    /* 亮框：主色 4 px，疊在列外框上（P.focus 的 ring） */
    #x-multi-problems .xmulti-on { position: absolute; inset: -4px; border: 4px solid var(--brand); border-radius: 20px; }
    /* 右示意區：三張疊在同一位置（P.swap 換） */

    #x-multi-problems .xmulti-fig .sc-icon { --d: 160px; --i: 88px; }
  </style>

  <script>
  (function () {
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-multi-problems'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const W1 = P.at('#40'), W2 = P.at('#41'), W3 = P.at('#42');   // 講到第 1–3 條那一句的開頭

    // 1. 卡片先進場，三列每 0.5 秒出現一列（觀眾先知道有幾條）；0.5 秒前不動
    P.reveal('#xmulti-card', 0.5);
    P.rise('#xmulti-r1, #xmulti-r2, #xmulti-r3', 1.0, { stagger: 0.5 });
    P.icon('#xmulti-ico1, #xmulti-ico2, #xmulti-ico3', 1.0 + P.BEAT, { stagger: 0.5 });

    // 2. 講到哪一條：那一條亮框、其他降到 0.4；右邊同一個位置換成那一條的示意
    P.focus('.xmulti-row', '#xmulti-r1', W1, { ring: '.xmulti-on' });
    P.rise('#xmulti-panel', W1);                        // 示意區和第一張一起出現（不留空框）
    P.icon('#xmulti-pico1', W1 + P.BEAT);
    P.focus('.xmulti-row', '#xmulti-r2', W2, { ring: '.xmulti-on' });
    P.swap('#xmulti-p1', '#xmulti-p2', W2);
    P.icon('#xmulti-pico2', W2 + 0.3);
    P.focus('.xmulti-row', '#xmulti-r3', W3, { ring: '.xmulti-on' });
    P.swap('#xmulti-p2', '#xmulti-p3', W3);
    P.icon('#xmulti-pico3', W3 + 0.3);

    P.end();                                           // 長度＝plan.json 這段的長度
    window.__timelines['x-multi-problems'] = tl;
  })();
  </script>
