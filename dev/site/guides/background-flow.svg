<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="720" viewBox="0 0 1320 720" role="img" aria-labelledby="title"><title id="title">複製設計指令給 AI，生成三組九張背景，按用途混搭，選了就自動套用</title><rect width="100%" height="100%" rx="24" fill="#090D17"/><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="32" y="48" font-size="38" fill="#F4F5F8" font-weight="800">AI 畫背景，你來挑搭配</text><text x="32" y="84" font-size="22" fill="#B6C1D5" font-weight="500">流程示意 · 每組都有三種用途</text><rect x="32" y="126" width="338" height="236" rx="16" fill="#121A2B" stroke="#2D3950"/><circle cx="64" cy="159" r="18" fill="#FF791F"/><text x="57" y="166" font-size="21" fill="#090D17" font-weight="800">1</text><text x="93" y="168" font-size="25" fill="#F4F5F8" font-weight="800">給 AI 設計方向</text><text x="56" y="214" font-size="20" fill="#B6C1D5" font-weight="500">主色</text><circle cx="131" cy="207" r="12" fill="#FF791F"/><text x="56" y="252" font-size="20" fill="#F4F5F8" font-weight="500">參考圖 ＋ 風格 ＋ 描述</text><rect x="56" y="282" width="290" height="50" rx="8" fill="#FF791F" stroke="#2D3950"/><text x="77" y="315" font-size="20" fill="#090D17" font-weight="800">複製生圖指令 → 貼給 AI</text><rect x="428" y="126" width="432" height="424" rx="16" fill="#121A2B" stroke="#2D3950"/><circle cx="460" cy="159" r="18" fill="#FF791F"/><text x="453" y="166" font-size="21" fill="#090D17" font-weight="800">2</text><text x="489" y="168" font-size="25" fill="#F4F5F8" font-weight="800">三組，共 9 張</text><text x="494" y="209" font-size="18" fill="#B6C1D5" font-weight="500">全畫面</text><text x="596" y="209" font-size="18" fill="#B6C1D5" font-weight="500">側邊欄</text><text x="698" y="209" font-size="18" fill="#B6C1D5" font-weight="500">章節</text><text x="448" y="263" font-size="23" fill="#FF791F" font-weight="800">A</text><rect x="488" y="226" width="92" height="65" rx="8" fill="#E6DDCC" stroke="none"/><path d="M536 235L536 282" fill="none" stroke="#D57935" stroke-width="1" stroke-linecap="round"/><path d="M546 235L546 28