" stroke="none"/><path d="M988 270L988 306" fill="none" stroke="#4676A1" stroke-width="1" stroke-linecap="round"/><path d="M998 270L998 306" fill="none" stroke="#4676A1" stroke-width="1" stroke-linecap="round"/><path d="M1008 270L1008 306" fill="none" stroke="#4676A1" stroke-width="1" stroke-linecap="round"/><path d="M1018 270L1018 306" fill="none" stroke="#4676A1" stroke-width="1" stroke-linecap="round"/><circle cx="1008" cy="295" r="14" fill="none" stroke="#4676A1" stroke-width="2"/><text x="1048" y="296" font-size="22" fill="#F4F5F8" font-weight="500">側邊欄 → 選 B</text><rect x="940" y="328" width="92" height="54" rx="8" fill="#E0E9E1" stroke="none"/><path d="M988 337L988 373" fill="none" stroke="#528667" stroke-width="1" stroke-linecap="round"/><path d="M998 337L998 373" fill="none" stroke="#528667" stroke-width="1" stroke-linecap="round"/><path d="M1008 337L1008 373" fill="none" stroke="#528667" stroke-width="1" stroke-linecap="round"/><path d="M1018 337L1018 373" fill="none" stroke="#528667" stroke-width="1" stroke-linecap="round"/><circle cx="1008" cy="362" r="14" fill="none" stroke="#528667" stroke-width="2"/><text x="1048" y="363" font-size="22" fill="#F4F5F8" font-weight="500">章節 → 選 C</text><rect x="940" y="410" width="326" height="55" rx="8" fill="#FF791F" stroke="#2D3950"/><text x="991" y="446" font-size="24" fill="#090D17" font-weight="800">選了就自動套用</text><path d="M386 238h26m-7-7 7 7-7 7" fill="none" stroke="#FF791F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M877 238h26m-7-7 7 7-7 7" fill="none" stroke="#FF791F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="32" y="588" width="1256" height="84" rx="12" fill="#15251F" stroke="#365C49"/><text x="57" y="623" font-size="24" fill="#82D9B0" font-weight="700">選了就自動套用這一集，同頁動畫馬上看到效果。</text><text x="57" y="653" font-size="19" fill="#B6C1D5" font-weight="500">原本背景也能選回來；這裡的小圖是選圖邏輯示意，實際圖片由 AI 依需求生成。</text></g></svg>