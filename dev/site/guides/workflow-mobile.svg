45" y="676" font-size="18" fill="#82D9B0" font-weight="500">① 看剪輯清單</text><path d="M220 712v26m-7-7 7 7 7-7" fill="none" stroke="#FF791F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="736" width="392" height="292" rx="16" fill="#121A2B" stroke="#2D3950"/><circle cx="57" cy="773" r="18" fill="#FF791F"/><text x="50" y="780" font-size="21" fill="#090D17" font-weight="800">3</text><text x="88" y="782" font-size="27" fill="#F4F5F8" font-weight="800">構圖與風格</text><rect x="45" y="800" width="350" height="112" rx="10" fill="#0B111E" stroke="#2D3950"/><rect x="60" y="812" width="155" height="86" rx="5" fill="#293449" stroke="#2D3950"/><rect x="75" y="820" width="123" height="69" rx="0" fill="none" stroke="#FF791F"/><circle cx="139" cy="844" r="13" fill="#C3CEDF"/><path d="M111 883q0-32 28-32t28 32" fill="#C3CEDF"/><path d="M224 856h26m-7-7 7 7-7 7" fill="none" stroke="#FF791F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="261" y="817" width="113" height="78" rx="5" fill="#EFE8DB" stroke="#2D3950"/><rect x="271" y="830" width="58" height="15" rx="3" fill="#FF791F" stroke="#2D3950"/><rect x="342" y="866" width="23" height="22" rx="3" fill="#354058" stroke="#2D3950"/><text x="274" y="866" font-size="14" fill="#323C4E" font-weight="500">動畫預覽</text><text x="45" y="947" font-size="21" fill="#F4F5F8" font-weight="500">拖框、選主色與背景</text><text x="45" y="989" font-size="18" fill="#82D9B0" font-weight="500">② 看動畫，儲存並套用</text><path d="M220 1025v26m-7-7 7 7 7-7" fill="none" stroke="#FF791F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="1049" width="392" height="292" rx="16" fill="#121A2B" stroke="#2D3950"/><circle cx="57" cy="1086" r="18" fill="#FF791F"/><text x="50" y="1093" font-size="21" fill="#090D17" font-weight="800">4</text><text x="88" y="1095" font-size="27" fill="#F4F5F8" font-weight="800">確認分鏡</text><rect x="45" y="1113" width="350" height="112" rx="10" fill="#0B111E" stroke="#2D3950"/><rect x="60" y="1128" width="100" height="63" rx="5" fill="#26344C" stroke="#2D3950"/><rect x="70" y="1138" width="45" height="8" rx="2" fill="#FF791F" stroke="#2D3950"/><path d="M70 1162L138 1162" fill="none" stroke="#B6C1D5" stroke-width="3" stroke-linecap="round"/><text x="79" y="1213" font-size="15" fill="#B6C1D5" font-weight="500">s01 開場</text><rect x="169" y="1128" width="100" height="63" rx="5" fill="#F6ECE0" stroke="#2D3950"/><rect x="179" y="1138" width="45" height="8" rx="2" fill="#FF791F" stroke="#2D3950"/><path d="M179 1162L247 1162" fill="none" stroke="#A8A093" stroke-width="3" stroke-linecap="round"/><text x="188" y="1213" font-size="15" fill="#B6C1D5" font-weight="500">s02 流程</text><rect x="278" y="1128" width="100" height="63" rx="5" fill="#26344C" stroke="#2D3950"/><rect x="288" y="1138" width="45" height="8" rx="2" fill="#FF791F" stroke="#2D3950"/><path d="M288 1162L356 1162" fill="none" stroke="#B6C1D5" stroke-width="3" stroke-linecap="round"/><text x="297" y="1213" font-size="15" fill="#B6C1D5" font-weight="500">s03 重點</text><text x="45" y="1260" font-size="21" fill="#F4F5F8" font-weight="500">每段要配什麼畫面</text><text x="45" y="1302" font-size="18" fill="#82D9B0" font-weight="500">③ 看分鏡表與截圖</text><path d="M220 1338v26m-7-7 7 7 7-7" fill="none" stroke="#FF791F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="1362" width="392" height="292" rx="16" fill="#121A2B" stroke="#2D3950"/><circle cx="57" cy="1399" r="18" fill="#FF791F"/><text x="50" y="1406" font-size="21" fill="#090D17" font-weight="800">5</text><text x="88" y="1408" font-size="27" fill="#F4F5F8" font-weight="800">預覽與修改</text><rect x="45" y="1426" width="350" height="112" rx="10" fill="#0B111E" stroke="#2D3950"/><rect x="60" y="1438" width="155" height="74" rx="5" fill="#F4EADC" stroke="#2D3950"/><rect x="73" y="1451" width="78" height="15" rx="3" fill="#FF791F" stroke="#2D3950"/><rect x="166" y="1481" width="36" height="23" rx="3" fill="#314563" stroke="#2D3950"/><rect x="235" y="1440" width="140" height="14" rx="3" fill="#38577D" stroke="#2D3950"/><rect x="235" y="1467" width="122" height="14" rx="3" fill="#FF791F" stroke="#2D3950"/><rect x="235" y="1494" width="104" height="14" rx="3" fill="#38577D" stroke="#2D3950"/><text x="67" y="1529" font-size="16" fill="#B6C1D5" font-weight="500">預覽 → 修改 → 再確認</text><text x="45" y="1573" font-size="21" fill="#F4F5F8" font-weight="500">看完成影片，說一句話或自己調</text><text x="45" y="1615" font-size="18" fill="#82D9B0" font-weight="500">④ 完成影片預覽；需要時開 ⑤ 剪輯</text><path d="M220 1651v26m-7-7 7 7 7-7" fill="none" stroke="#FF791F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="1675" width="392" height="292" rx="16" fill="#121A2B" stroke="#2D3950"/><circle cx="57" cy="1712" r="18" fill="#FF791F"/><text x="50" y="1719" font-size="21" fill="#090D17" font-weight="800">6</text><text x="88" y="1721" font-size="27" fill="#F4F5F8" font-weight="800">輸出與驗收</text><rect x="45" y="1739" width="350" height="112" rx="10" fill="#0B111E" stroke="#2D3950"/><rect x="63" y="1755" width="132" height="80" rx="6" fill="#253950" stroke="#2D3950"/><path d="M115 1777l28 18-28 18z" fill="#FF791F"/><path d="M216 1795h26m-7-7 7 7-7 7" fill="none" stroke="#FF791F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="261" y="1787" font-size="23" fill="#F4F5F8" font-weight="700">final.mp4</text><text x="261" y="1816" font-size="17" fill="#B6C1D5" font-weight="500">也能帶去剪映</text><text x="45" y="1886" font-size="21" fill="#F4F5F8" font-weight="500">確認後輸出 MP4</text><text x="45" y="1928" font-size="18" fill="#82D9B0" font-weight="500">選用：主軌＋透明 MOV＋SRT</text><text x="32" y="1998" font-size="18" fill="#B6C1D5" font-weight="500">換共用背景時，另看 ⑥ 背景預覽</text></g></svg>