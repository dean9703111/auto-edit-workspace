<svg xmlns="http://www.w3.org/2000/svg" width="440" height="2040" viewBox="0 0 440 2040" role="img" aria-labelledby="title"><title id="title">素材、初剪、構圖、分鏡、預覽修改、輸出的六步流程</title><rect width="100%" height="100%" rx="24" fill="#090D17"/><g font-family="Noto Sans TC, PingFang TC, Microsoft JhengHei, sans-serif"><text x="32" y="48" font-size="31" fill="#F4F5F8" font-weight="800">從素材到完成影片</text><text x="32" y="82" font-size="19" fill="#B6C1D5" font-weight="500">先看整體流程，再跟 AI 一步一步做</text><rect x="24" y="110" width="392" height="292" rx="16" fill="#121A2B" stroke="#2D3950"/><circle cx="57" cy="147" r="18" fill="#FF791F"/><text x="50" y="154" font-size="21" fill="#090D17" font-weight="800">1</text><text x="88" y="156" font-size="27" fill="#F4F5F8" font-weight="800">放好素材</text><rect x="45" y="174" width="350" height="112" rx="10" fill="#0B111E" stroke="#2D3950"/><rect x="61" y="190" width="72" height="78" rx="8" fill="#1B2940" stroke="#2D3950"/><text x="69" y="219" font-size="18" fill="#F4F5F8" font-weight="500">講解</text><path d="M73 235L114 235" fill="none" stroke="#FF791F" stroke-width="3" stroke-linecap="round"/><path d="M73 247L103 247" fill="none" stroke="#B6C1D5" stroke-width="2" stroke-linecap="round"/><rect x="143" y="190" width="72" height="78" rx="8" fill="#1B2940" stroke="#2D3950"/><text x="151" y="219" font-size="18" fill="#F4F5F8" font-weight="500">旁白</text><path d="M155 235L196 235" fill="none" stroke="#FF791F" stroke-width="3" stroke-linecap="round"/><path d="M155 247L185 247" fill="none" stroke="#B6C1D5" stroke-width="2" stroke-linecap="round"/><rect x="225" y="190" width="72" height="78" rx="8" fill="#1B2940" stroke="#2D3950"/><text x="233" y="219" font-size="18" fill="#F4F5F8" font-weight="500">錄影</text><path d="M237 235L278 235" fill="none" stroke="#FF791F" stroke-width="3" stroke-linecap="round"/><path d="M237 247L267 247" fill="none" stroke="#B6C1D5" stroke-width="2" stroke-linecap="round"/><rect x="307" y="190" width="72" height="78" rx="8" fill="#1B2940" st