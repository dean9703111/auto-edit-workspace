<svg xmlns="http://www.w3.org/2000/svg" width="440" height="1162" viewBox="0 0 440 1162" role="img" aria-labelledby="title"><title id="title">版面節奏：開頭三十秒字卡、半螢幕至少十五秒、子母畫面至少四十五秒</title><rect width="100%" height="100%" rx="24" fill="#090D17"/><g font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"><text x="32" y="50" font-size="30" fill="#F4F5F8" font-weight="800" text-anchor="start">畫面不亂跳：版面節奏</text><text x="32" y="84" font-size="19" fill="#B6C1D5" font-weight="500" text-anchor="start">切進去就待夠久，不會馬上又切回來</text><rect x="24" y="112" width="392" height="306" rx="16" fill="#121A2B" stroke="#2D3950"/><rect x="44" y="132" width="352" height="198" rx="10" fill="#1B2940" stroke="#2D3950"/><clipPath id="c44-132"><rect x="44" y="132" width="352" height="198" rx="10"/></clipPath><g clip-path="url(#c44-132)"><circle cx="220" cy="201.102" r="34.9272" fill="#C3CEDF"/><path d="M140.998 330q0 -83.16 79.002 -83.16t79.002 83.16z" fill="#C3CEDF"/><rect x="65.12" y="242.88" width="140.8" height="47.519999999999996" rx="6" fill="#F6ECE0" stroke="none"/><rect x="75.12" y="252.88" width="53.504000000000005" height="9" rx="3" fill="#FF791F" stroke="none"/><path d="M75.12 276.88h120.80000000000001" stroke="#A8A093" stroke-width="4" stroke-linecap="round"/></g><text x="44" y="362" font-size="26" fill="#F4F5F8" font-weight="800" text-anchor="start">字卡為主</text><text x="396" y="362" font-size="20" fill="#FF791F" font-weight="700" text-anchor="end">開頭 30 秒</text><text x="44" y="396" font-size="17" fill="#B6C1D5" font-weight="500" text-anchor="start">講者滿版露臉，先讓觀眾認識你</text><rect x="24" y="442" width="392" height="306" rx="16" fill="#121A2B" stroke="#2D3950"/><rect x="44" y="462" width="352" height="198" rx="10" fill="#1B2940" stroke="#2D3950"/><clipPath id="c44-462"><rect x="44" y="462" width="352" height="198" rx="10"/></clipPath><g clip-path="url(#c44-462)"><circle cx="308" cy="531.102" r="34.9272" fill="#C3CEDF"/><path d="M228.998 660q0 -83.16 79.002 -83.16t79.002 83.16z" fill="#C3CEDF"/><rect x="44" y="462" width="176" height="198" fill="#F6ECE0"/><rect x="215" y="462" width="5" height="198" fill="#FF791F"/><circle cx="66" cy="521.4" r="7" fill="#FF791F"/><path d="M82 521.4h114" stroke="#A8A093" stroke-width="4" stroke-linecap="round"/><circle cx="66" cy="561" r="7" fill="#FF791F"/><path d="M82 561h100" stroke="#A8A093" stroke-width="4" stroke-linecap="round"/><circle cx="66" cy="600.6" r="7" fill="#FF791F"/><path d="M82 600.6h86" stroke="#A8A093" stroke-width="4" stroke-linecap="round"/></g><text x="44" y="692" font-size="26" fill="#F4F5F8" font-weight="800" text-anchor="start">半螢幕</text><text x="396" y="692" font-size="20" fill="#FF791F" font-weight="700" text-anchor="end">一次至少 15 秒</text><text x="44" y="726" font-size="17" fill="#B6C1D5" font-weight="500" text-anchor="start">講者讓到一邊，另一半放條列重點</text><rect x="24" y="772" width="392" height="306" rx="16" fill="#121A2B" stroke="#2D3950"/><rect x="44" y="792" width="352" height="198" rx="10" fill="#1B2940" stroke="#2D3950"/><clipPath id="c44-792"><rect x="44" y="792" width="352" height="198" rx="10"/></clipPath><g clip-path="url(#c44-792)"><rect x="44" y="792" width="352" height="198" fill="#F4EADC"/><rect x="65.12" y="823.68" width="211.2" height="122.76" rx="6" fill="#FFFFFF" stroke="none"/><rect x="65.12" y="823.68" width="211.2" height="31.68" rx="6" fill="#FF791F" stroke="none"/><rect x="79.2" y="879.12" width="45.760000000000005" height="43.56" rx="5" fill="#E8DFD2"/><rect x="142.56" y="879.12" width="45.760000000000005" height="43.56" rx="5" fill="#E8DFD2"/><rect x="205.92000000000002" y="879.12" width="45.760000000000005" height="43.56" rx="5" fill="#E8DFD2"/><rect x="300.96" y="919.2744" width="84.47999999999999" height="60.82559999999999" rx="5" fill="#1B2940" stroke="#FF791F"/><circle cx="343.2" cy="942.388128" r="10.218700799999999" fill="#C3CEDF"/><path d="M320.086272 980.1q0 -24.330239999999996 23.113727999999995 -24.330239999999996t23.113727999999995 24.330239999999996z" fill="#C3CEDF"/></g><text x="44" y="1022" font-size="26" fill="#F4F5F8" font-weight="800" text-anchor="start">子母畫面</text><text x="396" y="1022" font-size="20" fill="#FF791F" font-weight="700" text-anchor="end">一次至少 45 秒</text><text x="44" y="1056" font-size="17" fill="#B6C1D5" font-weight="500" text-anchor="start">動畫佔滿畫面，講者縮成小視窗</text><text x="32" y="1126" font-size="18" fill="#82D9B0" font-weight="500" text-anchor="start">太短的段，AI 會併進前後或改回字卡</text></g></svg>
