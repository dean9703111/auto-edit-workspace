<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="678" viewBox="0 0 1320 678" role="img" aria-labelledby="title"><title id="title">版面節奏：開頭三十秒字卡、半螢幕至少十五秒、子母畫面至少四十五秒</title><rect width="100%" height="100%" rx="24" fill="#090D17"/><g font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif"><text x="32" y="50" font-size="38" fill="#F4F5F8" font-weight="800" text-anchor="start">畫面不亂跳：版面節奏</text><text x="32" y="84" font-size="23" fill="#B6C1D5" font-weight="500" text-anchor="start">切進去就待夠久，不會馬上又切回來</text><rect x="32" y="116" width="392" height="318" rx="16" fill="#121A2B" stroke="#2D3950"/><rect x="52" y="136" width="352" height="198" rx="10" fill="#1B2940" stroke="#2D3950"/><clipPath id="c52-136"><rect x="52" y="136" width="352" height="198" rx="10"/></clipPath><g clip-path="url(#c52-136)"><circle cx="228" cy="205.102" r="34.9272" fill="#C3CEDF"/><path d="M148.998 334q0 -83.16 79.002 -83.16t79.002 83.16z" fill="#C3CEDF"/><rect x="73.12" y="246.88" width="140.8" height="47.519999999999996" rx="6" fill="#F6ECE0" stroke="none"/><rect x="83.12" y="256.88" width="53.504000000000005" height="9" rx="3" fill="#FF791F" stroke="none"/><path d="M83.12 280.88h120.80000000000001" stroke="#A8A093" stroke-width="4" stroke-linecap="round"/></g><text x="52" y="368" font-size="28" fill="#F4F5F8" font-weight="800" text-anchor="start">字卡為主</text><text x="404" y="368" font-size="21" fill="#FF791F" font-weight="700" text-anchor="end">開頭 30 秒</text><text x="52" y="404" font-size="18" fill="#B6C1D5" font-weight="500" text-anchor="start">講者滿版露臉，先讓觀眾認識你</text><rect x="458" y="116" width="392" height="318" rx="16" fill="#121A2B" stroke="#2D3950"/><rect x="478" y="136" width="352" height="198" rx="10" fill="#1B2940" stroke="#2D3950"/><clipPath id="c478-136"><rect x="478" y="136" width="352" height="198" rx="10"/></clipPath><g clip-path="url(#c478-136)"><circle cx="742" cy="205.102" r="34.9272" fill="#C3CEDF"/><path d="M662.998 334q0 -83.16 79.002 -83.16t79.002 83.16z" fill="#C3CEDF"/><rect x="478" y="136" width="176" height="198" fill="#F6ECE0"/><rect x="649" y="136" width="5" height="198" fill="#FF791F"/><circle cx="500" cy="195.4" r="7" fill="#FF791F"/><path d="M516 195.4h114" stroke="#A8A093" stroke-width="4" stroke-linecap="round"/><circle cx="500" cy="235" r="7" fill="#FF791F"/><path d="M516 235h100" stroke="#A8A093" stroke-width="4" stroke-linecap="round"/><circle cx="500" cy="274.6" r="7" fill="#FF791F"/><path d="M516 274.6h86" stroke="#A8A093" stroke-width="4" stroke-linecap="round"/></g><text x="478" y="368" font-size="28" fill="#F4F5F8" font-weight="800" text-anchor="start">半螢幕</text><text x="830" y="368" font-size="21" fill="#FF791F" font-weight="700" text-anchor="end">一次至少 15 秒</text><text x="478" y="404" font-size="18" fill="#B6C1D5" font-weight="500" text-anchor="start">講者讓到一邊，另一半放條列重點</text><rect x="884" y="116" width="392" height="318" rx="16" fill="#121A2B" stroke="#2D3950"/><rect x="904" y="136" width="352" height="198" rx="10" fill="#1B2940" stroke="#2D3950"/><clipPath id="c904-136"><rect x="904" y="136" width="352" height="198" rx="10"/></clipPath><g clip-path="url(#c904-136)"><rect x="904" y="136" width="352" height="198" fill="#F4EADC"/><rect x="925.12" y="167.68" width="211.2" height="122.76" rx="6" fill="#FFFFFF" stroke="none"/><rect x="925.12" y="167.68" width="211.2" height="31.68" rx="6" fill="#FF791F" stroke="none"/><rect x="939.2" y="223.12" width="45.760000000000005" height="43.56" rx="5" fill="#E8DFD2"/><rect x="1002.5600000000001" y="223.12" width="45.760000000000005" height="43.56" rx="5" fill="#E8DFD2"/><rect x="1065.92" y="223.12" width="45.760000000000005" height="43.56" rx="5" fill="#E8DFD2"/><rect x="1160.96" y="263.2744" width="84.47999999999999" height="60.82559999999999" rx="5" fill="#1B2940" stroke="#FF791F"/><circle cx="1203.2" cy="286.38812800000005" r="10.218700799999999" fill="#C3CEDF"/><path d="M1180.086272 324.1q0 -24.330239999999996 23.113727999999995 -24.330239999999996t23.113727999999995 24.330239999999996z" fill="#C3CEDF"/></g><text x="904" y="368" font-size="28" fill="#F4F5F8" font-weight="800" text-anchor="start">子母畫面</text><text x="1256" y="368" font-size="21" fill="#FF791F" font-weight="700" text-anchor="end">一次至少 45 秒</text><text x="904" y="404" font-size="18" fill="#B6C1D5" font-weight="500" text-anchor="start">動畫佔滿畫面，講者縮成小視窗</text><text x="32" y="482" font-size="21" fill="#B6C1D5" font-weight="500" text-anchor="start">一支片的前兩分鐘可能長這樣</text><rect x="34" y="506" width="310" height="56" rx="10" fill="#26344C"/><text x="189" y="542" font-size="21" fill="#F4F5F8" font-weight="700" text-anchor="middle">字卡</text><rect x="348" y="506" width="519.3333333333334" height="56" rx="10" fill="#FF791F"/><text x="607.6666666666667" y="542" font-size="21" fill="#090D17" font-weight="700" text-anchor="middle">子母畫面 50 秒</text><rect x="871.3333333333334" y="506" width="184.39999999999998" height="56" rx="10" fill="#38577D"/><text x="963.5333333333333" y="542" font-size="21" fill="#F4F5F8" font-weight="700" text-anchor="middle">半螢幕 18 秒</text><rect x="1059.7333333333333" y="506" width="226.26666666666665" height="56" rx="10" fill="#26344C"/><text x="1172.8666666666668" y="542" font-size="21" fill="#F4F5F8" font-weight="700" text-anchor="middle">字卡</text><path d="M32 568v10" stroke="#B6C1D5" stroke-width="2"/><text x="32" y="604" font-size="18" fill="#B6C1D5" font-weight="500" text-anchor="start">0:00</text><path d="M346 568v10" stroke="#B6C1D5" stroke-width="2"/><text x="346" y="604" font-size="18" fill="#B6C1D5" font-weight="500" text-anchor="middle">0:30</text><path d="M660 568v10" stroke="#B6C1D5" stroke-width="2"/><text x="660" y="604" font-size="18" fill="#B6C1D5" font-weight="500" text-anchor="middle">1:00</text><path d="M974 568v10" stroke="#B6C1D5" stroke-width="2"/><text x="974" y="604" font-size="18" fill="#B6C1D5" font-weight="500" text-anchor="middle">1:30</text><path d="M1288 568v10" stroke="#B6C1D5" stroke-width="2"/><text x="1288" y="604" font-size="18" fill="#B6C1D5" font-weight="500" text-anchor="end">2:00</text><text x="32" y="646" font-size="20" fill="#82D9B0" font-weight="500" text-anchor="start">排不到這個長度的段，AI 會併進前後的段，或改回疊在講者上的字卡；檢查時不合會列出來</text></g></svg>
