" width="45" height="8" rx="2" fill="#FF791F" stroke="#2D3950"/><path d="M78 583L146 583" fill="none" stroke="#B6C1D5" stroke-width="3" stroke-linecap="round"/><text x="87" y="634" font-size="15" fill="#B6C1D5" font-weight="500">s01 開場</text><rect x="177" y="549" width="100" height="63" rx="5" fill="#F6ECE0" stroke="#2D3950"/><rect x="187" y="559" width="45" height="8" rx="2" fill="#FF791F" stroke="#2D3950"/><path d="M187 583L255 583" fill="none" stroke="#A8A093" stroke-width="3" stroke-linecap="round"/><text x="196" y="634" font-size="15" fill="#B6C1D5" font-weight="500">s02 流程</text><rect x="286" y="549" width="100" height="63" rx="5" fill="#26344C" stroke="#2D3950"/><rect x="296" y="559" width="45" height="8" rx="2" fill="#FF791F" stroke="#2D3950"/><path d="M296 583L364 583" fill="none" stroke="#B6C1D5" stroke-width="3" stroke-linecap="round"/><text x="305" y="634" font-size="15" fill="#B6C1D5" font-weight="500">s03 重點</text><text x="53" y="681" font-size="21" fill="#F4F5F8" font-weight="500">每段要配什麼畫面</text><text x="53" y="723" font-size="18" fill="#82D9B0" font-weight="500">③ 看分鏡表與截圖</text><path d="M428 616h26m-7-7 7 7-7 7" fill="none" stroke="#FF791F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="458" y="470" width="392" height="292" rx="16" fill="#121A2B" stroke="#2D3950"/><circle cx="491" cy="507" r="18" fill="#FF791F"/><text x="484" y="514" font-size="21" fill="#090D17" font-weight="800">5</text><text x="522" y="516" font-size="27" fill="#F4F5F8" font-weight="800">預覽與修改</text><rect x="479" y="534" width="350" height="112" rx="10" fill="#0B111E" stroke="#2D3950"/><rect x="494" y="546" width="155" height="74" rx="5" fill="#F4EADC" stroke="#2D3950"/><rect x="507" y="559" width="78" height="15" rx="3" fill="#FF791F" stroke="#2D3950"/><rect x="600" y="589" width="36" height="23" rx="3" fill="#314563" stroke="#2D3950"/><rect x="669" y="548" width="140" height="14" rx="3" fill="#38577D" stroke="#2D3950"/><rect x="669" y="575" width="122" height="14" rx="3" fill="#FF791F" stroke="#2D3950"/><rect x="669" y="602" width="104" height="14" rx="3" fill="#38577D" stroke="#2D3950"/><text x="501" y="637" font-size="16" fill="#B6C1D5" font-weight="500">預覽 → 修改 → 再確認</text><text x="479" y="681" font-size="21" fill="#F4F5F8" font-weight="500">看完成影片，說一句話或自己調</text><text x="479" y="723" font-size="18" fill="#82D9B0" font-weight="500">④ 完成影片預覽；需要時開 ⑤ 剪輯</text><path d="M854 616h26m-7-7 7 7-7 7" fill="none" stroke="#FF791F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="884" y="470" width="392" height="292" rx="16" fill="#121A2B" stroke="#2D3950"/><circle cx="917" cy="507" r="18" fill="#FF791F"/><text x="910" y="514" font-size="21" fill="#090D17" font-weight="800">6</text><text x="948" y="516" font-size="27" fill="#F4F5F8" font-weight="800">輸出與驗收</text><rect x="905" y="534" width="350" height="112" rx="10" fill="#0B111E" stroke="#2D3950"/><rect x="923" y="550" width="132" height="80" rx="6" fill="#253950" stroke="#2D3950"/><path d="M975 572l28 18-28 18z" fill="#FF791F"/><path d="M1076 590h26m-7-7 7 7-7 7" fill="none" stroke="#FF791F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1121" y="582" font-size="23" fill="#F4F5F8" font-weight="700">final.mp4</text><text x="1121" y="611" font-size="17" fill="#B6C1D5" font-weight="500">也能帶去剪映</text><text x="905" y="681" font-size="21" fill="#F4F5F8" font-weight="500">確認後輸出 MP4</text><text x="905" y="723" font-size="18" fill="#82D9B0" font-weight="500">選用：主軌＋透明 MOV＋SRT</text><text x="32" y="848" font-size="22" fill="#B6C1D5" font-weight="500">換共用背景時，另看 ⑥ 背景預覽</text></g></svg>