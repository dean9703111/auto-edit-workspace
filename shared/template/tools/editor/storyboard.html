<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>分鏡表</title>
<link rel="icon" href="/editor/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/kit/fonts.css">
<link rel="stylesheet" href="/kit/brand.css">
<link rel="stylesheet" href="/editor/editor.css">
<style>
  body.storyboard { display: block; height: auto; min-height: 100vh; overflow: auto; scroll-padding-top: 66px; }
  body.storyboard .topbar { position: sticky; top: 0; z-index: 20; }
  .sb-shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); gap: 16px; padding: 16px; align-items: start; }
  .sb-nav { position: sticky; top: 66px; max-height: calc(100vh - 78px); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .sb-panel { background: var(--bg2); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; min-width: 0; }
  .sb-navlist { list-style: none; margin: 0; padding: 6px; overflow-y: auto; min-height: 0; flex: 1 1 auto; overscroll-behavior: contain; }
  .sb-navlist a { display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 6px; align-items: baseline; padding: 6px 8px; border-radius: 6px; color: var(--mute); text-decoration: none; font-size: 13px; }
  .sb-navlist a:hover { background: var(--card); color: var(--ink); }
  .sb-navlist a.on { background: var(--card2); color: var(--ink); }
  .sb-navlist .sb-navid { font-family: var(--mono); font-size: 12px; color: var(--dim); }
  .sb-navlist .sb-navtxt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-navlist a.plain { grid-template-columns: minmax(0, 1fr); }
  .sb-navlist a.decide { color: var(--accent-text); font-weight: 700; }
  .sb-navlist a.ref { font-size: 12.5px; color: var(--dim); }
  .sb-navlist a.changed .sb-navtxt::after, .sb-navlist a.plain.changed::after { content: ' ●'; color: var(--accent); }
  .sb-navgap { height: 1px; margin: 6px 8px; background: var(--line); }
  .sb-navch > summary { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 6px 8px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 700; color: var(--ink); }
  .sb-navch > summary:hover { background: var(--card); }
  .sb-chmeta { font-family: var(--mono); font-size: 11.5px; font-weight: 400; color: var(--dim); white-space: nowrap; }
  .sb-navch ul { list-style: none; margin: 0; padding: 0; }
  .sb-navlist a.seen .sb-navid { color: var(--good-kw); }
  .sb-navlist a.kind-design .sb-navtxt { color: var(--accent-text); }
  .sb-navlist a.seen .sb-navtxt { color: var(--dim); }
  .sb-tasks { display: flex; flex-wrap: wrap; gap: 8px; flex: 1 1 100%; margin-top: 8px; }
  .sb-tasks:empty { display: none; }
  .sb-task { display: grid; gap: 1px; padding: 6px 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--line2); color: var(--ink); font: inherit; text-align: left; text-decoration: none; cursor: pointer; }
  a.sb-task:hover, button.sb-task:hover { background: var(--card2); }
  .sb-task b { font-size: 13.5px; }
  .sb-task span { font-size: 12px; color: var(--mute); }
  .sb-task.static { cursor: default; }
  .sb-task.todo { border-color: var(--accent); }
  .sb-task.todo b { color: var(--accent-text); }
  .sb-task.ok b { color: var(--good-kw); }
  .sb-task.over { border-color: var(--warn); }
  .sb-task.over b { color: var(--warn-kw); }
  .sb-finder { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; flex: 1 1 100%; margin-top: 10px; }
  .sb-finder input { flex: 1 1 320px; min-width: 0; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line2); background: var(--card); color: var(--ink); font: inherit; font-size: 14px; }
  .sb-finder input:focus { outline: 2px solid var(--accent); }
  .sb-kinds { display: flex; flex-wrap: wrap; gap: 4px; }
  .sb-kinds button { padding: 3px 9px; font-size: 12.5px; border-radius: 999px; }
  .sb-kinds button[aria-pressed="true"] { background: var(--card2); border-color: var(--accent); color: var(--ink); font-weight: 700; }
  .sb-findernote { font-size: 13px; color: var(--mute); }
  .sb-findernote button { padding: 1px 8px; font-size: 12px; margin-left: 4px; }
  .sb-idlink { font-family: var(--mono); color: var(--accent-text); }
  .sb-see { font-size: 12.5px; color: var(--accent-text); white-space: nowrap; }
  [hidden] { display: none !important; }
  .sb-next { padding: 12px 14px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 16%, var(--card)); border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); font-size: 13.5px; line-height: 1.55; flex: none; }
  .sb-next b { color: var(--accent-text); }
  .sb-main { display: grid; gap: 16px; min-width: 0; }
  .sb-intro { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  .sb-intro p { margin: 0; font-size: 14px; color: var(--mute); }
  .sb-summary { font-family: var(--mono); font-size: 13px; color: var(--mute); }
  .sb-banner { margin: 0; padding: 9px 12px; border-radius: 6px; font-size: 13px; background: var(--card2); border: 1px solid var(--line2); overflow-wrap: anywhere; }
  .sb-banner.err { border-color: var(--warn); color: var(--warn-kw); }
  .sb-banner blockquote { margin: 6px 0 0; padding: 6px 10px; border-radius: 4px; background: var(--plate); color: var(--ink); user-select: all; }
  #banner { display: grid; gap: 8px; }
  #banner:empty { display: none; }
  .sb-empty { padding: 48px 8px; text-align: center; color: var(--mute); }

  .sb-sec { scroll-margin-top: 66px; }
  .sb-sechead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 12px; }
  .sb-sechead h2 { margin: 0; font-size: 16px; line-height: 1.4; min-width: 0; overflow-wrap: anywhere; }
  .sb-id { font-family: var(--mono); font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 6px; background: var(--card2); border: 1px solid var(--line2); color: var(--ink); }
  .sb-chip { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--plate); color: var(--mute); }
  .sb-chip.time { font-family: var(--mono); }
  .sb-sec.decide { border-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  .sb-note { margin: 0 0 10px; font-size: 13px; color: var(--mute); }

  .sb-segbody { display: grid; grid-template-columns: minmax(240px, 400px) minmax(0, 1fr); gap: 16px; align-items: start; }
  .sb-segbody.noshot { grid-template-columns: minmax(0, 1fr); }
  .sb-shots { display: grid; gap: 8px; min-width: 0; }
  .sb-shots.many { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sb-shots.pending { position: relative; }
  .sb-pending { position: absolute; left: 8px; right: 8px; top: 8px; padding: 6px 10px; border-radius: 6px; background: rgba(11, 16, 32, .92); border: 1px solid var(--accent); color: var(--ink); font-size: 12.5px; line-height: 1.45; font-weight: 700; }
  .sb-beat { color: var(--ink); }
  .sb-shots a { display: block; line-height: 0; }
  .sb-shots img { display: block; width: 100%; max-height: 360px; object-fit: contain; border-radius: 6px; background: #000; border: 1px solid var(--line); }
  .sb-noimg { display: grid; place-items: center; min-height: 90px; padding: 8px; border-radius: 6px; border: 1px dashed var(--line2); color: var(--dim); font-size: 12px; text-align: center; line-height: 1.4; }
  .sb-fields { display: grid; gap: 8px; min-width: 0; font-size: 14px; }
  .sb-field { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 2px 10px; align-items: baseline; }
  .sb-field.nolabel { grid-template-columns: minmax(0, 1fr); }
  .sb-label { font-size: 12.5px; color: var(--dim); }
  .sb-ordered { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: baseline; }
  .sb-ordered > .sb-mark { font-family: var(--mono); font-size: 12px; color: var(--dim); text-align: right; }
  .sb-subhead { margin: 0 0 8px; font-size: 13.5px; font-weight: 700; color: var(--ink); }
  .sb-subgroup { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  details.sb-fold > summary { cursor: pointer; font-size: 13.5px; font-weight: 700; color: var(--ink); padding: 2px 0; }
  details.sb-fold[open] > summary { margin-bottom: 10px; }
  details.sb-fold > summary > span { margin-left: 4px; }
  details.sb-ref > summary { display: flex; align-items: center; gap: 4px; font-size: 15px; }
  details.sb-ref > summary::before { content: '▸'; color: var(--dim); }
  details.sb-ref[open] > summary::before { content: '▾'; }
  details.sb-ref[open] > summary { margin-bottom: 12px; }

  .sb-read { color: var(--mute); font-size: 13.5px; overflow-wrap: anywhere; }
  .sb-pieces { overflow-wrap: anywhere; }
  .sb-fixed { color: var(--mute); }
  .sb-limit { margin-left: 6px; font-size: 12px; color: var(--dim); }
  .sb-piece { display: inline-block; min-width: 2em; margin: 0 1px; padding: 0 5px; border-radius: 4px; background: color-mix(in srgb, var(--accent) 14%, var(--card)); box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--accent) 70%, transparent); color: var(--ink); cursor: text; overflow-wrap: anywhere; }
  .sb-piece:focus { outline: 2px solid var(--accent); background: var(--card); }
  .sb-select { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; min-width: 0; }
  .sb-select select { max-width: 100%; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line2); background: var(--card); color: var(--ink); font: inherit; font-size: 13.5px; cursor: pointer; }
  .sb-select select:focus-visible { outline: 2px solid var(--accent); }
  .sb-select a { font-size: 12.5px; color: var(--accent-text); white-space: nowrap; }
  .sb-hint { width: 100%; font-size: 12.5px; color: var(--dim); line-height: 1.5; }
  .sb-wish { display: flex; align-items: center; gap: 10px; width: 100%; box-sizing: border-box; padding: 6px 9px; border-radius: 6px; font-size: 12.5px; line-height: 1.5; background: color-mix(in srgb, var(--accent) 12%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); color: var(--ink); }
  .sb-wish span { flex: 1 1 auto; }
  .sb-wish button { flex: none; padding: 2px 10px; font-size: 12px; }
  .sb-note-box { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .sb-note-box label { display: inline-block; margin-bottom: 6px; font-size: 13.5px; font-weight: 700; color: var(--ink); }
  .sb-note-box textarea { display: block; width: 100%; box-sizing: border-box; min-height: 60px; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--line2); background: var(--card); color: var(--ink); font: inherit; font-size: 14px; line-height: 1.6; resize: vertical; }
  .sb-note-box textarea:focus { outline: 2px solid var(--accent); }
  .sb-note-box textarea.has-note { border-color: var(--accent); }
  .sb-note-box textarea.unsaved, .sb-answer.unsaved { outline: 2px solid var(--warn); }
  .sb-asks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .sb-ask { padding: 10px 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); display: grid; gap: 8px; }
  .sb-ask.answered { border-color: color-mix(in srgb, var(--good) 55%, transparent); }
  .sb-ask-q { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 14px; line-height: 1.6; }
  .sb-ask-mark { font-family: var(--mono); font-size: 12.5px; color: var(--dim); text-align: right; }
  .sb-ask.answered .sb-ask-mark { color: var(--good-kw); font-weight: 700; }
  .sb-answer { display: block; width: 100%; box-sizing: border-box; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line2); background: var(--bg3); color: var(--ink); font: inherit; font-size: 14px; line-height: 1.5; resize: none; overflow: hidden; }
  .sb-answer:focus { outline: 2px solid var(--accent); }
  .sb-speaker { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
  .sb-speaker-msg { flex: 1 1 100%; color: var(--ink); line-height: 1.55; }
  .sb-speaker label { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }
  .sb-speaker input { padding: 5px 8px; border-radius: 6px; border: 1px solid var(--line2); background: var(--card); color: var(--ink); font: inherit; width: 220px; max-width: 100%; }
  .sb-speaker-err { color: var(--warn-kw); font-weight: 700; }
  .sb-edit { min-height: 1.5em; padding: 1px 4px; margin: -1px -4px; border-radius: 4px; outline: 1px solid transparent; overflow-wrap: anywhere; cursor: text; transition: background .1s, outline-color .1s; }
  .sb-edit[contenteditable] { background: color-mix(in srgb, var(--accent) 14%, var(--card)); box-shadow: inset 0 -1px 0 color-mix(in srgb, var(--accent) 70%, transparent); }
  .sb-edit[contenteditable]:hover { background: color-mix(in srgb, var(--accent) 22%, var(--card)); }
  .sb-edit[contenteditable]:focus { background: var(--card); outline: 2px solid var(--accent); }
  .sb-edit.empty::before { content: '（空白，點一下填寫）'; color: var(--dim); font-size: 12.5px; }
  .sb-edit.unsaved { outline: 2px solid var(--warn); }
  .sb-edit code, .sb-code { font-family: var(--mono); font-size: 12px; background: var(--plate); padding: 0 4px; border-radius: 3px; }
  .sb-edit strong { color: var(--ink); }
  .sb-pre { margin: 0 0 8px; padding: 8px 10px; border-radius: 6px; background: var(--plate); font-family: var(--mono); font-size: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }

  .sb-tablewrap { overflow-x: auto; }
  .sb-table { border-collapse: collapse; width: 100%; font-size: 13px; }
  .sb-table th, .sb-table td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; min-width: 56px; }
  .sb-table th { color: var(--dim); font-weight: 400; white-space: nowrap; }
  .sb-table td.wide { min-width: 170px; }
  .sb-table td.check { text-align: center; min-width: 40px; }
  .sb-table td.check input { width: 18px; height: 18px; margin: 0; accent-color: var(--accent); cursor: pointer; }

  @media (max-width: 960px) {
    .sb-shell { grid-template-columns: minmax(0, 1fr); }
    .sb-nav { position: static; max-height: 240px; }
    .sb-segbody { grid-template-columns: minmax(0, 1fr); }
    .sb-field { grid-template-columns: minmax(0, 1fr); }
  }
</style>
</head>
<body class="storyboard">
<header class="topbar">
  <div class="brandmark">
    <span class="logo" aria-hidden="true">剪</span>
    <div class="titles">
      <h1>分鏡表</h1>
      <div class="sub" id="projName">載入中…</div>
    </div>
  </div>
  <div class="save-state" id="saveState" data-state="busy" role="status"><span class="dot"></span><span class="txt">載入中…</span></div>
</header>

<div class="sb-shell">
  <nav class="sb-nav" aria-label="分鏡表目錄">
    <ul class="sb-panel sb-navlist" id="nav"></ul>
    <div class="sb-next" id="next" hidden></div>
  </nav>
  <main class="sb-main">
    <div class="sb-panel sb-intro" id="intro" hidden>
      <p id="hint">橘底的文字可以直接改，下拉選單可以換呈現方式；不滿意就寫在每段下面的補充說明。全部自動存檔。</p>
      <span class="sb-summary" id="summary"></span>
      <div class="sb-tasks" id="tasks"></div>
      <div class="sb-finder" id="finder">
        <input id="finderInput" type="search" autocomplete="off" placeholder="找段號、字幕、畫面文字或時間（例 x0410、手機、12:30）" aria-label="找一段">
        <div class="sb-kinds" role="group" aria-label="只看哪一種">
          <button type="button" data-kind-filter="all" aria-pressed="true">全部</button>
          <button type="button" data-kind-filter="design" aria-pressed="false">內容設計動畫</button>
          <button type="button" data-kind-filter="anim" aria-pressed="false">模板動畫</button>
          <button type="button" data-kind-filter="card" aria-pressed="false">字卡</button>
          <button type="button" data-kind-filter="media" aria-pressed="false">錄影／圖片</button>
          <button type="button" data-kind-filter="changed" aria-pressed="false">我改過的</button>
          <button type="button" data-kind-filter="unseen" aria-pressed="false">還沒看的</button>
        </div>
        <span class="sb-findernote" id="finderNote" role="status"></span>
      </div>
    </div>
    <div id="speakerBox"></div>
    <div id="banner"></div>
    <div class="sb-panel sb-empty" id="empty" hidden></div>
    <div id="sections" class="sb-main"></div>
  </main>
</div>

<div class="notice" id="notice" role="alert" hidden></div>

<script type="module" src="/editor/storyboard.js"></script>
<script type="module" src="/editor/flow.js"></script>
</body>
</html>
