<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>x-scene 示意動畫骨架｜預覽</title>
<!-- build.mjs --gallery 產生（tools/lib/custom-preview.mjs）：custom/x-scene.html 的 <template> 原樣放進來，時間用 root 的 data-cues-sample；改 custom 檔後重跑 --gallery -->
<link rel="stylesheet" href="../kit/fonts.css">
<link rel="stylesheet" href="../kit/brand.css">
<link rel="stylesheet" href="../kit/scene.css">
<link rel="stylesheet" href="../kit/illus.css">
<link rel="stylesheet" href="../kit/theme.css">
<link rel="stylesheet" href="../kit/captions.css">
<script src="../kit/style-switch.js"></script>
<script src="../kit/gsap.min.js"></script>
<script src="../kit/scene-motion.js"></script>
<script src="../kit/illus.js"></script>
<script src="../kit/scene-layout.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; transform-origin: 0 0; }
  #footage { position: absolute; inset: 0; }
  #footage img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
  #scene { position: absolute; inset: 0; z-index: 30; }
  #pip { position: absolute; left: 1424px; top: 594px; width: 432px; height: 324px; overflow: hidden; border-radius: 6px; z-index: 40; }
  #pip img { position: absolute; left: -220px; top: -10px; width: 873px; height: 491px; }
  #pipf { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 41; }
  .sc-surface-fs { background-image: url("../bg-fs.jpg"), var(--sc-fs-pattern); background-size: cover, 1920px 1080px; background-position: center, 0 0; background-repeat: no-repeat; }
</style>
<script>window.__timelines = window.__timelines || {};</script>
</head>
<body>
<div id="stage">
  <div id="footage"><img src="speaker.jpg" alt=""></div>
  <div id="scene">

  <style>
    #x-scene { position: absolute; inset: 0; }
    #x-scene .fill { position: absolute; inset: 0; }
    /* 主卡：panelTop 區（左 120、頂 150、寬 1180；標題列 128＋內容區 580＝708） */
    #x-scene #xsc-card { position: absolute; left: 120px; top: 150px; width: 1180px; }
    #x-scene #xsc-card .sc-wcard__bar { height: 128px; padding: 20px var(--sc-pad-card); }
    #x-scene #xsc-stage { position: relative; width: 1176px; height: 580px; }
    /* 連接線：xsc-lines 的 data-links 自動產生（kit/scene-layout.js；樣式是 scene.css 的 .sc-link） */
    /* 地面線（選用）：和內容區一樣大的 svg，線的位置由程式量 xsc-stand 元件的腳底算；data-stops 的站點是程式加的 circle */
    #x-scene .xsc-floor { position: absolute; left: 0; top: 0; width: 1176px; height: 580px; overflow: visible; }
    #x-scene .xsc-floor path { fill: none; stroke: var(--il-line); stroke-width: 4px; stroke-linecap: round; }
    #x-scene .xsc-floor circle { fill: var(--v2-node); stroke: var(--il-line); stroke-width: 4px; }
    #x-scene .xsc-route path { stroke: var(--brand); stroke-width: 10px; }   /* 路線圖：地面線 class 加 xsc-route＝主色粗線＋站點 */
    #x-scene .xsc-route circle { stroke: var(--brand); stroke-width: 6px; }
    /* 目前位置標記（選用）：沿地面線滑到聚焦的元件下面 */
    #x-scene .xsc-here { position: absolute; left: 0; top: 0; width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; background: var(--v2-ink); border: 8px solid var(--brand); opacity: 0; }
    /* 元件：插圖＋下面的標籤（xsc-side＝標籤在右邊）；位置由 xsc-stage 的 data-layout 排（kit/scene-layout.js），不寫 left／top */
    #x-scene .xsc-it { position: absolute; display: flex; flex-direction: column; align-items: center; gap: var(--sc-gap-sm); white-space: nowrap; }
    #x-scene .xsc-side { flex-direction: row; gap: var(--sc-gap-sm); }
    #x-scene .xsc-lbl { display: block; font-size: 32px; line-height: 40px; }   /* 標籤 32px：退到 0.96 時仍 ≥ 30px */
    #x-scene .xsc-wv { width: 216px; height: 88px; }   /* 聲紋（選用）：P.wave 自動插跳動的條 */
  </style>
  <div id="x-scene" data-composition-id="x-scene" data-width="1920" data-height="1080" data-duration="19.5"
       data-cues-sample='{"start":0,"D":19.5,"cues":{"182":[2.5,5],"183":[5.4,7.9],"184":[8.3,10.8],"185":[11.2,13.7],"186":[14.1,16.6]},"refs":{"#182@手機":2.9,"#183@雲端":5.8,"#184@電腦":9,"#185@播放":11.8,"#186@沒問題":14.6}}'>
    <div class="sc-surface-fs fill"></div>
    <div id="xsc-card" class="sc-wcard">
      <div class="sc-wcard__bar"><span class="sc-opt">以前的傳檔流程</span></div>
      <div id="xsc-stage" data-layout="row" data-gap="xl">
        <svg id="xsc-floor" class="xsc-floor" data-layout-ignore xmlns="http://www.w3.org/2000/svg"><path d=""/></svg>
        <!-- <div class="xsc-here" data-layout-ignore></div> -->
        <svg id="xsc-lines" data-links="xsc-phone>xsc-cloud xsc-cloud>xsc-laptop" xmlns="http://www.w3.org/2000/svg"></svg>
        <!-- ══ DATA 1：元件清單（一個元件一行；只改這裡）══ -->
        <div id="xsc-phone" class="xsc-it" data-slot><div data-illus="phone" data-orient="landscape" data-screen="video" style="width:296px;height:148px"></div><b class="xsc-lbl sc-w700">手機</b></div>
        <div id="xsc-cloud" class="xsc-it" data-slot><div data-illus="cloud" data-arrow="up" style="width:256px;height:174px"></div><b class="xsc-lbl sc-w700">雲端</b></div>
        <div id="xsc-laptop" class="xsc-it" data-slot><div data-illus="laptop" data-screen="blank" style="width:312px;height:212px"></div><b class="xsc-lbl sc-w700">電腦</b></div>
        <div id="xsc-ok" class="xsc-it xsc-side" data-slot data-row="2"><div data-illus="badge" data-kind="check" style="width:96px;height:96px"></div><b class="xsc-lbl sc-w700">沒問題</b></div>
        <!-- ══ DATA 1 到這裡 ══ -->
      </div>
    </div>
  </div>
  <script>
  (function () {
    ILLUS.mount(document.getElementById('x-scene'));   // 第一行：元件清單的 data-illus／data-illus-src 先換成 SVG，之後建的動畫才抓得到 .il-* 子元素
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-scene'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });

    // ══ DATA 2：拍（一拍一行；只改這裡）══
    const T1 = P.at('#182@手機');
    const T2 = P.at('#183@雲端');
    const T3 = P.at('#184@電腦');
    const T4 = P.at('#185@播放');
    const T5 = P.at('#186@沒問題');
    const BEATS = [
      [T1, { in: ['xsc-phone'], focus: 'xsc-phone' }],
      [T2, { in: ['xsc-cloud'], line: 'xsc-phone-xsc-cloud', focus: 'xsc-cloud' }],
      [T3, { in: ['xsc-laptop'], line: 'xsc-cloud-xsc-laptop', focus: 'xsc-laptop' }],
      [T4, { state: ['xsc-laptop', 'blank', 'play'], focus: 'xsc-laptop' }],
      [T5, { check: 'xsc-ok', focus: 'xsc-ok' }],
    ];
    // ══ DATA 2 到這裡；下面不用改 ══

    const ROOT = document.getElementById('x-scene');
    const R = P.region('panelTop');   // 主卡＝全畫面主卡區（design-system §2；直式由 window.__regions 蓋過）
    const CARD = document.getElementById('xsc-card');
    CARD.style.left = R[0] + 'px'; CARD.style.top = R[1] + 'px'; if (!CARD.hasAttribute('data-wide')) CARD.style.width = R[2] + 'px';   // 全寬版型：kit 已把主卡拉到 1680，不要蓋回去
    const sel = function (id) { return '#' + id; };
    const stateSel = function (s) { return !s || s === 'blank' ? null : s === 'video' ? '.il-content' : '.il-' + s; };   // 狀態名 → 狀態群組
    // 位置由 data-layout 排好（kit/scene-layout.js；ILLUS.mount 之後自動跑一次），這裡只讀
    const L = window.SceneLayout, moved = {};
    const illusOf = function (el) { return el.querySelector('[data-illus], [data-illus-src]') || el; };
    const DRAW = 0.7;   // 一個插圖元件畫出來的秒數（馬克筆照筆順一筆一筆畫，P.draw）
    const drawn = function (s) { return !!ROOT.querySelector(s + ' .il'); };   // 插圖元件用畫的；不是插圖（聲紋、自己的 HTML）用彈出
    const lblAt = function (s, at) { if (ROOT.querySelector(s + ' .xsc-lbl')) P.chars(s + ' .xsc-lbl', at, { stagger: 0.035 }); };

    // 拍 0 開場：主卡進場（看 ENTER）→ 標題逐字上浮
    const ENTER = P.prev() === 'fullscreen' ? 'swap' : 'grow';   // 預設看前一段（build 給）：也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出；要固定才改成 'grow' 或 'swap'
    if (ENTER === 'grow') P.grow('#xsc-card', 0.3);
    else { P.wipe('#xsc-card', 0, { dir: 'up', dur: 0.8 }); P.pop('#xsc-card', 0, { from: 0.96, dy: 60, dur: 0.8, ease: P.V2.EASE.in }); }
    P.chars('#xsc-card .sc-wcard__bar .sc-opt', 0.5, { stagger: 0.035 });
    // 拍 1 場景骨架：地面線（畫在 xsc-stand 元件的腳底；data-stops＝每個元件下面一個站點）→ 一開始就在的元件（xsc-pre）一筆一筆畫出
    const FLOOR = ROOT.querySelector('.xsc-floor'), STANDS = Array.prototype.slice.call(ROOT.querySelectorAll('.xsc-stand'));
    const HERE = ROOT.querySelector('.xsc-here');   // 目前位置標記（選用）：聚焦到站在地上的元件時，沿地面線滑到它下面
    let fx0 = 0, fx1 = 1, here = -1;
    if (FLOOR && STANDS.length) {
      const st = FLOOR.parentNode, route = FLOOR.classList.contains('xsc-route');   // 路線圖：線畫在標籤下面（物件、站名、站點由上往下）；地面線：畫在插圖的腳底
      const bs = STANDS.map(function (el) { return L.box(illusOf(el), st); });
      const y = Math.max.apply(null, STANDS.map(function (el, i) { const b = route ? L.box(el, st) : bs[i]; return b[1] + b[3] + (route ? 36 : 0); }));
      fx0 = Math.max(24, Math.min.apply(null, bs.map(function (b) { return b[0]; })) - 48); fx1 = Math.min(st.offsetWidth - 24, Math.max.apply(null, bs.map(function (b) { return b[0] + b[2]; })) + 48);
      FLOOR.querySelector('path').setAttribute('d', 'M' + fx0 + ' ' + y + ' L' + fx1 + ' ' + y);
      if (FLOOR.hasAttribute('data-stops')) bs.forEach(function (b) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', Math.round(b[0] + b[2] / 2)); c.setAttribute('cy', y); c.setAttribute('r', 12); FLOOR.appendChild(c);
      });
      if (HERE) { HERE.style.left = Math.round(fx0 - HERE.offsetWidth / 2) + 'px'; HERE.style.top = Math.round(y - HERE.offsetHeight / 2) + 'px'; }
    } else if (FLOOR) FLOOR.remove();   // 沒有站在地上的元件：不畫地面線
    if (HERE && FLOOR && STANDS.length) P.pop(HERE, 1.2, { from: 0.4, dy: 0 });   // 標記和路線一起出現在起點
    const hereTo = function (id, at) {   // 標記沿線滑到這個元件下面
      const el = document.getElementById(id);
      if (!HERE || STANDS.indexOf(el) < 0) return;
      const b = L.box(illusOf(el), FLOOR.parentNode), to = (b[0] + b[2] / 2 - fx0) / (fx1 - fx0);
      P.along(HERE, '#' + FLOOR.id + ' path', at, { from: Math.max(0, here), to: to, dur: 0.8 });
      here = to;
    };
    const PRE = Array.prototype.map.call(ROOT.querySelectorAll('.xsc-pre'), function (el) { return '#' + el.id; });
    P.draw('#xsc-floor, #x-scene .xsc-pre .il', 1.2, { dur: 0.8 });   // 同一支筆：先地面線、再場景骨架（文件順序）
    PRE.forEach(function (s) { if (!drawn(s)) P.pop(s, 1.2, { from: 0.9, dy: 20 }); lblAt(s, 1.6); });

    // 每一拍：畫出來（或彈出）→ 換狀態／移動／數字／聲紋 → 連接線 → 結果 → 聚焦（同一時間只有一個焦點）
    const entered = PRE.slice(), dimmed = [];   // 場景骨架也可以被聚焦、移動
    let spotted = false;
    BEATS.forEach(function (b, k) {
      const t = b[0], o = b[1];
      const ins = (o.in || []).map(sel), drw = ins.filter(drawn), pops = ins.filter(function (s) { return !drawn(s); });
      const lines = o.line ? $q(sel(o.line) + ', ' + sel(o.line) + '-head') : [];   // 先有節點再畫線：同一支筆畫完這拍的元件，接著畫連接線與箭頭（0.5 秒）
      const strokes = drw.map(function (s) { return ROOT.querySelector(s + ' .il'); }).concat(lines);
      if (strokes.length) P.draw(strokes, t, { dur: DRAW * drw.length + (lines.length ? 0.35 : 0) });
      if (pops.length) P.pop(pops.join(', '), t, { stagger: 0.12, from: 0.82, dy: 28 });
      ins.forEach(function (s, i) { lblAt(s, t + 0.3 + i * 0.3); if (entered.indexOf(s) < 0) entered.push(s); });
      if (o.state) {
        const s = sel(o.state[0]), a = stateSel(o.state[1]), z = stateSel(o.state[2]);
        if (a && z) P.swap(s + ' ' + a, s + ' ' + z, t + 0.15);
        else if (z) P.in(s + ' ' + z, t + 0.15);
        else if (a) P.out(s + ' ' + a, t + 0.15);
        P.ripple(s + ' .il', t + 0.2, { to: 1.5 });
      }
      if (o.move) {   // move: [元件, 目標元件, 'left'｜'right']：走到目標插圖的左（右）邊，隔 --sc-gap-md，兩個都有標籤＝插圖底對齊（標籤同一條線），否則插圖中線對齊
        const el = document.getElementById(o.move[0]), tg = document.getElementById(o.move[1]);
        const a = L.box(illusOf(el), el.offsetParent), b = L.box(illusOf(tg), el.offsetParent), ea = L.box(illusOf(el), el), g = L.token('gap-md'), lbl = (e) => !!e.querySelector(':scope > [class*="lbl"]');
        const from = moved[o.move[0]] || { left: el.offsetLeft, top: el.offsetTop };
        const x = o.move[2] === 'right' ? b[0] + b[2] + g : b[0] - g - a[2];
        const to = { left: Math.round(x - ea[0]), top: Math.round((lbl(el) && lbl(tg) ? b[1] + b[3] - a[3] : b[1] + b[3] / 2 - a[3] / 2) - ea[1]) };
        P.morph(sel(o.move[0]), t, to, { from: from, dur: 1.0, ease: P.V2.EASE.move });
        moved[o.move[0]] = to;
      }
      if (o.count) P.count(o.count[0], t + 0.2, { from: o.count[1], to: o.count[2], dur: 1.2, prefix: o.count[3] || '' });
      if (o.wave) P.wave(sel(o.wave) + ' .xsc-wv', t + 0.2);   // 聲紋從這拍跳到段尾
      if (o.check) {
        const s = sel(o.check);
        P.pop(s, t, { from: 0.6, dy: 0 });
        lblAt(s, t + 0.14);
        P.check(s + ' .il', t + 0.3);
        if (entered.indexOf(s) < 0) entered.push(s);
      }
      (o.dim || []).forEach(function (id) { P.dim(sel(id), t, { to: 0.6 }); if (dimmed.indexOf(sel(id)) < 0) dimmed.push(sel(id)); });
      if (o.focus) {
        const f = sel(o.focus), fresh = ins.indexOf(f) >= 0 || o.check === o.focus;
        const at = t + (fresh && drw.indexOf(f) < 0 ? 0.6 : 0.1);   // 畫出來的元件一開始畫就聚焦（不放大、不上移，筆尖才對得準）；彈出的等彈完
        P.spot(entered.join(', '), f, at, { scale: 1, lift: 0 });
        hereTo(o.focus, at);
        spotted = true;
      }
    });

    // 收：最後一拍講完 2 秒回均衡（全部亮回），完成態停到段尾
    const TR = BEATS[BEATS.length - 1][0] + 2.0;
    if (spotted) P.spot(entered.join(', '), null, TR, { dur: 0.6 });
    if (dimmed.length) P.dim(dimmed.join(', '), TR, { to: 1 });

    P.end();                                         // 長度＝plan.json 這段的長度
    window.__timelines['x-scene'] = tl;
  })();
  </script>

  </div>
  <div id="pip"><img src="speaker.jpg" alt=""></div>
  <img id="pipf" src="../kit/pip-frame.png" alt="">
</div>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); stage.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();
  var key = "x-scene";
  var start = function () {
    var inner = window.__timelines[key];
    if (!inner) { document.title = key + '｜script 出錯（看 console）'; return; }
    var D = inner.duration();
    var tl = gsap.timeline({ repeat: -1, repeatDelay: 1.2 });
    tl.fromTo('#scene, #pip, #pipf', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'sine.out' }, 0);
    tl.add(inner.paused(false), 0);
    tl.to('#scene, #pip, #pipf', { opacity: 0, duration: 0.5, ease: 'sine.in' }, Math.max(0.5, D - 0.5));
    // 截圖用：網址加 ?t=秒數 就停在那一刻（例：x-process.html?t=13.9）
    var t = Number(new URLSearchParams(location.search).get('t'));
    if (t > 0) tl.pause(t);
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'hf-preview-replay') return;
      tl.restart();
      (e.source || parent).postMessage({ type: 'hf-preview-started', key: key }, '*');
    });
    parent.postMessage({ type: 'hf-preview-ready', key: key, duration: Math.round(D * 1000) / 1000, cues: [] }, '*');
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
</body>
</html>
