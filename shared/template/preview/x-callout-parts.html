<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>x-callout-parts 零件圖｜預覽</title>
<!-- build.mjs --gallery 產生（tools/lib/custom-preview.mjs）：custom/x-callout-parts.html 的 <template> 原樣放進來，時間用 root 的 data-cues-sample；改 custom 檔後重跑 --gallery -->
<link rel="stylesheet" href="../kit/fonts.css">
<link rel="stylesheet" href="../kit/brand.css">
<link rel="stylesheet" href="../kit/scene.css">
<link rel="stylesheet" href="../kit/illus.css">
<link rel="stylesheet" href="../kit/theme.css">
<link rel="stylesheet" href="../kit/captions.css">
<script src="../kit/style-switch.js"></script>
<script src="../kit/gsap.min.js"></script>
<script src="../kit/scene-motion.js"></script>
<script src="../kit/illus.js"></script>
<script src="../kit/scene-layout.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; transform-origin: 0 0; }
  #footage { position: absolute; inset: 0; }
  #footage img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
  #scene { position: absolute; inset: 0; z-index: 30; }
  #pip { position: absolute; left: 1424px; top: 594px; width: 432px; height: 324px; overflow: hidden; border-radius: 6px; z-index: 40; }
  #pip img { position: absolute; left: -220px; top: -10px; width: 873px; height: 491px; }
  #pipf { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 41; }
  .sc-surface-fs { background-image: url("../bg-fs.jpg"), var(--sc-fs-pattern); background-size: cover, 1920px 1080px; background-position: center, 0 0; background-repeat: no-repeat; }
</style>
<script>window.__timelines = window.__timelines || {};</script>
</head>
<body>
<div id="stage">
  <div id="footage"><img src="speaker.jpg" alt=""></div>
  <div id="scene">

  <style>
    #x-callout-parts { position: absolute; inset: 0; }
    #x-callout-parts .fill { position: absolute; inset: 0; }
    /* 主卡：左 120、頂 150、寬 1180（右緣 1300）；標題列 128、內容區 1176×580（卡底 862） */
    #x-callout-parts #xcpa-card { position: absolute; left: 120px; top: 150px; width: 1180px; }
    #x-callout-parts #xcpa-card .sc-wcard__bar { height: 128px; padding: 20px 56px; }
    #x-callout-parts #xcpa-body { position: relative; width: 1176px; height: 580px; }
    /* 藍圖紙：方格只畫在內容區 */
    #x-callout-parts #xcpa-grid { position: absolute; left: 0; top: 0; width: 1176px; height: 580px; }
    #x-callout-parts #xcpa-grid path { fill: none; stroke: var(--v2-line); stroke-width: 1px; }
    /* 主體：插圖＋右邊 120 給編號圓、下面主體名稱；部位點 .xcpa-pt 不佔位置 */
    #x-callout-parts #xcpa-objwrap { position: absolute; width: 320px; height: 472px; }
    #x-callout-parts #xcpa-obj { position: absolute; left: 0; top: 0; width: 200px; height: 400px; }
    #x-callout-parts .xcpa-lbl { position: absolute; left: 0; top: 416px; width: 200px; height: 56px; text-align: center; white-space: nowrap; }
    #x-callout-parts .xcpa-pt { position: absolute; width: 0; height: 0; }
    /* 引線、圓點（script 算）與編號圓 */
    #x-callout-parts #xcpa-lines { position: absolute; left: 0; top: 0; width: 320px; height: 400px; overflow: visible; }
    #x-callout-parts .xcpa-lead { fill: none; stroke: var(--sc-fs-ink); stroke-width: 4px; stroke-linecap: round; }
    #x-callout-parts .xcpa-dot { fill: var(--brand); stroke: var(--v2-node); stroke-width: 4px; }
    #x-callout-parts .xcpa-bal { position: absolute; width: 64px; height: 64px; box-sizing: border-box; border-radius: 32px; border: 4px solid var(--brand);
                                 background: var(--v2-node); color: var(--brand); display: flex; align-items: center; justify-content: center; }
    /* 零件表：400 寬、紙膠帶貼上（P.tape）；每列 100 高、淡主色底、列距 8 */
    #x-callout-parts #xcpa-list { position: absolute; width: 400px; box-sizing: border-box; padding: 24px 28px; border: 4px solid var(--v2-node-line);
                                  border-radius: 16px; background: var(--v2-node); color: var(--sc-fs-ink); }
    #x-callout-parts .xcpa-row { position: relative; height: 100px; box-sizing: border-box; padding: 0 24px; border-radius: 16px; background: var(--v2-node-tint);
                                 display: flex; align-items: center; gap: 20px; white-space: nowrap; }
    #x-callout-parts .xcpa-row + .xcpa-row { margin-top: 8px; }
    #x-callout-parts .xcpa-num { width: 48px; height: 48px; flex: none; border-radius: 24px; background: var(--brand); color: var(--brand-ink);
                                 display: flex; align-items: center; justify-content: center; }
    #x-callout-parts .xcpa-name { position: relative; }
  </style>
  <div id="x-callout-parts" data-composition-id="x-callout-parts" data-width="1920" data-height="1080" data-duration="15.7"
       data-cues-sample='{"start":0,"D":15.7,"cues":{"242":[2.5,5.1],"243":[5.2,7.6],"244":[7.7,10.1],"245":[10.2,12.6],"246":[12.9,15.2]},"refs":{"#242@鏡頭":2.7,"#243@手機":5.4,"#244@雲台":7.9,"#245@三腳架":10.4}}'>
    <div class="sc-surface-fs fill"></div>
    <div id="xcpa-card" class="sc-wcard">
      <div class="sc-wcard__bar"><span class="sc-opt">拍片架拆解</span></div>
      <div id="xcpa-body" data-layout="row" data-gap="xxl">
        <svg id="xcpa-grid" xmlns="http://www.w3.org/2000/svg" data-layout-ignore><defs><pattern id="xcpa-sq" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0 L0 0 L0 40" /></pattern></defs><rect width="1176" height="580" fill="url(#xcpa-sq)" /></svg>
        <div id="xcpa-objwrap" data-slot>
          <div id="xcpa-obj" data-illus="phoneTripod" data-orient="portrait" data-screen="blank"></div>
          <svg id="xcpa-lines" xmlns="http://www.w3.org/2000/svg" data-layout-ignore></svg>
          <b class="xcpa-lbl sc-t40 sc-w700 sc-gray sc-opt">手機拍片架</b>
          <!-- ══ 部位：data-at＝插圖上的位置（左上 0,0、右下 100,100 的百分比）══ -->
          <i id="xcpa-p1" class="xcpa-pt" data-at="50,3"></i>
          <i id="xcpa-p2" class="xcpa-pt" data-at="50,35"></i>
          <i id="xcpa-p3" class="xcpa-pt" data-at="50,73"></i>
          <i id="xcpa-p4" class="xcpa-pt" data-at="76,92"></i>
        </div>
        <div id="xcpa-list" data-slot>
          <div id="xcpa-t1" class="xcpa-row"><span class="xcpa-num sc-t40 sc-w900">1</span><span id="xcpa-n1" class="xcpa-name sc-t52 sc-w700 sc-opt">鏡頭</span></div>
          <div id="xcpa-t2" class="xcpa-row"><span class="xcpa-num sc-t40 sc-w900">2</span><span id="xcpa-n2" class="xcpa-name sc-t52 sc-w700 sc-opt">手機</span></div>
          <div id="xcpa-t3" class="xcpa-row"><span class="xcpa-num sc-t40 sc-w900">3</span><span id="xcpa-n3" class="xcpa-name sc-t52 sc-w700 sc-opt">雲台</span></div>
          <div id="xcpa-t4" class="xcpa-row"><span class="xcpa-num sc-t40 sc-w900">4</span><span id="xcpa-n4" class="xcpa-name sc-t52 sc-w700 sc-opt">三腳架</span></div>
        </div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    ILLUS.mount(document.getElementById('x-callout-parts'));   // 第一行：主體插圖先掛成 SVG，P.draw 才抓得到每一筆
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-callout-parts'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const T1 = P.at('#242@鏡頭'), T2 = P.at('#243@手機'), T3 = P.at('#244@雲台'), T4 = P.at('#245@三腳架');   // 講到每個零件的時刻
    const ALL = P.at('#246');                        // 講到總結那一句（沒有這句見檔頭【綁句欄位】）
    const ENTER = P.prev() === 'fullscreen' ? 'swap' : 'grow';   // 預設看前一段（build 給）：也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出；要固定才改成 'grow' 或 'swap'

    // 0. 部位 → 圓點、引線、編號圓（以下都不用改；載入時算一次，每次結果相同）
    const NS = 'http://www.w3.org/2000/svg', WRAP = $q('#xcpa-objwrap')[0], OBJ = $q('#xcpa-obj')[0], SVG = $q('#xcpa-lines')[0];
    const OW = OBJ.offsetWidth, OH = OBJ.offsetHeight, BX = OW + 48;
    let lastY = -999;
    $q('#x-callout-parts .xcpa-pt').forEach(function (pt, i) {
      const at = pt.getAttribute('data-at').split(',').map(Number), x = Math.round(OW * at[0] / 100), y = Math.round(OH * at[1] / 100);
      const by = Math.max(y, lastY + 80); lastY = by;
      const k = i + 1, line = document.createElementNS(NS, 'path'), dot = document.createElementNS(NS, 'circle');
      line.setAttribute('class', 'xcpa-lead'); line.setAttribute('id', 'xcpa-l' + k);
      line.setAttribute('d', 'M' + x + ' ' + y + (by !== y ? ' L' + (BX - 40) + ' ' + y + ' L' + (BX - 16) + ' ' + by : ' L' + (BX - 8) + ' ' + y));
      dot.setAttribute('class', 'xcpa-dot'); dot.setAttribute('id', 'xcpa-d' + k); dot.setAttribute('cx', x); dot.setAttribute('cy', y); dot.setAttribute('r', 10);
      SVG.appendChild(line); SVG.appendChild(dot);
      const b = document.createElement('b'); b.className = 'xcpa-bal sc-t40 sc-w900'; b.id = 'xcpa-b' + k; b.textContent = String(k);
      b.setAttribute('data-layout-allow-overlap', ''); b.style.left = BX + 'px'; b.style.top = (by - 32) + 'px'; WRAP.appendChild(b);
    });
    const part = function (k, t) {   // 一個零件一拍：圓點描出 → 引線畫過去 → 編號圓彈出 → 那一列亮起
      P.stroke('#xcpa-d' + k, t, { dur: 0.2 });
      P.draw('#xcpa-l' + k, t + 0.1, { dur: 0.4, pen: false });
      P.pop('#xcpa-b' + k, t + 0.4, { from: 0.5, dy: 0 });
      P.pop('#xcpa-t' + k, t, { from: 0.9, dy: 16 });  P.chars('#xcpa-n' + k, t + 0.12);
    };

    // 拍 0 開場：主卡進場（看 ENTER）→ 標題逐字上浮 → 1.0 主體被馬克筆畫出來（1.0 秒）→ 1.3 零件表落下、紙膠帶貼上
    if (ENTER === 'grow') P.grow('#xcpa-card', 0.3);
    else { P.wipe('#xcpa-card', 0, { dir: 'up', dur: 0.8 }); P.pop('#xcpa-card', 0, { from: 0.96, dy: 60, dur: 0.8, ease: P.V2.EASE.in }); }
    P.chars('#xcpa-card .sc-wcard__bar .sc-opt', 0.5, { stagger: 0.035 });
    P.in('#xcpa-grid', 0.8, { dur: 0.4 });
    P.draw('#xcpa-obj', 1.0, { dur: 1.0 });
    P.tape('#xcpa-list', 1.3);
    // 拍 1–4 每個零件：照順序（3 個以下時刪掉多的那行）；＋0.6 聚焦到那一列
    part(1, T1);  P.spot('#xcpa-t1', '#xcpa-t1', T1 + 0.6, { scale: 1.04, lift: 0, dim: 0.5 });
    part(2, T2);  P.spot('#xcpa-t1, #xcpa-t2', '#xcpa-t2', T2 + 0.6, { scale: 1.04, lift: 0, dim: 0.5 });
    part(3, T3);  P.spot('#xcpa-t1, #xcpa-t2, #xcpa-t3', '#xcpa-t3', T3 + 0.6, { scale: 1.04, lift: 0, dim: 0.5 });
    part(4, T4);  P.spot('#xcpa-t1, #xcpa-t2, #xcpa-t3, #xcpa-t4', '#xcpa-t4', T4 + 0.6, { scale: 1.04, lift: 0, dim: 0.5 });   // 第 4 個零件
    // 收：總結那一句 → 回均衡（零件表全部亮回），完成態停到段尾
    P.spot('#xcpa-t1, #xcpa-t2, #xcpa-t3, #xcpa-t4', null, ALL, { dur: 0.6 });

    P.end();                                         // 長度＝plan.json 這段的長度
    window.__timelines['x-callout-parts'] = tl;
  })();
  </script>

  </div>
  <div id="pip"><img src="speaker.jpg" alt=""></div>
  <img id="pipf" src="../kit/pip-frame.png" alt="">
</div>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); stage.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();
  var key = "x-callout-parts";
  var start = function () {
    var inner = window.__timelines[key];
    if (!inner) { document.title = key + '｜script 出錯（看 console）'; return; }
    var D = inner.duration();
    var tl = gsap.timeline({ repeat: -1, repeatDelay: 1.2 });
    tl.fromTo('#scene, #pip, #pipf', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'sine.out' }, 0);
    tl.add(inner.paused(false), 0);
    tl.to('#scene, #pip, #pipf', { opacity: 0, duration: 0.5, ease: 'sine.in' }, Math.max(0.5, D - 0.5));
    // 截圖用：網址加 ?t=秒數 就停在那一刻（例：x-process.html?t=13.9）
    var t = Number(new URLSearchParams(location.search).get('t'));
    if (t > 0) tl.pause(t);
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'hf-preview-replay') return;
      tl.restart();
      (e.source || parent).postMessage({ type: 'hf-preview-started', key: key }, '*');
    });
    parent.postMessage({ type: 'hf-preview-ready', key: key, duration: Math.round(D * 1000) / 1000, cues: [] }, '*');
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
</body>
</html>
