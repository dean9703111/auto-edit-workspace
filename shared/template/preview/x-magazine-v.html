<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>x-magazine 雜誌封面｜直式預覽</title>
<!-- build.mjs --gallery 產生（tools/lib/custom-preview.mjs，format: portrait）：custom/x-magazine.html 的 <template> 原樣放進來，舞台縮放 0.8475 倍進上半面板（直式只顯示 x 120–1300、y 130–880）；改 custom 檔後重跑 --gallery -->
<link rel="stylesheet" href="../kit/fonts.css">
<link rel="stylesheet" href="../kit/brand.css">
<link rel="stylesheet" href="../kit/scene.css">
<link rel="stylesheet" href="../kit/illus.css">
<link rel="stylesheet" href="../kit/theme.css">
<link rel="stylesheet" href="../kit/captions.css">
<script src="../kit/style-switch.js"></script>
<script src="../kit/gsap.min.js"></script>
<script src="../kit/scene-motion.js"></script>
<script src="../kit/illus.js"></script>
<script src="../kit/scene-layout.js"></script>
<script>window.__regions = {"full":[60,240,960,1020],"band":[60,880,880,360],"panelTop":[0,0,1080,900],"panelBottom":[0,900,1080,1020],"pip":[0,900,1080,1020],"badge":[60,250,624,112],"captions":[0,1280,1080,140],"safe":[60,240,960,1200]};</script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; background: #000; transform-origin: 0 0; }
  #footage { position: absolute; inset: 0; }
  #footage img, #pip img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; }
  #bd { position: absolute; inset: 0; z-index: 29; }
  #scene { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 30; transform: translate(-61.7px, 129.825px) scale(0.8475); transform-origin: 0 0; }
  #pip { position: absolute; left: 0px; top: 900px; width: 1080px; height: 1020px; overflow: hidden; z-index: 40; }
  #pipf { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; z-index: 41; }
  #pv-label { position: absolute; left: 24px; top: 924px; z-index: 42; padding: 6px 16px; border-radius: 8px; background: rgba(0, 0, 0, 0.55); color: #fff; font: 700 28px/40px system-ui, sans-serif; }
  .sc-surface-fs { background-image: url("../bg-fs.jpg"), var(--sc-fs-pattern); background-size: cover, 1920px 1080px; background-position: center, 0 0; background-repeat: no-repeat; }
</style>
<script>window.__timelines = window.__timelines || {};</script>
</head>
<body>
<div id="stage">
  <div id="footage"><img src="speaker-v.jpg" onerror="this.onerror=null;this.src='speaker.jpg'" alt=""></div>
  <div id="bd" class="sc-surface-fs"></div>
  <div id="scene">

  <style>
    #x-magazine { position: absolute; inset: 0; }
    #x-magazine #xmg-frame { position: absolute; left: 40px; top: 40px; width: 1840px; height: 1000px; box-sizing: border-box; border: 4px solid var(--v2-card); }
    #x-magazine .xmg-top { position: absolute; top: 64px; color: var(--v2-card); white-space: nowrap; letter-spacing: 4px; text-shadow: 0 2px 6px var(--v2-ink); }
    #x-magazine #xmg-top1 { left: 96px; }
    #x-magazine #xmg-top2 { left: 0; width: 1920px; text-align: center; }
    #x-magazine #xmg-top3 { right: 96px; }
    /* 刊名：警示紅的大字（雜誌刊頭），在講者後面 */
    #x-magazine #xmg-mast { position: absolute; left: 0; top: 110px; width: 1920px; text-align: center; white-space: nowrap; font-size: 330px; line-height: 1; font-weight: 900;
                            letter-spacing: 12px; color: var(--sc-warn); }
    /* 左側封面標題：大數字＋一行字 */
    #x-magazine .xmg-line { position: absolute; left: 96px; height: 104px; display: flex; align-items: center; gap: 20px; white-space: nowrap; color: var(--v2-card); text-shadow: 0 2px 8px var(--v2-ink); }
    #x-magazine .xmg-n { color: var(--sc-warn); text-shadow: none; }
    #x-magazine #xmg-l1 { top: 500px; }
    #x-magazine #xmg-l2 { top: 628px; }
    #x-magazine #xmg-l3 { top: 756px; }
    #x-magazine #xmg-code { position: absolute; left: 96px; top: 892px; width: 240px; height: 0; }
    #x-magazine #xmg-code svg { position: absolute; left: 0; bottom: 12px; display: block; width: 240px; height: 72px; background: var(--v2-card); fill: var(--v2-ink); }
  </style>
  <div id="x-magazine" data-composition-id="x-magazine" data-width="1920" data-height="1080" data-duration="12" data-matte="1"
       data-cues-sample='{"start":0,"D":12,"cues":{"441":[0.5,2.8],"442":[2.9,5.4],"443":[5.5,11.6]},"refs":{"#441@相信":0.8,"#442@品味":3.4,"#443@什麼":6.0}}'>
    <div id="xmg-frame" data-layout-allow-overlap data-layout-allow-caption-zone data-layout-allow-overflow></div>
    <span id="xmg-top1" class="xmg-top sc-t40 sc-w700 sc-mono">VOL.01</span>
    <span id="xmg-top2" class="xmg-top sc-t40 sc-w700">AI 時代特刊</span>
    <span id="xmg-top3" class="xmg-top sc-t40 sc-w700 sc-mono">2026 NOV</span>
    <div id="xmg-mast" data-layout-allow-overflow>TASTE</div>
    <div id="xmg-l1" class="xmg-line"><span class="xmg-n sc-t80 sc-w900 sc-mono">2</span><span class="xmg-t sc-t44 sc-w900 sc-opt">個方法練品味</span></div>
    <div id="xmg-l2" class="xmg-line"><span class="xmg-n sc-t80 sc-w900 sc-mono">90</span><span class="xmg-t sc-t44 sc-w900 sc-opt">分的人多做一步</span></div>
    <div id="xmg-l3" class="xmg-line"><span class="xmg-n sc-t80 sc-w900 sc-mono">1</span><span class="xmg-t sc-t44 sc-w900 sc-opt">個常見的誤會</span></div>
    <div id="xmg-code"><svg viewBox="0 0 240 72" xmlns="http://www.w3.org/2000/svg"><rect x="12" y="10" width="6" height="52" /><rect x="24" y="10" width="3" height="52" /><rect x="33" y="10" width="9" height="52" /><rect x="48" y="10" width="3" height="52" /><rect x="57" y="10" width="6" height="52" /><rect x="69" y="10" width="12" height="52" /><rect x="87" y="10" width="3" height="52" /><rect x="96" y="10" width="6" height="52" /><rect x="108" y="10" width="3" height="52" /><rect x="117" y="10" width="9" height="52" /><rect x="132" y="10" width="6" height="52" /><rect x="144" y="10" width="3" height="52" /><rect x="153" y="10" width="12" height="52" /><rect x="171" y="10" width="3" height="52" /><rect x="180" y="10" width="6" height="52" /><rect x="192" y="10" width="9" height="52" /><rect x="207" y="10" width="3" height="52" /><rect x="216" y="10" width="12" height="52" /></svg></div>
  </div>
  <script>
  (function () {
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-magazine'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const OPEN = P.at('#441@相信'), HIT = P.at('#442@品味'), MORE = P.at('#443@什麼');   // 講到引子／講到那個詞／講到後面的重點
    P.sfx('impact', '#442@品味');     // 刊名打出來的音效（句號和 HIT 一樣）

    // 刊名太寬就等比縮小（字母數 × 字寬估 0.62 倍字高＋字距；載入時算一次，不用改）
    const MAST = document.getElementById('xmg-mast'), N = MAST.textContent.trim().length, WIDE = N * (330 * 0.62 + 12);
    if (WIDE > 1760) MAST.style.fontSize = Math.floor(330 * 1760 / WIDE) + 'px';

    // 拍 1 講到引子：封面細框由左擦開 → ＋0.3 上緣小字逐字浮出
    P.wipe('#xmg-frame', OPEN, { dir: 'left', dur: 0.6 });
    P.chars('.xmg-top', OPEN + 0.3);
    // 拍 2 講到那個詞：刊名的字母一個一個彈出（在講者後面）
    P.chars('#xmg-mast', HIT, { mode: 'pop', stagger: 0.09 });
    // 拍 3 講到後面的重點：封面標題一條一條彈出 → ＋0.9 條碼由左擦開
    P.pop('.xmg-line', MORE, { from: 0.8, dy: 20, stagger: 0.25 });
    P.wipe('#xmg-code', MORE + 0.9, { dir: 'left', dur: 0.3 });

    // 收：段尾前 0.3 秒整組淡出（overlay 自己退場）
    P.out('#xmg-frame, .xmg-top, #xmg-mast, .xmg-line, #xmg-code', P.dur() - 0.3);

    P.end();                                           // 長度＝plan.json 這段的長度
    window.__timelines['x-magazine'] = tl;
  })();
  </script>

  </div>
  <div id="pip"><img src="speaker-v.jpg" onerror="this.onerror=null;this.src='speaker.jpg'" alt=""></div>
  <img id="pipf" src="../kit/pip-frame-v.png" alt="">
  <div id="pv-label">講者面板（示意）</div>
</div>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var s = Math.min(window.innerWidth / 1080, window.innerHeight / 1920); stage.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();
  var key = "x-magazine";
  var start = function () {
    var inner = window.__timelines[key];
    if (!inner) { document.title = key + '｜script 出錯（看 console）'; return; }
    var D = inner.duration();
    var tl = gsap.timeline({ repeat: -1, repeatDelay: 1.2 });
    tl.fromTo('#bd, #scene, #pip, #pipf, #pv-label', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'sine.out' }, 0);
    tl.add(inner.paused(false), 0);
    tl.to('#bd, #scene, #pip, #pipf, #pv-label', { opacity: 0, duration: 0.5, ease: 'sine.in' }, Math.max(0.5, D - 0.5));
    // 截圖用：網址加 ?t=秒數 就停在那一刻（例：x-process.html?t=13.9）
    var t = Number(new URLSearchParams(location.search).get('t'));
    if (t > 0) tl.pause(t);
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'hf-preview-replay') return;
      tl.restart();
      (e.source || parent).postMessage({ type: 'hf-preview-started', key: key }, '*');
    });
    parent.postMessage({ type: 'hf-preview-ready', key: key, duration: Math.round(D * 1000) / 1000, cues: [] }, '*');
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
</body>
</html>
