<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>x-process 流程逐步亮起｜預覽</title>
<!-- build.mjs --gallery 產生（tools/lib/custom-preview.mjs）：custom/x-process.html 的 <template> 原樣放進來，時間用 root 的 data-cues-sample；改 custom 檔後重跑 --gallery -->
<link rel="stylesheet" href="../kit/fonts.css">
<link rel="stylesheet" href="../kit/brand.css">
<link rel="stylesheet" href="../kit/scene.css">
<link rel="stylesheet" href="../kit/illus.css">
<link rel="stylesheet" href="../kit/theme.css">
<link rel="stylesheet" href="../kit/captions.css">
<script src="../kit/style-switch.js"></script>
<script src="../kit/gsap.min.js"></script>
<script src="../kit/scene-motion.js"></script>
<script src="../kit/illus.js"></script>
<script src="../kit/scene-layout.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; transform-origin: 0 0; }
  #footage { position: absolute; inset: 0; }
  #footage img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
  #scene { position: absolute; inset: 0; z-index: 30; }
  #pip { position: absolute; left: 1424px; top: 594px; width: 432px; height: 324px; overflow: hidden; border-radius: 6px; z-index: 40; }
  #pip img { position: absolute; left: -220px; top: -10px; width: 873px; height: 491px; }
  #pipf { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 41; }
  .sc-surface-fs { background-image: url("../bg-fs.jpg"), var(--sc-fs-pattern); background-size: cover, 1920px 1080px; background-position: center, 0 0; background-repeat: no-repeat; }
</style>
<script>window.__timelines = window.__timelines || {};</script>
</head>
<body>
<div id="stage">
  <div id="footage"><img src="speaker.jpg" alt=""></div>
  <div id="scene">

  <style>
    #x-process { position: absolute; inset: 0; }
    #x-process .fill { position: absolute; inset: 0; }
    /* 主卡：左 120、頂 150、寬 1180（右緣 1300，避開右下子母畫面）；標題列 128、內容區 1176×580（卡底 862） */
    #x-process #xproc-card { position: absolute; left: 120px; top: 150px; width: 1180px; }
    #x-process #xproc-card .sc-wcard__bar { height: 128px; padding: 20px 56px; }
    /* 內容區：站用 flex 排成一列、整組置中（data-layout="free"：排版程式沒有上下錯落的排法） */
    #x-process #xproc-body { position: relative; width: 1176px; height: 580px; display: flex; justify-content: center; align-items: center; }
    /* 連接線：#xproc-lines 的 data-links 自動產生（kit/scene-layout.js；樣式是 scene.css 的 .sc-link），不佔 flex 的位置 */
    #x-process #xproc-lines { position: absolute; }
    /* 虛線預告層：script 載入時從每條連接線複製一份（不用手寫），講到之前一直往前流 */
    #x-process .xproc-ghost { fill: none; stroke: var(--v2-line); stroke-width: 4px; stroke-linecap: round; stroke-dasharray: 2 14; }
    /* 站：寬 264、高 224；單數站下面、雙數站上面各空一站高＋--sc-gap-lg（上下錯落，flex 置中後單數在上排、雙數在下排）；圖示和站名同一塊 */
    #x-process .xproc-node { position: relative; flex: none; width: 264px; height: 224px; box-sizing: border-box; border: 4px solid var(--v2-node-line);
                             border-radius: 24px; background: var(--v2-node); color: var(--sc-fs-ink);
                             display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; white-space: nowrap; }
    #x-process .xproc-node .sc-icon { --d: 96px; --i: 56px; position: relative; }
    #x-process .xproc-node .xproc-name { position: relative; }
    #x-process .xproc-node:nth-of-type(odd) { margin-bottom: calc(224px + var(--sc-gap-lg)); }
    #x-process .xproc-node:nth-of-type(even) { margin-top: calc(224px + var(--sc-gap-lg)); }
    /* 亮起：now＝目前這一站的底色（下一站亮起時淡掉）；主色亮框與「走過」的細框由 P.spot 自動加（.sc-spot） */
    #x-process .xproc-now { position: absolute; inset: 0; border-radius: 20px; background: var(--v2-node-tint); }
  </style>
  <div id="x-process" data-composition-id="x-process" data-width="1920" data-height="1080" data-duration="17"
       data-cues-sample='{"start":0,"D":17,"cues":{"12":[3.2,5.7],"13":[6,8.5],"14":[8.8,11.3],"15":[11.6,14]},"refs":{"#12@錄影":3.2,"#13@逐字稿":6,"#14@剪輯清單":8.8,"#15@初剪":11.6}}'>
    <div class="sc-surface-fs fill"></div>
    <div id="xproc-card" class="sc-wcard">
      <div class="sc-wcard__bar"><span class="sc-opt">從錄影到初剪</span></div>
      <div id="xproc-body" data-layout="free">
        <svg id="xproc-lines" data-links="xproc-n1>xproc-n2 xproc-n2>xproc-n3 xproc-n3>xproc-n4" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="xproc-n1" class="xproc-node" data-slot><i id="xproc-now1" class="xproc-now"></i>
          <span id="xproc-ico1" class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5" /><rect x="2" y="6" width="14" height="12" rx="2" /></svg></span><span class="xproc-name sc-t52 sc-w900 sc-opt">錄影</span></div>
        <div id="xproc-n2" class="xproc-node" data-slot><i id="xproc-now2" class="xproc-now"></i>
          <span id="xproc-ico2" class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /><path d="M14 2v4a2 2 0 0 0 2 2h4" /><path d="M10 9H8" /><path d="M16 13H8" /><path d="M16 17H8" /></svg></span><span class="xproc-name sc-t52 sc-w900 sc-opt">逐字稿</span></div>
        <div id="xproc-n3" class="xproc-node" data-slot><i id="xproc-now3" class="xproc-now"></i>
          <span id="xproc-ico3" class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 17 2 2 4-4" /><path d="m3 7 2 2 4-4" /><path d="M13 6h8" /><path d="M13 12h8" /><path d="M13 18h8" /></svg></span><span class="xproc-name sc-t52 sc-w900 sc-opt">剪輯清單</span></div>
        <div id="xproc-n4" class="xproc-node" data-slot><i id="xproc-now4" class="xproc-now"></i>
          <span id="xproc-ico4" class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3" /><path d="M8.12 8.12 12 12" /><path d="M20 4 8.12 15.88" /><circle cx="6" cy="18" r="3" /><path d="M14.8 14.8 20 20" /></svg></span><span class="xproc-name sc-t52 sc-w900 sc-opt">初剪</span></div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-process'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const T1 = P.at('#12@錄影'), T2 = P.at('#13@逐字稿'), T3 = P.at('#14@剪輯清單'), T4 = P.at('#15@初剪');   // 講到每一站站名的時刻

    const ENTER = P.prev() === 'fullscreen' ? 'swap' : 'grow';   // 預設看前一段（build 給）：也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出；要固定才改成 'grow' 或 'swap'
    const ALL = '#xproc-n1, #xproc-n2, #xproc-n3, #xproc-n4';   // 四站（3 站時拿掉 n4）

    // 0. 每條連接線（data-links 產生的）複製一份虛線預告層（只在載入時建 DOM，每次結果相同）
    $q('#xproc-lines .sc-link').forEach(function (p) {
      var g = p.cloneNode(false); g.removeAttribute('id'); g.removeAttribute('data-link'); g.setAttribute('class', 'xproc-ghost'); p.parentNode.insertBefore(g, p.parentNode.firstChild);
    });

    // 拍 0 開場：主卡進場（看 ENTER）→ 標題逐字上浮
    if (ENTER === 'grow') P.grow('#xproc-card', 0.3);
    else { P.wipe('#xproc-card', 0, { dir: 'up', dur: 0.8 }); P.pop('#xproc-card', 0, { from: 0.96, dy: 60, dur: 0.8, ease: P.V2.EASE.in }); }
    P.chars('#xproc-card .sc-wcard__bar .sc-opt', 0.5, { stagger: 0.035 });
    // 拍 1 骨架：四站錯拍彈出（間隔 0.12），＋0.15 圖示描線
    P.pop(ALL, 1.0, { stagger: 0.12, from: 0.7, dy: 40 });
    P.icon('#xproc-ico1, #xproc-ico2, #xproc-ico3, #xproc-ico4', 1.15, { stagger: 0.12 });
    // 拍 2 預告：站間虛線淡入、一直往前流
    P.in('.xproc-ghost', 1.5, { stagger: 0.1 });
    P.flow('.xproc-ghost', 1.5);
    // 拍 3 等待：預覽態（四站壓暗縮小）＋鏡頭慢推，推到第 1 站前 0.2 秒
    P.spot(ALL, 'none', 2.0, { dim: 0.45, dur: 0.6 });
    P.cam('#xproc-card', 2.0, { scale: 1.03, dur: T1 - 2.2 });

    // 拍 4 第 1 站：鏡頭帶過去（提早 0.2）、聚焦（放大抬起發光、其他壓暗）、底色亮起、圖示漣漪；＋0.6 漂浮
    P.cam('#xproc-card', T1 - 0.2, { to: '#xproc-n1', k: 0.12, scale: 1.04, dur: 0.9 });
    P.spot(ALL, '#xproc-n1', T1, { scale: 1.08, lift: -12 });
    P.in('#xproc-now1', T1);
    P.ripple('#xproc-ico1', T1 + 0.05, { to: 2.4 });
    P.idle('#xproc-n1', T1 + 0.6, { y: 4, period: 2.8, until: T2 - 0.1 });
    // 拍 5 第 2 站：提早 0.85 秒主色實線帶發光頭從上一站描過來（線和箭頭同一條，id＝<上一站>-<這一站>）；上一站變「走過」（0.92、留細框）
    P.comet('#xproc-n1-xproc-n2', T2 - 0.85, { dur: 0.75 });
    P.cam('#xproc-card', T2 - 0.2, { to: '#xproc-n2', k: 0.12, scale: 1.04, dur: 0.9 });
    P.spot(ALL, '#xproc-n2', T2, { scale: 1.08, lift: -12, done: '#xproc-n1' });
    P.out('#xproc-now1', T2);  P.in('#xproc-now2', T2);
    P.ripple('#xproc-ico2', T2 + 0.05, { to: 2.4 });
    P.idle('#xproc-n2', T2 + 0.6, { y: 4, period: 2.8, until: T3 - 0.1 });
    // 拍 6 第 3 站：同拍 5
    P.comet('#xproc-n2-xproc-n3', T3 - 0.85, { dur: 0.75 });
    P.cam('#xproc-card', T3 - 0.2, { to: '#xproc-n3', k: 0.12, scale: 1.04, dur: 0.9 });
    P.spot(ALL, '#xproc-n3', T3, { scale: 1.08, lift: -12, done: '#xproc-n1, #xproc-n2' });
    P.out('#xproc-now2', T3);  P.in('#xproc-now3', T3);
    P.ripple('#xproc-ico3', T3 + 0.05, { to: 2.4 });
    P.idle('#xproc-n3', T3 + 0.6, { y: 4, period: 2.8, until: T4 - 0.1 });
    // 拍 7 第 4 站：同拍 5（3 站時刪掉這一組 6 行，收尾的 T4 改 T3、now4 改 now3）
    P.comet('#xproc-n3-xproc-n4', T4 - 0.85, { dur: 0.75 });
    P.cam('#xproc-card', T4 - 0.2, { to: '#xproc-n4', k: 0.12, scale: 1.04, dur: 0.9 });
    P.spot(ALL, '#xproc-n4', T4, { scale: 1.08, lift: -12, done: '#xproc-n1, #xproc-n2, #xproc-n3' });
    P.out('#xproc-now3', T4);  P.in('#xproc-now4', T4);
    P.ripple('#xproc-ico4', T4 + 0.05, { to: 2.4 });
    P.idle('#xproc-n4', T4 + 0.6, { y: 4, period: 2.8 });

    // 收：最後一站講完 2.6 秒回均衡（全部亮回、鏡頭回正），完成態停到段尾
    const TR = T4 + 2.6;
    P.spot(ALL, null, TR, { dur: 0.6 });
    P.out('#xproc-now4', TR);
    P.cam('#xproc-card', TR, { x: 0, y: 0, scale: 1, dur: 0.6 });

    P.end();                                         // 長度＝plan.json 這段的長度
    window.__timelines['x-process'] = tl;
  })();
  </script>

  </div>
  <div id="pip"><img src="speaker.jpg" alt=""></div>
  <img id="pipf" src="../kit/pip-frame.png" alt="">
</div>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); stage.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();
  var key = "x-process";
  var start = function () {
    var inner = window.__timelines[key];
    if (!inner) { document.title = key + '｜script 出錯（看 console）'; return; }
    var D = inner.duration();
    var tl = gsap.timeline({ repeat: -1, repeatDelay: 1.2 });
    tl.fromTo('#scene, #pip, #pipf', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'sine.out' }, 0);
    tl.add(inner.paused(false), 0);
    tl.to('#scene, #pip, #pipf', { opacity: 0, duration: 0.5, ease: 'sine.in' }, Math.max(0.5, D - 0.5));
    // 截圖用：網址加 ?t=秒數 就停在那一刻（例：x-process.html?t=13.9）
    var t = Number(new URLSearchParams(location.search).get('t'));
    if (t > 0) tl.pause(t);
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'hf-preview-replay') return;
      tl.restart();
      (e.source || parent).postMessage({ type: 'hf-preview-started', key: key }, '*');
    });
    parent.postMessage({ type: 'hf-preview-ready', key: key, duration: Math.round(D * 1000) / 1000, cues: [] }, '*');
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
</body>
</html>
