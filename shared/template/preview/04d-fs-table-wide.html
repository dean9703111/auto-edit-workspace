<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>04d 全畫面表格（全寬）｜預覽</title>
<!-- build.mjs --gallery 產生：用 scene.json 的 sample 填模板，講者是 speaker.jpg；換主色或放 ../bg-fs.jpg、../bg-side.jpg、../bg-ch.jpg（或單一 ../bg.jpg）後重新整理就會更新 -->
<link rel="stylesheet" href="../kit/fonts.css">
<link rel="stylesheet" href="../kit/brand.css">
<link rel="stylesheet" href="../kit/scene.css">
<link rel="stylesheet" href="../kit/illus.css">
<link rel="stylesheet" href="../kit/theme.css">
<link rel="stylesheet" href="../kit/captions.css">
<script src="../kit/style-switch.js"></script>
<script src="../kit/gsap.min.js"></script>
<script src="../kit/scene-motion.js"></script>
<script src="../kit/illus.js"></script>
<script src="../kit/scene-layout.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; transform-origin: 0 0; }
  #footage { position: absolute; inset: 0; }
  #footage img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
  .fill { position: absolute; inset: 0; }
  #scene { position: absolute; inset: 0; z-index: 30; }
  #pip { position: absolute; left: 1424px; top: 594px; width: 432px; height: 324px; overflow: hidden; border-radius: 6px; z-index: 40; }
  #pip img { position: absolute; left: -220px; top: -10px; width: 873px; height: 491px; }
  #pipf { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 41; }
  #cap { z-index: 60; }
  /* 背景圖：各版面先用自己的 ../bg-*.jpg，沒有就用 ../bg.jpg，都沒有只顯示底紋（不必重新產生預覽頁） */
  .sc-surface-fs { background-image: url("../bg-fs.jpg"), url("../bg.jpg"), var(--sc-fs-pattern); background-size: cover, cover, 1920px 1080px; background-position: center, center, 0 0; background-repeat: no-repeat; }
  .sc-surface-ch { background-image: url("../bg-ch.jpg"), url("../bg.jpg"), var(--sc-ch-pattern); background-size: cover, cover, 1920px 1080px; background-position: center, center, 0 0; background-repeat: no-repeat; }
  .sc-surface-side { background-image: url("../bg-side.jpg"), url("../bg.jpg"), var(--sc-side-pattern); background-size: cover, 1920px auto, 960px 1080px; background-position: center, 0 50%, 0 0; background-repeat: no-repeat; }
  #pv-fs-table #pv-wCard { position: absolute; left: 120px; top: 150px; width: 1180px; }
  #pv-fs-table #pv-wCard .sc-wcard__bar { height: 128px; padding: 20px var(--sc-pad-card); }
  #pv-fs-table #pv-wBody { width: 1176px; height: 580px; }
  #pv-fs-table #pv-fTbl { width: calc(100% - 2 * var(--sc-pad-card)); }
  #pv-fs-table .fTr { display: flex; align-items: center; height: 128px; }
  #pv-fs-table .fTr.fHead { height: 112px; background: var(--sc-fs-head); color: var(--sc-fs-head-ink); border-radius: 12px 12px 0 0; font-weight: 700; }
  #pv-fs-table .fTr.fRow:nth-child(odd) { background: var(--sc-fs-tint); }
  #pv-fs-table .fTd { flex: 1 1 0; min-width: 0; padding: 0 var(--sc-gap-md); font-size: 44px; line-height: 60px; white-space: nowrap; }
  #pv-fs-table .fTd > span { display: block; padding-bottom: 6px; }
  #pv-fs-table .fRow .fTd { font-weight: 500; }
  #pv-fs-table .fRow .fTd:first-child { font-weight: 700; }
  #pv-fs-table #pv-fTbl:has(.fTr:nth-child(5)) .fRow { height: 96px; }
  #pv-fs-table #pv-fTbl:has(.fTr:nth-child(6)) .fRow { height: 84px; }
  #pv-fs-table #pv-fTbl:has(.fTr:nth-child(6)) .fHead { height: 96px; }
  #pv-fs-table #pv-fTbl[data-highlight="1"] > :nth-child(2), #pv-fs-table #pv-fTbl[data-highlight="2"] > :nth-child(3), #pv-fs-table #pv-fTbl[data-highlight="3"] > :nth-child(4), #pv-fs-table #pv-fTbl[data-highlight="4"] > :nth-child(5), #pv-fs-table #pv-fTbl[data-highlight="5"] > :nth-child(6) { box-shadow: inset 0 0 0 4px var(--sc-accent); }
</style>
</head>
<body>
<div id="stage">
  <div id="footage"><img src="speaker.jpg" alt=""></div>
  <div id="scene" data-wide>
    <div id="pv-fs-table" class="fill">
      <div class="sc-surface-fs fill"></div>
      <div id="pv-aWrap" class="fill">
        <div id="pv-wCard" class="sc-wcard">
          <div class="sc-wcard__bar"><span class="sc-opt">兩個工具怎麼分工</span></div>
          <div id="pv-wBody" data-layout="col">
            <div id="pv-fTbl" data-slot data-highlight="">
              <div id="pv-fHd" class="fTr fHead"><span class="fTd"><span>工具</span></span><span class="fTd"><span>負責</span></span></div>
              <div id="pv-fTr1" class="fTr fRow"><span class="fTd"><span>HyperFrames</span></span><span class="fTd"><span>字幕與動畫</span></span></div>
              <div id="pv-fTr2" class="fTr fRow"><span class="fTd"><span>auto-editor</span></span><span class="fTd"><span>剪掉停頓</span></span></div>
              <div id="pv-fTr3" class="fTr fRow"><span class="fTd"><span>AI</span></span><span class="fTd"><span>找出 NG</span></span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="cg" id="cap"><span>需要判斷的工作，才交給 AI</span></div>
</div>
<script>
window.__PREVIEW = {"key":"fs-table","duration":7,"cues":[]};
</script>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); stage.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();
  var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
  var start = function () {
    const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.2 });
    var pv = window.__PREVIEW;
    const P = SceneMotion(tl, document.getElementById('pv-fs-table'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const D = 7;
    /* v2（shared/template/BEATS.md §2 的動作）：欄頭擦開 → 每列各綁 at 由左擦開＋滑入；新的一列出現時前一列退焦 0.6 → 最後一列講完 2 秒回均衡。主卡進場看 P.prev()（換卡不換景／長出），離場由 build 負責 */
    // 開場：前一段也是全畫面＝換卡不換景（由下擦開＋上浮 60u）；前一段是講者或其他畫面＝主卡從子母畫面長出（P.prev() 由 build 給，不用改）
    if (P.prev() === 'fullscreen') { P.wipe('#pv-wCard', 0, { dir: 'up', dur: 0.8 }); P.pop('#pv-wCard', 0, { from: 0.96, dy: 60, dur: 0.8, ease: P.V2.EASE.in }); }
    else P.grow('#pv-wCard', 0.3);
    P.chars('#pv-wCard .sc-wcard__bar .sc-opt', 0.5, { stagger: 0.035 });
    P.wipe('#pv-fHd', 0.5, { dir: 'left', dur: P.V2.SHELL });
    const rowAt = [0.85, 1.2, 1.55];
    P.wipe('#pv-fTr1', 0.85, { dir: 'left' });
    P.drift('#pv-fTr1', 0.85, { dx: -24 * P.U });
    P.wipe('#pv-fTr2', 1.2, { dir: 'left' });
    P.drift('#pv-fTr2', 1.2, { dx: -24 * P.U });
    P.wipe('#pv-fTr3', 1.55, { dir: 'left' });
    P.drift('#pv-fTr3', 1.55, { dx: -24 * P.U });
    for (let i = 1; i < rowAt.length; i++) P.dim('#pv-fTr' + i, rowAt[i], { to: 0.6 });
    // 回均衡：最後一條講完 2 秒（不晚於段尾前 1.6 秒）全部亮回
    const endAt = Math.min(rowAt[rowAt.length - 1] + 2.0, D - 1.6);
    if (rowAt.length > 1 && endAt > rowAt[rowAt.length - 1] + 0.6) for (let i = 1; i < rowAt.length; i++) P.dim('#pv-fTr' + i, endAt, { to: 1 });
    tl.fromTo('#scene', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'sine.out' }, 0);
    tl.to('#scene', { opacity: 0, duration: 0.5, ease: 'sine.in' }, 6.5);
    P.end(D);
    // 截圖用：網址加 ?t=秒數 就停在那一刻（例：03-side-panel.html?t=3）
    var t = Number(new URLSearchParams(location.search).get('t'));
    if (t > 0) tl.pause(t);
    // 重播協定：父頁（音效預覽）送 hf-preview-replay → 從頭播，並回 hf-preview-started
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'hf-preview-replay') return;
      tl.restart();
      (e.source || parent).postMessage({ type: 'hf-preview-started', key: pv.key }, '*');
    });
    parent.postMessage({ type: 'hf-preview-ready', key: pv.key, duration: pv.duration, cues: pv.cues }, '*');
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
</body>
</html>
