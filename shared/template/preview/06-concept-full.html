<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>06 一般字卡（全寬）｜預覽</title>
<!-- build.mjs --gallery 產生：用 scene.json 的 sample 填模板，講者是 speaker.jpg；換主色或放 ../bg-fs.jpg、../bg-side.jpg、../bg-ch.jpg（或單一 ../bg.jpg）後重新整理就會更新 -->
<link rel="stylesheet" href="../kit/fonts.css">
<link rel="stylesheet" href="../kit/brand.css">
<link rel="stylesheet" href="../kit/scene.css">
<link rel="stylesheet" href="../kit/illus.css">
<link rel="stylesheet" href="../kit/theme.css">
<link rel="stylesheet" href="../kit/captions.css">
<script src="../kit/style-switch.js"></script>
<script src="../kit/gsap.min.js"></script>
<script src="../kit/scene-motion.js"></script>
<script src="../kit/illus.js"></script>
<script src="../kit/scene-layout.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; transform-origin: 0 0; }
  #footage { position: absolute; inset: 0; }
  #footage img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
  .fill { position: absolute; inset: 0; }
  #scene { position: absolute; inset: 0; z-index: 30; }
  #pip { position: absolute; left: 1424px; top: 594px; width: 432px; height: 324px; overflow: hidden; border-radius: 6px; z-index: 40; }
  #pip img { position: absolute; left: -220px; top: -10px; width: 873px; height: 491px; }
  #pipf { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 41; }
  #cap { z-index: 60; }
  /* 背景圖：各版面先用自己的 ../bg-*.jpg，沒有就用 ../bg.jpg，都沒有只顯示底紋（不必重新產生預覽頁） */
  .sc-surface-fs { background-image: url("../bg-fs.jpg"), url("../bg.jpg"), var(--sc-fs-pattern); background-size: cover, cover, 1920px 1080px; background-position: center, center, 0 0; background-repeat: no-repeat; }
  [data-wide] .sc-surface-fs { background-image: var(--sc-fs-pattern); }
  .sc-surface-ch { background-image: url("../bg-ch.jpg"), url("../bg.jpg"), var(--sc-ch-pattern); background-size: cover, cover, 1920px 1080px; background-position: center, center, 0 0; background-repeat: no-repeat; }
  .sc-surface-side { background-image: url("../bg-side.jpg"), url("../bg.jpg"), var(--sc-side-pattern); background-size: cover, 1920px auto, 960px 1080px; background-position: center, 0 50%, 0 0; background-repeat: no-repeat; }
  #pv-concept #pv-cfTop { position: absolute; left: 120px; right: 120px; top: 200px; height: 96px; display: flex; align-items: center; justify-content: center; gap: 24px; }
  #pv-concept #pv-cfIcon { --d: 96px; --i: 56px; }
  #pv-concept #pv-cfTag { font-size: 44px; line-height: 60px; font-weight: 700; color: var(--sc-fs-mute); white-space: nowrap; }
  #pv-concept #pv-cfBrace { position: absolute; left: 120px; top: 354px; width: 1680px; height: 232px; }
  #pv-concept #pv-cfTerm { font-size: min(112px, calc(1200px / 3)); line-height: 136px; font-weight: 900; color: var(--sc-fs-ink); }
  #pv-concept #pv-cfTerm .sc-kw { color: var(--brand); }
  #pv-concept #pv-cfDef { position: absolute; left: 120px; right: 120px; top: 640px; text-align: center; white-space: nowrap; font-size: 56px; line-height: 76px; font-weight: 700; color: var(--sc-fs-ink); }
  #pv-concept #pv-cfDef .sc-kw { color: var(--brand); font-weight: 900; }
</style>
</head>
<body>
<div id="stage">
  <div id="footage"><img src="speaker.jpg" alt=""></div>
  <div id="scene" data-wide>
    <div id="pv-concept" class="fill">
      <div class="sc-surface-fs fill"></div>
      <div id="pv-aWrap" class="fill">
        <div id="pv-cfTop" data-layout="free">
          <span id="pv-cfIcon" class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path class="stroke-draw" pathLength="1" d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z" /> <path class="stroke-draw" pathLength="1" d="M12 22V12" /> <path class="stroke-draw" pathLength="1" d="m3.3 7 7.703 4.734a2 2 0 0 0 1.994 0L20.7 7" /> <path class="stroke-draw" pathLength="1" d="m7.5 4.27 9 5.15" /> </svg></span>
          <span id="pv-cfTag">概念</span>
        </div>
        <div id="pv-cfBrace" class="sc-brace">
          <svg class="sc-brace__l" viewBox="0 0 96 232" aria-hidden="true"><path pathLength="1" d="M74 12 C44 12 46 28 46 58 L46 92 C46 106 38 116 18 116 C38 116 46 126 46 140 L46 174 C46 204 44 220 74 220" /></svg>
          <svg class="sc-brace__r" viewBox="0 0 96 232" aria-hidden="true"><path pathLength="1" d="M22 12 C52 12 50 28 50 58 L50 92 C50 106 58 116 78 116 C58 116 50 126 50 140 L50 174 C50 204 52 220 22 220" /></svg>
          <div class="sc-brace__text"><span id="pv-cfTerm">Skill</span></div>
        </div>
        <div id="pv-cfDef">工具附的使用說明書</div>
      </div>
    </div>
  </div>
  <div class="cg" id="cap"><span>Skill 就像工具附的使用說明書</span></div>
</div>
<script>
window.__PREVIEW = {"key":"concept","duration":6,"cues":[]};
</script>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); stage.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();
  var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
  var start = function () {
    const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.2 });
    var pv = window.__PREVIEW;
    const P = SceneMotion(tl, document.getElementById('pv-concept'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const D = 6;
    /* 全幕版：圖示彈出＋描線、標籤上浮 → 括號合著描出、0.45 秒後彈開把名詞拉開 → 定義跟著講解打字（每秒 12 字）。
       前一段是講者晚 0.35 秒開始，前一段也是全畫面 0.1 秒開始；離場由 build 負責 */
    const T0 = 0 + (P.prev() === 'speaker' ? 0.35 : 0.1);
    P.pop('#pv-cfIcon', T0, { from: 0.2, dy: 0, ease: 'back.out(2.4)' });
    P.icon('#pv-cfIcon', T0 + 0.15);
    P.rise('#pv-cfTag', T0 + 0.1);
    P.brace('#pv-cfBrace', T0 + 0.3, { open: T0 + 0.75 });
    P.in('#pv-cfDef', T0 + 1.75, { dur: 0.05 });
    P.type('#pv-cfDef', T0 + 1.8, { cps: 12 });
    tl.fromTo('#scene', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'sine.out' }, 0);
    tl.to('#scene', { opacity: 0, duration: 0.5, ease: 'sine.in' }, 5.5);
    P.end(D);
    // 截圖用：網址加 ?t=秒數 就停在那一刻（例：03-side-panel.html?t=3）
    var t = Number(new URLSearchParams(location.search).get('t'));
    if (t > 0) tl.pause(t);
    // 重播協定：父頁（音效預覽）送 hf-preview-replay → 從頭播，並回 hf-preview-started
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'hf-preview-replay') return;
      tl.restart();
      (e.source || parent).postMessage({ type: 'hf-preview-started', key: pv.key }, '*');
    });
    parent.postMessage({ type: 'hf-preview-ready', key: pv.key, duration: pv.duration, cues: pv.cues }, '*');
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
</body>
</html>
