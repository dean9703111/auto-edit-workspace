<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>x-relay 截圖接力｜預覽</title>
<!-- build.mjs --gallery 產生（tools/lib/custom-preview.mjs）：custom/x-relay.html 的 <template> 原樣放進來，時間用 root 的 data-cues-sample；改 custom 檔後重跑 --gallery -->
<link rel="stylesheet" href="../kit/fonts.css">
<link rel="stylesheet" href="../kit/brand.css">
<link rel="stylesheet" href="../kit/scene.css">
<link rel="stylesheet" href="../kit/illus.css">
<link rel="stylesheet" href="../kit/theme.css">
<link rel="stylesheet" href="../kit/captions.css">
<script src="../kit/style-switch.js"></script>
<script src="../kit/gsap.min.js"></script>
<script src="../kit/scene-motion.js"></script>
<script src="../kit/illus.js"></script>
<script src="../kit/scene-layout.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; transform-origin: 0 0; }
  #footage { position: absolute; inset: 0; }
  #footage img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
  #scene { position: absolute; inset: 0; z-index: 30; }
  #cut { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 35; }   /* 講者去背圖（有 preview/speaker-cutout.png 才有）：疊在 overlay 動畫上面，示意「講者站在動畫前面」的模板 */
  #pip { position: absolute; left: 1424px; top: 594px; width: 432px; height: 324px; overflow: hidden; border-radius: 6px; z-index: 40; }
  #pip img { position: absolute; left: -220px; top: -10px; width: 873px; height: 491px; }
  #pipf { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 41; }
  .sc-surface-fs { background-image: url("../bg-fs.jpg"), var(--sc-fs-pattern); background-size: cover, 1920px 1080px; background-position: center, 0 0; background-repeat: no-repeat; }
</style>
<script>window.__timelines = window.__timelines || {};</script>
</head>
<body>
<div id="stage">
  <div id="footage"><img src="speaker.jpg" alt=""></div>
  <div id="scene">

  <style>
    #x-relay { position: absolute; inset: 0; }
    #x-relay .fill { position: absolute; inset: 0; }
    /* 膠片視窗：x 72–736、y 60–900（截圖卡 x 120–688，左右多留 48 給落影與亮框）；上下露出的卡在視窗邊被切掉 */
    #x-relay #xrl-card { position: absolute; left: 72px; top: 60px; width: 664px; height: 840px; overflow: hidden; }
    /* 膠片：卡由上往下排、間距 40（一格 370）；第 1 張（#xrl-c1）的上緣在視窗裡 255＝畫面 315，中線 480 */
    #x-relay #xrl-strip { position: absolute; left: 48px; top: -115px; display: flex; flex-direction: column; gap: 40px; }
    #x-relay .xrl-shot { position: relative; flex: none; width: 568px; height: 330px; box-sizing: border-box; padding: 10px;
                          border: 2px solid var(--sc-fs-card-line); border-radius: 16px; background: var(--sc-fs-card); box-shadow: var(--v2-card-shadow); }
    #x-relay .xrl-img { width: 100%; height: 100%; border-radius: 8px; overflow: hidden; }
    #x-relay .xrl-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
    /* 右邊：主體（不動）＋能力詞（同一個位置接力）＋說明，都靠左 x 740；能力詞的字面中線對準截圖中線 y 480 */
    #x-relay #xrl-subj { position: absolute; left: 740px; top: 310px; white-space: nowrap; color: var(--sc-fs-ink); }
    #x-relay .xrl-word { position: absolute; left: 740px; top: 406px; white-space: nowrap; color: var(--sc-fs-kw); }
    #x-relay .xrl-note { position: absolute; left: 740px; top: 550px; white-space: nowrap; }
    /* 全寬（沒有講者）：截圖卡 792×456（x 120–912）、一格 496；字靠左 x 1000、放大 */
    #x-relay[data-wide] #xrl-card { width: 888px; }
    #x-relay[data-wide] #xrl-strip { top: -304px; }
    #x-relay[data-wide] .xrl-shot { width: 792px; height: 456px; }
    #x-relay[data-wide] #xrl-subj { left: 1000px; top: 276px; font-size: 80px; line-height: 104px; }
    #x-relay[data-wide] .xrl-word { left: 1000px; top: 388px; font-size: 144px; line-height: 168px; }
    #x-relay[data-wide] .xrl-note { left: 1000px; top: 564px; font-size: 48px; line-height: 66px; }
  </style>
  <div id="x-relay" data-composition-id="x-relay" data-width="1920" data-height="1080" data-duration="13.4"
       data-cues-sample='{"start":0,"D":13.4,"cues":{"591":[0.3,2.0],"592":[2.1,4.6],"593":[4.7,7.2],"594":[7.3,9.8],"595":[9.9,13.0]},"refs":{"#592@轉逐字稿":2.3,"#593@找出":4.9,"#594@剪好看":7.5,"#595@一句":10.1}}'>
    <div class="sc-surface-fs fill"></div>
    <div id="xrl-card" data-layout-allow-overflow>
      <div id="xrl-strip">
        <!-- 膠片是一圈：最上面露出最後一項的截圖（c0）、最下面露出第 1 項的截圖（c9） -->
        <div id="xrl-c0" class="xrl-shot"><div class="xrl-img"><img src="../preview/shots/relay-4.jpg" alt=""></div></div>
        <div id="xrl-c1" class="xrl-shot"><div class="xrl-img"><img src="../preview/shots/relay-1.jpg" alt=""></div></div>
        <div id="xrl-c2" class="xrl-shot"><div class="xrl-img"><img src="../preview/shots/relay-2.jpg" alt=""></div></div>
        <div id="xrl-c3" class="xrl-shot"><div class="xrl-img"><img src="../preview/shots/relay-3.jpg" alt=""></div></div>
        <div id="xrl-c4" class="xrl-shot"><div class="xrl-img"><img src="../preview/shots/relay-4.jpg" alt=""></div></div>
        <div id="xrl-c9" class="xrl-shot"><div class="xrl-img"><img src="../preview/shots/relay-1.jpg" alt=""></div></div>
      </div>
    </div>
    <div id="xrl-subj" class="sc-t64 sc-w900">AI 剪輯</div>
    <div id="xrl-w1" class="xrl-word sc-t112 sc-w900">轉逐字稿</div>
    <div id="xrl-w2" class="xrl-word sc-t112 sc-w900">找出 NG</div>
    <div id="xrl-w3" class="xrl-word sc-t112 sc-w900">剪好看</div>
    <div id="xrl-w4" class="xrl-word sc-t112 sc-w900">一句就改</div>
    <div id="xrl-n1" class="xrl-note sc-t40 sc-w700 sc-gray">先把講解轉成文字</div>
    <div id="xrl-n2" class="xrl-note sc-t40 sc-w700 sc-gray">講錯的句子自動標出來</div>
    <div id="xrl-n3" class="xrl-note sc-t40 sc-w700 sc-gray">字卡、動畫一次配好</div>
    <div id="xrl-n4" class="xrl-note sc-t40 sc-w700 sc-gray">說一句話就能改</div>
  </div>
  <script>
  (function () {
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    // 版型（以下都不用改）：全寬時 CSS 的 [data-wide] 那幾行接手；一格＝卡高＋間距 40
    const ROOT = document.getElementById('x-relay'), WIDE = !!ROOT.closest('[data-wide]');
    if (WIDE) ROOT.setAttribute('data-wide', '');
    const STEP = WIDE ? 496 : 370;
    const CARDS = '#xrl-strip .xrl-shot';               // 膠片上全部的卡（含頭尾露出的那兩張）

    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-relay'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const T1 = P.at('#592@轉逐字稿'), T2 = P.at('#593@找出'), T3 = P.at('#594@剪好看'), T4 = P.at('#595@一句');   // 講到每一種能力那個詞的時刻
    const ENTER = P.prev() === 'fullscreen' ? 'swap' : 'grow';   // 預設看前一段（build 給）：也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出；要固定才改成 'grow' 或 'swap'

    // 拍 0 開場：膠片視窗進場（看 ENTER），膠片停在預覽態（全部退暗到 0.4、縮 0.96）；＋0.6 主體逐字上浮
    if (ENTER === 'grow') P.grow('#xrl-card', 0.3);
    else { P.wipe('#xrl-card', 0, { dir: 'up', dur: 0.8 }); P.pop('#xrl-card', 0, { from: 0.96, dy: 60, dur: 0.8, ease: P.V2.EASE.in }); }
    P.spot(CARDS, 'none', 0, { dim: 0.4, dur: 0.01 });
    P.chars('#xrl-subj', 0.6);

    // 拍 1 第 1 種能力：第 1 張截圖亮起（主色亮框；不放大不抬起，中線對準能力詞），能力詞逐字上浮；＋0.12 說明逐字上浮
    P.spot(CARDS, '#xrl-c1', T1, { scale: 1, lift: 0, dim: 0.4 });
    P.chars('#xrl-w1', T1);
    P.chars('#xrl-n1', T1 + 0.12, { stagger: 0.02 });

    // 拍 2 第 2 種能力：−0.3 舊詞往上淡出（先出）、膠片往上捲一格（0.6 秒）、焦點換到第 2 張 → 講到時新詞逐字上浮（後進）
    P.out('#xrl-w1', T2 - 0.3, { dur: 0.25 });
    P.morph('#xrl-w1', T2 - 0.3, { y: -32 }, { from: { y: 0 }, dur: 0.25, ease: 'power2.in' });
    P.out('#xrl-n1', T2 - 0.3, { dur: 0.25 });
    P.morph('#xrl-strip', T2 - 0.3, { y: -STEP }, { from: { y: 0 }, dur: 0.6, ease: 'power3.inOut' });
    P.spot(CARDS, '#xrl-c2', T2 - 0.3, { scale: 1, lift: 0, dim: 0.4, dur: 0.6 });
    P.chars('#xrl-w2', T2);
    P.chars('#xrl-n2', T2 + 0.12, { stagger: 0.02 });

    // 拍 3 第 3 種能力：同拍 2
    P.out('#xrl-w2', T3 - 0.3, { dur: 0.25 });
    P.morph('#xrl-w2', T3 - 0.3, { y: -32 }, { from: { y: 0 }, dur: 0.25, ease: 'power2.in' });
    P.out('#xrl-n2', T3 - 0.3, { dur: 0.25 });
    P.morph('#xrl-strip', T3 - 0.3, { y: -2 * STEP }, { from: { y: -STEP }, dur: 0.6, ease: 'power3.inOut' });
    P.spot(CARDS, '#xrl-c3', T3 - 0.3, { scale: 1, lift: 0, dim: 0.4, dur: 0.6 });
    P.chars('#xrl-w3', T3);
    P.chars('#xrl-n3', T3 + 0.12, { stagger: 0.02 });

    // 拍 4 第 4 種能力：同拍 2（3 項時刪掉這一段，見檔頭）
    P.out('#xrl-w3', T4 - 0.3, { dur: 0.25 });
    P.morph('#xrl-w3', T4 - 0.3, { y: -32 }, { from: { y: 0 }, dur: 0.25, ease: 'power2.in' });
    P.out('#xrl-n3', T4 - 0.3, { dur: 0.25 });
    P.morph('#xrl-strip', T4 - 0.3, { y: -3 * STEP }, { from: { y: -2 * STEP }, dur: 0.6, ease: 'power3.inOut' });
    P.spot(CARDS, '#xrl-c4', T4 - 0.3, { scale: 1, lift: 0, dim: 0.4, dur: 0.6 });
    P.chars('#xrl-w4', T4);
    P.chars('#xrl-n4', T4 + 0.12, { stagger: 0.02 });

    // 收：最後一張截圖＋最後一個能力詞停到段尾（焦點留在最後一張，不回均衡：膠片的完成態就是「講到的那一張在中間」）
    P.end();                                           // 長度＝plan.json 這段的長度
    window.__timelines['x-relay'] = tl;
  })();
  </script>

  </div>
  <div id="pip"><img src="speaker.jpg" alt=""></div>
  <img id="pipf" src="../kit/pip-frame.png" alt="">
</div>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); stage.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();
  var key = "x-relay";
  var start = function () {
    var inner = window.__timelines[key];
    if (!inner) { document.title = key + '｜script 出錯（看 console）'; return; }
    var D = inner.duration();
    var tl = gsap.timeline({ repeat: -1, repeatDelay: 1.2 });
    tl.fromTo('#scene, #pip, #pipf', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'sine.out' }, 0);
    tl.add(inner.paused(false), 0);
    tl.to('#scene, #pip, #pipf', { opacity: 0, duration: 0.5, ease: 'sine.in' }, Math.max(0.5, D - 0.5));
    // 截圖用：網址加 ?t=秒數 就停在那一刻（例：x-process.html?t=13.9）
    var t = Number(new URLSearchParams(location.search).get('t'));
    if (t > 0) tl.pause(t);
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'hf-preview-replay') return;
      tl.restart();
      (e.source || parent).postMessage({ type: 'hf-preview-started', key: key }, '*');
    });
    parent.postMessage({ type: 'hf-preview-ready', key: key, duration: Math.round(D * 1000) / 1000, cues: [] }, '*');
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
</body>
</html>
