<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 兩側｜預覽</title>
<!-- build.mjs --gallery 產生：用 scene.json 的 sample 填模板，講者是 speaker.jpg；換主色或放 ../bg-fs.jpg、../bg-side.jpg、../bg-ch.jpg（或單一 ../bg.jpg）後重新整理就會更新 -->
<link rel="stylesheet" href="../kit/fonts.css">
<link rel="stylesheet" href="../kit/brand.css">
<link rel="stylesheet" href="../kit/scene.css">
<link rel="stylesheet" href="../kit/illus.css">
<link rel="stylesheet" href="../kit/theme.css">
<link rel="stylesheet" href="../kit/captions.css">
<script src="../kit/style-switch.js"></script>
<script src="../kit/gsap.min.js"></script>
<script src="../kit/scene-motion.js"></script>
<script src="../kit/illus.js"></script>
<script src="../kit/scene-layout.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; transform-origin: 0 0; }
  #footage { position: absolute; inset: 0; }
  #footage img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
  .fill { position: absolute; inset: 0; }
  #scene { position: absolute; inset: 0; z-index: 20; }
  #pip { position: absolute; left: 1424px; top: 594px; width: 432px; height: 324px; overflow: hidden; border-radius: 6px; z-index: 40; }
  #pip img { position: absolute; left: -220px; top: -10px; width: 873px; height: 491px; }
  #pipf { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 41; }
  #cap { z-index: 60; }
  /* 背景圖：各版面先用自己的 ../bg-*.jpg，沒有就用 ../bg.jpg，都沒有只顯示底紋（不必重新產生預覽頁） */
  .sc-surface-fs { background-image: url("../bg-fs.jpg"), url("../bg.jpg"), var(--sc-fs-pattern); background-size: cover, cover, 1920px 1080px; background-position: center, center, 0 0; background-repeat: no-repeat; }
  [data-wide] .sc-surface-fs { background-image: var(--sc-fs-pattern); }
  .sc-surface-ch { background-image: url("../bg-ch.jpg"), url("../bg.jpg"), var(--sc-ch-pattern); background-size: cover, cover, 1920px 1080px; background-position: center, center, 0 0; background-repeat: no-repeat; }
  .sc-surface-side { background-image: url("../bg-side.jpg"), url("../bg.jpg"), var(--sc-side-pattern); background-size: cover, 1920px auto, 960px 1080px; background-position: center, 0 50%, 0 0; background-repeat: no-repeat; }
  #pv-two-sides #pv-sColL, #pv-two-sides #pv-sColR { position: absolute; top: calc(160px - var(--sc-pad-card-y)); width: calc(504px + 2 * var(--sc-pad-card)); height: calc(710px + 2 * var(--sc-pad-card-y)); }
  #pv-two-sides #pv-sColL { left: calc(96px - var(--sc-pad-card)); }
  #pv-two-sides #pv-sColR { left: calc(1320px - var(--sc-pad-card)); }
  #pv-two-sides .sCard { width: 504px; height: 280px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: var(--sc-gap-md); background: var(--sc-card-solid); }
  #pv-two-sides .sCard .sc-t60 { line-height: 64px; }
  #pv-two-sides .sCard.sc-card--topline::before { left: 16px; right: 16px; top: 16px; height: 4px; border-radius: 2px; }
  #pv-two-sides .sc-icon--96 { --d: 96px; --i: 56px; }
</style>
</head>
<body>
<div id="stage">
  <div id="footage"><img src="speaker.jpg" alt=""></div>
  <div id="scene">
    <div id="pv-two-sides" class="fill">
      <div id="pv-aWrap" class="fill">
        <div id="pv-sColL" data-layout="col" data-gap="lg">
          <div id="pv-sCard1" class="sc-card sc-card--topline sCard" data-slot>
            <span class="sc-icon sc-icon--96"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path class="stroke-draw" pathLength="1" d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5" /> <rect class="stroke-draw" pathLength="1" x="2" y="6" width="14" height="12" rx="2" /> </svg></span>
            <span class="sc-t60 sc-w700 sc-opt">原始講解</span>
          </div>
          <div id="pv-sCard2" class="sc-card sc-card--topline sCard" data-slot>
            <span class="sc-icon sc-icon--96"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path class="stroke-draw" pathLength="1" d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /> <path class="stroke-draw" pathLength="1" d="M14 2v4a2 2 0 0 0 2 2h4" /> <path class="stroke-draw" pathLength="1" d="M10 9H8" /> <path class="stroke-draw" pathLength="1" d="M16 13H8" /> <path class="stroke-draw" pathLength="1" d="M16 17H8" /> </svg></span>
            <span class="sc-t60 sc-w700 sc-opt">講稿</span>
          </div>
        </div>
        <div id="pv-sColR" data-layout="col" data-gap="lg">
          <div id="pv-sCard3" class="sc-card sc-card--topline sCard" data-slot>
            <span class="sc-icon sc-icon--96"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path class="stroke-draw" pathLength="1" d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" /> <circle class="stroke-draw" pathLength="1" cx="12" cy="13" r="3" /> </svg></span>
            <span class="sc-t60 sc-w700 sc-opt">場地照</span>
          </div>
          <div id="pv-sCard4" class="sc-card sc-card--topline sCard" data-slot>
            <span class="sc-icon sc-icon--96"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path class="stroke-draw" pathLength="1" d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" /> <path class="stroke-draw" pathLength="1" d="M16 9a5 5 0 0 1 0 6" /> <path class="stroke-draw" pathLength="1" d="M19.364 18.364a9 9 0 0 0 0-12.728" /> </svg></span>
            <span class="sc-t60 sc-w700 sc-opt">音效</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="cg" id="cap"><span>剪輯要用到的檔案，我做成了範本</span></div>
</div>
<script>
window.__PREVIEW = {"key":"two-sides","duration":8,"cues":[]};
</script>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); stage.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();
  var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
  var start = function () {
    const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.2 });
    var pv = window.__PREVIEW;
    const P = SceneMotion(tl, document.getElementById('pv-two-sides'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const D = 8;
    /* v2（shared/template/BEATS.md §2 的動作）：四張卡各綁 at 彈出（從下 28u、0.82 → 1）→ 0.15 後圖示描線 → 段尾一起向左擦掉 */
    P.pop('#pv-sCard1', 0.2, { from: 0.82, dy: 28 });
    P.icon('#pv-sCard1 .sc-icon', 0.2 + 0.15);
    P.pop('#pv-sCard2', 0.55, { from: 0.82, dy: 28 });
    P.icon('#pv-sCard2 .sc-icon', 0.55 + 0.15);
    P.pop('#pv-sCard3', 0.9, { from: 0.82, dy: 28 });
    P.icon('#pv-sCard3 .sc-icon', 0.9 + 0.15);
    P.pop('#pv-sCard4', 1.25, { from: 0.82, dy: 28 });
    P.icon('#pv-sCard4 .sc-icon', 1.25 + 0.15);
    P.wipeOut('#pv-sCard1, #pv-sCard2, #pv-sCard3, #pv-sCard4', D - P.V2.OUT, { dir: 'left' });

    P.end(D);
    // 截圖用：網址加 ?t=秒數 就停在那一刻（例：03-side-panel.html?t=3）
    var t = Number(new URLSearchParams(location.search).get('t'));
    if (t > 0) tl.pause(t);
    // 重播協定：父頁（音效預覽）送 hf-preview-replay → 從頭播，並回 hf-preview-started
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'hf-preview-replay') return;
      tl.restart();
      (e.source || parent).postMessage({ type: 'hf-preview-started', key: pv.key }, '*');
    });
    parent.postMessage({ type: 'hf-preview-ready', key: pv.key, duration: pv.duration, cues: pv.cues }, '*');
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
</body>
</html>
