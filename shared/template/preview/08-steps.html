<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>08 Step 字卡｜預覽</title>
<!-- build.mjs --gallery 產生：用 scene.json 的 sample 填模板，講者是 speaker.jpg；換主色或放 ../bg-fs.jpg、../bg-side.jpg、../bg-ch.jpg（或單一 ../bg.jpg）後重新整理就會更新 -->
<link rel="stylesheet" href="../kit/fonts.css">
<link rel="stylesheet" href="../kit/brand.css">
<link rel="stylesheet" href="../kit/scene.css">
<link rel="stylesheet" href="../kit/illus.css">
<link rel="stylesheet" href="../kit/theme.css">
<link rel="stylesheet" href="../kit/captions.css">
<script src="../kit/style-switch.js"></script>
<script src="../kit/gsap.min.js"></script>
<script src="../kit/scene-motion.js"></script>
<script src="../kit/illus.js"></script>
<script src="../kit/scene-layout.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; transform-origin: 0 0; }
  #footage { position: absolute; inset: 0; }
  #footage img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
  .fill { position: absolute; inset: 0; }
  #scene { position: absolute; inset: 0; z-index: 20; }
  #pip { position: absolute; left: 1424px; top: 594px; width: 432px; height: 324px; overflow: hidden; border-radius: 6px; z-index: 40; }
  #pip img { position: absolute; left: -220px; top: -10px; width: 873px; height: 491px; }
  #pipf { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 41; }
  #cap { z-index: 60; }
  /* 背景圖：各版面先用自己的 ../bg-*.jpg，沒有就用 ../bg.jpg，都沒有只顯示底紋（不必重新產生預覽頁） */
  .sc-surface-fs { background-image: url("../bg-fs.jpg"), url("../bg.jpg"), var(--sc-fs-pattern); background-size: cover, cover, 1920px 1080px; background-position: center, center, 0 0; background-repeat: no-repeat; }
  [data-wide] .sc-surface-fs { background-image: var(--sc-fs-pattern); }
  .sc-surface-ch { background-image: url("../bg-ch.jpg"), url("../bg.jpg"), var(--sc-ch-pattern); background-size: cover, cover, 1920px 1080px; background-position: center, center, 0 0; background-repeat: no-repeat; }
  .sc-surface-side { background-image: url("../bg-side.jpg"), url("../bg.jpg"), var(--sc-side-pattern); background-size: cover, 1920px auto, 960px 1080px; background-position: center, 0 50%, 0 0; background-repeat: no-repeat; }
  #pv-steps #pv-gCard { left: 120px; bottom: 220px; }
  #pv-steps .st-body { display: grid; }
  #pv-steps .st-body > * { grid-area: 1 / 1; justify-self: start; }
  #pv-steps .st-num { display: inline-grid; vertical-align: top; font-variant-numeric: tabular-nums; }
  #pv-steps .st-num > * { grid-area: 1 / 1; }
</style>
</head>
<body>
<div id="stage">
  <div id="footage"><img src="speaker.jpg" alt=""></div>
  <div id="scene">
    <div id="pv-steps" class="fill">
      <div id="pv-aWrap" class="fill">
        <div id="pv-gCard" class="sc-lt" data-layout="free">
          <i class="sc-lt__plate"></i>
          <div class="sc-lt__card">
            <i class="sc-lt__dots"></i>
            <div class="sc-lt__body st-body">
              <div id="pv-s1" class="sc-lt__row"><span class="sc-icon sc-icon--88"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <polyline class="stroke-draw" pathLength="1" points="4 17 10 11 4 5" /> <line class="stroke-draw" pathLength="1" x1="12" x2="20" y1="19" y2="19" /> </svg></span><span class="sc-t54 sc-w700 sc-opt">貼上<span class="sc-kw">第一個提示詞</span>，裝好工具</span></div>
              <div id="pv-s2" class="sc-lt__row"><span class="sc-icon sc-icon--88"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path class="stroke-draw" pathLength="1" d="m3 17 2 2 4-4" /> <path class="stroke-draw" pathLength="1" d="m3 7 2 2 4-4" /> <path class="stroke-draw" pathLength="1" d="M13 6h8" /> <path class="stroke-draw" pathLength="1" d="M13 12h8" /> <path class="stroke-draw" pathLength="1" d="M13 18h8" /> </svg></span><span class="sc-t54 sc-w700 sc-opt">確認<span class="sc-kw">剪輯清單</span>再剪</span></div>
              <div id="pv-s3" class="sc-lt__row"><span class="sc-icon sc-icon--88"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path class="stroke-draw" pathLength="1" d="M10 7.75a.75.75 0 0 1 1.142-.638l3.664 2.249a.75.75 0 0 1 0 1.278l-3.664 2.25a.75.75 0 0 1-1.142-.64z" /> <path class="stroke-draw" pathLength="1" d="M12 17v4" /> <path class="stroke-draw" pathLength="1" d="M8 21h8" /> <rect class="stroke-draw" pathLength="1" x="2" y="3" width="20" height="14" rx="2" /> </svg></span><span class="sc-t54 sc-w700 sc-opt">看完<span class="sc-kw">預覽</span>再輸出</span></div>
            </div>
          </div>
          <div class="sc-lt__tag"><span class="sc-lt__tagin">步驟&nbsp;<span class="st-num"><span id="pv-n1">01</span><span id="pv-n2">02</span><span id="pv-n3">03</span></span></span></div>
        </div>
      </div>
    </div>
  </div>
  <div class="cg" id="cap"><span>貼上第一個提示詞</span></div>
</div>
<script>
window.__PREVIEW = {"key":"steps","duration":8,"cues":[]};
</script>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); stage.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();
  var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
  var start = function () {
    const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.2 });
    var pv = window.__PREVIEW;
    const P = SceneMotion(tl, document.getElementById('pv-steps'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const D = 8;
    /* v2（shared/template/BEATS.md §2 的動作）：外殼擦開＋左移 → 標籤彈出 → 第 1 步上漂 → 之後每一步：內容 P.axis 往左換、標籤數字 P.swap（每步停 ≥ 0.65＋1.2）→ 段尾向左擦掉 */
    const stepAt = [0.15, 2.75, 5.35];
    P.wipe('#pv-gCard .sc-lt__plate, #pv-gCard .sc-lt__card', 0, { dir: 'left', dur: P.V2.SHELL });
    P.drift('#pv-gCard .sc-lt__plate, #pv-gCard .sc-lt__card', 0, { dx: -40 * P.U, dur: P.V2.SHELL });
    P.pop('#pv-gCard .sc-lt__tag', 0 + 0.12, { from: 0.4, dy: 18 });
    P.rise('#pv-s1', stepAt[0]);
    for (let i = 1; i < stepAt.length; i++) {
      P.axis('#pv-s' + i, '#pv-s' + (i + 1), stepAt[i]);
      P.swap('#pv-n' + i, '#pv-n' + (i + 1), stepAt[i]);
    }
    P.icon('#pv-s1 .sc-icon', stepAt[0] + 0.15);
    for (let i = 1; i < stepAt.length; i++) P.icon('#pv-s' + (i + 1) + ' .sc-icon', stepAt[i] + P.AXIS_LAG + 0.15);
    P.wipeOut('#pv-gCard', D - P.V2.OUT, { dir: 'left' });

    P.end(D);
    // 截圖用：網址加 ?t=秒數 就停在那一刻（例：03-side-panel.html?t=3）
    var t = Number(new URLSearchParams(location.search).get('t'));
    if (t > 0) tl.pause(t);
    // 重播協定：父頁（音效預覽）送 hf-preview-replay → 從頭播，並回 hf-preview-started
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'hf-preview-replay') return;
      tl.restart();
      (e.source || parent).postMessage({ type: 'hf-preview-started', key: pv.key }, '*');
    });
    parent.postMessage({ type: 'hf-preview-ready', key: pv.key, duration: pv.duration, cues: pv.cues }, '*');
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
</body>
</html>
