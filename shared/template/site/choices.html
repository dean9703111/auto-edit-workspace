<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>這集學到的習慣</title>
<!-- 學習清單（062）：固定模板，versions.mjs learn --page 把 AI 寫的候選規則（work/feedback/learn-rules.json）塞進來。
     照落點分組（寫進剪輯偏好／改工具的預設／加程式檢查），每條寫現行、建議、代價、證據，選「照做／不要／再想想」；
     選的存在這個瀏覽器（localStorage，每個專案一份），最下面「複製答案」貼回給 AI，貼回的文字就是答案。 -->
<style>
:root {
  --brand: #FFD400; --brand-ink: #0B1020; --brand-text: #FFD400;
  /*__BRAND__*/
  --bg: #070B14; --bg2: #0B1020; --card: #111A2E; --card2: #16213A;
  --line: rgba(255, 255, 255, .10); --line2: rgba(255, 255, 255, .22);
  --ink: #fff; --mute: rgba(255, 255, 255, .72); --dim: rgba(255, 255, 255, .5);
  --accent: var(--brand); --on-accent: var(--brand-ink); --accent-text: var(--brand-text);
  --good: #2FB36B; --bad: #FF5A5F;
  --font: "Noto Sans TC", system-ui, -apple-system, "PingFang TC", "Segoe UI", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font); padding-bottom: calc(150px + env(safe-area-inset-bottom)); }
button, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.wrap { max-width: 760px; margin: 0 auto; padding: 0 16px; }
.top { padding-top: 22px; padding-bottom: 6px; }
.eyebrow { font: 600 12px var(--mono); letter-spacing: .12em; color: var(--accent-text); }
h1 { font-size: 24px; line-height: 1.3; margin: 6px 0; }
.top p { margin: 0; color: var(--mute); font-size: 13px; }
h2 { font-size: 17px; margin: 26px 0 4px; }
.group-note { margin: 0 0 10px; color: var(--dim); font-size: 13px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-top: 12px; }
.card[data-pick="keep"] { border-color: var(--good); }
.card[data-pick="drop"] { opacity: .72; }
.rid { font: 700 13px var(--mono); color: var(--accent-text); }
.text { font-size: 16px; font-weight: 700; margin: 4px 0 8px; line-height: 1.5; }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
dt { color: var(--dim); white-space: nowrap; }
dd { margin: 0; color: var(--mute); overflow-wrap: anywhere; }
.pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.pick button { min-height: 42px; border-radius: 10px; border: 1px solid var(--line2); background: var(--card2); font-size: 15px; }
.pick button[aria-pressed="true"][data-v="keep"] { background: var(--good); border-color: var(--good); color: #04120a; font-weight: 700; }
.pick button[aria-pressed="true"][data-v="drop"] { background: var(--bad); border-color: var(--bad); color: #1d0003; font-weight: 700; }
.pick button[aria-pressed="true"][data-v="later"] { background: var(--line2); border-color: var(--ink); font-weight: 700; }
.pick button:focus-visible, textarea:focus-visible, .primary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea { width: 100%; min-height: 70px; margin-top: 8px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line2); background: var(--bg2); font-size: 16px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--bg2) 94%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line2); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); }
.bar .wrap { display: flex; align-items: center; gap: 10px; }
.bar p { margin: 0; flex: 1; font-size: 13px; color: var(--mute); line-height: 1.4; }
.primary { flex: none; min-height: 48px; padding: 0 18px; border-radius: 10px; border: 0; background: var(--accent); color: var(--on-accent); font-size: 16px; font-weight: 700; }
.primary:disabled { background: var(--card2); color: var(--dim); cursor: not-allowed; }
dialog { width: min(680px, calc(100vw - 32px)); background: var(--card); color: var(--ink); border: 1px solid var(--line2); border-radius: 12px; padding: 16px; }
dialog::backdrop { background: rgb(0 0 0 / .8); }
dialog textarea { min-height: 40vh; font: 13px/1.5 var(--mono); }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 20; background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 18px; font-size: 14px; }
</style>
</head>
<body>
<header class="wrap top">
  <div class="eyebrow">這集學到的習慣</div>
  <h1 id="proj"></h1>
  <p id="meta"></p>
</header>
<main class="wrap" id="groups"></main>
<section class="wrap">
  <h2>補充（選填）</h2>
  <textarea id="extra" aria-label="補充" placeholder="例如「L3 只限橫式」"></textarea>
</section>
<footer class="bar"><div class="wrap"><p id="barNote" role="status"></p><button class="primary" id="copy" disabled>複製答案</button></div></footer>
<dialog id="manual" aria-label="手動複製"><p>這個瀏覽器不讓網頁直接寫剪貼簿：長按下面的文字 → 全選 → 拷貝，再貼給 AI。</p><textarea id="manualText" readonly></textarea><p><button class="primary" id="manualClose">關閉</button></p></dialog>
<script type="application/json" id="siteData">__SITE_DATA__</script>
<script>
(() => {
  const D = JSON.parse(document.getElementById('siteData').textContent);
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const KEY = `auto-edit-learn:${D.project}`;
  let S = { picks: {}, extra: '' };
  try { const v = JSON.parse(localStorage.getItem(KEY) || 'null'); if (v && v.picks) S = v; } catch { /* 沒有存過 */ }
  const store = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { /* 無痕視窗 */ } };
  const GROUPS = [
    ['偏好', '寫進剪輯偏好（之後每一集寫分鏡、改段落都照做）'],
    ['改預設', '改工具的預設值（給工具作者改，不會自己動 shared/）'],
    ['程式檢查', '加一條程式檢查（給工具作者改，不會自己動 shared/）'],
  ];
  const PICKS = [['keep', '照做'], ['drop', '不要'], ['later', '再想想']];
  $('#proj').textContent = D.project;
  $('#meta').textContent = `${D.generated} 整理｜${D.rules.length} 條候選規則：每條選「照做／不要／再想想」，最後按「複製答案」貼回給 AI`;
  const card = (r) => `<article class="card" data-id="${esc(r.id)}" data-pick="${esc(S.picks[r.id] || '')}">
    <div class="rid">${esc(r.id)}</div><div class="text">${esc(r.text)}</div>
    <dl>${r.now ? `<dt>現行</dt><dd>${esc(r.now)}</dd>` : ''}${r.change ? `<dt>建議</dt><dd>${esc(r.change)}</dd>` : ''}${r.cost ? `<dt>代價</dt><dd>${esc(r.cost)}</dd>` : ''}<dt>證據</dt><dd>${esc(r.evidence)}</dd></dl>
    <div class="pick" role="group" aria-label="${esc(r.id)} 要不要照做">${PICKS.map(([v, t]) => `<button type="button" data-v="${v}" aria-pressed="${S.picks[r.id] === v}">${t}</button>`).join('')}</div>
  </article>`;
  $('#groups').innerHTML = GROUPS.map(([k, title]) => {
    const list = D.rules.filter((r) => r.where === k);
    return list.length ? `<h2>${esc(title)}（${list.length}）</h2>${list.map(card).join('')}` : '';
  }).join('');
  $('#extra').value = S.extra || '';
  const answer = () => {
    const of = (v) => D.rules.filter((r) => S.picks[r.id] === v).map((r) => r.id);
    const L = [`學習清單的答案（${D.file}）`, `照做：${of('keep').join('、') || '無'}`, `不要：${of('drop').join('、') || '無'}`, `再想想：${of('later').join('、') || '無'}`];
    if (S.extra.trim()) L.push(`補充：${S.extra.trim().replace(/\s*\n\s*/g, '／')}`);
    return L.join('\n');
  };
  const refresh = () => {
    const n = D.rules.filter((r) => S.picks[r.id]).length;
    $('#copy').disabled = !n;
    $('#barNote').textContent = n ? `已選 ${n}／${D.rules.length} 條（沒選的算「再想想」）` : '還沒選任何一條：每條選「照做／不要／再想想」，這個按鈕才能複製';
  };
  $('#groups').addEventListener('click', (e) => {
    const b = e.target.closest('.pick button');
    if (!b) return;
    const c = b.closest('.card'), id = c.dataset.id;
    S.picks[id] = S.picks[id] === b.dataset.v ? '' : b.dataset.v;
    if (!S.picks[id]) delete S.picks[id];
    c.dataset.pick = S.picks[id] || '';
    for (const x of c.querySelectorAll('.pick button')) x.setAttribute('aria-pressed', String(S.picks[id] === x.dataset.v));
    store(); refresh();
  });
  $('#extra').addEventListener('input', (e) => { S.extra = e.target.value; store(); });
  $('#copy').addEventListener('click', async () => {
    const text = answer();
    let ok = false;
    try { await navigator.clipboard.writeText(text); ok = true; } catch {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch { ok = false; }
      ta.remove();
    }
    if (ok) { const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role', 'status'); t.textContent = '已複製答案，貼回給 AI'; document.body.appendChild(t); setTimeout(() => t.remove(), 3000); }
    else { $('#manualText').value = text; $('#manual').showModal(); $('#manualText').select(); }
  });
  $('#manualClose').addEventListener('click', () => $('#manual').close());
  refresh();
  window.__learn = { data: D, answer };
})();
</script>
</body>
</html>
