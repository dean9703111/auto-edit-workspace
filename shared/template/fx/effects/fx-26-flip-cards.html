<!doctype html>
<html lang="zh-Hant" data-composition-variables='[
  {"id":"text","type":"string","label":"動畫文字（B）","default":"翻轉卡片"},
  {"id":"alt","type":"string","label":"切換文字（A）","default":"Flip"},
  {"id":"accent","type":"color","label":"主色","default":"#a78bfa"},
  {"id":"bg","type":"enum","label":"底色","default":"accent","options":[{"value":"dark","label":"深色"},{"value":"light","label":"淺色"},{"value":"accent","label":"主色"},{"value":"none","label":"透明"}]}
]'>
<head><meta charset="UTF-8"><title>26 Flip Cards 翻轉卡片</title></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; }
    /* 26 Flip Cards */
    .fx-26-row { display: flex; align-items: center; justify-content: center; }
    .fx-26-card { position: relative; flex: none; perspective: 900px; }
    .fx-26-inner { position: absolute; inset: 0; transform-style: preserve-3d; }
    .fx-26-face { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: var(--fx-panel); color: #fff; border-radius: 14px; white-space: pre;
      backface-visibility: hidden; -webkit-backface-visibility: hidden; }
    .fx-26-back { transform: rotateY(180deg); }
  </style>
  <div id="root" data-composition-id="fx-26-flip-cards" data-width="1920" data-height="1080" data-duration="4">
    <div class="fx-stage">
      <div class="fx-safe"><div class="fx-26-row"></div></div>
    </div>
  </div>
  <script src="fx-kit.js"></script>
  <script>
    /* 26 Flip Cards：每字一張黑卡，正面 A、背面 B；逐張 rotateY 0→180 翻到 B，停留後 180→360 翻回 A */
    const v = window.__hyperframes.getVariables();
    const stage = document.querySelector('.fx-stage');
    const row = document.querySelector('.fx-26-row');
    const { D } = FXKit.setup(stage, v, 4);

    const A = [...String(v.alt ?? '')], B = [...String(v.text ?? '')];
    const N = Math.max(A.length, B.length, 1);
    while (A.length < N) A.push(' ');
    while (B.length < N) B.push(' ');
    const f = Math.min(240, Math.floor(FXKit.SAFE.w / (1.1 * N)));
    const cw = Math.round(f * 0.96), ch = Math.round(f * 1.3), gap = Math.round(f * 0.07);

    const inners = A.map((a, i) => {
      const card = document.createElement('div');
      card.className = 'fx-26-card';
      card.style.cssText = `width:${cw}px;height:${ch}px;margin:0 ${gap / 2}px;font-size:${Math.round(f * 0.88)}px;`;
      const inner = document.createElement('div');
      inner.className = 'fx-26-inner';
      const front = document.createElement('div');
      front.className = 'fx-26-face';
      front.textContent = a;
      const back = document.createElement('div');
      back.className = 'fx-26-face fx-26-back';
      back.textContent = B[i];
      inner.appendChild(front); inner.appendChild(back);
      card.appendChild(inner);
      row.appendChild(card);
      return inner;
    });

    const M = 0.3;
    const dur = Math.min(0.7, (D - 2 * M) * 0.3);
    const st = Math.max(0.01, Math.min(0.12, ((D - 2 * M) * 0.4 - dur) / Math.max(1, N - 1)));
    const Smax = dur + st * (N - 1);
    const t1 = M, t2 = D - M - Smax;

    const tl = gsap.timeline({ paused: true });
    inners.forEach((el, i) => {
      tl.fromTo(el, { rotationY: 0 }, { rotationY: 180, duration: dur, ease: 'power2.inOut' }, t1 + i * st)
        .fromTo(el, { rotationY: 180 }, { rotationY: 360, duration: dur, ease: 'power2.inOut', immediateRender: false }, t2 + i * st);
    });
    window.__timelines['fx-26-flip-cards'] = tl;
  </script>
</template>
</body>
</html>
