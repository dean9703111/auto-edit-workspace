<!doctype html>
<html lang="zh-Hant" data-composition-variables='[
  {"id":"text","type":"string","label":"動畫文字","default":"液體填充"},
  {"id":"accent","type":"color","label":"主色","default":"#f78c3c"},
  {"id":"bg","type":"enum","label":"底色","default":"dark","options":[{"value":"dark","label":"深色"},{"value":"light","label":"淺色"},{"value":"accent","label":"主色"},{"value":"none","label":"透明"}]}
]'>
<head><meta charset="UTF-8"><title>37 Liquid Fill 液體填充</title></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; }
    /* 37 Liquid Fill */
    .fx-37-box { position: relative; display: inline-block; white-space: nowrap; }
    .fx-37-layer { position: absolute; left: 0; top: 0; white-space: nowrap; }
    .fx-37-ghost { visibility: hidden; }
    .fx-37-line { color: var(--fx-ink); filter: url(#fx-37-ring); }
    .fx-37-back { color: var(--fx-hi); opacity: .5; clip-path: polygon(0 100%, 0 100%, 0 100%); }
    .fx-37-front { color: var(--fx-hi); clip-path: polygon(0 100%, 0 100%, 0 100%); }
    .fx-stage[data-bg="none"] .fx-37-box { filter: drop-shadow(0 2px 4px rgba(0,0,0,.85)); }
    /* 透明疊在講者畫面上：空心字後面墊一層深色的實心字。白色外框在淺色背景（白牆、白衣服）上看不見，水位還沒滿的時候字會像缺了一半 */
    .fx-stage[data-bg="none"] .fx-37-ghost { visibility: visible; color: rgba(16,18,25,0.82); }
  </style>
  <div id="root" data-composition-id="fx-37-liquid-fill" data-width="1920" data-height="1080" data-duration="4">
    <svg width="0" height="0" style="position:absolute">
      <!-- 空心字外框：外擴 3px 後扣掉原字形（可變字型的 text-stroke 會露出筆畫重疊線） -->
      <filter id="fx-37-ring" x="-5%" y="-10%" width="110%" height="120%">
        <feMorphology in="SourceGraphic" operator="dilate" radius="3" result="d"/>
        <feComposite in="d" in2="SourceAlpha" operator="out"/>
      </filter>
    </svg>
    <div class="fx-stage">
      <div class="fx-safe"><div class="fx-37-box">
        <div class="fx-37-ghost"></div>
        <div class="fx-37-layer fx-37-line"></div>
        <div class="fx-37-layer fx-37-back"></div>
        <div class="fx-37-layer fx-37-front"></div>
      </div></div>
    </div>
  </div>
  <script src="fx-kit.js"></script>
  <script>
    /* 37 Liquid Fill：實心主色複本用 clip-path polygon 裁出波浪液面；液面高度與波相位都是時間的純函數，
       從底部升到滿，之後停在滿的狀態（2026-11-12：原本會再降回空心，短的段落大半時間字都是半滿的，看起來像破掉） */
    const v = window.__hyperframes.getVariables();
    const stage = document.querySelector('.fx-stage');
    const box = document.querySelector('.fx-37-box');
    const { D } = FXKit.setup(stage, v, 4);

    const SIZE = FXKit.fitSize(v.text, 280, FXKit.SAFE.w);
    box.style.fontSize = SIZE + 'px';
    ['.fx-37-ghost', '.fx-37-line', '.fx-37-back', '.fx-37-front'].forEach((s) => { document.querySelector(s).textContent = v.text; });
    const back = document.querySelector('.fx-37-back');
    const front = document.querySelector('.fx-37-front');

    const AMP = 16;      // 波高 px
    const CYC = 3.2;     // 液面橫跨整個字的波數
    const WAVES = Math.max(2, Math.round(D / 1.5)); // 整數個波相位週期，首尾相同
    const T0 = 0.15, edge = 0.15;
    const move = Math.max(0.5, Math.min(1.4, (D - 2 * edge) * 0.36)); // 上升佔的秒數（長的段落也不超過 1.4 秒）
    const smooth = (x) => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); };
    // 液位 0＝空、1＝滿
    const level = (t) => smooth((t - T0) / move);

    function poly(t, phase, lv) {
      const H = SIZE; // line-height 1，高度＝字級，不量 DOM
      const y0 = (H + AMP + 6) - lv * (H + 2 * AMP + 12); // 空＝完全在盒底下、滿＝完全在盒頂上
      const n = 48;
      const pts = [];
      for (let i = 0; i <= n; i++) {
        const u = -0.02 + 1.04 * i / n; // 水平位置用寬度百分比
        const y = y0 + AMP * Math.sin(u * CYC * Math.PI * 2 + phase);
        pts.push((u * 100).toFixed(2) + '% ' + y.toFixed(1) + 'px');
      }
      pts.push('102% ' + (H + 40) + 'px', '-2% ' + (H + 40) + 'px');
      return 'polygon(' + pts.join(',') + ')';
    }
    function apply(t) {
      const lv = level(t);
      const ph = (t / D) * WAVES * Math.PI * 2;
      front.style.clipPath = poly(t, ph, lv);
      back.style.clipPath = poly(t, -ph * 1 + 1.7, Math.max(0, lv - 0.04) * 1);
    }
    apply(0);

    const tl = gsap.timeline({ paused: true });
    const prog = { p: 0 };
    tl.to(prog, { p: 1, duration: D, ease: 'none', onUpdate: () => apply(prog.p * D) }, 0);
    window.__timelines['fx-37-liquid-fill'] = tl;
  </script>
</template>
</body>
</html>
