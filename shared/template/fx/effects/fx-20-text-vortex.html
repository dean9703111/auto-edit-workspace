<!doctype html>
<html lang="zh-Hant" data-composition-variables='[
  {"id":"text","type":"string","label":"動畫文字","default":"文字漩渦"},
  {"id":"accent","type":"color","label":"主色","default":"#2dd4bf"},
  {"id":"bg","type":"enum","label":"底色","default":"dark","options":[{"value":"dark","label":"深色"},{"value":"light","label":"淺色"},{"value":"accent","label":"主色"},{"value":"none","label":"透明"}]}
]'>
<head><meta charset="UTF-8"><title>20 Text Vortex 文字漩渦</title></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; }
    /* 20 Text Vortex */
    .fx-20-field { position: absolute; left: 960px; top: 495px; width: 0; height: 0; }
    .fx-20-c { position: absolute; left: 0; top: 0; text-shadow: var(--fx-scrim); }
  </style>
  <div id="root" data-composition-id="fx-20-text-vortex" data-width="1920" data-height="1080" data-duration="4">
    <div class="fx-stage">
      <div class="fx-20-field"></div>
    </div>
  </div>
  <script src="fx-kit.js"></script>
  <script>
    /* 20 Text Vortex：正常橫排 → 逐字沿螺旋排開、切線方向拉長並旋轉（多出的複本淡入補滿螺旋）→ 還原橫排；首尾都是靜止橫排 */
    const v = window.__hyperframes.getVariables();
    const stage = document.querySelector('.fx-stage');
    const field = document.querySelector('.fx-20-field');
    const { D } = FXKit.setup(stage, v, 4);

    const base = [...v.text].filter((c) => c.trim());
    const n = base.length;
    const fs = FXKit.fitSize(base.join(''), 260, FXKit.SAFE.w);
    const adv = base.map((c) => FXKit.emWidth(c) * fs);
    const total = adv.reduce((a, b) => a + b, 0);
    let acc = -total / 2;
    const xn = adv.map((a) => { const x = acc + a / 2; acc += a; return x; });

    const all = Array.from({ length: Math.ceil(40 / n) }, () => base).flat();
    const N = all.length;
    const els = FXKit.splitChars(field, all.join(''), 'fx-20-c');
    els.forEach((el, i) => {
      el.style.fontSize = fs + 'px';
      el.style.color = i % 2 ? 'var(--fx-hi)' : 'var(--fx-ink)';
    });

    const sv = Math.min(1, 105 / fs);   // 漩渦裡的字縮到約 105px 高，螺旋才看得出紋路
    const ss = (x) => { x = Math.min(1, Math.max(0, x)); return x * x * (3 - 2 * x); };
    function weight(u) {
      if (u < 0.12) return 0;
      if (u < 0.4) return ss((u - 0.12) / 0.28);
      if (u < 0.6) return 1;
      if (u < 0.88) return ss(1 - (u - 0.6) / 0.28);
      return 0;
    }

    function draw(time) {
      const u = time / D;
      const w = weight(u);
      const spin = u * Math.PI * 4;   // 整個過程轉兩圈（首尾 w=0，與旋轉量無關）
      els.forEach((el, i) => {
        const f = i / (N - 1);
        const primary = i < n;
        const a = f * Math.PI * 4.4 + spin;
        const rho = 70 + 320 * Math.pow(f, 0.9);
        const xv = 1.65 * rho * Math.cos(a), yv = rho * Math.sin(a);
        const rotV = (a * 180) / Math.PI + 90;
        const sxV = (1.2 + 1.6 * f) * sv, syV = sv;
        const xN = primary ? xn[i] : 0;
        const x = xN + (xv - xN) * w;
        const y = yv * w;
        const rot = rotV * w;
        const sx = primary ? 1 + (sxV - 1) * w : sxV * w;
        const sy = primary ? 1 + (syV - 1) * w : syV * w;
        el.style.opacity = (primary ? 1 : w).toFixed(3);
        el.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) translate(-50%, -50%) rotate(${rot.toFixed(2)}deg) scale(${Math.max(sx, 0.001).toFixed(3)}, ${Math.max(sy, 0.001).toFixed(3)})`;
      });
    }

    const proxy = { t: 0 };
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(proxy, { t: 0 }, { t: D, duration: D, ease: 'none', onUpdate: () => draw(proxy.t) }, 0);
    draw(0);
    window.__timelines['fx-20-text-vortex'] = tl;
  </script>
</template>
</body>
</html>
