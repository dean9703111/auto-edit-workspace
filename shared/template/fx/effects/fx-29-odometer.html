<!doctype html>
<html lang="zh-Hant" data-composition-variables='[
  {"id":"label","type":"string","label":"左側標籤","default":"數字計數"},
  {"id":"number","type":"string","label":"目標數字（位數由它決定）","default":"0029"},
  {"id":"unit","type":"string","label":"數字右邊的單位（例：小時、支；不要就留空）","default":""},
  {"id":"accent","type":"color","label":"主色","default":"#a78bfa"},
  {"id":"bg","type":"enum","label":"底色","default":"dark","options":[{"value":"dark","label":"深色"},{"value":"light","label":"淺色"},{"value":"accent","label":"主色"},{"value":"none","label":"透明"}]}
]'>
<head><meta charset="UTF-8"><title>29 Odometer 數字計數</title></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; }
    /* 29 Odometer */
    .fx-29-row { display: flex; align-items: center; justify-content: center; white-space: nowrap; }
    .fx-29-label, .fx-29-unit { color: var(--fx-ink); text-shadow: var(--fx-scrim); }
    .fx-29-digits { display: flex; align-items: center; color: var(--fx-hi); font-variant-numeric: tabular-nums; text-shadow: var(--fx-scrim); }
    .fx-29-win { position: relative; flex: none; overflow: hidden;
      -webkit-mask-image: linear-gradient(transparent, #000 9%, #000 91%, transparent);
      mask-image: linear-gradient(transparent, #000 9%, #000 91%, transparent); }
    .fx-29-strip { position: absolute; left: 0; top: 0; width: 100%; }
    .fx-29-it { display: flex; align-items: center; justify-content: center; width: 100%; text-shadow: var(--fx-scrim); }
    .fx-29-sep { display: flex; align-items: center; justify-content: center; text-shadow: var(--fx-scrim); }
  </style>
  <div id="root" data-composition-id="fx-29-odometer" data-width="1920" data-height="1080" data-duration="4">
    <div class="fx-stage">
      <div class="fx-safe"><div class="fx-29-row"><div class="fx-29-label" data-live="label"></div><div class="fx-29-digits" data-live="number"></div><div class="fx-29-unit" data-live="unit"></div></div></div>
    </div>
  </div>
  <script src="fx-kit.js"></script>
  <script>
    /* 29 Odometer：左側固定標籤、右側單位（選填）；數值 v 從 0 減速數到目標，每位數滾輪位置是 v 的純函數（真實里程表進位）；
       停在目標值到最後，整排淡出（不倒數回 0：影片裡會變成「只花 0 小時」）。data-live 給剪輯台邊打字邊看用 */
    const v = window.__hyperframes.getVariables();
    const stage = document.querySelector('.fx-stage');
    const label = document.querySelector('.fx-29-label');
    const digits = document.querySelector('.fx-29-digits');
    const unit = document.querySelector('.fx-29-unit');
    const { D } = FXKit.setup(stage, v, 4);

    const LAB = String(v.label ?? '');
    const NUM = [...String(v.number ?? '0')];
    const nd = Math.max(1, NUM.filter((c) => /\d/.test(c)).length);
    const ns = NUM.length - nd;
    const UNIT = String(v.unit ?? '').trim();
    const E = FXKit.emWidth(LAB), EU = UNIT ? FXKit.emWidth(UNIT) : 0;
    const fn = Math.min(260, Math.floor(FXKit.SAFE.w / (0.45 * E + 0.35 + 0.7 * nd + 0.3 * ns + (UNIT ? 0.45 * EU + 0.2 : 0))));
    const fl = Math.round(fn * 0.45);
    const H = Math.round(fn * 1.1), wW = Math.round(fn * 0.68);
    label.textContent = LAB;
    label.style.fontSize = fl + 'px';
    label.style.marginRight = Math.round(fn * 0.35) + 'px';
    digits.style.fontSize = fn + 'px';
    unit.textContent = UNIT;
    unit.style.fontSize = fl + 'px';
    unit.style.marginLeft = UNIT ? Math.round(fn * 0.2) + 'px' : '0';

    // 目標值（只取數字字元）；每位數一個滾輪，10 個數字＋結尾再放一個 0 讓 9→0 能平滑接上
    const target = Number(NUM.filter((c) => /\d/.test(c)).join('') || '0');
    let place = nd;
    const wheels = [];
    NUM.forEach((c) => {
      if (!/\d/.test(c)) {
        const sp = document.createElement('div');
        sp.className = 'fx-29-sep';
        sp.style.cssText = `height:${H}px;width:${Math.round(fn * 0.3)}px;`;
        sp.textContent = c;
        digits.appendChild(sp);
        return;
      }
      place--;
      const win = document.createElement('div');
      win.className = 'fx-29-win';
      win.style.cssText = `width:${wW}px;height:${H}px;`;
      const strip = document.createElement('div');
      strip.className = 'fx-29-strip';
      for (let k = 0; k <= 10; k++) {
        const it = document.createElement('div');
        it.className = 'fx-29-it';
        it.style.height = H + 'px';
        it.textContent = String(k % 10);
        strip.appendChild(it);
      }
      win.appendChild(strip);
      digits.appendChild(win);
      wheels.push({ strip, p10: Math.pow(10, place) });
    });

    // 里程表：第 k 位的位置 = floor(v/10^k) + max(0, (v mod 10^k) − (10^k − 1))，顯示 pos mod 10
    function render(val) {
      wheels.forEach(({ strip, p10 }) => {
        const pos = Math.floor(val / p10) + Math.max(0, (val % p10) - (p10 - 1));
        strip.style.transform = `translateY(${-(pos % 10) * H}px)`;
      });
    }

    const roll = Math.max(0.5, Math.min(1.8, (D - 1.0) * 0.5));
    const out = 0.35;
    const p = { v: 0 };
    render(0);
    const row = document.querySelector('.fx-29-row');
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(p, { v: 0 }, { v: target, duration: roll, ease: 'power2.out', onUpdate: () => render(p.v) }, 0.3)
      .fromTo(row, { opacity: 1, y: 0 }, { opacity: 0, y: -24, duration: out, ease: 'power2.in', immediateRender: false },
        Math.max(0.3 + roll + 0.3, D - out - 0.05));
    window.__timelines['fx-29-odometer'] = tl;
  </script>
</template>
</body>
</html>
