<!-- 預設拍型：D 清單（BEATS.md §3 D；手機在中間、背後同心圓，講到一個功能，手機送出一圈漣漪、那個功能膠囊彈出，講到總結手機畫面打勾） -->
<!doctype html>
<!--
  x-callout-phone：一支手機（App、產品），四周逐一冒出功能膠囊（第二層 custom，layout: "fullscreen"；x-callout 的變體）

  【適用的講解】
  在介紹一個 App 或產品的 2–4 個功能、特色：「這張 eSIM 下載就能用、不用換卡、iPhone 和安卓都能用，還能隨時加值」。
  中間一支手機（插圖），背後三圈同心圓；講到哪個功能，手機送出一圈漣漪、那個功能的膠囊從手機旁邊彈出（圖示描線、字逐字浮出）並聚焦；
  講到總結那一句，全部亮回、手機畫面打勾。

  【不要用在哪裡】
  - 主體不是手機或 App：用 x-callout（主體可以換成其他插圖元件）。
  - 每個功能後面還有一句說明要同時看到：用 13 標題條列或 x-stack。
  - 超過 4 個功能：拆兩段，或用 04a。

  【要改的地方】
  1. 文字：標題列（#xcph-card 裡的 .sc-wcard__bar，≤ 10 字，寫產品名或主題）；四個功能膠囊的 .xcph-name（≤ 5 字；字級 52，放不下就縮文案，不縮字）。
  2. 圖示：四個膠囊的 .sc-icon。到 kit/icons.json 找名稱，把 svg 原文整段貼上。
     一個字都不改：svg 裡面 <rect>、<line>、<circle> 的 width、height、x、y、r 是形狀本身的尺寸，拿掉就畫不出來；
     圖示大小由 .sc-icon 的 --i 決定，<svg> 本身不用寫 width、height。
  3. 手機：#xcph-obj 的 data-screen 寫一開始的畫面（blank、video、shorts、qr；照 kit/illus-gallery.jpg），總結時換成打勾（check）。
     主體是電腦或網站：data-illus 換成 laptop（寬 360、高 244），其他不用改。
  4. 綁句：<script> 開頭 T1–T4、ALL 的句號與詞（見【綁句欄位】）。
  5. 開場：<script> 的 ENTER 預設自動判斷（前一段也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出），通常不用改；要固定才改成 'grow' 或 'swap'。
  功能是 3 個：刪掉 #xcph-t4、script 開頭的「, T4 = P.at(…)」與「第 4 個功能」那 2 行（右邊只剩一個，自動置中）；2 個：再照樣刪第 3 個。

  【綁句欄位】
  T1 = P.at('#232@下載')、T2 = P.at('#233@不用換卡')、T3 = P.at('#234@安卓')、T4 = P.at('#235@加值')：講到那個功能的時刻，手機送出漣漪、那個膠囊彈出，0.6 秒後聚焦。
  ALL = P.at('#236')：講到總結那一句，全部亮回、手機畫面打勾。沒有這句：改成 const ALL = T4 + 2.0;（3 個功能時寫 T3 + 2.0）。
  功能在句中間或句尾時一定用 @詞，不要綁句首；剛好是那句的第一個詞才寫 P.at('#233')。
  「@詞」要寫成字串字面值（P.at('#233@不用換卡')，不要用變數組字串），build 才算得到；要再晚一點加第二個參數：P.at('#233@不用換卡', 0.3)。
  相鄰兩個功能至少差 2.5 秒（膠囊彈出、0.6 秒聚焦，再停 ≥ 1.2 秒）；太近就綁後面那個詞，或減成 3 個。
  audit 會比對：這一拍出現的字（功能名）在別句才講到時，印 ⚠ 綁句對不上，照它給的 P.at 改。

  【D 下限】
  T1 ≥ 2.0（主卡 0.3 秒長出、0.5 秒起標題逐字、手機 1.0 秒彈出、同心圓 1.2 秒起錯拍淡入）
  T2 ≥ T1 + 2.5；T3 ≥ T2 + 2.5；T4 ≥ T3 + 2.5；ALL ≥ T4 + 2.5
  D ≥ ALL + 2.6（回均衡 0.6 秒＋最後一幕停 1.5 秒＋build 加的淡出 0.5 秒；D＝plan.json 這段的長度）
  結尾寫 P.end()（不帶參數），長度自動等於 plan.json 這段的長度；root 的 data-duration 只給單獨開檔時用。

  【版面】
  fullscreen：主卡進場看 script 的 ENTER；離場由 build 處理。主卡 left 120、top 150、寬 1180（右緣 1300，避開右下子母畫面），標題列 128、內容區 1176×580。
  手機（直式 200×416）在中間、左欄 t1、t3、右欄 t2、t4（膠囊 416×112，圓角 56），由 #xcph-body 的 data-layout="row" data-gap="md" 排（kit/scene-layout.js）：
  三組並排、中間各 24（共 1080），兩欄裡 data-layout="col" data-gap="lg"，整組在內容區置中，不寫 left／top。
  同心圓（直徑 240／360／480，虛線）以手機為中心，CSS 置中、疊在手機與膠囊後面（data-layout-allow-overlap），不用改。
-->
<html lang="zh-Hant">
<head><meta charset="UTF-8"><title>x-callout-phone 手機與功能膠囊</title></head>
<body>
<template id="x-callout-phone-template">
  <style>
    #x-callout-phone { position: absolute; inset: 0; }
    #x-callout-phone .fill { position: absolute; inset: 0; }
    /* 主卡：左 120、頂 150、寬 1180（右緣 1300）；標題列 128、內容區 1176×580（卡底 862） */
    #x-callout-phone #xcph-card { position: absolute; left: 120px; top: 150px; width: 1180px; }
    #x-callout-phone #xcph-card .sc-wcard__bar { height: 128px; padding: 20px 56px; }
    #x-callout-phone #xcph-body { position: relative; width: 1176px; height: 580px; }
    /* 手機＋背後的同心圓（以手機外框中心置中；位置由 data-layout 排，不寫 left／top） */
    #x-callout-phone #xcph-objwrap { position: absolute; width: 200px; height: 416px; }
    #x-callout-phone .xcph-ring { position: absolute; box-sizing: border-box; border: 4px dashed var(--v2-line); border-radius: 50%; background: var(--v2-node-tint); }
    #x-callout-phone #xcph-r1 { left: -20px; top: 88px; width: 240px; height: 240px; }
    #x-callout-phone #xcph-r2 { left: -80px; top: 28px; width: 360px; height: 360px; opacity: 0.7; }
    #x-callout-phone #xcph-r3 { left: -140px; top: -32px; width: 480px; height: 480px; opacity: 0.45; }
    #x-callout-phone #xcph-obj { position: absolute; left: 0; top: 0; width: 200px; height: 416px; }
    /* 功能膠囊：416×112、圓角 56，圖示＋名稱，疊在同心圓上面（z-index 2）；位置由 data-layout 排（左欄 t1、t3，右欄 t2、t4） */
    #x-callout-phone .xcph-tag { position: absolute; z-index: 2; width: 416px; height: 112px; box-sizing: border-box; border: 4px solid var(--v2-node-line);
                                 border-radius: 56px; background: var(--v2-node); color: var(--sc-fs-ink);
                                 display: flex; align-items: center; gap: 16px; padding: 0 28px; white-space: nowrap; }
    #x-callout-phone .xcph-tag .sc-icon { --d: 64px; --i: 36px; position: relative; }
    #x-callout-phone .xcph-tag .xcph-name { position: relative; }
  </style>
  <div id="x-callout-phone" data-composition-id="x-callout-phone" data-width="1920" data-height="1080" data-duration="15"
       data-cues-sample='{"start":0,"D":15,"cues":{"232":[1.9,4.3],"233":[4.4,6.8],"234":[6.9,9.3],"235":[9.4,11.8],"236":[12.2,14.6]},"refs":{"#232@下載":2.1,"#233@不用換卡":4.6,"#234@安卓":7.1,"#235@加值":9.6}}'>
    <div class="sc-surface-fs fill"></div>
    <div id="xcph-card" class="sc-wcard">
      <div class="sc-wcard__bar"><span class="sc-opt" data-fill="title">旅遊 eSIM 怎麼用</span></div>
      <div id="xcph-body" data-layout="row" data-gap="md">
        <div id="xcph-left" data-slot data-layout="col" data-gap="lg">
          <div id="xcph-t1" class="xcph-tag" data-slot>
            <span id="xcph-ico1" class="sc-icon" data-fill="items.1.icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /> <polyline points="17 8 12 3 7 8" /> <line x1="12" x2="12" y1="3" y2="15" /> </svg></span><span id="xcph-n1" class="xcph-name sc-t52 sc-w900 sc-opt" data-fill="items.1.text">下載就能用</span></div>
          <!-- @if n>=3 { -->
          <div id="xcph-t3" class="xcph-tag" data-slot>
            <span id="xcph-ico3" class="sc-icon" data-fill="items.3.icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <rect width="14" height="20" x="5" y="2" rx="2" ry="2" /> <path d="M12 18h.01" /> </svg></span><span id="xcph-n3" class="xcph-name sc-t52 sc-w900 sc-opt" data-fill="items.3.text">安卓也能用</span></div>
          <!-- @} -->
        </div>
        <div id="xcph-objwrap" data-slot>
          <i id="xcph-r3" class="xcph-ring" data-layout-allow-overlap></i><i id="xcph-r2" class="xcph-ring" data-layout-allow-overlap></i><i id="xcph-r1" class="xcph-ring" data-layout-allow-overlap></i>
          <div id="xcph-obj" data-illus="phone" data-orient="portrait" data-screen="blank"></div> <!-- @sub screen: <div id="xcph-obj" data-illus="phone" data-orient="portrait" data-screen="{{screen}}"></div> -->
        </div>
        <div id="xcph-right" data-slot data-layout="col" data-gap="lg">
          <div id="xcph-t2" class="xcph-tag" data-slot>
            <span id="xcph-ico2" class="sc-icon" data-fill="items.2.icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M20 6 9 17l-5-5" /> </svg></span><span id="xcph-n2" class="xcph-name sc-t52 sc-w900 sc-opt" data-fill="items.2.text">不用換卡</span></div>
          <!-- @if n>=4 { -->
          <div id="xcph-t4" class="xcph-tag" data-slot>
            <span id="xcph-ico4" class="sc-icon" data-fill="items.4.icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z" /> </svg></span><span id="xcph-n4" class="xcph-name sc-t52 sc-w900 sc-opt" data-fill="items.4.text">隨時加值</span></div>
          <!-- @} -->
        </div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    ILLUS.mount(document.getElementById('x-callout-phone'));   // 第一行：手機插圖先掛成 SVG，之後建的動畫才抓得到 .il-check
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-callout-phone'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const T1 = P.at('#232@下載'), T2 = P.at('#233@不用換卡'), T3 = P.at('#234@安卓'), T4 = P.at('#235@加值');   // 講到每個功能的時刻  // @sub n==3: const T1 = P.at('#232@下載'), T2 = P.at('#233@不用換卡'), T3 = P.at('#234@安卓'); @@ n==2: const T1 = P.at('#232@下載'), T2 = P.at('#233@不用換卡');
    const ALL = P.at('#236');                        // 講到總結那一句（沒有這句見檔頭【綁句欄位】）  // @sub !all && n==4: const ALL = T4 + 2.0; @@ !all && n==3: const ALL = T3 + 2.0; @@ !all && n==2: const ALL = T2 + 2.0;
    P.sfx('success', '#236');                        // 總結手機打勾那一拍（句號和上一行一樣）  // @if all
    const ENTER = P.prev() === 'fullscreen' ? 'swap' : 'grow';   // 預設看前一段（build 給）：也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出；要固定才改成 'grow' 或 'swap'
    const TAGS = '#xcph-t1, #xcph-t2, #xcph-t3, #xcph-t4';   // 全部膠囊（收尾用；少的選不到，不用改）

    // 拍 0 開場：主卡進場（看 ENTER）→ 標題逐字上浮 → 1.0 手機彈出 → 1.2 起同心圓由內往外錯拍淡入
    if (ENTER === 'grow') P.grow('#xcph-card', 0.3);
    else { P.wipe('#xcph-card', 0, { dir: 'up', dur: 0.8 }); P.pop('#xcph-card', 0, { from: 0.96, dy: 60, dur: 0.8, ease: P.V2.EASE.in }); }
    P.chars('#xcph-card .sc-wcard__bar .sc-opt', 0.5, { stagger: 0.035 });
    P.pop('#xcph-obj', 1.0, { from: 0.7 });
    P.pop('#xcph-r1, #xcph-r2, #xcph-r3', 1.2, { stagger: 0.15, from: 0.6, dy: 0 });
    // 拍 1 第 1 個功能：手機送出一圈漣漪 → 膠囊彈出、＋0.12 字逐字、＋0.15 圖示描線 → ＋0.6 聚焦
    P.ripple('#xcph-obj', T1, { to: 1.8 });
    P.pop('#xcph-t1', T1, { from: 0.6, dy: 0 });  P.chars('#xcph-n1', T1 + 0.12);  P.icon('#xcph-ico1', T1 + 0.15);
    P.spot('#xcph-t1', '#xcph-t1', T1 + 0.6, { scale: 1.05, lift: -8, dim: 0.6 });
    // 拍 2 第 2 個功能：同拍 1
    P.ripple('#xcph-obj', T2, { to: 1.8 });
    P.pop('#xcph-t2', T2, { from: 0.6, dy: 0 });  P.chars('#xcph-n2', T2 + 0.12);  P.icon('#xcph-ico2', T2 + 0.15);
    P.spot('#xcph-t1, #xcph-t2', '#xcph-t2', T2 + 0.6, { scale: 1.05, lift: -8, dim: 0.6 });
    // @if n>=3 {
    // 第 3 個功能（只有 2 個功能時刪掉這 3 行）
    P.ripple('#xcph-obj', T3, { to: 1.8 });
    P.pop('#xcph-t3', T3, { from: 0.6, dy: 0 });  P.chars('#xcph-n3', T3 + 0.12);  P.icon('#xcph-ico3', T3 + 0.15);
    P.spot('#xcph-t1, #xcph-t2, #xcph-t3', '#xcph-t3', T3 + 0.6, { scale: 1.05, lift: -8, dim: 0.6 });
    // @}
    // @if n>=4 {
    // 第 4 個功能（3 個以下時刪掉這 3 行）
    P.ripple('#xcph-obj', T4, { to: 1.8 });
    P.pop('#xcph-t4', T4, { from: 0.6, dy: 0 });  P.chars('#xcph-n4', T4 + 0.12);  P.icon('#xcph-ico4', T4 + 0.15);
    P.spot('#xcph-t1, #xcph-t2, #xcph-t3, #xcph-t4', '#xcph-t4', T4 + 0.6, { scale: 1.05, lift: -8, dim: 0.6 });
    // @}
    // 收：總結那一句 → 回均衡（膠囊全部亮回），手機畫面打勾、漣漪，完成態停到段尾
    P.spot(TAGS, null, ALL, { dur: 0.6 });
    P.in('#xcph-obj .il-check', ALL + 0.1);
    P.ripple('#xcph-obj', ALL + 0.15, { to: 1.8 });

    P.end();                                         // 長度＝plan.json 這段的長度
    window.__timelines['x-callout-phone'] = tl;
  })();
  </script>
</template>
</body>
</html>
