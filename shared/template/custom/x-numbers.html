<!doctype html>
<!--
  x-numbers.html — 第二層 custom 範例：數值變化（計數器＋量條，超量時同一根撐破）

  【適用的口播】
    口播在講「數量很大／超過上限」再講「處理掉大部分」：例「NG 有 32 段，超過人工看得完的 20 段；AI 一次剪掉 28 段」。
    畫面邏輯：數字從 0 數上去（P.count），量條同步長（P.bar），數到上限那一刻軌道本身撐開（P.morph）、
    量條跟著伸長變警示色（同一根，不另接一塊）；第二列用同一把尺顯示「剪掉 28 段」（綠色量條 28 ÷ 32）。

  【不要用在哪裡】
    - 只有一個數字、沒有「超過什麼」或「比較什麼」：用 06 概念或 07 重點字卡，把數字寫在字上。
    - 數字很多（≥ 4 組）：資訊過載，改第一層 04d 表格。
    - 軌道要超量的比例很誇張（> 2 倍）：撐開後超出卡片，要先算好寬度（撐開後右緣要 ≤ 卡內右緣 1120）。
    - 一集已經有 2 段 custom：改回第一層（USAGE-reference R7.1）。

  【要改的地方】
    1. 文字：#xn-labA／#xn-labB（左側名稱，≤ 5 字）、單位「段」、卡片標題列、兩個圖示（kit/icons.json 的名稱）。
    2. 數字：P.count 的 to（20、32、28）。量條比例：每 1 單位 ＝ 軌道寬 ÷ 上限（這裡 664 ÷ 20 ＝ 33.2 px），
       所以撐開後寬度 ＝ 33.2 × 32 ＝ 1062（改 morph 的 width）、綠條 28 ÷ 32 ＝ 0.875（改 P.bar 的 to）。
    3. 時間點：時間軸每一行的第二個參數（秒數，本段起點之後）。
    4. D（本段長度，秒）：跑 build.mjs --check，把報告的「長度」填回 data-duration 與 const D；最後一個動作後至少停 1.5 秒。

  【時間軸怎麼對到字幕句】
    本段時間軸 0 秒＝plan.json 這段的起點（--check 報告的「起點」）。
    某句口播要觸發的時間 ＝ 該句字幕起點（work/rough.srt） − 本段起點。
    例：本段起點 20.0 秒、「NG 有 32 段」那句起點 21.2 秒 → A 列計數從 1.2 開始；
    「剪掉 28 段」那句起點 24.6 秒 → B 列從 4.6 開始。

  【版型】fullscreen：整段淡入淡出 0.5 秒由 build 處理，主內容右緣 1300，0.5 秒前不動。
-->
<html lang="zh-Hant">
<head><meta charset="UTF-8"><title>x-numbers 數值變化</title></head>
<body>
<template id="x-numbers-template">
  <style>
    #x-numbers { position: absolute; inset: 0; }
    #x-numbers .fill { position: absolute; inset: 0; }
    /* 卡：左 120、頂 150、寬 1180（右緣 1300）、高 628（底 778） */
    #x-numbers #xn-card { position: absolute; left: 120px; top: 150px; width: 1180px; height: 628px; box-sizing: border-box; }
    #x-numbers #xn-body { position: relative; height: 0; }
    #x-numbers .xn-block { position: absolute; left: 56px; width: 1064px; height: 220px; }
    #x-numbers #xn-blockA { top: 36px; }
    #x-numbers #xn-blockB { top: 276px; }
    /* 一列：圖示／名稱／數字／單位同一條中線（高 112） */
    #x-numbers .xn-row { position: absolute; left: 0; top: 0; width: 1064px; height: 112px; display: flex; align-items: center; gap: 24px; white-space: nowrap; }
    #x-numbers .xn-lab { width: 300px; }
    #x-numbers .xn-n { width: 150px; text-align: right; }
    #x-numbers .xn-track { position: absolute; left: 0; top: 132px; height: 48px; box-sizing: border-box;
                           border: 4px solid var(--sc-fs-node-line); border-radius: 10px; background: var(--sc-fs-node); }
    #x-numbers #xn-trackA { width: 664px; }
    #x-numbers #xn-trackB { width: 1062px; }
    #x-numbers .xn-fill { position: absolute; inset: 0; border-radius: 6px; }
    #x-numbers #xn-fillA { background: var(--sc-accent); }
    #x-numbers #xn-overA { position: absolute; inset: 0; border-radius: 6px; background: var(--sc-warn); }
    #x-numbers #xn-fillB { background: var(--sc-good); }
  </style>
  <div id="x-numbers" data-composition-id="x-numbers" data-width="1920" data-height="1080" data-duration="9">
    <div class="sc-surface-fs fill"></div>
    <div id="xn-card" class="sc-wcard">
      <div class="sc-wcard__bar"><span class="sc-opt">NG 段落清理</span></div>
      <div id="xn-body">
        <div id="xn-blockA" class="xn-block">
          <div class="xn-row">
            <span id="xn-icoA" class="sc-icon sc-icon--88"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <circle cx="12" cy="12" r="10" /> <line x1="12" x2="12" y1="8" y2="12" /> <line x1="12" x2="12.01" y1="16" y2="16" /> </svg></span>
            <span class="xn-lab sc-t64 sc-w900 sc-opt">NG 段落</span>
            <span id="xn-nA" class="xn-n sc-t112 sc-w900">0</span>
            <span class="sc-t72 sc-w700 sc-opt">段</span>
          </div>
          <div id="xn-trackA" class="xn-track"><div id="xn-fillA" class="xn-fill"><div id="xn-overA"></div></div></div>
        </div>
        <div id="xn-blockB" class="xn-block">
          <div class="xn-row">
            <span id="xn-icoB" class="sc-icon sc-icon--88"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <circle cx="6" cy="6" r="3" /> <path d="M8.12 8.12 12 12" /> <path d="M20 4 8.12 15.88" /> <circle cx="6" cy="18" r="3" /> <path d="M14.8 14.8 20 20" /> </svg></span>
            <span class="xn-lab sc-t64 sc-w900 sc-opt">剪掉</span>
            <span id="xn-nB" class="xn-n sc-t112 sc-w900 sc-kw">0</span>
            <span class="sc-t72 sc-w700 sc-opt">段</span>
          </div>
          <div id="xn-trackB" class="xn-track"><div id="xn-fillB" class="xn-fill"></div></div>
        </div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-numbers'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const D = 9;

    // ── A 列：NG 32 段（超過上限 20 段，同一根撐破）──
    const A = 1.2;                                                         // 「NG 有 32 段」那句的秒數
    P.rise('#xn-blockA', 0.6);
    P.icon('#xn-icoA', 0.6 + P.BEAT);
    P.count('#xn-nA', A, { from: 0, to: 20, dur: 1.1, ease: 'none' });     // 數到上限 20，量條同速長滿軌道
    P.bar('#xn-fillA', A, { from: 0, to: 1, dur: 1.1, ease: 'none' });
    const B20 = A + 1.1;                                                   // 碰到上限的那一刻：軌道撐開、數字繼續、整條變警示色
    P.count('#xn-nA', B20, { from: 20, to: 32, dur: 0.7 });
    P.morph('#xn-trackA', B20, { width: 1062 }, { from: { width: 664 } }); // 同一根軌道 664 → 1062，填充（寬 100%）跟著伸長
    P.in('#xn-overA', B20, { dur: 0.3 });

    // ── B 列：剪掉 28 段（同一把尺：軌道 1062 ＝ 32 段）──
    const Bt = 4.6;                                                        // 「剪掉 28 段」那句的秒數
    P.rise('#xn-blockB', Bt);
    P.icon('#xn-icoB', Bt + P.BEAT);
    P.count('#xn-nB', Bt + 0.6, { from: 0, to: 28, dur: 1.2 });
    P.bar('#xn-fillB', Bt + 0.6, { from: 0, to: 0.875, dur: 1.2 });        // 28 ÷ 32
    // 5.8 + 1.2 ＝ 7.0 秒動作結束，停到 D＝9（≥ 1.5 秒）

    P.end(D);
    window.__timelines['x-numbers'] = tl;
  })();
  </script>
</template>
</body>
</html>
