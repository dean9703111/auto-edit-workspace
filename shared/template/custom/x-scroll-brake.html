<!-- 預設拍型：E 數字（BEATS.md §3 E；計數滾到項數 → 長清單越捲越快 → 急剎停在留下的那一項） -->
<!doctype html>
<!--
  x-scroll-brake：長清單急剎（第二層 custom，layout: "fullscreen"；左邊大數字數到項數，右邊長清單越捲越快、急剎停在最後留下的那一項）

  【適用的講解】
  先講數量很多、再點名只留下一個：「這一年我試了三十個 AI 剪輯工具，大部分用一次就刪掉了，最後真的留下來的，只有這一個」。
  畫面邏輯：講到數量時左邊數字從 0 滾到項數、右邊視窗的清單第一屏錯拍彈出；講到「這一個」前 3.6 秒清單開始往上捲、越捲越快（縱向動態模糊）；
  講到「這一個」時清單急剎（衝過頭 24 px 再 0.4 秒回正），停在留下的那一項：四角準星從外圍收攏咬住、其他列退暗、那一列抬起換主色框、
  「留下的」膠囊彈出，左邊的數字換成主色的 1。

  【不要用在哪裡】
  - 只有 3–5 項：捲不起來，用 x-rank、04a。
  - 最後留下的不只一個：用 x-checklist、x-rank。
  - 清單裡的名字觀眾要一個一個讀到：捲動中看不清楚，用 04a 清單或拆段。
  - 講的數字和清單項數不一樣（「試了一百個」只列得出 20 個）：計數停在項數，和口播對不上，改用 x-numbers。

  【要改的地方】
  1. 文字：視窗標題（.sc-wcard__bar，≤ 10 字）、左邊小標 #xsb-eye（≤ 6 字）、單位 #xsb-unit（≤ 7 字，例「個 AI 剪輯工具」）、
     急剎後換上的小標 #xsb-eye2（選填，≤ 6 字；不要就刪掉這個元素和 P.swap 那一行）、膠囊字 #xsb-keep（≤ 4 字）。
  2. 清單：只改 <script> 開頭 ITEMS 那一行（JSON 寫法，12–30 項，每項 ≤ 6 字，半形算半個字）和 PICK（留下的是第幾項，從 1 數；8 起，最多到倒數第 4 項，
     下面要有 3 列墊著）。列、編號、捲動距離、急剎停的位置都由程式算，不寫座標；計數停在 ITEMS 的項數。
  3. 綁句：<script> 開頭 TC、TB 的句號與詞（見【綁句欄位】），P.sfx 的句號跟著 TB 改。
  4. 開場：<script> 的 ENTER 預設自動判斷（前一段也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出），通常不用改。
  這支沒有圖示：清單每一列左邊是編號圓（01、02…），不是圖示。

  【綁句欄位】
  TC = P.at('#561@三十')：講到數量那個詞的時刻，數字提早 1.2 秒從 0 開始滾、剛好停在項數；清單第一屏提早 0.4 秒錯拍彈出。
  TB = P.at('#563@這一個')：講到「留下的就是這一個」那個詞的時刻，清單急剎停在 PICK 那一項、準星咬住、其他列退暗、膠囊彈出，
  配一顆 impact（P.sfx('impact', '#563@這一個')，句號一起改）。
  清單開始捲不另外綁句：程式從 TB 往前推 3.6 秒開始捲（最早 TC ＋ 1.9，第一屏彈完先停 1.2 秒），捲動和急剎是同一個動作。
  數量、「這一個」在句中間或句尾時一定用 @詞，不要綁句首。「@詞」要寫成字串字面值（P.at('#563@這一個')，不要用變數組字串），build 才算得到。

  【D 下限】
  TC ≥ 1.8（主卡 0.3 秒長出、0.5 秒起標題逐字、計數擦開；數字提早 1.2 秒開始滾、清單第一屏提早 0.4 秒彈出）
  TB ≥ TC + 4.4（第一屏彈完到 TC + 0.65、停 1.2 秒，最早 TC + 1.9 開始捲，至少捲 2.5 秒才加速得起來；不夠 audit 會報，不要硬擠，TB 改綁晚一點的句子）
  D ≥ TB + 3.0（急剎回正、準星、膠囊、數字換成 1 做到 TB + 1.05＋最後一幕停 1.5 秒＋build 加的淡出 0.5 秒；D＝plan.json 這段的長度）
  結尾寫 P.end()（不帶參數），長度自動等於 plan.json 這段的長度；root 的 data-duration 只給單獨開檔時用。

  【版面】
  fullscreen：視窗卡進場看 script 的 ENTER、計數 0.5 秒由左擦開；離場由 build 處理。
  子母畫面：計數 #xsb-count left 120、top 300、寬 400（小標 top 0、大數字 240 px top 92、單位 56 px top 348）；
  視窗卡 #xsb-card left 560、top 150、740×720（右緣 1300，避開右下子母畫面），標題列 128；清單區 #xsb-view 在標題列下 24、卡底上 24（高 540，一屏 5 列）。
  全寬（沒有講者：script 看到外層的 data-wide，在 root 也加 data-wide）：計數寬 560、視窗卡 left 760、寬 1040（右緣 1800），高度不變；
  卡頂 150 在右上角小節角標（y 16–136）之下，卡底 870 在字幕區 y 920 之上。
  清單：每一列高 96、間距 12（列距 108），左右內距 40；左內距 24：編號圓 64（字 40）→ 24 → 名稱 40 字；停點列的膠囊是 kit 的 .sc-pill（高 72）換成主色底，靠右 24。
  急剎時停點列的中線對到清單區正中（畫面 y 574）；四角準星 #xsb-lock 框住停點列、四邊外擴 24（子母畫面 x 578–1282、全寬 x 778–1782，y 502–646）。
  縱向動態模糊掛在清單區（#xsb-view）上、不掛在整條清單上：模糊＝捲動速度（px／格）× 0.45，封頂 22；停下來時拿掉濾鏡，字是銳的。
-->
<html lang="zh-Hant">
<head><meta charset="UTF-8"><title>x-scroll-brake 長清單急剎</title></head>
<body>
<template id="x-scroll-brake-template">
  <style>
    #x-scroll-brake { position: absolute; inset: 0; }
    #x-scroll-brake .fill { position: absolute; inset: 0; }
    #x-scroll-brake .xsb-defs { position: absolute; left: 0; top: 0; }
    /* 左：計數（子母畫面 x 120–520；全寬 x 120–680）。大數字自己一層（只改亮度、不縮放）：清單捲動時整頁重畫，240 px 的字邊緣才不會差一個色階 */
    #x-scroll-brake #xsb-count { position: absolute; left: 120px; top: 300px; width: 400px; height: 424px; }
    #x-scroll-brake #xsb-eye, #x-scroll-brake #xsb-eye2 { position: absolute; left: 0; top: 0; }
    #x-scroll-brake #xsb-num, #x-scroll-brake #xsb-num2 { position: absolute; left: 0; top: 92px; font-size: 240px; line-height: 240px; font-weight: 900;
                                                         white-space: nowrap; will-change: opacity; }
    #x-scroll-brake #xsb-num { color: var(--sc-fs-ink); }
    #x-scroll-brake #xsb-num2 { color: var(--brand); }
    #x-scroll-brake #xsb-unit { position: absolute; left: 0; top: 348px; white-space: nowrap; color: var(--sc-fs-ink); }
    /* 右：視窗卡 left 560、top 150、740×720（右緣 1300）；標題列 128；清單區在標題列下 24、卡底上 24（高 540，一屏 5 列；捲動時列在這兩條線被切掉） */
    #x-scroll-brake #xsb-card { position: absolute; left: 560px; top: 150px; width: 740px; height: 720px; box-sizing: border-box; }
    #x-scroll-brake #xsb-card .sc-wcard__bar { height: 128px; box-sizing: border-box; }
    #x-scroll-brake #xsb-view { position: absolute; left: 0; right: 0; top: 152px; bottom: 24px; overflow: hidden; }
    #x-scroll-brake #xsb-list { position: absolute; left: 40px; right: 40px; top: 0; }
    /* 一列：高 96、間距 12（列距 108）；第 k 列（從 1 數）上緣＝108 ×（k − 1） */
    #x-scroll-brake .xsb-row { position: relative; height: 96px; margin-bottom: 12px; box-sizing: border-box; display: flex; align-items: center; gap: 24px;
                               padding: 0 32px 0 24px; border-radius: 16px; background: var(--sc-fs-node); border: 2px solid var(--sc-fs-card-line); }
    #x-scroll-brake .xsb-chip { position: relative; flex: none; width: 64px; height: 64px; border-radius: 32px; display: grid; place-items: center;
                                background: var(--v2-node-tint); color: var(--sc-fs-ink); font-size: 40px; line-height: 64px; font-weight: 900; font-variant-numeric: tabular-nums; }
    #x-scroll-brake .xsb-on { position: absolute; left: 0; top: 0; width: 64px; height: 64px; border-radius: 32px; display: grid; place-items: center;
                              background: var(--brand); color: var(--brand-ink); opacity: 0; }
    #x-scroll-brake .xsb-name { color: var(--sc-fs-ink); white-space: nowrap; }
    /* 停點列：主色框（抬起時淡入）＋膠囊（kit 的 .sc-pill 換成主色底、白點，靠右） */
    #x-scroll-brake .xsb-ring { position: absolute; left: -2px; top: -2px; right: -2px; bottom: -2px; border: 4px solid var(--brand); border-radius: 18px;
                                box-shadow: var(--v2-card-shadow); pointer-events: none; opacity: 0; }
    #x-scroll-brake #xsb-keep { position: absolute; right: 24px; top: 10px; background: var(--brand); color: var(--brand-ink); --sc-accent: var(--brand-ink); }
    /* 四角準星：框住停點列、四邊外擴 24（停點列在畫面 y 526–622） */
    #x-scroll-brake #xsb-lock { position: absolute; left: 578px; top: 502px; width: 704px; height: 144px; pointer-events: none; }
    #x-scroll-brake .xsb-cn { position: absolute; width: 44px; height: 44px; box-sizing: border-box; border: 0 solid var(--brand); }
    #x-scroll-brake #xsb-c1 { left: 0; top: 0; border-top-width: 6px; border-left-width: 6px; border-top-left-radius: 10px; }
    #x-scroll-brake #xsb-c2 { right: 0; top: 0; border-top-width: 6px; border-right-width: 6px; border-top-right-radius: 10px; }
    #x-scroll-brake #xsb-c3 { left: 0; bottom: 0; border-bottom-width: 6px; border-left-width: 6px; border-bottom-left-radius: 10px; }
    #x-scroll-brake #xsb-c4 { right: 0; bottom: 0; border-bottom-width: 6px; border-right-width: 6px; border-bottom-right-radius: 10px; }
    /* 全寬（沒有講者）：計數寬 560、視窗卡 x 760–1800 */
    #x-scroll-brake[data-wide] #xsb-count { width: 560px; }
    #x-scroll-brake[data-wide] #xsb-card { left: 760px; width: 1040px; }
    #x-scroll-brake[data-wide] #xsb-lock { left: 778px; width: 1004px; }
  </style>
  <div id="x-scroll-brake" data-composition-id="x-scroll-brake" data-width="1920" data-height="1080" data-duration="11.6"
       data-cues-sample='{"start":0,"D":11.6,"cues":{"561":[0.4,4.2],"562":[4.4,6.0],"563":[6.2,9.4]},"refs":{"#561@三十":1.9,"#563@這一個":8.5}}'>
    <div class="sc-surface-fs fill"></div>
    <svg class="xsb-defs" width="0" height="0" aria-hidden="true"><filter id="xsb-blur" x="0" y="-2%" width="100%" height="104%" color-interpolation-filters="sRGB"><feGaussianBlur id="xsb-blurk" stdDeviation="0 0" /></filter></svg>
    <div id="xsb-count">
      <div id="xsb-eye" class="sc-pill"><span class="sc-opt" data-fill="eyebrow">這一年</span></div>
      <!-- @if eyebrowEnd { -->
      <div id="xsb-eye2" class="sc-pill"><span class="sc-opt" data-fill="eyebrowEnd">最後留下</span></div>
      <!-- @} -->
      <div id="xsb-num">0</div>
      <div id="xsb-num2">1</div>
      <div id="xsb-unit" class="sc-t56 sc-w900"><span class="sc-opt" data-fill="unit">個 AI 剪輯工具</span></div>
    </div>
    <div id="xsb-card" class="sc-wcard">
      <div class="sc-wcard__bar"><span class="sc-opt" data-fill="title">試過的 AI 工具</span></div>
      <div id="xsb-view" data-layout-allow-overflow>
        <div id="xsb-list"></div>
      </div>
    </div>
    <span id="xsb-keep" class="sc-pill"><span class="sc-opt" data-fill="keep">留下的</span></span>
    <div id="xsb-lock" data-layout-allow-overlap><i id="xsb-c1" class="xsb-cn"></i><i id="xsb-c2" class="xsb-cn"></i><i id="xsb-c3" class="xsb-cn"></i><i id="xsb-c4" class="xsb-cn"></i></div>
  </div>
  <script>
  (function () {
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const ITEMS = ["自動字幕","去背工具","AI 配音","剪輯外掛","自動調色","縮圖產生","音效庫","轉逐字稿","翻譯字幕","影片摘要","畫面放大","降噪工具","自動運鏡","短影音切片","字卡模板","語音克隆","影片生成","背景音樂","自動上片","標題產生","留言分析","美顏濾鏡","自動對嘴","雲端剪輯","腳本助手","畫面修復","自動剪 NG","動態字卡","素材管理","數據報表"];   // 只改這一行：12–30 項，每項 ≤ 6 字
    const PICK = 27;                                   // 留下的是第幾項（從 1 數；8 起，最多到倒數第 4 項）

    // 0. 依 ITEMS 長出每一列（以下都不用改；載入時算一次，只用常數、不量版面，每次結果相同）
    const ROOT = document.getElementById('x-scroll-brake'), WIDE = !!ROOT.closest('[data-wide]');
    if (WIDE) ROOT.setAttribute('data-wide', '');      // 全寬版型：CSS 的 [data-wide] 那幾行接手
    const N = ITEMS.length, K = Math.max(1, Math.min(PICK, N));
    const LIST = $q('#xsb-list')[0], VIEW = $q('#xsb-view')[0], BLUR = $q('#xsb-blurk')[0];
    const el = function (tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
    const rows = ITEMS.map(function (name, i) {
      const r = el('div', 'xsb-row'), no = String(i + 1).padStart(2, '0'), chip = el('span', 'xsb-chip', no);
      r.id = 'xsb-r' + (i + 1);
      r.appendChild(chip); r.appendChild(el('span', 'xsb-name sc-t40 sc-w700', String(name)));
      if (i + 1 === K) { chip.appendChild(el('span', 'xsb-on', no)); r.appendChild(el('i', 'xsb-ring')); r.appendChild($q('#xsb-keep')[0]); }
      LIST.appendChild(r);
      return r;
    });
    const pickRow = rows[K - 1], others = rows.filter(function (r, i) { return i !== K - 1; });
    const firstScreen = rows.slice(0, 5);              // 清單區 540 高：一開始看得到前 5 列
    // 停點列的中線對到清單區正中：第 K 列上緣 108(K−1)、列高 96、清單區半高 270
    const dist = 108 * (K - 1) + 48 - 270;

    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-scroll-brake'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const TC = P.at('#561@三十');                       // 講到數量：數字落在項數
    const TB = P.at('#563@這一個');                     // 講到「這一個」：急剎
    P.sfx('impact', '#563@這一個');                     // 急剎那一格一顆（句號和 TB 一樣）
    const ENTER = P.prev() === 'fullscreen' ? 'swap' : 'grow';   // 預設看前一段（build 給）：也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出

    // 急剎（以下都不用改）：清單往上捲 dist，加速（速度 ∝ 時間²）→ 等速 0.35 秒 → 0.45 秒猛減速衝過頭 24 px（TB 那一格）→ 0.4 秒回正。
    // 位置與縱向模糊都是時間的閉式解（純函式，不讀上一格）；用 P.morph 推清單元素上的進度屬性 xsbScroll（0→1），每次 render 照它重畫，建立時先畫 0
    const brake = function (s0, tb) {
      const ta = Math.max(1.0, tb - s0 - 0.8), start = tb - 0.8 - ta, over = 24, tc = 0.35, tbk = 0.45, settle = 0.4, total = ta + tc + tbk + settle;
      const vmax = (dist + over) / (ta / 3 + tc + tbk / 3), xa = vmax * ta / 3, xc = xa + vmax * tc;
      const at = function (tau) {   // → [位置 px, 速度 px／秒]
        if (tau <= 0) return [0, 0];
        if (tau < ta) return [vmax * tau * tau * tau / (3 * ta * ta), vmax * (tau / ta) * (tau / ta)];
        if (tau < ta + tc) return [xa + vmax * (tau - ta), vmax];
        if (tau < ta + tc + tbk) { const s = (tau - ta - tc) / tbk; return [xc + vmax * tbk / 3 * (1 - Math.pow(1 - s, 3)), vmax * (1 - s) * (1 - s)]; }
        const u = Math.min(1, (tau - ta - tc - tbk) / settle), e = (1 - Math.cos(Math.PI * u)) / 2;
        return [dist + over * (1 - e), u < 1 ? over * Math.PI / 2 * Math.sin(Math.PI * u) / settle : 0];
      };
      const paint = function (r) {
        const pv = at(r * total), y = Math.round(pv[0]), perFrame = pv[1] / 30, b = Math.max(0, Math.min(22, perFrame * 0.45));
        LIST.style.transform = y > 0 ? 'translateY(' + (-y) + 'px)' : '';   // 整數 px：字不糊、每次 seek 點陣一樣
        BLUR.setAttribute('stdDeviation', '0 ' + b.toFixed(2));
        VIEW.style.filter = perFrame >= 1 && b > 0.3 ? 'url(#xsb-blur)' : '';   // 模糊掛在清單區，停下來就拿掉
      };
      let prog = 0;
      Object.defineProperty(LIST, 'xsbScroll', { configurable: true, get: function () { return prog; }, set: function (r) { prog = r; paint(r); } });
      paint(0);
      P.morph(LIST, start, { xsbScroll: 1 }, { from: { xsbScroll: 0 }, dur: total, ease: 'none' });
    };

    // 拍 0 開場：視窗卡進場（看 ENTER）→ 標題逐字上浮；左邊計數由左擦開
    if (ENTER === 'grow') P.grow('#xsb-card', 0.3);
    else { P.wipe('#xsb-card', 0, { dir: 'up', dur: 0.8 }); P.pop('#xsb-card', 0, { from: 0.96, dy: 60, dur: 0.8, ease: P.V2.EASE.in }); }
    P.chars('#xsb-card .sc-wcard__bar .sc-opt', 0.5, { stagger: 0.035 });
    P.wipe('#xsb-count', 0.5, { dir: 'left', dur: 0.6 });

    // 拍 1 講到數量：數字提早 1.2 秒從 0 滾、落在項數；清單第一屏提早 0.4 秒錯拍彈出（一組算一個）
    P.count('#xsb-num', TC - 1.2, { from: 0, to: N, dur: 1.2 });
    P.pop(firstScreen, TC - 0.4, { from: 0.96, dy: 16, dur: 0.45, stagger: 0.12 });

    // 拍 2 這一個：TB 前 3.6 秒（最早 TC + 1.9）開始捲、越捲越快，講到時急剎衝過頭 → 回正
    brake(Math.max(TC + 1.9, TB - 3.6), TB);
    // 急剎那一格：四角準星從外圍收攏咬住（x 收 0.3 倍、y 收 1.2 倍的距離，back.out）；＋0.12 其他列退暗、停點列抬起換主色框；＋0.3 膠囊彈出
    P.in('#xsb-lock', TB, { dur: 0.15 });
    $q('.xsb-cn').forEach(function (c, i) {
      const sx = i % 2 ? 1 : -1, sy = i < 2 ? -1 : 1, w = WIDE ? 1004 : 704;
      P.morph(c, TB, { x: 0, y: 0 }, { from: { x: Math.round(sx * (w / 2 - 22) * 0.3), y: Math.round(sy * 50 * 1.2) }, dur: 0.36, ease: 'back.out(2.2)' });
    });
    P.dim(others, TB + 0.12, { to: 0.38 });
    P.morph(pickRow, TB + 0.12, { scale: 1.02 }, { from: { scale: 1 }, dur: 0.3, ease: 'power3.out' });
    P.in('.xsb-ring', TB + 0.12, { dur: 0.2 });
    P.in('.xsb-on', TB + 0.12, { dur: 0.2 });
    P.pop('#xsb-keep', TB + 0.3, { from: 0.6, dy: 0 });

    // 收：左邊小標換成急剎後的那一句、數字換成主色的 1（淡出 → 彈出重拍）；完成態停到段尾
    P.swap('#xsb-eye', '#xsb-eye2', TB + 0.45);         // @if eyebrowEnd
    P.out('#xsb-num', TB + 0.45, { dur: 0.2 });
    P.pop('#xsb-num2', TB + 0.5, { from: 0.7, dy: 0 });

    P.end();                                           // 長度＝plan.json 這段的長度
    window.__timelines['x-scroll-brake'] = tl;
  })();
  </script>
</template>
