<!-- 預設拍型：D 清單（BEATS.md §3 D；一層一拍＝從上方落下＋聚焦，講到「合起來」收） -->
<!doctype html>
<!--
  x-stack：架構一層一層疊上去（第二層 custom，layout: "fullscreen"）

  【適用的口播】
  在講「由下往上的組成」：3–4 層、從底層講起，每層一個名稱＋一句說明，例如「最底層是手機上的錄影 App，中間靠區網連線，最上層是電腦端的控制台」。
  畫面先畫出地基線；講到哪一層，那一層從上方落下就位（過衝落地），層內左邊圖示描線＋名稱、右邊說明逐字浮出；
  0.6 秒後這一層放大抬起、主色亮框，下面已經疊好的層壓暗。講到「這幾層合起來…」時全部亮回（回均衡）。

  【不要用在哪裡】
  - 口播從最上層往下講：用 13 標題條列或 04a（這支第 1 個講到的永遠放最底層）。
  - 各項之間沒有上下依賴、只是並列：用 13、x-callout 或 04a。
  - 有先後順序的步驟：用 x-process。
  - 超過 4 層：拆兩段。

  【要改的地方】
  1. 文字：標題列（≤ 10 字）；每層 .xstk-name 名稱（≤ 6 字）、.xstk-desc 說明（≤ 12 字，選填：不寫就刪掉那個 span 和 script 裡那一層的 P.chars('… .xstk-desc', …)，
     並在那一層的 .xstk-layer 加 data-layout-allow-slack（層要等寬，右邊是刻意留白；不加 audit 會報右側空白過多）。放不下就縮文案，不縮字。
  2. 圖示：每層的 .sc-icon（#xstk-ico1–4）。到 kit/icons.json 找名稱，把 svg 原文整段貼上。
     一個字都不改：svg 裡面 <rect>、<line>、<circle> 的 width、height、x、y、r 是形狀本身的尺寸，拿掉就畫不出來；
     圖示大小由 .sc-icon--72 決定，<svg> 本身不用寫 width、height。
  3. 綁句：<script> 開頭 T1–T4、ALL 的句號與詞（見【綁句欄位】），下一行 P.sfx 的句號跟著改成一樣。
  4. 開場：<script> 的 ENTER 預設自動判斷（前一段也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出），通常不用改；要固定才改成 'grow' 或 'swap'。
  層數是 3：刪掉 #xstk-l4（整個 div）、script 開頭的「, T4 = P.at(…)」與「P.sfx('tick', '#114@…');」、「第 4 層」那 3 行，收尾 spot 裡的「, #xstk-l4」拿掉、
  第 3 層 P.idle 的 until: T4 − 0.1 改 ALL − 0.1；位置和地基線由 data-layout 自動重排，不用改數字。

  【綁句欄位】
  T1 = P.at('#111@手機')、T2 = P.at('#112@區網')、T3 = P.at('#113@控制台')、T4 = P.at('#114@剪輯')：講到那一層名稱的時刻，那一層落下，0.6 秒後聚焦到這一層。
  每一層一顆 tick（下一行 P.sfx，句號和 T 一樣）。
  ALL = P.at('#115')：講到「合起來就是…」那一句，全部亮回、亮框收掉。沒有這句：改成 const ALL = T4 + 2.0;（最上層講完 2 秒收）。
  名稱在句中間或句尾時一定用 @詞，不要綁句首；剛好是那句的第一個詞才寫 P.at('#112')。
  「@詞」要寫成字串字面值（P.at('#112@區網')，不要用變數組字串），build 才算得到；要再晚一點加第二個參數：P.at('#112@區網', 0.3)。
  相鄰兩層至少差 2.5 秒（落下 0.55 秒、名稱與說明逐字、圖示描線、0.6 秒聚焦＝忙到 1.1 秒，再停 ≥ 1.2 秒）；太近就綁後面一句，或把兩層合併成一層。
  audit 會比對：這一拍出現的字（層名、說明）在別句才講到時，印 ⚠ 綁句對不上，照它給的 P.at 改。

  【D 下限】
  T1 ≥ 1.8（主卡 0.3 秒長出、0.5 秒起標題逐字、地基線 1.0 秒起描 0.7 秒）
  T2 ≥ T1 + 2.5；T3 ≥ T2 + 2.5；T4 ≥ T3 + 2.5；ALL ≥ T4 + 2.5
  D ≥ ALL + 2.6（回均衡 0.6 秒＋最後一幕停 1.5 秒＋build 加的淡出 0.5 秒；沒有 ALL 那句時 ALL＝T4 + 2.0；D＝plan.json 這段的長度）
  結尾寫 P.end()（不帶參數），長度自動等於 plan.json 這段的長度；root 的 data-duration 只給單獨開檔時用。

  【版面】
  fullscreen：主卡進場看 script 的 ENTER（'grow' 0.3 秒從子母畫面長出、'swap' 0 秒由下擦開上浮）；離場由 build 處理。主卡 left 120、top 140、寬 1180（右緣 1300），
  標題列 128、內容區 1176×580（卡底 852）。每層寬 1048、高 112，左邊圖示 72＋名稱（52 字），右邊說明（40 字、靠右）；左右內距 32。
    層由 #xstk-body 的 data-layout="col" data-gap="sm" 排（kit/scene-layout.js，shared/style.md「版面」）：HTML 由上往下寫（l4 … l1），
    等距 16（一疊緊貼）、中線對齊、整組在內容區置中（4 層上下 40／44；最上層聚焦抬起後離標題列仍 ≥ 24），層數改了自動重排，不寫 left／top。
    地基線 1080×8（比層寬左右各多 16）由 script 貼在最底層 l1 下面 16（讀排好的位置，不寫座標）。
  主色亮框由 P.spot 自動加在層的外框上，不算新元素；層從上方 28 px 落下、back.out 過衝落地。
  靈感（只借技法）：techhalla-498547／techhalla／https://x.com/techhalla/status/2103411244468498547；gdgtify-130294／Gdgtify／https://x.com/Gdgtify/status/2105570411870130294；0xlangeai-597929／0xlangeai／https://x.com/0xlangeai/status/2106391068367597929
-->
<html lang="zh-Hant">
<head><meta charset="UTF-8"><title>x-stack 架構堆疊</title></head>
<body>
<template id="x-stack-template">
  <style>
    #x-stack { position: absolute; inset: 0; }
    #x-stack .fill { position: absolute; inset: 0; }
    /* 主卡：左 120、頂 140、寬 1180（右緣 1300，避開右下子母畫面）；標題列 128、內容區 1176×580（卡底 852） */
    #x-stack #xstk-card { position: absolute; left: 120px; top: 140px; width: 1180px; }
    #x-stack #xstk-card .sc-wcard__bar { height: 128px; padding: 20px 56px; }
    #x-stack #xstk-body { position: relative; width: 1176px; height: 580px; }
    /* 地基線：1080×8（左右各比層寬多 16），script 貼在最底層 l1 下面 16（讀 data-layout 排好的位置） */
    #x-stack #xstk-base { position: absolute; width: 1080px; height: 8px; }
    #x-stack #xstk-base svg { display: block; width: 100%; height: 100%; overflow: visible; }
    #x-stack #xstk-ground { fill: none; stroke: var(--sc-fs-line); stroke-width: 4px; stroke-linecap: round; }
    /* 層：同寬 1048×112，左邊圖示＋名稱、右邊說明（靠右）；左右內距 32；位置由 #xstk-body 的 data-layout 排，不寫 left／top */
    #x-stack .xstk-layer { position: absolute; width: 1048px; height: 112px; box-sizing: border-box; border: 4px solid var(--v2-node-line);
                           border-radius: 16px; background: var(--v2-node); color: var(--sc-fs-ink);
                           display: flex; align-items: center; justify-content: space-between; padding: 0 32px; white-space: nowrap; }
    #x-stack .xstk-left { display: flex; align-items: center; gap: 24px; }
  </style>
  <div id="x-stack" data-composition-id="x-stack" data-width="1920" data-height="1080" data-duration="14.9"
       data-cues-sample='{"start":0,"D":14.9,"cues":{"111":[1.8,4.1],"112":[4.3,6.8],"113":[6.9,9.3],"114":[9.4,11.8],"115":[12.1,14.5]},"refs":{"#111@手機":2.0,"#112@區網":4.5,"#113@控制台":7.0,"#114@剪輯":9.5}}'>
    <div class="sc-surface-fs fill"></div>
    <div id="xstk-card" class="sc-wcard">
      <div class="sc-wcard__bar"><span class="sc-opt">多機錄影工具的架構</span></div>
      <div id="xstk-body" data-layout="col" data-gap="sm">
        <!-- 由上往下寫：l4 最上層 … l1 最底層（第 1 個講到）；data-layout="col" 照這個順序由上往下排。地基線不參與排版（沒有 data-slot） -->
        <div id="xstk-l4" class="xstk-layer" data-slot>
          <span class="xstk-left"><span id="xstk-ico4" class="sc-icon sc-icon--72"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <circle cx="6" cy="6" r="3" /> <path d="M8.12 8.12 12 12" /> <path d="M20 4 8.12 15.88" /> <circle cx="6" cy="18" r="3" /> <path d="M14.8 14.8 20 20" /> </svg></span><span class="xstk-name sc-t52 sc-w900 sc-opt">剪輯流程</span></span><span class="xstk-desc sc-t40 sc-w500 sc-gray sc-opt">直接接剪輯軟體</span></div>
        <div id="xstk-l3" class="xstk-layer" data-slot>
          <span class="xstk-left"><span id="xstk-ico3" class="sc-icon sc-icon--72"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <rect width="20" height="14" x="2" y="3" rx="2" /> <line x1="8" x2="16" y1="21" y2="21" /> <line x1="12" x2="12" y1="17" y2="21" /> </svg></span><span class="xstk-name sc-t52 sc-w900 sc-opt">控制台</span></span><span class="xstk-desc sc-t40 sc-w500 sc-gray sc-opt">電腦上按開始結束</span></div>
        <div id="xstk-l2" class="xstk-layer" data-slot>
          <span class="xstk-left"><span id="xstk-ico2" class="sc-icon sc-icon--72"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M12 20h.01" /> <path d="M2 8.82a15 15 0 0 1 20 0" /> <path d="M5 12.859a10 10 0 0 1 14 0" /> <path d="M8.5 16.429a5 5 0 0 1 7 0" /> </svg></span><span class="xstk-name sc-t52 sc-w900 sc-opt">區網連線</span></span><span class="xstk-desc sc-t40 sc-w500 sc-gray sc-opt">同一個 Wi-Fi 傳檔</span></div>
        <div id="xstk-l1" class="xstk-layer" data-slot>
          <span class="xstk-left"><span id="xstk-ico1" class="sc-icon sc-icon--72"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <rect width="14" height="20" x="5" y="2" rx="2" ry="2" /> <path d="M12 18h.01" /> </svg></span><span class="xstk-name sc-t52 sc-w900 sc-opt">手機 App</span></span><span class="xstk-desc sc-t40 sc-w500 sc-gray sc-opt">負責錄影與回傳</span></div>
        <div id="xstk-base"><svg viewBox="0 0 1080 8" xmlns="http://www.w3.org/2000/svg"><line id="xstk-ground" x1="2" y1="4" x2="1078" y2="4" /></svg></div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-stack'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const T1 = P.at('#111@手機'), T2 = P.at('#112@區網'), T3 = P.at('#113@控制台'), T4 = P.at('#114@剪輯');   // 由下往上講到每一層名稱的時刻
    P.sfx('tick', '#111@手機'); P.sfx('tick', '#112@區網'); P.sfx('tick', '#113@控制台'); P.sfx('tick', '#114@剪輯');   // 每一層一顆音效（句號和上一行一樣）
    const ALL = P.at('#115');                          // 講到「合起來就是…」那一句（沒有這句見檔頭【綁句欄位】）
    const ENTER = P.prev() === 'fullscreen' ? 'swap' : 'grow';   // 預設看前一段（build 給）：也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出；要固定才改成 'grow' 或 'swap'
    // 地基線貼在最底層 l1 下面 --sc-gap-sm、左右各多 --sc-gap-sm（層的位置由 data-layout 排好，這裡只讀；載入時算一次，不用改）
    const L1 = document.getElementById('xstk-l1'), BASE = document.getElementById('xstk-base'), G = window.SceneLayout.token('gap-sm');
    BASE.style.left = (L1.offsetLeft - G) + 'px'; BASE.style.top = (L1.offsetTop + L1.offsetHeight + G) + 'px';

    // 拍 0 開場：主卡進場（看 ENTER）→ 標題逐字上浮；1.0 秒起地基線描出
    if (ENTER === 'grow') P.grow('#xstk-card', 0.3);
    else { P.wipe('#xstk-card', 0, { dir: 'up', dur: 0.8 }); P.pop('#xstk-card', 0, { from: 0.96, dy: 60, dur: 0.8, ease: P.V2.EASE.in }); }
    P.chars('#xstk-card .sc-wcard__bar .sc-opt', 0.5, { stagger: 0.035 });
    P.stroke('#xstk-ground', 1.0);

    // 拍 1 第 1 層：從上方 28u 落下（過衝落地）→ ＋0.12 名稱、＋0.24 說明逐字浮出、＋0.15 圖示描線 → ＋0.6 聚焦（放大抬起發光）→ ＋0.9 漂浮
    P.pop('#xstk-l1', T1, { from: 0.94, dy: -28 });  P.chars('#xstk-l1 .xstk-name', T1 + 0.12);  P.chars('#xstk-l1 .xstk-desc', T1 + 0.24);  P.icon('#xstk-ico1', T1 + 0.15);
    P.spot('#xstk-l1', '#xstk-l1', T1 + 0.6, { scale: 1.02, lift: -8, dim: 0.6 });
    P.idle('#xstk-l1', T1 + 0.9, { y: 3, period: 2.8, until: T2 - 0.1 });
    // 拍 2 第 2 層：同拍 1；＋0.6 聚焦移到這一層（下面的層壓暗 0.6）
    P.pop('#xstk-l2', T2, { from: 0.94, dy: -28 });  P.chars('#xstk-l2 .xstk-name', T2 + 0.12);  P.chars('#xstk-l2 .xstk-desc', T2 + 0.24);  P.icon('#xstk-ico2', T2 + 0.15);
    P.spot('#xstk-l1, #xstk-l2', '#xstk-l2', T2 + 0.6, { scale: 1.02, lift: -8, dim: 0.6 });
    P.idle('#xstk-l2', T2 + 0.9, { y: 3, period: 2.8, until: T3 - 0.1 });
    // 拍 3 第 3 層：同拍 2
    P.pop('#xstk-l3', T3, { from: 0.94, dy: -28 });  P.chars('#xstk-l3 .xstk-name', T3 + 0.12);  P.chars('#xstk-l3 .xstk-desc', T3 + 0.24);  P.icon('#xstk-ico3', T3 + 0.15);
    P.spot('#xstk-l1, #xstk-l2, #xstk-l3', '#xstk-l3', T3 + 0.6, { scale: 1.02, lift: -8, dim: 0.6 });
    P.idle('#xstk-l3', T3 + 0.9, { y: 3, period: 2.8, until: T4 - 0.1 });
    // 拍 4 第 4 層：同拍 2（3 層時刪掉這 3 行，見檔頭）
    P.pop('#xstk-l4', T4, { from: 0.94, dy: -28 });  P.chars('#xstk-l4 .xstk-name', T4 + 0.12);  P.chars('#xstk-l4 .xstk-desc', T4 + 0.24);  P.icon('#xstk-ico4', T4 + 0.15);
    P.spot('#xstk-l1, #xstk-l2, #xstk-l3, #xstk-l4', '#xstk-l4', T4 + 0.6, { scale: 1.02, lift: -8, dim: 0.6 });
    P.idle('#xstk-l4', T4 + 0.9, { y: 3, period: 2.8, until: ALL - 0.1 });

    // 收：講到「合起來」→ 回均衡（全部亮回、亮框收掉），完成態停到段尾
    P.spot('#xstk-l1, #xstk-l2, #xstk-l3, #xstk-l4', null, ALL, { dur: 0.6 });

    P.end();                                           // 長度＝plan.json 這段的長度
    window.__timelines['x-stack'] = tl;
  })();
  </script>
</template>
</body>
</html>
