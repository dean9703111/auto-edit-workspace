<!-- 預設拍型：F 重點字卡（BEATS.md §3 F；一拍＝重點句逐字＋圖示重拍） -->
<!doctype html>
<!--
  x-point：全畫面的一句重點（第二層 custom，layout: "fullscreen"；一個大圖示加一句話，講到那個詞的瞬間出現）

  【適用的講解】
  子母畫面中間的一句重點、提醒、轉折或小結（一兩句、4 秒起），例如「所以開拍前一定要先確認」「接下來換安裝」。
  前後都是全畫面的動畫時用它：講者留在小視窗，不用為了一句重點切回講者滿版再切回來。

  【不要用在哪裡】
  - 講者滿版露臉的時候：用 07 重點字卡（疊在講者上）。
  - 有 2 個以上並列的重點：用 x-checklist、x-callout、04a。
  - 整支片最想讓人記住的那個詞：用 x-wordcut。

  【要改的地方】
  1. 文字：小標（選填，≤ 6 字）、重點句（≤ 9 字，用字幕原詞）、補一句（選填，≤ 14 字）。放不下就縮文案，不縮字。
  2. 圖示：#xpt-ico 的 svg。到 kit/icons.json 找名稱，把 svg 原文整段貼上。
  3. 綁句：<script> 開頭 T1 的句號與詞（見【綁句欄位】），下一行 P.sfx 的句號跟著改成一樣。
  4. 開場：<script> 的 ENTER 預設自動判斷（前一段也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出），通常不用改。

  【綁句欄位】
  T1 = P.at('#461@確認')：講到那句重點的時刻，重點句逐字浮出、圖示重拍，0.5 秒後補一句淡入，配一顆 ding（P.sfx('ding', '#461@確認')，句號一起改）。
  重點詞在句中間或句尾時一定用 @詞，不要綁句首。「@詞」要寫成字串字面值（P.at('#461@確認')，不要用變數組字串），build 才算得到。

  【D 下限】
  T1 ≥ 1.2（主卡 0.3 秒長出、圖示 0.45 秒彈出、小標 0.6 秒淡入）
  D ≥ T1 + 3.0（重點句、補一句約 1 秒做完＋最後一幕停 1.5 秒＋build 加的淡出 0.5 秒；D＝plan.json 這段的長度）
  結尾寫 P.end()（不帶參數），長度自動等於 plan.json 這段的長度；root 的 data-duration 只給單獨開檔時用。

  【版面】
  fullscreen：主卡進場看 script 的 ENTER；離場由 build 處理。主卡 left 120、top 246、寬 1180、高 516（右緣 1300，避開右下子母畫面；在內容區 y 150–858 上下置中）。
  卡內 free：圖示圓 240（圖示 132）left 96、top 138；文字區 left 400、寬 700：小標 top 104（高 64）、重點句 top 196（72 字）、補一句 top 318（44 字）；
  沒有小標和補一句時重點句 top 212。重點句放不下就縮文案，不縮字。
-->
<html lang="zh-Hant">
<head><meta charset="UTF-8"><title>x-point 全畫面的一句重點</title></head>
<body>
<template id="x-point-template">
  <style>
    #x-point { position: absolute; inset: 0; }
    #x-point .fill { position: absolute; inset: 0; }
    /* 主卡：左 120、頂 246、1180×516（右緣 1300，避開右下子母畫面） */
    #x-point #xpt-card { position: absolute; left: 120px; top: 246px; width: 1180px; height: 516px; }
    #x-point #xpt-ico { position: absolute; left: 96px; top: 138px; --d: 240px; --i: 132px; }
    #x-point #xpt-tag { position: absolute; left: 400px; top: 104px; height: 64px; padding: 0 32px; }
    #x-point #xpt-key { position: absolute; left: 400px; top: 196px; width: 700px; white-space: nowrap; color: var(--sc-fs-ink); }
    #x-point #xpt-sub { position: absolute; left: 400px; top: 318px; width: 700px; white-space: nowrap; color: var(--sc-fs-mute); }
    /* 沒有小標、也沒有補一句：重點句在卡片正中 */
    #x-point #xpt-card[data-solo] #xpt-key { top: 212px; }
    /* 全寬（沒有講者，主卡 1680）：字放大 */
    #x-point #xpt-card[data-wide] #xpt-key { width: 1200px; font-size: 96px; line-height: 124px; top: 180px; }
    #x-point #xpt-card[data-wide] #xpt-sub { width: 1200px; font-size: 52px; line-height: 72px; top: 326px; }
  </style>
  <div id="x-point" data-composition-id="x-point" data-width="1920" data-height="1080" data-duration="6"
       data-cues-sample='{"start":0,"D":6,"cues":{"461":[0.8,3.2],"462":[3.3,5.8]},"refs":{"#461@確認":1.4}}'>
    <div class="sc-surface-fs fill"></div>
    <div id="xpt-card" class="sc-wcard" data-layout="free"> <!-- @sub !tag && !sub: <div id="xpt-card" class="sc-wcard" data-layout="free" data-solo> -->
      <span id="xpt-ico" class="sc-icon" data-fill="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <circle cx="12" cy="12" r="10" /> <path d="m9 12 2 2 4-4" /> </svg></span>
      <!-- @if tag { -->
      <div id="xpt-tag" class="sc-pill"><span class="sc-opt" data-fill="tag">重點</span></div>
      <!-- @} -->
      <div id="xpt-key" class="sc-t72 sc-w900"><span class="sc-opt" data-fill="key">先確認再開拍</span></div>
      <!-- @if sub { -->
      <div id="xpt-sub" class="sc-t44"><span class="sc-opt" data-fill="sub">省下重錄的時間</span></div>
      <!-- @} -->
    </div>
  </div>
  <script>
  (function () {
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-point'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const T1 = P.at('#461@確認');                      // 講到那句重點的時刻
    P.sfx('ding', '#461@確認');                        // 提示音（句號和 T1 一樣）
    const ENTER = P.prev() === 'fullscreen' ? 'swap' : 'grow';   // 預設看前一段（build 給）：也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出

    // 拍 0 開場：主卡進場（看 ENTER）→ 圖示彈出、小標淡入（先看得到這句話是哪一類）
    if (ENTER === 'grow') P.grow('#xpt-card', 0.3);
    else { P.wipe('#xpt-card', 0, { dir: 'up', dur: 0.8 }); P.pop('#xpt-card', 0, { from: 0.96, dy: 60, dur: 0.8, ease: P.V2.EASE.in }); }
    P.pop('#xpt-ico', 0.45);
    // @if tag {
    P.in('#xpt-tag', 0.6);
    // @}

    // 拍 1 重點：重點句逐字浮出、圖示重拍 → ＋0.5 補一句淡入；完成態停到段尾
    P.chars('#xpt-key .sc-opt', T1, { stagger: 0.035 });
    P.punch('#xpt-ico', T1);
    // @if sub {
    P.in('#xpt-sub', T1 + 0.5);
    // @}

    P.end();                                           // 長度＝plan.json 這段的長度
    window.__timelines['x-point'] = tl;
  })();
  </script>
</template>
</body>
</html>
