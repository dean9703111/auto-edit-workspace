<!doctype html>
<!--
  x-timeline：時間軸逐點前進（第二層 custom，layout: "fullscreen"；也用在「本集分成幾個部分」）

  【適用的口播】
  在講「有時間先後的 3–4 個點」：年份、版本、階段，或「這集分成三個部分，先…接著…最後…」。
  畫面一開始只有一條橫軸和幾個空心點；講到哪個時間點，主色進度沿著軸走到那個點、點填滿，點上方浮出卡片（圖示＋年份或序號），下方一行說明。
  目前這一點的卡片有主色框；下一點亮起時框移走，走過的點保持實心。

  【不要用在哪裡】
  - 沒有先後的並列項目：用 x-callout、12 或 04a。
  - 每一站是一個動作、要看出「做完這步才做下一步」：用 x-process 或 04c。
  - 超過 4 個點：拆兩段；年份加說明都很長（說明 > 8 字）：縮文案，放不下就改 04a。
  - 「以前 vs 現在」只有兩個點：用 04b 或 x-before-after。

  【要改的地方】
  1. 文字：標題列（#xtl-card 裡的 .sc-wcard__bar，≤ 10 字）；每個點的 .xtl-lab（4 位數字的年份，或 ≤ 2 個字；本集大綱就寫 01／02／03）；
     每個點的 .xtl-cap 說明（≤ 8 字，每行 ≤ 4 字，3 點時每行 ≤ 5 字；超過一行用 <br> 斷在語意處，最多 2 行；字級 52，不縮字）。
  2. 圖示：每個點 .sc-icon 裡的 svg。到 kit/icons.json 找名稱，把 svg 原文整段貼上。
     一個字都不改：svg 裡面 <rect>、<line>、<circle> 的 width、height、x、y、r 是形狀本身的尺寸，拿掉就畫不出來；
     圖示大小由 .sc-icon 的 --i 決定，<svg> 本身不用寫 width、height。
  3. 綁句：<script> 開頭 T1–T4 的句號與詞（見【綁句欄位】），下一行 P.sfx 的句號跟著改成一樣。
  4. 開場：<script> 的 ENTER 預設自動判斷（前一段也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出），通常不用改；要固定才改成 'grow' 或 'swap'。
  點數是 3：刪掉第 4 點 #xtl-p4（卡片和說明一起）、兩個圓點 #xtl-dot4 與 #xtl-don4，再刪 script 開頭的「, T4 = P.at(…)」和「第 4 點」那 4 行。
  位置、寬度、橫軸與進度比例都自動排（data-layout＋script 讀排好的位置），不用改任何數字。

  【綁句欄位】
  T1 = P.at('#131@2019')、T2 = P.at('#132@2022')、T3 = P.at('#133@2024')、T4 = P.at('#134@今年')：講到那個時間點（年份、「第一部分」「接著」「最後」後面那個詞）的時刻，
  進度走到那個點、卡片從軸上彈起、說明逐字出現；進度在 T 之前 0.5 秒出發，剛好在 T 到點。
  時間詞在句中間或句尾時一定用 @詞，不要綁句首（綁句首，卡片會比講到早 1–3 秒出現）；剛好是那句的第一個詞才寫 P.at('#132')。
  「@詞」要寫成字串字面值（P.at('#132@2022')，不要用變數組字串），build 才算得到；要再晚一點加第二個參數：P.at('#132@2022', 0.3)。
  相鄰兩點至少差 3.0 秒（到點後 0.6 秒聚焦、約 1.25 秒動完，停 1.2 秒，下一段進度提早 0.5 秒出發）；太近就綁後面一句，或拆兩段。
  audit 會比對：這一拍出現的字（年份、說明）在別句才講到時，印 ⚠ 綁句對不上，照它給的 P.at 改。

  【D 下限】
  T1 ≥ 3.1（主卡 0.3 秒長出、1.2 秒橫軸帶發光頭畫出、空心點描到 2.1 秒；進度頭在 T1 − 1.1 彈出）
  T2 ≥ T1 + 3.0；T3 ≥ T2 + 3.0；T4 ≥ T3 + 3.0
  D ≥ T4 + 5.2（講完 2.6 秒回均衡＋0.6 秒＋最後一幕停 1.5 秒＋build 加的淡出 0.5 秒；3 點時改看 D ≥ T3 + 5.2；D＝plan.json 這段的長度）
  結尾寫 P.end()（不帶參數），長度自動等於 plan.json 這段的長度；root 的 data-duration 只給單獨開檔時用。

  【版面】
  fullscreen：主卡進場看 script 的 ENTER（'grow' 0.3 秒從子母畫面長出、'swap' 0 秒由下擦開上浮）；離場由 build 處理。主卡 left 120、top 150、寬 1180（右緣 1300，避開右下子母畫面），
  標題列 128、內容區 1176×580（卡底 862，在字幕區 y 920 之上）。
  每個點 .xtl-pt＝卡片（高 256：圖示 88＋年份 72 字）＋說明（高 144＝兩行，置中、靠上），卡片和說明之間空 72（--sc-gap-lg＋--sc-gap-md）給橫軸；4 點寬 248、3 點寬 320（說明每行可到 5 字）。
  點由 #xtl-body 的 data-layout="row" data-gap="md" 排（kit/scene-layout.js，shared/style.md「版面」）：等距、整組在內容區置中（4 點：左右約 54、上下 56／52；聚焦抬起後離標題列仍 ≥ 24），不寫 left／top。
  橫軸、進度條、進度頭、圓點由 script 讀排好的位置算：橫軸在卡片底和說明頂的正中（離兩邊各 36），從第一點左緣到最後一點右緣；圓點在每張卡片的中線。
  橫軸那層 svg 加 data-layout-ignore：它刻意橫過每個點，不是連接線（不量 shared/style.md「版面」第 7 條）。
-->

  <script>
  (function () {
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-timeline'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const T1 = P.at('#131@2019'), T2 = P.at('#132@2022'), T3 = P.at('#133@2024'), T4 = P.at('#134@今年');   // 講到每個時間點的時刻
    const ENTER = P.prev() === 'fullscreen' ? 'swap' : 'grow';   // 預設看前一段（build 給）：也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出；要固定才改成 'grow' 或 'swap'
    // 0. 版面：點（卡片＋說明）由 #xtl-body 的 data-layout 排好（kit/scene-layout.js），這裡只讀，載入時算一次、每次結果相同（以下都不用改）
    const L = window.SceneLayout, BODY = document.getElementById('xtl-body');
    const PT = $q('#x-timeline .xtl-pt').map(function (el) { return L.box(el, BODY); });   // 每個點的 [x, y, 寬, 高]（內容區座標）
    const N = PT.length;                                            // 幾個點＝上面 HTML 的點數（3 或 4）
    const X = PT.map(function (b) { return b[0] + b[2] / 2; });     // 點的中心 x＝卡片中線
    const AX0 = PT[0][0], AX1 = PT[N - 1][0] + PT[N - 1][2];        // 橫軸：第一點左緣到最後一點右緣
    const AY = Math.round((L.box($q('#xtl-n1')[0], BODY)[1] + $q('#xtl-n1')[0].offsetHeight + L.box($q('#xtl-c1')[0], BODY)[1]) / 2);   // 橫軸 y：卡片底和說明頂的正中
    const F = X.map(function (x) { return (x - AX0) / (AX1 - AX0); });   // 進度條走到每一點的比例
    const HX = X.map(function (x) { return x - 12; });              // 進度頭走到每一點的 left（頭寬 24）
    const ALL = N === 3 ? '#xtl-n1, #xtl-n2, #xtl-n3' : '#xtl-n1, #xtl-n2, #xtl-n3, #xtl-n4';
    const AXIS = $q('#xtl-axis')[0], FILL = $q('#xtl-fill')[0], HEAD = $q('#xtl-head')[0];
    AXIS.setAttribute('x1', String(AX0)); AXIS.setAttribute('x2', String(AX1)); AXIS.setAttribute('y1', String(AY)); AXIS.setAttribute('y2', String(AY));
    FILL.style.left = AX0 + 'px'; FILL.style.width = (AX1 - AX0) + 'px'; FILL.style.top = (AY - 4) + 'px';
    HEAD.style.left = (AX0 - 12) + 'px'; HEAD.style.top = (AY - 12) + 'px';
    X.forEach(function (x, i) {
      $q('#xtl-dot' + (i + 1) + ', #xtl-don' + (i + 1)).forEach(function (el) { el.setAttribute('cx', String(x)); el.setAttribute('cy', String(AY)); });
    });

    // 拍 0 開場：主卡進場（看 ENTER）→ 0.5 標題逐字上浮
    if (ENTER === 'grow') P.grow('#xtl-card', 0.3);
    else { P.wipe('#xtl-card', 0, { dir: 'up', dur: 0.8 }); P.pop('#xtl-card', 0, { from: 0.96, dy: 60, dur: 0.8, ease: P.V2.EASE.in }); }
    P.chars('#xtl-card .sc-wcard__bar .sc-opt', 0.5, { stagger: 0.035 });
    // 拍 1 骨架：橫軸由左往右帶著發光頭畫出，空心點跟著彗星經過描出來（先看到有幾個點）
    P.comet('#xtl-axis', 1.2, { dur: 0.8 });
    P.stroke('.xtl-dot', 1.35, { stagger: 0.17, dur: 0.25 });
    // 拍 2 準備：軸的左端彈出進度頭（第 1 點前 1.1 秒）
    P.pop('#xtl-head', T1 - 1.1, { from: 0.2, dy: 0 });

    // 拍 3 第 1 點：進度推進（提早 0.5 出發、講到時到點）→ 點填滿、進度頭漣漪、站卡從軸上彈起 → ＋0.14 說明逐字 → ＋0.18 圖示描線
    //   → ＋0.6 聚焦（站卡放大抬起、主色亮框；前一點的站卡壓暗、說明退焦）→ ＋0.9 漂浮
    P.bar('#xtl-fill', T1 - 0.5, { from: 0, to: F[0], dur: 0.5, ease: P.V2.EASE.move });
    P.morph('#xtl-head', T1 - 0.5, { left: HX[0] }, { from: { left: AX0 - 12 }, dur: 0.5, ease: P.V2.EASE.move });
    P.stroke('#xtl-don1', T1, { dur: 0.3 });  P.ripple('#xtl-head', T1);
    P.pop('#xtl-n1', T1, { from: 0.82, dy: 60 });  P.chars('#xtl-c1', T1 + 0.14);  P.icon('#xtl-ico1', T1 + 0.18);
    P.spot('#xtl-n1', '#xtl-n1', T1 + 0.6, { scale: 1.06, lift: -10 });
    P.idle('#xtl-n1', T1 + 0.9, { y: 4, period: 2.8, until: T2 - 0.1 });
    // 拍 4 第 2 點：同拍 3
    P.bar('#xtl-fill', T2 - 0.5, { from: F[0], to: F[1], dur: 0.5, ease: P.V2.EASE.move });
    P.morph('#xtl-head', T2 - 0.5, { left: HX[1] }, { from: { left: HX[0] }, dur: 0.5, ease: P.V2.EASE.move });
    P.stroke('#xtl-don2', T2, { dur: 0.3 });  P.ripple('#xtl-head', T2);
