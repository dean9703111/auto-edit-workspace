<!-- 預設拍型：D 清單（BEATS.md §3 D；主體先出現，一個標籤一拍＝彈出＋引線走到主體＋聚焦，講到總結收） -->
<!doctype html>
<!--
  x-callout：一個主體，四周逐一貼上標籤（第二層 custom，layout: "fullscreen"；取代關鍵詞條列）

  【適用的講解】
  在講「一個主體＋ 2–4 個短名詞」：主體的毛病、零件、用途、特徵，一個詞一句或一句裡連講，
  例如「像腳架不穩造成畫面輕微晃動，或自己穿的衣服太薄有激凸問題」（主體＝手機錄的畫面）。
  中央一個大圖示圓（主體）先彈出；講到哪個詞，主體左右兩邊的標籤之一從下彈出（圖示描線、字逐字浮出），引線帶著發光頭從標籤走到主體、端點描出小圓；
  0.6 秒後這個標籤放大抬起、主色亮框，前面的標籤和引線壓暗。講到總結那一句時全部亮回。

  【不要用在哪裡】
  - 名詞之間沒有共同的主體：用 12 關鍵詞條列或 04a。
  - 每個名詞後面還有一句說明要同時看到：用 13 標題條列或 x-stack。
  - 段長不到 4 秒或只有一句字幕：維持 12（style.md「情境動畫優先」的三條判準）。
  - 超過 4 個詞：拆兩段，或用 04a。

  【要改的地方】
  1. 文字：標題列（#xcall-card 裡的 .sc-wcard__bar，≤ 10 字，寫主體與主題，例「錄影常見小毛病」）；四個標籤的 .xcall-name（≤ 4 字；字級 52，放不下就縮文案，不縮字）。
  2. 圖示：中央主體 #xcall-obj 的 svg、四個標籤的 .sc-icon。到 kit/icons.json 找名稱，把 svg 原文整段貼上。
     一個字都不改：svg 裡面 <rect>、<line>、<circle> 的 width、height、x、y、r 是形狀本身的尺寸，拿掉就畫不出來；
     圖示大小由 .sc-icon 的 --i 決定，<svg> 本身不用寫 width、height。
     主體是看得到的東西（手機、App、電腦、雲端、人）時，主體改用插圖元件（比圖示圓清楚，觀眾一眼看出標籤都在講它）：
     把 <span id="xcall-obj" class="sc-icon" data-slot>…</span> 整段換成一行
     <div id="xcall-obj" data-slot data-illus="phone" data-orient="portrait" data-screen="check" style="width:180px;height:360px"></div>
     （data-* 照 kit/illus-gallery.jpg 每格下面的寫法；寬高照畫廊比例，高 ≤ 400）。其他不用改：script 第一行會掛插圖、自動跳過圖示描線，引線照樣接到插圖外框。
  3. 綁句：<script> 開頭 T1–T4、ALL 的句號與詞（見【綁句欄位】）。
  4. 開場：<script> 的 ENTER 預設自動判斷（前一段也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出），通常不用改；要固定才改成 'grow' 或 'swap'。
  標籤是 3 個：刪掉 #xcall-t4、#xcall-d4、#xcall-lines 的 data-links 裡的「xcall-t4-xcall-obj」，再刪 script 開頭的「, T4 = P.at(…)」、「第 4 個標籤」那 3 行（右邊只剩一個，自動置中）；
  2 個：再照樣刪第 3 個（左右各一）。位置和引線自動重排，不用改數字；收尾那兩行不用改。

  【綁句欄位】
  T1 = P.at('#101@腳架不穩')、T2 = P.at('#102@衣服太薄')、T3 = P.at('#103@收音太遠')、T4 = P.at('#104@背光太暗')：講到那個詞的時刻，那個標籤彈出、引線走到主體，
  0.6 秒後聚焦到這個標籤。
  ALL = P.at('#105')：講到總結那一句，全部亮回、亮框收掉。沒有這句：改成 const ALL = T4 + 2.0;（最後一個標籤講完 2 秒收；3 個標籤時寫 T3 + 2.0）。
  名詞在句中間或句尾時一定用 @詞，不要綁句首（綁句首，標籤會比講到早 1–3 秒出現）；剛好是那句的第一個詞才寫 P.at('#102')。
  「@詞」要寫成字串字面值（P.at('#102@衣服太薄')，不要用變數組字串），build 才算得到；要再晚一點加第二個參數：P.at('#102@衣服太薄', 0.3)。
  相鄰兩個標籤至少差 2.5 秒（標籤彈出、引線 0.25 秒起走 0.5 秒、0.6 秒聚焦＝忙到 1.1 秒，再停 ≥ 1.2 秒）；太近就綁後面那個詞、延長段，或拆兩段。
  講解一口氣講完（相鄰差不到 2.5 秒、綁後面的詞也不夠）：減成 3 個或 2 個標籤（照【要改的地方】最後一段刪），沒放上去的那個交給字幕；不要把段尾延進下一個話題。
  audit 會比對：這一拍出現的字（標籤）在別句才講到時，印 ⚠ 綁句對不上，照它給的 P.at 改。

  【D 下限】
  T1 ≥ 2.0（主卡 0.3 秒長出、0.5 秒起標題逐字、主體 1.0 秒彈出、1.15 秒起圖示描線到 1.85 秒）
  T2 ≥ T1 + 2.5；T3 ≥ T2 + 2.5；T4 ≥ T3 + 2.5；ALL ≥ T4 + 2.5
  D ≥ ALL + 2.6（回均衡 0.6 秒＋最後一幕停 1.5 秒＋build 加的淡出 0.5 秒；沒有 ALL 那句時 ALL＝T4 + 2.0；D＝plan.json 這段的長度）
  結尾寫 P.end()（不帶參數），長度自動等於 plan.json 這段的長度；root 的 data-duration 只給單獨開檔時用。

  【版面】
  fullscreen：主卡進場看 script 的 ENTER（'grow' 0.3 秒從子母畫面長出、'swap' 0 秒由下擦開上浮）；離場由 build 處理。主卡 left 120、top 150、寬 1180（右緣 1300，避開右下子母畫面），
  標題列 128、內容區 1176×580（卡底 862，在字幕區 y 920 之上）。
  主體圖示圓 200、標籤 344×112（t1、t3 在左欄，t2、t4 在右欄）由 #xcall-body 的 data-layout="row" data-gap="xl" 排（kit/scene-layout.js，shared/style.md「版面」）：
  左欄、主體、右欄並排、中間各 96，兩欄裡是 data-layout="col" data-gap="md"（上下隔 24），整組在內容區置中（左右 48），不寫 left／top。
  引線由 #xcall-lines 的 data-links 自動畫：從標籤內側邊外 12 水平走到主體外框外 12（高度在標籤和主體上下重疊段的正中）；端點小圓的圓心由 script 放在主體外框邊上（貼近圓周），不寫座標。
  聚焦放大 1.05、抬起 8 後標籤離標題列仍 ≥ 24。主色亮框由 P.spot 自動加在標籤外框上，不算新元素。
-->
<!-- 靈感（只借技法，不含程式與素材；同一份清單在 NOTICE.md）：stokebuilder-356793（stokebuilder，https://x.com/stokebuilder/status/2103896101120356793）；heyiamnick-119558（heyiamnick，https://x.com/heyiamnick/status/2109174851412119558） -->
<html lang="zh-Hant">
<head><meta charset="UTF-8"><title>x-callout 主體四周貼標籤</title></head>
<body>
<template id="x-callout-template">
  <style>
    #x-callout { position: absolute; inset: 0; }
    #x-callout .fill { position: absolute; inset: 0; }
    /* 主卡：左 120、頂 150、寬 1180（右緣 1300，避開右下子母畫面）；標題列 128、內容區 1176×580（卡底 862） */
    #x-callout #xcall-card { position: absolute; left: 120px; top: 150px; width: 1180px; }
    #x-callout #xcall-card .sc-wcard__bar { height: 128px; padding: 20px 56px; }
    #x-callout #xcall-body { position: relative; width: 1176px; height: 580px; }
    /* 主體：中央一個 200 的主色圖示圓；位置由 #xcall-body 的 data-layout 排，不寫 left／top */
    #x-callout #xcall-obj { position: absolute; --d: 200px; --i: 112px; }
    /* 引線與端點：#xcall-lines 的 data-links 自動產生引線（class 用 data-link-class 的 xcall-line）；svg 大小由 kit/scene-layout.js 設成整個內容區 */
    #x-callout #xcall-lines { position: absolute; }
    #x-callout .xcall-line { fill: none; stroke: var(--sc-fs-ink); stroke-width: 4px; stroke-linecap: round; stroke-linejoin: round; }
    #x-callout .xcall-dot { fill: var(--sc-fs-card); stroke: var(--brand); stroke-width: 4px; }
    /* 標籤：344×112，圖示和名稱同一塊；位置由 data-layout 排（左欄 t1、t3，右欄 t2、t4） */
    #x-callout .xcall-tag { position: absolute; width: 344px; height: 112px; box-sizing: border-box; border: 4px solid var(--v2-node-line);
                            border-radius: 16px; background: var(--v2-node); color: var(--sc-fs-ink);
                            display: flex; align-items: center; justify-content: center; gap: 16px; white-space: nowrap; }
    #x-callout .xcall-tag .sc-icon { --d: 64px; --i: 36px; position: relative; }
    #x-callout .xcall-tag .xcall-name { position: relative; }
  </style>
  <div id="x-callout" data-composition-id="x-callout" data-width="1920" data-height="1080" data-duration="14.9"
       data-cues-sample='{"start":0,"D":14.9,"cues":{"101":[1.9,4.3],"102":[4.4,6.8],"103":[6.9,9.3],"104":[9.4,11.8],"105":[12.2,14.6]},"refs":{"#101@腳架不穩":2.1,"#102@衣服太薄":4.6,"#103@收音太遠":7.1,"#104@背光太暗":9.6}}'>
    <div class="sc-surface-fs fill"></div>
    <div id="xcall-card" class="sc-wcard">
      <div class="sc-wcard__bar"><span class="sc-opt">錄影常見小毛病</span></div>
      <div id="xcall-body" data-layout="row" data-gap="xl">
        <svg id="xcall-lines" data-links="xcall-t1-xcall-obj xcall-t2-xcall-obj xcall-t3-xcall-obj xcall-t4-xcall-obj" data-link-class="xcall-line" xmlns="http://www.w3.org/2000/svg">
          <!-- 四條引線由 data-links 產生（id xcall-t1-xcall-obj …）；端點小圓的位置由 script 算 -->
          <circle id="xcall-d1" class="xcall-dot" r="10" />
          <circle id="xcall-d2" class="xcall-dot" r="10" />
          <circle id="xcall-d3" class="xcall-dot" r="10" />
          <circle id="xcall-d4" class="xcall-dot" r="10" />
        </svg>
        <div id="xcall-left" data-slot data-layout="col" data-gap="md">
          <div id="xcall-t1" class="xcall-tag" data-slot>
            <span id="xcall-ico1" class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="m2 8 2 2-2 2 2 2-2 2" /> <path d="m22 8-2 2 2 2-2 2 2 2" /> <rect width="8" height="14" x="8" y="5" rx="1" /> </svg></span><span id="xcall-n1" class="xcall-name sc-t52 sc-w900 sc-opt">腳架不穩</span></div>
          <div id="xcall-t3" class="xcall-tag" data-slot>
            <span id="xcall-ico3" class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" /> <path d="M19 10v2a7 7 0 0 1-14 0v-2" /> <line x1="12" x2="12" y1="19" y2="22" /> </svg></span><span id="xcall-n3" class="xcall-name sc-t52 sc-w900 sc-opt">收音太遠</span></div>
        </div>
        <span id="xcall-obj" class="sc-icon" data-slot><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <rect width="14" height="20" x="5" y="2" rx="2" ry="2" /> <path d="M12 18h.01" /> </svg></span>
        <div id="xcall-right" data-slot data-layout="col" data-gap="md">
          <div id="xcall-t2" class="xcall-tag" data-slot>
            <span id="xcall-ico2" class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M20.38 3.46 16 2a4 4 0 0 1-8 0L3.62 3.46a2 2 0 0 0-1.34 2.23l.58 3.47a1 1 0 0 0 .99.84H6v10c0 1.1.9 2 2 2h8a2 2 0 0 0 2-2V10h2.15a1 1 0 0 0 .99-.84l.58-3.47a2 2 0 0 0-1.34-2.23z" /> </svg></span><span id="xcall-n2" class="xcall-name sc-t52 sc-w900 sc-opt">衣服太薄</span></div>
          <div id="xcall-t4" class="xcall-tag" data-slot>
            <span id="xcall-ico4" class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <circle cx="12" cy="12" r="4" /> <path d="M12 2v2" /> <path d="M12 20v2" /> <path d="m4.93 4.93 1.41 1.41" /> <path d="m17.66 17.66 1.41 1.41" /> <path d="M2 12h2" /> <path d="M20 12h2" /> <path d="m6.34 17.66-1.41 1.41" /> <path d="m19.07 4.93-1.41 1.41" /> </svg></span><span id="xcall-n4" class="xcall-name sc-t52 sc-w900 sc-opt">背光太暗</span></div>
        </div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    ILLUS.mount(document.getElementById('x-callout'));   // 第一行：主體換成插圖元件（data-illus）時先掛成 SVG；用圖示圓時什麼都不做
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-callout'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const T1 = P.at('#101@腳架不穩'), T2 = P.at('#102@衣服太薄'), T3 = P.at('#103@收音太遠'), T4 = P.at('#104@背光太暗');   // 講到每個標籤的時刻
    const ALL = P.at('#105');                        // 講到總結那一句（沒有這句見檔頭【綁句欄位】）
    const ENTER = P.prev() === 'fullscreen' ? 'swap' : 'grow';   // 預設看前一段（build 給）：也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出；要固定才改成 'grow' 或 'swap'
    const TAGS = '#xcall-t1, #xcall-t2, #xcall-t3, #xcall-t4';   // 全部標籤（收尾用；少的標籤選不到，不用改）
    // 端點小圓：放在每條引線（data-links 產生的）終點再往主體 --sc-link-gap，也就是主體外框邊上（載入時算一次，不用改）
    const LG = window.SceneLayout.token('link-gap');
    [1, 2, 3, 4].forEach(function (k) {
      const p = $q('#xcall-t' + k + '-xcall-obj')[0], d = $q('#xcall-d' + k)[0];
      if (!p || !d) return;
      const q = JSON.parse(p.getAttribute('data-pts')), a = q[0], b = q[q.length - 1];
      d.setAttribute('cx', String(b[0] + (b[0] > a[0] ? LG : -LG))); d.setAttribute('cy', String(b[1]));
    });

    // 拍 0 開場：主卡進場（看 ENTER）→ 標題逐字上浮；1.0 秒主體（圓或插圖）彈出、＋0.15 圖示描線（先看到主角是誰）
    if (ENTER === 'grow') P.grow('#xcall-card', 0.3);
    else { P.wipe('#xcall-card', 0, { dir: 'up', dur: 0.8 }); P.pop('#xcall-card', 0, { from: 0.96, dy: 60, dur: 0.8, ease: P.V2.EASE.in }); }
    P.chars('#xcall-card .sc-wcard__bar .sc-opt', 0.5, { stagger: 0.035 });
    P.pop('#xcall-obj', 1.0, { from: 0.7 });
    if (!$q('#xcall-obj')[0].classList.contains('il')) P.icon('#xcall-obj', 1.15);   // 插圖元件當主體：彈出就好，不描線

    // 拍 1 第 1 個標籤：從下彈出 → ＋0.12 字逐字浮出、＋0.15 圖示描線 → ＋0.25 引線帶發光頭走到主體（0.5 秒）、＋0.65 端點小圓描出
    //   → ＋0.6 聚焦（放大抬起發光）
    P.pop('#xcall-t1', T1);  P.chars('#xcall-n1', T1 + 0.12);  P.icon('#xcall-ico1', T1 + 0.15);
    P.comet('#xcall-t1-xcall-obj', T1 + 0.25, { dur: 0.5 });  P.stroke('#xcall-d1', T1 + 0.65, { dur: 0.25 });
    P.spot('#xcall-t1', '#xcall-t1', T1 + 0.6, { scale: 1.05, lift: -8, dim: 0.6 });
    // 拍 2 第 2 個標籤：同拍 1；＋0.6 聚焦移過來、上一個標籤的引線與端點退焦 0.6
    P.pop('#xcall-t2', T2);  P.chars('#xcall-n2', T2 + 0.12);  P.icon('#xcall-ico2', T2 + 0.15);
    P.comet('#xcall-t2-xcall-obj', T2 + 0.25, { dur: 0.5 });  P.stroke('#xcall-d2', T2 + 0.65, { dur: 0.25 });
    P.spot('#xcall-t1, #xcall-t2', '#xcall-t2', T2 + 0.6, { scale: 1.05, lift: -8, dim: 0.6 });  P.dim('#xcall-t1-xcall-obj, #xcall-d1', T2 + 0.6);
    // 第 3 個標籤（只有 2 個標籤時刪掉這 3 行）
    P.pop('#xcall-t3', T3);  P.chars('#xcall-n3', T3 + 0.12);  P.icon('#xcall-ico3', T3 + 0.15);
    P.comet('#xcall-t3-xcall-obj', T3 + 0.25, { dur: 0.5 });  P.stroke('#xcall-d3', T3 + 0.65, { dur: 0.25 });
    P.spot('#xcall-t1, #xcall-t2, #xcall-t3', '#xcall-t3', T3 + 0.6, { scale: 1.05, lift: -8, dim: 0.6 });  P.dim('#xcall-t2-xcall-obj, #xcall-d2', T3 + 0.6);
    // 第 4 個標籤（3 個以下時刪掉這 3 行）
    P.pop('#xcall-t4', T4);  P.chars('#xcall-n4', T4 + 0.12);  P.icon('#xcall-ico4', T4 + 0.15);
    P.comet('#xcall-t4-xcall-obj', T4 + 0.25, { dur: 0.5 });  P.stroke('#xcall-d4', T4 + 0.65, { dur: 0.25 });
    P.spot('#xcall-t1, #xcall-t2, #xcall-t3, #xcall-t4', '#xcall-t4', T4 + 0.6, { scale: 1.05, lift: -8, dim: 0.6 });  P.dim('#xcall-t3-xcall-obj, #xcall-d3', T4 + 0.6);

    // 收：總結那一句 → 回均衡（標籤全部亮回、亮框收掉，引線亮回），完成態停到段尾
    P.spot(TAGS, null, ALL, { dur: 0.6 });
    P.dim('#xcall-t1-xcall-obj, #xcall-d1, #xcall-t2-xcall-obj, #xcall-d2, #xcall-t3-xcall-obj, #xcall-d3', ALL, { to: 1 });

    P.end();                                         // 長度＝plan.json 這段的長度
    window.__timelines['x-callout'] = tl;
  })();
  </script>
</template>
</body>
</html>
