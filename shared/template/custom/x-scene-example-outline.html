<!-- 預設拍型：S 示意（BEATS.md §5；x-scene 骨架的填法示範：四個物件逐個進＋描線 → 最後一站換狀態） -->
<!doctype html>
<!--
  x-scene-example-outline：示意動畫參考——本集大綱四站（第二層 custom，layout: "fullscreen"；從 x-scene.html 骨架填 DATA 而來）

  【適用的口播】
  在介紹「這集會講哪幾件事」，而每件事都有具體的物件可以畫：「這集分成四個部分：先帶大家實際操作，再來是安裝工具，接著設定網路，最後聊 AI 開發，一次次迭代」。
  這支是 x-scene 骨架的填法示範（ep2 seg13 本集大綱改寫成 v2 動作與插圖元件）：四個物件一個一個進、物件之間描線，最後一站換狀態。

  【不要用在哪裡】
  - 大綱只有字、沒有具體物件可以畫：用 x-timeline（本集大綱時間軸）或 04a 清單。
  - 超過 4 部分：拆成兩段，或改用 04a 清單。
  - 要做新的示意動畫：從 x-scene.html 骨架複製，照分鏡填兩塊 DATA；這支只當參考（看 DATA 怎麼寫）。

  【要改的地方】
  和 x-scene.html 一樣只改兩塊 DATA（這支沒有圖示：主角是插圖元件；script 第一行的 ILLUS.mount 不要動）。
  1. DATA 1 元件清單（不寫 left／top）：四站各一個插圖元件＋標籤（≤ 10 字），寫 data-slot；xsco-lines 的 data-links 寫「xsco-s1>xsco-s2 …」，線自動畫。
  2. DATA 2 拍：每站 in＋line（上一站到這一站的線 'xsco-s1-xsco-s2'，這一站彈出後才描）＋focus；最後一拍 state 換最後一站的螢幕。
  開場：ENTER 預設自動判斷，通常不用改；標題列（≤ 10 字）在 #xsco-card 的 .sc-wcard__bar。

  【綁句欄位】
  T1 = P.at('#202@實際操作')、T2 = P.at('#203@安裝')、T3 = P.at('#204@網路')、T4 = P.at('#205@AI')、T5 = P.at('#206@迭代')：講到那一部分的詞的時刻。
  部分名在句中間或句尾時一定用 @詞，不要綁句首；「@詞」要寫成字串字面值，build 才算得到；要再晚一點加第二個參數：P.at('#203@安裝', 0.3)。
  分鏡第 0 拍（段起點，開場）不用寫 P.at：主卡進場與標題由骨架的程式做。
  audit 會比對：這一拍出現的字（標籤）在別句才講到時，印 ⚠ 綁句對不上，照它給的 P.at 改。

  【D 下限】
  T1 ≥ 2.0（主卡 0.3 秒長出、0.5 標題逐字上浮）
  T2 ≥ T1 + 2.5；T3 ≥ T2 + 2.5；T4 ≥ T3 + 2.5；T5 ≥ T4 + 2.5（每站：彈出 0.55＋0.7 描線＋聚焦，停 ≥ 1.2 秒）
  D ≥ T5 + 4.6（最後一拍講完 2 秒回均衡＋0.6 秒＋最後一幕停 1.5 秒＋build 加的淡出 0.5 秒；D＝plan.json 這段的長度）
  結尾寫 P.end()（不帶參數），長度自動等於 plan.json 這段的長度；root 的 data-duration 只給單獨開檔時用。

  【版面】
  fullscreen：主卡在 panelTop 區（x 120–1300、y 150–918），標題列 128、內容區 xsco-stage 1176×636。
  xsco-stage 是 data-layout="row" data-gap="xl"（kit/scene-layout.js，shared/style.md「版面」）：四站等距 96（中間放連接線）、底對齊（標籤同一條線）、整組置中；
  4 站一列每站寬 ≤ 200px（直的手機腳架可以更高）；連接線由 data-links 畫在元件外框邊之間（水平線在兩個插圖高度重疊段的正中）。
-->
<html lang="zh-Hant">
<head><meta charset="UTF-8"><title>x-scene-example-outline 示意動畫參考：本集大綱</title></head>
<body>
<template id="x-scene-example-outline-template">
  <style>
    #x-scene-example-outline { position: absolute; inset: 0; }
    #x-scene-example-outline .fill { position: absolute; inset: 0; }
    /* 主卡：panelTop 區（左 120、頂 150、寬 1180；標題列 128＋內容區 636＝764；卡底 918＝子母畫面本體下緣，直式 580） */
    #x-scene-example-outline #xsco-card { position: absolute; left: 120px; top: 150px; width: 1180px; }
    #x-scene-example-outline #xsco-card .sc-wcard__bar { height: 128px; padding: 20px var(--sc-pad-card); }
    #x-scene-example-outline #xsco-stage { position: relative; width: 1176px; height: var(--sc-body-h); }
    /* 連接線：xsco-lines 的 data-links 自動產生（kit/scene-layout.js；樣式是 scene.css 的 .sc-link） */
    /* 元件：插圖＋下面的標籤（xsco-side＝標籤在右邊）；位置由 xsco-stage 的 data-layout 排（kit/scene-layout.js），不寫 left／top */
    #x-scene-example-outline .xsco-it { position: absolute; display: flex; flex-direction: column; align-items: center; gap: var(--sc-gap-sm); white-space: nowrap; }
    #x-scene-example-outline .xsco-side { flex-direction: row; gap: var(--sc-gap-sm); }
    #x-scene-example-outline .xsco-lbl { display: block; font-size: 32px; line-height: 40px; }   /* 標籤 32px：退到 0.96 時仍 ≥ 30px */
  </style>
  <div id="x-scene-example-outline" data-composition-id="x-scene-example-outline" data-width="1920" data-height="1080" data-duration="20.5"
       data-cues-sample='{"start":0,"D":20.5,"cues":{"202":[2.5,5],"203":[5.5,8],"204":[8.5,11],"205":[11.5,14],"206":[14.5,17]},"refs":{"#202@實際操作":3.3,"#203@安裝":6,"#204@網路":9.1,"#205@AI":12.4,"#206@迭代":15.3}}'>
    <div class="sc-surface-fs fill"></div>
    <div id="xsco-card" class="sc-wcard">
      <div class="sc-wcard__bar"><span class="sc-opt">本集大綱</span></div>
      <div id="xsco-stage" data-layout="row" data-gap="xl">
        <svg id="xsco-lines" data-links="xsco-s1>xsco-s2 xsco-s2>xsco-s3 xsco-s3>xsco-s4" xmlns="http://www.w3.org/2000/svg"></svg>
        <!-- ══ DATA 1：元件清單（一個元件一行；只改這裡）══ -->
        <div id="xsco-s1" class="xsco-it" data-slot><div data-illus="phoneTripod" data-orient="portrait" data-screen="rec" style="width:144px;height:376px"></div><b class="xsco-lbl sc-w700">實際操作</b></div>
        <div id="xsco-s2" class="xsco-it" data-slot><div data-illus="laptop" data-screen="app" style="width:200px;height:136px"></div><b class="xsco-lbl sc-w700">安裝工具</b></div>
        <div id="xsco-s3" class="xsco-it" data-slot><div data-illus="cloud" data-arrow="down" style="width:200px;height:136px"></div><b class="xsco-lbl sc-w700">網路設定</b></div>
        <div id="xsco-s4" class="xsco-it" data-slot><div data-illus="monitor" data-screen="app" style="width:200px;height:168px"></div><b class="xsco-lbl sc-w700">AI 開發</b></div>
        <!-- ══ DATA 1 到這裡 ══ -->
      </div>
    </div>
  </div>
  <script>
  (function () {
    ILLUS.mount(document.getElementById('x-scene-example-outline'));   // 第一行：元件清單的 data-illus／data-illus-src 先換成 SVG，之後建的動畫才抓得到 .il-* 子元素
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-scene-example-outline'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });

    // ══ DATA 2：拍（一拍一行；只改這裡）══
    const T1 = P.at('#202@實際操作');
    const T2 = P.at('#203@安裝');
    const T3 = P.at('#204@網路');
    const T4 = P.at('#205@AI');
    const T5 = P.at('#206@迭代');       P.sfx('ding', '#206@迭代');
    const BEATS = [
      [T1, { in: ['xsco-s1'], focus: 'xsco-s1' }],
      [T2, { in: ['xsco-s2'], line: 'xsco-s1-xsco-s2', focus: 'xsco-s2' }],
      [T3, { in: ['xsco-s3'], line: 'xsco-s2-xsco-s3', focus: 'xsco-s3' }],
      [T4, { in: ['xsco-s4'], line: 'xsco-s3-xsco-s4', focus: 'xsco-s4' }],
      [T5, { state: ['xsco-s4', 'app', 'check'], focus: 'xsco-s4' }],
    ];
    // ══ DATA 2 到這裡；下面不用改 ══

    const ROOT = document.getElementById('x-scene-example-outline');
    const R = P.region('panelTop');   // 主卡＝全畫面主卡區（design-system §2；直式由 window.__regions 蓋過）
    const CARD = document.getElementById('xsco-card');
    CARD.style.left = R[0] + 'px'; CARD.style.top = R[1] + 'px'; if (!CARD.hasAttribute('data-wide')) CARD.style.width = R[2] + 'px';   // 全寬版型：kit 已把主卡拉到 1680，不要蓋回去
    const sel = function (id) { return '#' + id; };
    const stateSel = function (s) { return !s || s === 'blank' ? null : s === 'video' ? '.il-content' : '.il-' + s; };   // 狀態名 → 狀態群組
    // 位置由 data-layout 排好（kit/scene-layout.js；ILLUS.mount 之後自動跑一次），這裡只讀
    const L = window.SceneLayout, moved = {};
    const illusOf = function (el) { return el.querySelector('[data-illus], [data-illus-src]') || el; };

    // 拍 0 開場：主卡進場（看 ENTER）→ 標題逐字上浮
    const ENTER = P.prev() === 'fullscreen' ? 'swap' : 'grow';   // 預設看前一段（build 給）：也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出；要固定才改成 'grow' 或 'swap'
    if (ENTER === 'grow') P.grow('#xsco-card', 0.3);
    else { P.wipe('#xsco-card', 0, { dir: 'up', dur: 0.8 }); P.pop('#xsco-card', 0, { from: 0.96, dy: 60, dur: 0.8, ease: P.V2.EASE.in }); }
    P.chars('#xsco-card .sc-wcard__bar .sc-opt', 0.5, { stagger: 0.035 });
    // 拍 1 場景骨架：一開始就在的元件（class 有 xsco-pre）錯拍彈出
    P.pop('#x-scene-example-outline .xsco-pre', 1.0, { stagger: 0.12, from: 0.9, dy: 20 });

    // 每一拍：進場 → 換狀態／移動／數字 → 連接線 → 結果 → 聚焦（同一時間只有一個焦點）
    const entered = [], dimmed = [];
    Array.prototype.forEach.call(ROOT.querySelectorAll('.xsco-pre'), function (el) { entered.push('#' + el.id); });   // 場景骨架也可以被聚焦、移動
    let spotted = false;
    BEATS.forEach(function (b, k) {
      const t = b[0], o = b[1], next = k + 1 < BEATS.length ? BEATS[k + 1][0] : t + 2.0;
      const ins = (o.in || []).map(sel);
      if (ins.length) {
        P.pop(ins.join(', '), t, { stagger: 0.12, from: 0.82, dy: 28 });
        ins.forEach(function (s, i) { if (ROOT.querySelector(s + ' .xsco-lbl')) P.chars(s + ' .xsco-lbl', t + 0.14 + i * 0.12, { stagger: 0.035 }); });
        ins.forEach(function (s) { if (entered.indexOf(s) < 0) entered.push(s); });
      }
      if (o.state) {
        const s = sel(o.state[0]), a = stateSel(o.state[1]), z = stateSel(o.state[2]);
        if (a && z) P.swap(s + ' ' + a, s + ' ' + z, t + 0.15);
        else if (z) P.in(s + ' ' + z, t + 0.15);
        else if (a) P.out(s + ' ' + a, t + 0.15);
        P.ripple(s + ' .il', t + 0.2, { to: 1.5 });
      }
      if (o.move) {   // move: [元件, 目標元件, 'left'｜'right']：走到目標插圖的左（右）邊，隔 --sc-gap-md，兩個都有標籤＝插圖底對齊（標籤同一條線），否則插圖中線對齊
        const el = document.getElementById(o.move[0]), tg = document.getElementById(o.move[1]);
        const a = L.box(illusOf(el), el.offsetParent), b = L.box(illusOf(tg), el.offsetParent), ea = L.box(illusOf(el), el), g = L.token('gap-md'), lbl = (e) => !!e.querySelector(':scope > [class*="lbl"]');
        const from = moved[o.move[0]] || { left: el.offsetLeft, top: el.offsetTop };
        const x = o.move[2] === 'right' ? b[0] + b[2] + g : b[0] - g - a[2];
        const to = { left: Math.round(x - ea[0]), top: Math.round((lbl(el) && lbl(tg) ? b[1] + b[3] - a[3] : b[1] + b[3] / 2 - a[3] / 2) - ea[1]) };
        P.morph(sel(o.move[0]), t, to, { from: from, dur: 1.0, ease: P.V2.EASE.move });
        moved[o.move[0]] = to;
      }
      if (o.count) P.count(o.count[0], t + 0.2, { from: o.count[1], to: o.count[2], dur: 1.2, prefix: o.count[3] || '' });
      if (o.line) P.stroke(sel(o.line), t + 0.7, { dur: 0.5 });   // 先有節點再畫線：這一拍的元件彈出（0.55 秒）之後才描
      if (o.check) {
        const s = sel(o.check);
        P.pop(s, t, { from: 0.6, dy: 0 });
        if (ROOT.querySelector(s + ' .xsco-lbl')) P.chars(s + ' .xsco-lbl', t + 0.14, { stagger: 0.035 });
        P.check(s + ' .il', t + 0.3);
        if (entered.indexOf(s) < 0) entered.push(s);
      }
      (o.dim || []).forEach(function (id) { P.dim(sel(id), t, { to: 0.6 }); if (dimmed.indexOf(sel(id)) < 0) dimmed.push(sel(id)); });
      if (o.focus) {
        const f = sel(o.focus), fresh = (o.in || []).indexOf(o.focus) >= 0 || o.check === o.focus;
        const at = t + (fresh ? 0.6 : 0.1);
        P.spot(entered.join(', '), f, at, { scale: 1.05, lift: -8 });
        spotted = true;
      }
    });

    // 收：最後一拍講完 2 秒回均衡（全部亮回），完成態停到段尾
    const TR = BEATS[BEATS.length - 1][0] + 2.0;
    if (spotted) P.spot(entered.join(', '), null, TR, { dur: 0.6 });
    if (dimmed.length) P.dim(dimmed.join(', '), TR, { to: 1 });

    P.end();                                         // 長度＝plan.json 這段的長度
    window.__timelines['x-scene-example-outline'] = tl;
  })();
  </script>
</template>
</body>
</html>
