<!-- 預設拍型：S 示意（BEATS.md §5；x-scene 骨架的填法示範：路線與站點 → 四站物件逐個畫出＋目前位置點 → 最後一站換狀態） -->
<!doctype html>
<!--
  x-scene-example-outline：示意動畫參考——本集大綱四站（第二層 custom，layout: "fullscreen"；從 x-scene.html 骨架填 DATA 而來）

  【適用的講解】
  在介紹「這集會講哪幾件事」，而每件事都有具體的物件可以畫：「這集分成四個部分：先帶大家實際操作，再來是安裝工具，接著設定網路，最後聊 AI 開發，一次次迭代」。
  這支是 x-scene 骨架的填法示範（路線圖＋白板）：主色路線與四個站點先畫好，講到哪一部分，那一站的物件被畫出來、目前位置點沿線滑過去，最後一站換狀態。

  【不要用在哪裡】
  - 大綱只有字、沒有具體物件可以畫：用 x-timeline（路線圖）或 04a 清單。
  - 超過 4 部分：拆成兩段，或改用 04a 清單。
  - 要做新的示意動畫：從 x-scene.html 骨架複製，照分鏡填兩塊 DATA；這支只當參考（看 DATA 怎麼寫）。

  【要改的地方】
  和 x-scene.html 一樣只改兩塊 DATA（這支沒有圖示：主角是插圖元件；script 第一行的 ILLUS.mount 不要動）。
  1. DATA 1 元件清單（不寫 left／top）：四站各一個插圖元件＋標籤（≤ 10 字），class 都有 xsco-stand（站在路線上）、寫 data-slot；
     路線 xsco-floor（class 有 xsco-route、data-stops）與目前位置點 xsco-here 不用改，位置程式算。
  2. DATA 2 拍：每站 in＋focus（聚焦時目前位置點自動滑到那一站）；最後一拍 state 換最後一站的螢幕。
  開場：ENTER 預設自動判斷，通常不用改；標題列（≤ 10 字）在 #xsco-card 的 .sc-wcard__bar。

  【綁句欄位】
  T1 = P.at('#202@實際操作')、T2 = P.at('#203@安裝')、T3 = P.at('#204@網路')、T4 = P.at('#205@AI')、T5 = P.at('#206@迭代')：講到那一部分的詞的時刻。
  部分名在句中間或句尾時一定用 @詞，不要綁句首；「@詞」要寫成字串字面值，build 才算得到；要再晚一點加第二個參數：P.at('#203@安裝', 0.3)。
  分鏡第 0 拍（段起點，開場）不用寫 P.at：主卡進場與標題由骨架的程式做。
  audit 會比對：這一拍出現的字（標籤）在別句才講到時，印 ⚠ 綁句對不上，照它給的 P.at 改。

  【D 下限】
  T1 ≥ 2.0（主卡 0.3 秒長出、0.5 標題逐字上浮、1.2 路線與站點畫出 0.8 秒）
  T2 ≥ T1 + 2.5；T3 ≥ T2 + 2.5；T4 ≥ T3 + 2.5；T5 ≥ T4 + 2.5（每站：畫出 0.7＋聚焦與目前位置點滑 1 秒，停 ≥ 1.2 秒）
  D ≥ T5 + 4.6（最後一拍講完 2 秒回均衡＋0.6 秒＋最後一幕停 1.5 秒＋build 加的淡出 0.5 秒；D＝plan.json 這段的長度）
  結尾寫 P.end()（不帶參數），長度自動等於 plan.json 這段的長度；root 的 data-duration 只給單獨開檔時用。

  【版面】
  fullscreen：主卡在 panelTop 區（x 120–1300、y 150–858），標題列 128、內容區 xsco-stage 1176×580。
  xsco-stage 是 data-layout="row" data-gap="xl"（kit/scene-layout.js，shared/style.md「版面」）：四站等距 96、底對齊（標籤同一條線）、整組置中；
  4 站一列每站寬 ≤ 216px（直的手機腳架可以更高）；路線畫在標籤下面 36px，站點在每站插圖的中線。
-->
<html lang="zh-Hant">
<head><meta charset="UTF-8"><title>x-scene-example-outline 示意動畫參考：本集大綱</title></head>
<body>
<template id="x-scene-example-outline-template">
  <style>
    #x-scene-example-outline { position: absolute; inset: 0; }
    #x-scene-example-outline .fill { position: absolute; inset: 0; }
    /* 主卡：panelTop 區（左 120、頂 150、寬 1180；標題列 128＋內容區 580＝708） */
    #x-scene-example-outline #xsco-card { position: absolute; left: 120px; top: 150px; width: 1180px; }
    #x-scene-example-outline #xsco-card .sc-wcard__bar { height: 128px; padding: 20px var(--sc-pad-card); }
    #x-scene-example-outline #xsco-stage { position: relative; width: 1176px; height: 580px; }
    /* 連接線：xsco-lines 的 data-links 自動產生（kit/scene-layout.js；樣式是 scene.css 的 .sc-link） */
    /* 地面線（選用）：和內容區一樣大的 svg，線的位置由程式量 xsco-stand 元件的腳底算；data-stops 的站點是程式加的 circle */
    #x-scene-example-outline .xsco-floor { position: absolute; left: 0; top: 0; width: 1176px; height: 580px; overflow: visible; }
    #x-scene-example-outline .xsco-floor path { fill: none; stroke: var(--il-line); stroke-width: 4px; stroke-linecap: round; }
    #x-scene-example-outline .xsco-floor circle { fill: var(--v2-node); stroke: var(--il-line); stroke-width: 4px; }
    #x-scene-example-outline .xsco-route path { stroke: var(--brand); stroke-width: 10px; }   /* 路線圖：地面線 class 加 xsco-route＝主色粗線＋站點 */
    #x-scene-example-outline .xsco-route circle { stroke: var(--brand); stroke-width: 6px; }
    /* 目前位置標記（選用）：沿地面線滑到聚焦的元件下面 */
    #x-scene-example-outline .xsco-here { position: absolute; left: 0; top: 0; width: 40px; height: 40px; box-sizing: border-box; border-radius: 50%; background: var(--v2-ink); border: 8px solid var(--brand); opacity: 0; }
    /* 元件：插圖＋下面的標籤（xsco-side＝標籤在右邊）；位置由 xsco-stage 的 data-layout 排（kit/scene-layout.js），不寫 left／top */
    #x-scene-example-outline .xsco-it { position: absolute; display: flex; flex-direction: column; align-items: center; gap: var(--sc-gap-sm); white-space: nowrap; }
    #x-scene-example-outline .xsco-side { flex-direction: row; gap: var(--sc-gap-sm); }
    #x-scene-example-outline .xsco-lbl { display: block; font-size: 32px; line-height: 40px; }   /* 標籤 32px：退到 0.96 時仍 ≥ 30px */
    #x-scene-example-outline .xsco-wv { width: 216px; height: 88px; }   /* 聲紋（選用）：P.wave 自動插跳動的條 */
  </style>
  <div id="x-scene-example-outline" data-composition-id="x-scene-example-outline" data-width="1920" data-height="1080" data-duration="20.5"
       data-cues-sample='{"start":0,"D":20.5,"cues":{"202":[2.5,5],"203":[5.5,8],"204":[8.5,11],"205":[11.5,14],"206":[14.5,17]},"refs":{"#202@實際操作":3.3,"#203@安裝":6,"#204@網路":9.1,"#205@AI":12.4,"#206@迭代":15.3}}'>
    <div class="sc-surface-fs fill"></div>
    <div id="xsco-card" class="sc-wcard">
      <div class="sc-wcard__bar"><span class="sc-opt">本集大綱</span></div>
      <div id="xsco-stage" data-layout="row" data-gap="xl">
        <svg id="xsco-floor" class="xsco-floor xsco-route" data-stops data-layout-ignore xmlns="http://www.w3.org/2000/svg"><path d=""/></svg>
        <div class="xsco-here" data-layout-ignore></div>
        <!-- ══ DATA 1：元件清單（一個元件一行；只改這裡）══ -->
        <div id="xsco-s1" class="xsco-it xsco-stand" data-slot><div data-illus="phoneTripod" data-orient="portrait" data-screen="rec" style="width:136px;height:350px"></div><b class="xsco-lbl sc-w700">實際操作</b></div>
        <div id="xsco-s2" class="xsco-it xsco-stand" data-slot><div data-illus="laptop" data-screen="app" style="width:216px;height:148px"></div><b class="xsco-lbl sc-w700">安裝工具</b></div>
        <div id="xsco-s3" class="xsco-it xsco-stand" data-slot><div data-illus="cloud" data-arrow="down" style="width:216px;height:148px"></div><b class="xsco-lbl sc-w700">網路設定</b></div>
        <div id="xsco-s4" class="xsco-it xsco-stand" data-slot><div data-illus="monitor" data-screen="app" style="width:216px;height:180px"></div><b class="xsco-lbl sc-w700">AI 開發</b></div>
        <!-- ══ DATA 1 到這裡 ══ -->
      </div>
    </div>
  </div>
  <script>
  (function () {
    ILLUS.mount(document.getElementById('x-scene-example-outline'));   // 第一行：元件清單的 data-illus／data-illus-src 先換成 SVG，之後建的動畫才抓得到 .il-* 子元素
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-scene-example-outline'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });

    // ══ DATA 2：拍（一拍一行；只改這裡）══
    const T1 = P.at('#202@實際操作');
    const T2 = P.at('#203@安裝');
    const T3 = P.at('#204@網路');
    const T4 = P.at('#205@AI');
    const T5 = P.at('#206@迭代');       P.sfx('ding', '#206@迭代');
    const BEATS = [
      [T1, { in: ['xsco-s1'], focus: 'xsco-s1' }],
      [T2, { in: ['xsco-s2'], focus: 'xsco-s2' }],
      [T3, { in: ['xsco-s3'], focus: 'xsco-s3' }],
      [T4, { in: ['xsco-s4'], focus: 'xsco-s4' }],
      [T5, { state: ['xsco-s4', 'app', 'check'], focus: 'xsco-s4' }],
    ];
    // ══ DATA 2 到這裡；下面不用改 ══

    const ROOT = document.getElementById('x-scene-example-outline');
    const R = P.region('panelTop');   // 主卡＝全畫面主卡區（design-system §2；直式由 window.__regions 蓋過）
    const CARD = document.getElementById('xsco-card');
    CARD.style.left = R[0] + 'px'; CARD.style.top = R[1] + 'px'; if (!CARD.hasAttribute('data-wide')) CARD.style.width = R[2] + 'px';   // 全寬版型：kit 已把主卡拉到 1680，不要蓋回去
    const sel = function (id) { return '#' + id; };
    const stateSel = function (s) { return !s || s === 'blank' ? null : s === 'video' ? '.il-content' : '.il-' + s; };   // 狀態名 → 狀態群組
    // 位置由 data-layout 排好（kit/scene-layout.js；ILLUS.mount 之後自動跑一次），這裡只讀
    const L = window.SceneLayout, moved = {};
    const illusOf = function (el) { return el.querySelector('[data-illus], [data-illus-src]') || el; };
    const DRAW = 0.7;   // 一個插圖元件畫出來的秒數（馬克筆照筆順一筆一筆畫，P.draw）
    const drawn = function (s) { return !!ROOT.querySelector(s + ' .il'); };   // 插圖元件用畫的；不是插圖（聲紋、自己的 HTML）用彈出
    const lblAt = function (s, at) { if (ROOT.querySelector(s + ' .xsco-lbl')) P.chars(s + ' .xsco-lbl', at, { stagger: 0.035 }); };

    // 拍 0 開場：主卡進場（看 ENTER）→ 標題逐字上浮
    const ENTER = P.prev() === 'fullscreen' ? 'swap' : 'grow';   // 預設看前一段（build 給）：也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出；要固定才改成 'grow' 或 'swap'
    if (ENTER === 'grow') P.grow('#xsco-card', 0.3);
    else { P.wipe('#xsco-card', 0, { dir: 'up', dur: 0.8 }); P.pop('#xsco-card', 0, { from: 0.96, dy: 60, dur: 0.8, ease: P.V2.EASE.in }); }
    P.chars('#xsco-card .sc-wcard__bar .sc-opt', 0.5, { stagger: 0.035 });
    // 拍 1 場景骨架：地面線（畫在 xsco-stand 元件的腳底；data-stops＝每個元件下面一個站點）→ 一開始就在的元件（xsco-pre）一筆一筆畫出
    const FLOOR = ROOT.querySelector('.xsco-floor'), STANDS = Array.prototype.slice.call(ROOT.querySelectorAll('.xsco-stand'));
    const HERE = ROOT.querySelector('.xsco-here');   // 目前位置標記（選用）：聚焦到站在地上的元件時，沿地面線滑到它下面
    let fx0 = 0, fx1 = 1, here = -1;
    if (FLOOR && STANDS.length) {
      const st = FLOOR.parentNode, route = FLOOR.classList.contains('xsco-route');   // 路線圖：線畫在標籤下面（物件、站名、站點由上往下）；地面線：畫在插圖的腳底
      const bs = STANDS.map(function (el) { return L.box(illusOf(el), st); });
      const y = Math.max.apply(null, STANDS.map(function (el, i) { const b = route ? L.box(el, st) : bs[i]; return b[1] + b[3] + (route ? 36 : 0); }));
      fx0 = Math.max(24, Math.min.apply(null, bs.map(function (b) { return b[0]; })) - 48); fx1 = Math.min(st.offsetWidth - 24, Math.max.apply(null, bs.map(function (b) { return b[0] + b[2]; })) + 48);
      FLOOR.querySelector('path').setAttribute('d', 'M' + fx0 + ' ' + y + ' L' + fx1 + ' ' + y);
      if (FLOOR.hasAttribute('data-stops')) bs.forEach(function (b) {
        const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('cx', Math.round(b[0] + b[2] / 2)); c.setAttribute('cy', y); c.setAttribute('r', 12); FLOOR.appendChild(c);
      });
      if (HERE) { HERE.style.left = Math.round(fx0 - HERE.offsetWidth / 2) + 'px'; HERE.style.top = Math.round(y - HERE.offsetHeight / 2) + 'px'; }
    } else if (FLOOR) FLOOR.remove();   // 沒有站在地上的元件：不畫地面線
    if (HERE && FLOOR && STANDS.length) P.pop(HERE, 1.2, { from: 0.4, dy: 0 });   // 標記和路線一起出現在起點
    const hereTo = function (id, at) {   // 標記沿線滑到這個元件下面
      const el = document.getElementById(id);
      if (!HERE || STANDS.indexOf(el) < 0) return;
      const b = L.box(illusOf(el), FLOOR.parentNode), to = (b[0] + b[2] / 2 - fx0) / (fx1 - fx0);
      P.along(HERE, '#' + FLOOR.id + ' path', at, { from: Math.max(0, here), to: to, dur: 0.8 });
      here = to;
    };
    const PRE = Array.prototype.map.call(ROOT.querySelectorAll('.xsco-pre'), function (el) { return '#' + el.id; });
    P.draw('#xsco-floor, #x-scene-example-outline .xsco-pre .il', 1.2, { dur: 0.8 });   // 同一支筆：先地面線、再場景骨架（文件順序）
    PRE.forEach(function (s) { if (!drawn(s)) P.pop(s, 1.2, { from: 0.9, dy: 20 }); lblAt(s, 1.6); });

    // 每一拍：畫出來（或彈出）→ 換狀態／移動／數字／聲紋 → 連接線 → 結果 → 聚焦（同一時間只有一個焦點）
    const entered = PRE.slice(), dimmed = [];   // 場景骨架也可以被聚焦、移動
    let spotted = false;
    BEATS.forEach(function (b, k) {
      const t = b[0], o = b[1];
      const ins = (o.in || []).map(sel), drw = ins.filter(drawn), pops = ins.filter(function (s) { return !drawn(s); });
      const lines = o.line ? $q(sel(o.line) + ', ' + sel(o.line) + '-head') : [];   // 先有節點再畫線：同一支筆畫完這拍的元件，接著畫連接線與箭頭（0.35 秒）
      const strokes = drw.map(function (s) { return ROOT.querySelector(s + ' .il'); }).concat(lines);
      if (strokes.length) P.draw(strokes, t, { dur: DRAW * drw.length + (lines.length ? 0.35 : 0) });
      if (pops.length) P.pop(pops.join(', '), t, { stagger: 0.12, from: 0.82, dy: 28 });
      ins.forEach(function (s, i) { lblAt(s, t + 0.3 + i * 0.3); if (entered.indexOf(s) < 0) entered.push(s); });
      if (o.state) {
        const s = sel(o.state[0]), a = stateSel(o.state[1]), z = stateSel(o.state[2]);
        if (a && z) P.swap(s + ' ' + a, s + ' ' + z, t + 0.15);
        else if (z) P.in(s + ' ' + z, t + 0.15);
        else if (a) P.out(s + ' ' + a, t + 0.15);
        P.ripple(s + ' .il', t + 0.2, { to: 1.5 });
      }
      if (o.move) {   // move: [元件, 目標元件, 'left'｜'right']：走到目標插圖的左（右）邊，隔 --sc-gap-md，兩個都有標籤＝插圖底對齊（標籤同一條線），否則插圖中線對齊
        const el = document.getElementById(o.move[0]), tg = document.getElementById(o.move[1]);
        const a = L.box(illusOf(el), el.offsetParent), b = L.box(illusOf(tg), el.offsetParent), ea = L.box(illusOf(el), el), g = L.token('gap-md'), lbl = (e) => !!e.querySelector(':scope > [class*="lbl"]');
        const from = moved[o.move[0]] || { left: el.offsetLeft, top: el.offsetTop };
        const x = o.move[2] === 'right' ? b[0] + b[2] + g : b[0] - g - a[2];
        const to = { left: Math.round(x - ea[0]), top: Math.round((lbl(el) && lbl(tg) ? b[1] + b[3] - a[3] : b[1] + b[3] / 2 - a[3] / 2) - ea[1]) };
        P.morph(sel(o.move[0]), t, to, { from: from, dur: 1.0, ease: P.V2.EASE.move });
        moved[o.move[0]] = to;
      }
      if (o.count) P.count(o.count[0], t + 0.2, { from: o.count[1], to: o.count[2], dur: 1.2, prefix: o.count[3] || '' });
      if (o.wave) P.wave(sel(o.wave) + ' .xsco-wv', t + 0.2);   // 聲紋從這拍跳到段尾
      if (o.check) {
        const s = sel(o.check);
        P.pop(s, t, { from: 0.6, dy: 0 });
        lblAt(s, t + 0.14);
        P.check(s + ' .il', t + 0.3);
        if (entered.indexOf(s) < 0) entered.push(s);
      }
      (o.dim || []).forEach(function (id) { P.dim(sel(id), t, { to: 0.6 }); if (dimmed.indexOf(sel(id)) < 0) dimmed.push(sel(id)); });
      if (o.focus) {
        const f = sel(o.focus), fresh = ins.indexOf(f) >= 0 || o.check === o.focus;
        const at = t + (fresh && drw.indexOf(f) < 0 ? 0.6 : 0.1);   // 畫出來的元件一開始畫就聚焦（不放大、不上移，筆尖才對得準）；彈出的等彈完
        P.spot(entered.join(', '), f, at, { scale: 1, lift: 0 });
        hereTo(o.focus, at);
        spotted = true;
      }
    });

    // 收：最後一拍講完 2 秒回均衡（全部亮回），完成態停到段尾
    const TR = BEATS[BEATS.length - 1][0] + 2.0;
    if (spotted) P.spot(entered.join(', '), null, TR, { dur: 0.6 });
    if (dimmed.length) P.dim(dimmed.join(', '), TR, { to: 1 });

    P.end();                                         // 長度＝plan.json 這段的長度
    window.__timelines['x-scene-example-outline'] = tl;
  })();
  </script>
</template>
</body>
</html>
