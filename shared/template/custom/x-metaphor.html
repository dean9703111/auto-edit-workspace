<!-- 預設拍型：G 比喻（BEATS.md §3 G；生活物件 → 技術概念 → 一句結論，＋一句代價） -->
<!doctype html>
<!--
  x-metaphor：比喻圖解（第二層 custom，layout: "fullscreen"）

  【適用的口播】
  作者的比喻三段式：「生活物件 → 技術概念 → 一句代價／限制」。
  例：「就像工具附的使用說明書；Skill 就是寫給 AI 的說明書，AI 照著它做事；所以說明書寫錯了，AI 就照錯的做」。
  左邊是觀眾熟悉的東西，右邊是這集要教的概念，下面兩句是結論與代價。講到哪一個，那一個就是畫面上唯一的焦點。

  【不要用在哪裡】
  - 只有「一句定義」沒有比喻：用 06 概念字卡。
  - 比喻有兩個以上的生活物件、或要比較兩個概念：用 05 兩側或 04b 對照。
  - 沒有「代價／限制」那一句：刪掉最下面的警示條（#xmeta-warn）、script 開頭的「, T4 = P.at(…)」與「P.sfx('alert', …)」、「拍 4」那 5 行，收尾的 T4 改 T3；卡片大小不變，其他位置不用動。
  - 流程、數字、前後對比：用 x-process、x-numbers、x-before-after。

  【要改的地方】
  1. 文字：標題列（≤ 10 字）、左右兩個名稱（≤ 6 字）、結論句（≤ 10 字，關鍵詞包在 #xmeta-kw 裡）、限制句（≤ 10 字，壞的那個詞包在 #xmeta-bad 裡）。
     完整的句子留給字幕，畫面只放關鍵詞。放不下就縮文案，不縮字。
  2. 圖示：#xmeta-icoL（生活物件）、#xmeta-icoR（技術概念）、#xmeta-icoW（警示）裡的 svg。
     到 kit/icons.json 找名稱，把 svg 原文整段貼上。
     一個字都不改：svg 裡面 <rect>、<line>、<circle> 的 width、height、x、y、r 是形狀本身的尺寸，拿掉就畫不出來；
     圖示大小由 .sc-icon 的 --i 決定，<svg> 本身不用寫 width、height。
  3. 綁句：<script> 開頭 T1–T4 的句號與詞（見【綁句欄位】），下一行 P.sfx 的句號跟著改成一樣。
  4. 開場：<script> 的 ENTER 預設自動判斷（前一段也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出），通常不用改；要固定才改成 'grow' 或 'swap'。

  【綁句欄位】
  T1 = P.at('#22@說明書')：講到生活物件（左邊名稱）的時刻：左框彈出、圖示描線、名稱逐字浮出；＋0.3 兩框之間出現流動的虛線（預告「右邊還有一個」）；＋0.6 聚焦。
  T2 = P.at('#23@Skill')：講到技術概念（右邊名稱）的時刻：提早 0.6 秒箭頭帶著發光頭從左框描過來，右框彈出、圖示描線＋漣漪；＋0.6 聚焦右框、左框變「走過」。
  T3 = P.at('#24@做事')：講到結論關鍵詞的時刻：結論句逐字浮出、＋0.5 關鍵詞螢光筆；＋0.6 上面兩框一起退焦。
  T4 = P.at('#25@寫錯')：講到代價／限制關鍵詞的時刻：警示條彈出、警示圖示描線、限制句逐字浮出、＋0.55 壞的那個詞重拍；＋0.6 結論句退焦。
  名稱、關鍵詞在句中間或句尾時一定用 @詞，不要綁句首；剛好是那句的第一個詞才寫 P.at('#22')。
  「@詞」要寫成字串字面值（P.at('#23@Skill')，不要用變數組字串），build 才算得到；要再晚一點加第二個參數：P.at('#23@Skill', 0.3)。
  物件和概念在同一句、相隔不到 2.9 秒：T2 綁後面一句講到概念的詞，或拆成兩段。
  audit 會比對：這一拍出現的字（名稱、結論、限制）在別句才講到時，印 ⚠ 綁句對不上，照它給的 P.at 改。

  【D 下限】
  T1 ≥ 2.0（主卡 0.3 秒長出、0.5 秒標題逐字，1.3 秒標題到位，再停 0.6 秒）
  T2 ≥ T1 + 2.9（聚焦到 +1.1 秒＋新資訊停 1.2 秒＋箭頭提早 0.6 秒出發）
  T3 ≥ T2 + 2.5（聚焦到 +1.1 秒＋停 1.2 秒＋鏡頭提早 0.2 秒出發）
  T4 ≥ T3 + 2.5（結論逐字與退焦到 +1.0 秒＋停 1.2 秒）
  D ≥ T4 + 5.2（講完 2.6 秒回均衡＋0.6 秒＋最後一幕停 1.5 秒＋build 加的淡出 0.5 秒；D＝plan.json 這段的長度）
  結尾寫 P.end()（不帶參數），長度自動等於 plan.json 這段的長度；root 的 data-duration 只給單獨開檔時用。

  【版面】
  fullscreen：主卡進場看 script 的 ENTER（'grow' 0.3 秒從子母畫面長出、'swap' 0 秒由下擦開上浮）；離場由 build 處理。主卡 left 120、top 150、寬 1180（右緣 1300，避開右下子母畫面），
  標題列 128（左右內距 --sc-pad-card）、內容區 1176×636（卡底 918＝子母畫面本體下緣，在字幕區 y 920 之上）。
  位置由 kit/scene-layout.js 排（shared/style.md「版面」），不寫 left／top：內容區 #xmeta-body 是 data-layout="col" data-gap="md"，
  由上往下是兩框一組 #xmeta-pair、結論句（高 88，寬跟著字）、警示條 600×112，各自水平置中、整組上下置中（內距 ≥ 72／64（情境動畫））。
  #xmeta-pair 是 data-layout="row" data-gap="xxl"（左右兩框 360×240，中間 160 放比喻箭頭）；兩框和箭頭包在 #xmeta-pair（結論時一起退焦）。聚焦時放大抬起，離標題列仍 ≥ 48。
  箭頭由 #xmeta-arrow 的 data-links="xmeta-boxL>xmeta-boxR" 自動畫在兩框之間（中線高度、端點離框 12；線的 path id＝xmeta-boxL-xmeta-boxR，
  箭頭頭是另一條 xmeta-boxL-xmeta-boxR-head，線描完時淡入）；
  虛線預告層由 script 從箭頭複製，不用手寫。
  鏡頭只跟到結論句（拍 4 不再往下帶）：帶到警示條時整張卡會往上偏 35 px，垂直不平衡。
-->
<html lang="zh-Hant">
<head><meta charset="UTF-8"><title>x-metaphor 比喻圖解</title></head>
<body>
<template id="x-metaphor-template">
  <style>
    #x-metaphor { position: absolute; inset: 0; }
    #x-metaphor .fill { position: absolute; inset: 0; }
    /* 主卡：左 120、頂 150、寬 1180（右緣 1300，避開右下子母畫面）；標題列 128、內容區 1176×636（卡底 918） */
    #x-metaphor #xmeta-card { position: absolute; left: 120px; top: 150px; width: 1180px; }
    #x-metaphor #xmeta-card .sc-wcard__bar { height: 128px; padding: 20px var(--sc-pad-card); }
    /* 內容區：data-layout="col"（kit/scene-layout.js）由上往下排兩框一組、結論句、警示條；不寫 left／top */
    #x-metaphor #xmeta-body { position: relative; width: 1176px; height: var(--sc-body-h); }
    /* 兩框＋箭頭一組（結論那一拍一起退焦）：data-layout="row"，大小由 helper 照兩框算；箭頭 svg 由 data-links 產生 */
    #x-metaphor #xmeta-pair { position: absolute; }
    #x-metaphor .xmeta-line { fill: none; stroke: var(--brand); stroke-width: 6px; stroke-linecap: round; stroke-linejoin: round; }
    /* 虛線預告層：script 載入時從箭頭複製一份（不用手寫），講到概念之前一直往前流 */
    #x-metaphor .xmeta-ghost { fill: none; stroke: var(--v2-line); stroke-width: 4px; stroke-linecap: round; stroke-dasharray: 2 14; }
    /* 左右兩個框：同高（240）、同中線（y 176）；圖示和名稱同一塊；主色亮框由 P.spot 自動加（.sc-spot） */
    #x-metaphor .xmeta-box { position: absolute; width: 360px; height: 240px; box-sizing: border-box; border: 4px solid var(--v2-node-line);
                             border-radius: 24px; background: var(--v2-node); color: var(--sc-fs-ink);
                             display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; white-space: nowrap; }
    #x-metaphor .xmeta-box .sc-icon { --d: 112px; --i: 64px; position: relative; }
    #x-metaphor .xmeta-box .xmeta-name { position: relative; }
    /* 結論句：整列置中，逐字浮出；關鍵詞 #xmeta-kw 之後掃螢光筆 */
    #x-metaphor #xmeta-sum { position: absolute; width: max-content; height: 88px; text-align: center; white-space: nowrap; color: var(--sc-fs-ink); }
    /* 限制句：警示條（警示色框＋和框同色的底：淺色、深色主題都讀得到），圖示和文字同一條 */
    #x-metaphor #xmeta-warn { position: absolute; width: 600px; height: 112px; box-sizing: border-box;
                              border: 4px solid var(--sc-warn); border-radius: 20px; background: var(--v2-node); color: var(--sc-fs-ink);
                              display: flex; align-items: center; justify-content: center; gap: 24px; white-space: nowrap; }
    #x-metaphor #xmeta-warn .sc-icon { --d: 72px; --i: 40px; background: var(--sc-warn); color: var(--sc-fs-ink); }
    /* 壞的那個詞：inline-block 才吃得到重拍的縮放 */
    #x-metaphor #xmeta-bad { display: inline-block; color: var(--sc-warn-kw); }
  </style>
  <div id="x-metaphor" data-composition-id="x-metaphor" data-width="1920" data-height="1080" data-duration="15.4"
       data-cues-sample='{"start":0,"D":15.4,"cues":{"22":[2,4.8],"23":[5,7.4],"24":[7.6,9.9],"25":[10.1,12.7]},"refs":{"#22@說明書":2,"#23@Skill":5,"#24@做事":7.6,"#25@寫錯":10.1}}'>
    <div class="sc-surface-fs fill"></div>
    <div id="xmeta-card" class="sc-wcard">
      <div class="sc-wcard__bar"><span class="sc-opt">Skill 的比喻</span></div>
      <div id="xmeta-body" data-layout="col" data-gap="md">
        <div id="xmeta-pair" data-slot data-layout="row" data-gap="xxl">
          <svg id="xmeta-arrow" data-links="xmeta-boxL>xmeta-boxR" data-link-class="xmeta-line" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="xmeta-boxL" class="xmeta-box" data-slot>
            <span id="xmeta-icoL" class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7v14" /><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" /></svg></span><span class="xmeta-name sc-t52 sc-w900 sc-opt">使用說明書</span></div>
          <div id="xmeta-boxR" class="xmeta-box" data-slot>
            <span id="xmeta-icoR" class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z" /><path d="M20 3v4" /><path d="M22 5h-4" /><path d="M4 17v2" /><path d="M5 18H3" /></svg></span><span class="xmeta-name sc-t52 sc-w900 sc-opt">Skill</span></div>
        </div>
        <div id="xmeta-sum" class="sc-t64 sc-w900" data-slot>AI 照<span id="xmeta-kw" class="sc-kw">說明書</span>做事</div>
        <div id="xmeta-warn" data-slot>
          <span id="xmeta-icoW" class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></svg></span><span id="xmeta-wtext" class="sc-t52 sc-w900 sc-opt"><span id="xmeta-bad">寫錯</span>了，照錯做</span></div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-metaphor'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const T1 = P.at('#22@說明書'), T2 = P.at('#23@Skill'), T3 = P.at('#24@做事'), T4 = P.at('#25@寫錯');   // 講到物件／概念／結論／限制的時刻

    P.sfx('alert', '#25@寫錯');   // 限制那一拍一顆 alert（句號和上一行一樣）
    const ENTER = P.prev() === 'fullscreen' ? 'swap' : 'grow';   // 預設看前一段（build 給）：也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出；要固定才改成 'grow' 或 'swap'
    const BOX = '#xmeta-boxL, #xmeta-boxR';

    // 0. 箭頭（data-links 產生，SceneMotion 建立時已畫好）複製一份虛線預告層（只在載入時建 DOM，每次結果相同）
    ['#xmeta-boxL-xmeta-boxR'].forEach(function (id) {
      var p = $q(id)[0], g = p.cloneNode(false); g.removeAttribute('id'); g.setAttribute('class', 'xmeta-ghost'); p.parentNode.insertBefore(g, p.parentNode.firstChild);
    });

    // 拍 0 開場：主卡進場（看 ENTER）→ 標題逐字上浮
    if (ENTER === 'grow') P.grow('#xmeta-card', 0.3);
    else { P.wipe('#xmeta-card', 0, { dir: 'up', dur: 0.8 }); P.pop('#xmeta-card', 0, { from: 0.96, dy: 60, dur: 0.8, ease: P.V2.EASE.in }); }
    P.chars('#xmeta-card .sc-wcard__bar .sc-opt', 0.5, { stagger: 0.035 });

    // 拍 1 生活物件：鏡頭帶過去（提早 0.2）→ 左框彈出、＋0.14 名稱逐字、＋0.18 圖示描線 → ＋0.3 虛線預告淡入、一直往前流 → ＋0.6 聚焦
    P.cam('#xmeta-card', T1 - 0.2, { to: '#xmeta-boxL', k: 0.12, scale: 1.04, dur: 0.9 });
    P.pop('#xmeta-boxL', T1, { from: 0.82, dy: 40 });
    P.chars('#xmeta-boxL .xmeta-name', T1 + 0.14);
    P.icon('#xmeta-icoL', T1 + 0.18);
    P.in('.xmeta-ghost', T1 + 0.3);
    P.flow('.xmeta-ghost', T1 + 0.3);
    P.spot('#xmeta-boxL', '#xmeta-boxL', T1 + 0.6, { scale: 1.06, lift: -10 });
    // 拍 2 技術概念：提早 0.6 秒箭頭（data-links 產生；箭頭頭在線描完時淡入）帶發光頭描過去 → 右框彈出、名稱逐字、圖示描線＋漣漪 → ＋0.6 聚焦右框、左框「走過」
    P.comet('#xmeta-boxL-xmeta-boxR', T2 - 0.6, { dur: 0.5 });
    P.cam('#xmeta-card', T2 - 0.2, { to: '#xmeta-boxR', k: 0.12, scale: 1.04, dur: 0.9 });
    P.pop('#xmeta-boxR', T2, { from: 0.82, dy: 40 });
    P.chars('#xmeta-boxR .xmeta-name', T2 + 0.14);
    P.icon('#xmeta-icoR', T2 + 0.18);
    P.ripple('#xmeta-icoR', T2 + 0.05, { to: 2.4 });
    P.spot(BOX, '#xmeta-boxR', T2 + 0.6, { scale: 1.06, lift: -10, done: '#xmeta-boxL' });
    // 拍 3 結論：鏡頭帶到結論句 → 逐字浮出 → ＋0.5 關鍵詞螢光筆 → ＋0.6 兩框收回焦點、整組退焦
    P.cam('#xmeta-card', T3 - 0.2, { to: '#xmeta-sum', k: 0.12, scale: 1.04, dur: 0.9 });
    P.chars('#xmeta-sum', T3);
    P.marker('#xmeta-kw', T3 + 0.5);
    P.spot(BOX, null, T3 + 0.6, { dur: 0.5 });
    P.dim('#xmeta-pair', T3 + 0.6, { to: 0.55 });
    // 拍 4 代價／限制（鏡頭留在結論句）：彈出、＋0.14 限制句逐字、＋0.18 警示圖示描線 → ＋0.55 壞的詞重拍 → ＋0.6 結論句退焦
    P.pop('#xmeta-warn', T4, { from: 0.82, dy: 40 });
    P.chars('#xmeta-wtext', T4 + 0.14);
    P.icon('#xmeta-icoW', T4 + 0.18);
    P.punch('#xmeta-bad', T4 + 0.55, { scale: 1.12 });
    P.dim('#xmeta-sum', T4 + 0.6, { to: 0.6 });

    // 收：最後一拍講完 2.6 秒回均衡（全部亮回、鏡頭回正），完成態停到段尾
    const TR = T4 + 2.6;
    P.spot(BOX, null, TR, { dur: 0.6 });
    P.dim('#xmeta-pair, #xmeta-sum', TR, { to: 1, dur: 0.6 });
    P.cam('#xmeta-card', TR, { x: 0, y: 0, scale: 1, dur: 0.6 });

    P.end();                                         // 長度＝plan.json 這段的長度
    window.__timelines['x-metaphor'] = tl;
  })();
  </script>
</template>
</body>
</html>
