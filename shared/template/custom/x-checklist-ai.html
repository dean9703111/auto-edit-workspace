<!doctype html>
<!--
  x-checklist-ai：AI 一條一條做完的清單（第二層 custom，layout: "fullscreen"；x-checklist 的變體：轉圈 → 打勾 → 結果）

  【適用的講解】
  在講「交給 AI（或工具）跑的一串工作」，2–4 項、每項有一個結果：「AI 先讀完逐字稿、找出重講的地方、列出剪輯清單，最後產生字幕」。
  畫面一開始就看得到每一項要做什麼，目前在做的那一列的圈圈在轉（後面的列是灰色虛線圈在等）；講到哪一項：那一列的圈圈換成打勾、
  右邊跳出結果（例「12 處」），下一列開始轉；底下進度條和「2 / 4」跟著前進；講到「全部好了」時全部亮回、進度條換成完成色。

  【不要用在哪裡】
  - 人自己要做的準備、要確認的事（沒有「機器在跑」的感覺）：用 x-checklist。
  - 回顧剛剛講過的重點（總結、回顧）：用 11 總結字卡。
  - 有先後順序、每一步是一個動作的流程：用 x-process 或 04c（流程的站不打勾）。
  - 是警告、注意事項：用 x-warnings 或 07 tone: warn。
  - 超過 4 項：拆兩段，或用 04a。只有 1 項：不下卡。

  【要改的地方】
  1. 文字：標題列（≤ 10 字）、四個 .xcai-t 的項目文字（每項 ≤ 10 字，動詞放前面）、四個 .xcai-res 的結果（≤ 6 字，數字＋單位最好，例「12 處」）。
     放不下就縮文案，不縮字。這支沒有圖示（圈圈和勾就是圖示）。
  2. 綁句：<script> 開頭 T1–T4、ALL 的句號與詞（見【綁句欄位】），下一行 P.sfx 的句號跟著改成一樣。
  3. 開場：<script> 的 ENTER 預設自動判斷（前一段也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出），通常不用改；要固定才改成 'grow' 或 'swap'。
  項數是 3：刪掉第 4 列（#xcai-r4 整個 div）、script 開頭的「, T4 = P.at(…)」、ROWS 裡的「, #xcai-r4」和「第 4 項」那 6 行，
  收尾的 now4 改 now3、第 3 項那組的 until 改 ALL；2 項照這樣再刪第 3 項。進度條的分母、「/ 4」的數字會自動跟著列數變，其他不用改。

  【綁句欄位】
  T1 = P.at('#252@逐字稿')、T2 = P.at('#253@重講')、T3 = P.at('#254@剪輯清單')、T4 = P.at('#255@字幕')：講到那一項「項目詞」的時刻，
  那一列的圈圈停下、換成打勾，結果逐字跳出、進度前進一格，下一列開始轉。項目字從一開始就看得到（AI 的待辦清單），不用綁。
  ALL = P.at('#256')：講到「全部完成／都好了」那一句，全部亮回、進度條換成完成色，配一顆 success（P.sfx('success', '#256')，句號一起改）。
  沒有這句：ALL 改成 P.at('#255@字幕', 2.5)（最後一項講完 2.5 秒收），P.sfx 那一行改成 P.sfx('success', '#255@字幕', 2.5)。
  項目詞在句中間或句尾時一定用 @詞，不要綁句首（綁句首，字會比講到早 1–3 秒出來）；項目詞剛好是那句的第一個詞才寫 P.at('#253')。
  「@詞」要寫成字串字面值（P.at('#253@重講')，不要用變數組字串），build 才算得到；要再晚一點加第二個參數：P.at('#253@重講', 0.3)。
  相鄰兩項至少差 2.5 秒（打勾、結果逐字、進度條 0.6 秒＝忙到 0.9 秒，再停 ≥ 1.2 秒，取共同規則 2.5；轉圈是背景的微動，不算）；太近就綁後面一句，或把兩項合併成一項。
  audit 會比對：這一拍出現的字（項目）在別句才講到時，印 ⚠ 綁句對不上，照它給的 P.at 改。

  【D 下限】
  T1 ≥ 2.4（主卡 0.3 秒長出、0.5 秒起標題逐字、四列 1.0 秒起錯拍上浮到 1.85 秒、第 1 列 1.6 秒開始轉）
  T2 ≥ T1 + 2.5；T3 ≥ T2 + 2.5；T4 ≥ T3 + 2.5
  ALL ≥ T4 + 2.5
  D ≥ ALL + 2.6（回均衡與完成色 0.6 秒＋最後一幕停 1.5 秒＋build 加的淡出 0.5 秒；D＝plan.json 這段的長度）
  結尾寫 P.end()（不帶參數），長度自動等於 plan.json 這段的長度；root 的 data-duration 只給單獨開檔時用。

  【版面】
  fullscreen：主卡進場看 script 的 ENTER（'grow' 0.3 秒從子母畫面長出、'swap' 0 秒由下擦開上浮）；離場由 build 處理。主卡 left 120、top 150、寬 1180（右緣 1300），
  標題列 128、內容區 1176×580（卡底 862）。四列（寬 1080、高 80、圓角 20）和進度區（寬 1064、高 72）由 #xcai-body 的 data-layout="col" data-gap="md" 排
  （kit/scene-layout.js，shared/style.md「版面」）：由上往下等距 24、中線對齊、整組在內容區置中（4 項：上下 48／44；第 1 列聚焦抬起後離標題列仍 ≥ 24），
  項數改了自動重排，不寫 left／top。列內左內距 28：狀態圈 56×56（轉圈、打勾同一格）→ 間距 32 → 項目字（52 字）→ 右邊結果（主色 52 字，靠右）。目前這一項的淡色底（.xcai-now）和主色亮框（P.spot 自動加）疊在列上，不算新元素。
  進度區：軌道寬 800、高 24（進度區裡 y 24–48）；計數寬 224 靠右。項目字放不下就縮文案，不縮字。
  靈感（只借技法）：Vincentwei1021/video-shotcraft 的 sc-ai-stream-response（Apache-2.0，只看效果）；koushikde-937635／_koushikde_／https://x.com/_koushikde_/status/2105730717455937635；mattbean-917572／mattbean／https://x.com/mattbean/status/2103146389412917572；n01ennn-597182／N01ennn／https://x.com/N01ennn/status/2108520767092597182
-->

    const ROWS = '#xcai-r1, #xcai-r2, #xcai-r3, #xcai-r4';   // 全部的列（3 項時拿掉 r4）
    const N = $q('#x-checklist-ai .xcai-row').length;    // 幾項＝上面 HTML 的列數，不用改

    // 拍 0 開場：主卡進場（看 ENTER）→ 標題逐字上浮
    if (ENTER === 'grow') P.grow('#xcai-card', 0.3);
    else { P.wipe('#xcai-card', 0, { dir: 'up', dur: 0.8 }); P.pop('#xcai-card', 0, { from: 0.96, dy: 60, dur: 0.8, ease: P.V2.EASE.in }); }
