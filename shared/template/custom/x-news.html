<!-- 預設拍型：E 數字（BEATS.md §3 E；新聞包裝：快訊標籤＋標題條，講到數字時大數字卡翻起來、講到變化時走勢卡翻起來畫線，最後亮出來源） -->
<!doctype html>
<!--
  x-news：新聞快訊（第二層 custom，layout: "fullscreen"）

  【適用的口播】
  在轉述一則新聞、公告、官方數據，有一個大數字和一段變化：「YouTube 說 Shorts 的觀看次數是去年的兩倍，而且這半年一路往上，這是官方部落格公布的」。
  沒有主卡：左上的主色「快訊」標籤翻起來、深色標題條由左擦開、標題逐字 → 講到數字時，左邊大數字卡翻起來、數字從 0 數上去、音效 impact →
  講到變化時，右邊走勢卡翻起來、折線一路畫上去、終點亮起漲幅 → 講到出處時，最下面的來源列擦開。

  【不要用在哪裡】
  - 不是新聞、公告或別人公布的數據（是自己的經驗、自己的頻道數字）：用 x-numbers 或 x-trend。
  - 只有一個數字、沒有變化：刪掉走勢卡（見【要改的地方】第 4 點），或用 04e。
  - 數字超過兩個：拆兩段。

  【要改的地方】
  1. 文字：快訊標籤 #xnews-tag（≤ 2 字）、標題條 #xnews-htext（≤ 14 字）、大數字卡的說明 #xnews-bl（≤ 8 字）、單位 #xnews-unit（≤ 2 字）、
     下面那行 #xnews-bs（≤ 6 字）、走勢卡的標題 #xnews-rl（≤ 6 字）、漲幅 #xnews-rv（≤ 5 字）、來源列 #xnews-stext（≤ 24 字）。
  2. 數字：script 的 P.count 那一行的 to（大數字）；折線 #xnews-line 與底下的面 #xnews-area 的點（viewBox 508×220，左下 0,220，往右上是漲；
     兩條的點要一樣，面最後多「L500 220 L8 220 Z」），終點圓 #xnews-dot 放在最後一點。
  3. 圖示：標籤的 newspaper、走勢卡的 trending-up。到 kit/icons.json 找名稱，把 svg 原文整段貼上。
     一個字都不改：svg 裡面 <rect>、<line>、<circle> 的 width、height、x、y、r 是形狀本身的尺寸，拿掉就畫不出來；
     圖示大小由 .sc-icon 的 --i 決定，<svg> 本身不用寫 width、height。
  4. 綁句：<script> 開頭 T1–T3 的句號與詞（見【綁句欄位】），P.sfx 的句號跟著 T1 改。
     沒有走勢：刪掉 #xnews-trend、const T2 那一行和「拍 2」那一組，大數字卡改寬 1180。沒有出處：刪掉 #xnews-src、const T3 和「拍 3」那 1 行。

  【綁句欄位】
  T1 = P.at('#372@兩倍')：講到大數字的時刻，大數字卡從平躺翻起來（0.6 秒）、數字 0.8 秒數上去；音效 impact。
  T2 = P.at('#373@半年')：講到變化的時刻，走勢卡翻起來，0.4 秒起折線 1.0 秒畫上去、面淡入，畫完終點圓彈出、漲幅彈出。
  T3 = P.at('#374@官方')：講到出處的時刻，來源列由左擦開。
  詞在句中間或句尾時一定用 @詞，不要綁句首；剛好是那句的第一個詞才寫 P.at('#373')。
  「@詞」要寫成字串字面值（P.at('#373@半年')，不要用變數組字串），build 才算得到；要再晚一點加第二個參數：P.at('#373@半年', 0.3)。
  audit 會比對：這一拍出現的字在別句才講到時，印 ⚠ 綁句對不上，照它給的 P.at 改。

  【D 下限】
  T1 ≥ 2.2（0.5 秒快訊標籤翻起來、0.7 秒標題條擦開、0.9 秒起標題逐字）
  T2 ≥ T1 + 2.4（翻起來 0.6 秒、數字數到 +1.0 秒，停 1.2 秒；留 0.2 秒餘裕）
  T3 ≥ T2 + 3.1（折線畫到 +1.4 秒、終點與漲幅彈到 +1.9 秒，停 1.2 秒）
  D ≥ T3 + 2.8（擦開 0.5 秒＋最後一幕停 1.5 秒＋build 加的淡出 0.5 秒，留 0.3 秒餘裕；D＝plan.json 這段的長度）
  結尾寫 P.end()（不帶參數），長度自動等於 plan.json 這段的長度；root 的 data-duration 只給單獨開檔時用。

  【版面】
  fullscreen、沒有主卡（新聞包裝本身就是畫面）；全部在 x 120–1300、y 150–850 裡（右下子母畫面 x 1424 起）。
  第一列 y 160–260：快訊標籤 232×100（主色）＋標題條 948×100（深色，右緣 1300）。
  中間 y 300–700：大數字卡 560×400（left 120）、走勢卡 588×400（left 712），白底細框；翻起來的軸是卡的底邊。
  最下面 y 740–836：來源列（淡主色底、高 96、寬照字）。
-->
<html lang="zh-Hant">
<head><meta charset="UTF-8"><title>x-news 新聞快訊</title></head>
<body>
<template id="x-news-template">
  <style>
    #x-news { position: absolute; inset: 0; }
    #x-news .fill { position: absolute; inset: 0; }
    /* 第一列：快訊標籤＋標題條 */
    #x-news #xnews-tag { position: absolute; left: 120px; top: 160px; width: 232px; height: 100px; box-sizing: border-box; border-radius: 20px 0 0 20px;
                         background: var(--brand); color: var(--brand-ink); display: flex; align-items: center; justify-content: center; gap: 12px; white-space: nowrap; }
    #x-news #xnews-tag .sc-icon { --d: 56px; --i: 32px; position: relative; background: var(--brand-ink); color: var(--brand); }
    #x-news #xnews-head { position: absolute; left: 352px; top: 160px; width: 948px; height: 100px; box-sizing: border-box; padding: 0 40px; border-radius: 0 20px 20px 0;
                          background: var(--v2-ink); color: var(--v2-node); display: flex; align-items: center; white-space: nowrap; }
    /* 中間兩張卡：白底細框，翻起來的軸是底邊 */
    #x-news .xnews-card { position: absolute; top: 300px; height: 400px; box-sizing: border-box; padding: 40px 48px; border: 4px solid var(--v2-node-line); border-radius: 24px;
                          background: var(--v2-node); color: var(--sc-fs-ink); box-shadow: var(--v2-card-shadow); }
    #x-news #xnews-big { left: 120px; width: 560px; padding: 40px 72px; display: flex; flex-direction: column; justify-content: center; gap: 8px; white-space: nowrap; }
    #x-news #xnews-nrow { display: flex; align-items: baseline; gap: 12px; color: var(--brand); }
    #x-news #xnews-trend { left: 712px; width: 588px; display: flex; flex-direction: column; gap: 24px; }
    #x-news #xnews-rhead { height: 72px; display: flex; align-items: center; gap: 16px; white-space: nowrap; }
    #x-news #xnews-rhead .sc-icon { --d: 64px; --i: 36px; position: relative; }
    #x-news #xnews-rv { margin-left: auto; color: var(--brand); }
    #x-news #xnews-chart { display: block; width: 484px; height: 210px; overflow: visible; }
    #x-news #xnews-line { fill: none; stroke: var(--brand); stroke-width: 8px; stroke-linecap: round; stroke-linejoin: round; }
    #x-news #xnews-area { fill: var(--v2-node-tint); stroke: none; }
    #x-news #xnews-base { fill: none; stroke: var(--v2-line); stroke-width: 4px; }
    #x-news #xnews-dot { fill: var(--brand); stroke: var(--v2-node); stroke-width: 6px; }
    /* 來源列：淡主色底、寬照字 */
    #x-news #xnews-src { position: absolute; left: 120px; top: 740px; width: max-content; height: 96px; box-sizing: border-box; padding: 0 32px; border-radius: 16px;
                         background: var(--v2-node-tint); color: var(--sc-fs-ink); display: flex; align-items: center; white-space: nowrap; }
  </style>
  <div id="x-news" data-composition-id="x-news" data-width="1920" data-height="1080" data-duration="11.6"
       data-cues-sample='{"start":0,"D":11.6,"cues":{"372":[2.2,5.0],"373":[5.1,8.4],"374":[8.5,11.4]},"refs":{"#372@兩倍":2.4,"#373@半年":5.2,"#374@官方":8.6}}'>
    <div class="sc-surface-fs fill"></div>
    <div id="xnews-tag"><span id="xnews-tico" class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2" /> <path d="M18 14h-8" /> <path d="M15 18h-5" /> <path d="M10 6h8v4h-8V6Z" /> </svg></span><b class="sc-t52 sc-w900 sc-opt">快訊</b></div>
    <div id="xnews-head" data-layout-allow-slack><b id="xnews-htext" class="sc-t52 sc-w900 sc-opt">YouTube 公布 Shorts 數據</b></div>
    <div id="xnews-big" class="xnews-card" data-layout-allow-slack>
      <b id="xnews-bl" class="sc-t40 sc-w700 sc-gray sc-opt">Shorts 觀看次數</b>
      <div id="xnews-nrow"><b id="xnews-num" class="sc-t150 sc-w900">0</b><b id="xnews-unit" class="sc-t72 sc-w900 sc-opt">倍</b></div>
      <b id="xnews-bs" class="sc-t40 sc-w700 sc-opt">比去年同期</b>
    </div>
    <div id="xnews-trend" class="xnews-card">
      <div id="xnews-rhead"><span id="xnews-rico" class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" /> <polyline points="16 7 22 7 22 13" /> </svg></span><b id="xnews-rl" class="sc-t40 sc-w700 sc-opt">近 6 個月</b><b id="xnews-rv" class="sc-t52 sc-w900 sc-opt">+120%</b></div>
      <svg id="xnews-chart" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 508 220">
        <path id="xnews-base" d="M8 216 L500 216" />
        <path id="xnews-area" d="M8 196 L100 170 L190 176 L280 120 L370 96 L500 24 L500 220 L8 220 Z" />
        <path id="xnews-line" d="M8 196 L100 170 L190 176 L280 120 L370 96 L500 24" />
        <circle id="xnews-dot" cx="500" cy="24" r="14" />
      </svg>
    </div>
    <div id="xnews-src" data-snap-width><b id="xnews-stext" class="sc-t40 sc-w700 sc-opt">資料來源：YouTube 官方部落格（2026 年 10 月）</b></div>
  </div>
  <script>
  (function () {
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-news'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const T1 = P.at('#372@兩倍'), T2 = P.at('#373@半年'), T3 = P.at('#374@官方');   // 大數字／變化／出處
    P.sfx('impact', '#372@兩倍');                                                 // 大數字翻起來一顆 impact（句號和 T1 一樣）

    // 拍 0 開場：快訊標籤翻起來 → 標題條由左擦開 → 標題逐字
    P.hinge('#xnews-tag', 0.5);
    P.icon('#xnews-tico', 0.65);
    P.wipe('#xnews-head', 0.7, { dir: 'left', dur: 0.5 });
    P.chars('#xnews-htext', 0.9, { stagger: 0.03 });
    // 拍 1 大數字：卡從平躺翻起來 → 數字數上去
    P.hinge('#xnews-big', T1);
    P.count('#xnews-num', T1 + 0.2, { from: 0, to: 2, dur: 0.8 });
    // 拍 2 變化：走勢卡翻起來 → 折線畫上去、面淡入 → 終點圓與漲幅彈出
    P.hinge('#xnews-trend', T2);
    P.icon('#xnews-rico', T2 + 0.15);
    P.stroke('#xnews-line', T2 + 0.4, { dur: 1.0 });
    P.in('#xnews-area', T2 + 0.4, { dur: 1.0 });
    P.pop('#xnews-dot, #xnews-rv', T2 + 1.4, { from: 0.5, dy: 0 });
    // 拍 3 出處：來源列由左擦開
    P.wipe('#xnews-src', T3, { dir: 'left', dur: 0.5 });

    P.end();                                           // 長度＝plan.json 這段的長度
    window.__timelines['x-news'] = tl;
  })();
  </script>
</template>
</body>
</html>
