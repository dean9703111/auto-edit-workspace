<!doctype html>
<!--
  內容設計動畫的空白畫布（不是模板）：設計師子代理從這裡開始。
  畫面完全照這段內容設計，不要從 custom/x-*.html 複製或模仿。動畫照 hyperframes skill 用 GSAP 寫；和一般 HyperFrames 不同的地方看 .agents/skills/auto-edit-motion/references/design-build.md。
-->
<html lang="zh-Hant">
<head><meta charset="UTF-8"><title>x-design 內容設計動畫</title></head>
<body>
<template id="x-design-template">
  <style>
    #x-design { position: absolute; inset: 0; }
    #x-design .fill { position: absolute; inset: 0; }
    /* 占位：停點 ③ 確認鏡位腳本前，分鏡截圖顯示這段的構想。做動畫時底下那個占位元素整個刪掉，工具才知道這段做了 */
    #x-design #xd-idea { position: absolute; left: 120px; top: 300px; width: 1180px; padding: 56px; box-sizing: border-box; color: var(--sc-fs-ink); }
  </style>
  <div id="x-design" data-composition-id="x-design" data-width="1920" data-height="1080" data-duration="8">
    <div class="sc-surface-fs fill"></div>
    <div id="xd-idea" data-design-blank class="sc-wcard sc-t52 sc-w700"><span class="sc-opt">內容設計動畫（製作中）</span></div>
  </div>
  <script>
  (function () {
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-design'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });

    // 每拍：const T1 = P.at('#N@詞');（段內秒數，播放時照字幕換算）
    // 動畫：tl.from('#xd-…', { opacity: 0, y: 24, duration: 0.5, ease: 'power3.out' }, T1);
    // 音效：P.sfx('success', '#N@詞');

    P.end();
    window.__timelines['x-design'] = tl;
  })();
  </script>
</template>
</body>
</html>
