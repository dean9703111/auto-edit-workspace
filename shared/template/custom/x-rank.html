<!-- 預設拍型：E 數字（BEATS.md §3 E；排行榜：講到哪一項，那一列的長條長出來、數字數上去） -->
<!doctype html>
<!--
  x-rank：排名長條圖（第二層 custom，layout: "fullscreen"；3–5 個項目各有一個數字，照數字大小自動排名）

  【適用的講解】
  在比「誰最多」：3–5 個項目各有一個數字，要看出名次，例如「最花時間的是找 NG 要 90 分鐘，再來上字幕 60 分鐘、做字卡 50 分鐘」
  「留言最多人問的第一名是…」。項目照講的順序寫就好，畫面照數字由大到小排（第一名在最上面、主色）。
  名次徽章和空軌道一開始就在；講到哪一項，那一列的名稱擦開、長條長到比例、數字數上去。
  有結論的話（「光找 NG 就佔了一半」），講到結論時第一名那一列亮著、其他退焦，畫螢光筆。

  【不要用在哪裡】
  - 同一個量在不同時間點的變化：用 x-trend。
  - 一筆一筆加起來有合計：用 x-receipt。
  - 只有兩個數字在比：用 x-before-after、x-numbers。
  - 數字越小越好的排名（最快、最便宜）：長條會反過來，改用 04d 表格。
  - 超過 5 項：只留前 5 名。這支的項目沒有圖示（只有標題列一個）。

  【要改的地方】
  1. 文字：標題 #xrk-title（≤ 12 字）、單位 #xrk-unit（選填，≤ 4 字，例「分鐘」）；每一列的名稱 .xrk-name（≤ 6 字）、
     數字 .xrk-val（0–99999，可以有小數；只寫數字，單位寫在標題列）。
  2. 項數：3–5 列。少一列就刪掉最後那個 .xrk-row、同號的 .xrk-badge 和 .xrk-track、它的 P.wipe 那一行，還有 const 那一行對應的 T；
     #xrk-card 的 top、height 跟著改（3 列 268／472、4 列 220／568、5 列 172／664）。
  3. 圖示：標題列 #xrk-ico 的 svg。到 kit/icons.json 找名稱，把 svg 原文整段貼上。
  4. 綁句：<script> 開頭 T1–T5、TOP 的句號與詞（見【綁句欄位】），P.sfx 的句號跟著 TOP 改。
  5. 開場：<script> 的 ENTER 預設自動判斷（前一段也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出），通常不用改。

  【綁句欄位】
  T1 = P.at('#502@輸出') … T5 = P.at('#506@NG')：講到每一項的時刻（照講的順序），那一列擦開、長條 0.6 秒長到比例、數字數上去。
  TOP = P.at('#507@一半')：講到結論的時刻（選填），第一名亮著、其他退焦，第一名的數字重拍、名稱畫螢光筆；音效 impact。
  項目名稱在句中間時一定用 @詞，不要綁句首。「@詞」要寫成字串字面值，build 才算得到。

  【D 下限】
  T1 ≥ 1.5（主卡 0.3 秒長出、0.5 秒起圖示描線、標題逐字）
  T2 ≥ T1 + 2.0（一列 0.7 秒做完，停 1.2 秒）
  T3 ≥ T2 + 2.0
  T4 ≥ T3 + 2.0
  T5 ≥ T4 + 2.0
  TOP ≥ T3 + 2.0（最後一項做完再停 1.2 秒）
  TOP ≥ T4 + 2.0
  TOP ≥ T5 + 2.0
  D ≥ T3 + 3.0（最後一項 0.7 秒做完＋最後一幕停 1.5 秒＋build 加的淡出 0.5 秒；D＝plan.json 這段的長度）
  D ≥ T4 + 3.0
  D ≥ T5 + 3.0
  D ≥ TOP + 3.0
  結尾寫 P.end()（不帶參數），長度自動等於 plan.json 這段的長度；root 的 data-duration 只給單獨開檔時用。

  【版面】
  fullscreen：主卡進場看 script 的 ENTER；離場由 build 處理。主卡 #xrk-card：left 120、寬 1180（右緣 1300，避開右下子母畫面），
  5 列 top 172、高 664；4 列 top 220、高 568；3 列 top 268、高 472（在內容區 y 150–858 上下置中）。
  卡內 free：標題列 top 36（圖示圓 72 left 56、標題 52 字 left 152、單位膠囊靠右 56）；
  第 k 名那一列 top＝144＋(k−1)×96、高 72：名次徽章圓 64 left 56、名稱 44 字 left 144、軌道與長條 left 464 寬 480 高 36、數字 48 字靠右 56。
  每一列放在第幾名的位置由 script 照數字算（載入時算一次，不用改）。
-->
<html lang="zh-Hant">
<head><meta charset="UTF-8"><title>x-rank 排名長條圖</title></head>
<body>
<template id="x-rank-template">
  <style>
    #x-rank { position: absolute; inset: 0; }
    #x-rank .fill { position: absolute; inset: 0; }
    /* 主卡：左 120、寬 1180（右緣 1300）；高度跟著列數，上下置中 */
    #x-rank #xrk-card { position: absolute; left: 120px; top: 172px; width: 1180px; height: 664px; }   /* @sub n==3: #x-rank #xrk-card { position: absolute; left: 120px; top: 268px; width: 1180px; height: 472px; } @@ n==4: #x-rank #xrk-card { position: absolute; left: 120px; top: 220px; width: 1180px; height: 568px; } */
    #x-rank #xrk-ico { position: absolute; left: 56px; top: 36px; }
    #x-rank #xrk-title { position: absolute; left: 152px; top: 36px; white-space: nowrap; color: var(--sc-fs-ink); }
    #x-rank #xrk-unit { position: absolute; right: 56px; top: 36px; }
    /* 骨架：名次徽章＋空軌道（跟主卡一起出現）；第 1 名的徽章是主色 */
    #x-rank .xrk-badge { position: absolute; left: 56px; width: 64px; height: 64px; border-radius: 32px; display: grid; place-items: center;
                         background: var(--v2-node-tint); color: var(--sc-fs-ink); }
    #x-rank #xrk-g1 { background: var(--brand); color: var(--brand-ink); }
    #x-rank .xrk-track { position: absolute; left: 464px; width: 480px; height: 36px; border-radius: 6px; background: var(--sc-fs-node-line); }
    #x-rank #xrk-g1 { top: 148px; }
    #x-rank #xrk-g2 { top: 244px; }
    #x-rank #xrk-g3 { top: 340px; }
    #x-rank #xrk-g4 { top: 436px; }
    #x-rank #xrk-g5 { top: 532px; }
    #x-rank #xrk-k1 { top: 162px; }
    #x-rank #xrk-k2 { top: 258px; }
    #x-rank #xrk-k3 { top: 354px; }
    #x-rank #xrk-k4 { top: 450px; }
    #x-rank #xrk-k5 { top: 546px; }
    /* 內容列（照講的順序寫；top 由 script 照名次填）：名稱、長條、數字 */
    #x-rank .xrk-row { position: absolute; left: 144px; top: 144px; width: 980px; height: 72px; }
    #x-rank .xrk-name { position: absolute; left: 0; top: 6px; white-space: nowrap; color: var(--sc-fs-ink); }
    #x-rank .xrk-bar { position: absolute; left: 320px; top: 18px; width: 480px; height: 36px; border-radius: 6px; background: var(--v2-mute); }
    #x-rank .xrk-val { position: absolute; right: 0; top: 3px; white-space: nowrap; color: var(--sc-fs-ink); }
    #x-rank .xrk-row[data-top] .xrk-bar { background: var(--brand); }
  </style>
  <div id="x-rank" data-composition-id="x-rank" data-width="1920" data-height="1080" data-duration="16.4"
       data-cues-sample='{"start":0,"D":16.4,"cues":{"501":[0.4,1.4],"502":[1.6,3.6],"503":[3.7,5.7],"504":[5.8,7.8],"505":[7.9,9.9],"506":[10.0,12.2],"507":[12.4,16.2]},"refs":{"#502@輸出":1.8,"#503@音效":3.9,"#504@字卡":6.0,"#505@字幕":8.1,"#506@NG":10.2,"#507@一半":12.7}}'>
    <div class="sc-surface-fs fill"></div>
    <div id="xrk-card" class="sc-wcard" data-layout="free">
      <span id="xrk-ico" class="sc-icon sc-icon--72" data-fill="icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /> <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /> <path d="M4 22h16" /> <path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" /> <path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" /> <path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" /> </svg></span>
      <div id="xrk-title" class="sc-t52 sc-w900"><span class="sc-opt" data-fill="title">最花時間的步驟</span></div>
      <div id="xrk-unit" class="sc-pill"><span class="sc-opt" data-fill="unit">分鐘</span></div> <!-- @if unit -->
      <span id="xrk-g1" class="xrk-badge sc-t40 sc-w900"><span class="sc-opt">1</span></span><i id="xrk-k1" class="xrk-track" data-layout-allow-overlap></i>
      <span id="xrk-g2" class="xrk-badge sc-t40 sc-w900"><span class="sc-opt">2</span></span><i id="xrk-k2" class="xrk-track" data-layout-allow-overlap></i>
      <span id="xrk-g3" class="xrk-badge sc-t40 sc-w900"><span class="sc-opt">3</span></span><i id="xrk-k3" class="xrk-track" data-layout-allow-overlap></i>
      <span id="xrk-g4" class="xrk-badge sc-t40 sc-w900"><span class="sc-opt">4</span></span><i id="xrk-k4" class="xrk-track" data-layout-allow-overlap></i> <!-- @if n>=4 -->
      <span id="xrk-g5" class="xrk-badge sc-t40 sc-w900"><span class="sc-opt">5</span></span><i id="xrk-k5" class="xrk-track" data-layout-allow-overlap></i> <!-- @if n>=5 -->
      <div id="xrk-r1" class="xrk-row"><span class="xrk-name sc-t44 sc-w700 sc-opt" data-fill="items.1.text">輸出</span><i id="xrk-b1" class="xrk-bar"></i><span id="xrk-v1" class="xrk-val sc-t48 sc-w900 sc-mono" data-fill="items.1.value">20</span></div>
      <div id="xrk-r2" class="xrk-row"><span class="xrk-name sc-t44 sc-w700 sc-opt" data-fill="items.2.text">配音效</span><i id="xrk-b2" class="xrk-bar"></i><span id="xrk-v2" class="xrk-val sc-t48 sc-w900 sc-mono" data-fill="items.2.value">30</span></div>
      <div id="xrk-r3" class="xrk-row"><span class="xrk-name sc-t44 sc-w700 sc-opt" data-fill="items.3.text">做字卡</span><i id="xrk-b3" class="xrk-bar"></i><span id="xrk-v3" class="xrk-val sc-t48 sc-w900 sc-mono" data-fill="items.3.value">50</span></div>
      <div id="xrk-r4" class="xrk-row"><span class="xrk-name sc-t44 sc-w700 sc-opt" data-fill="items.4.text">上字幕</span><i id="xrk-b4" class="xrk-bar"></i><span id="xrk-v4" class="xrk-val sc-t48 sc-w900 sc-mono" data-fill="items.4.value">60</span></div> <!-- @if n>=4 -->
      <div id="xrk-r5" class="xrk-row"><span class="xrk-name sc-t44 sc-w700 sc-opt" data-fill="items.5.text">找 NG</span><i id="xrk-b5" class="xrk-bar"></i><span id="xrk-v5" class="xrk-val sc-t48 sc-w900 sc-mono" data-fill="items.5.value">90</span></div> <!-- @if n>=5 -->
    </div>
  </div>
  <script>
  (function () {
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-rank'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const T1 = P.at('#502@輸出'), T2 = P.at('#503@音效'), T3 = P.at('#504@字卡'), T4 = P.at('#505@字幕'), T5 = P.at('#506@NG');   // 講到每一項的時刻（照講的順序）  // @sub n==3: const T1 = P.at('#502@輸出'), T2 = P.at('#503@音效'), T3 = P.at('#504@字卡'); @@ n==4: const T1 = P.at('#502@輸出'), T2 = P.at('#503@音效'), T3 = P.at('#504@字卡'), T4 = P.at('#505@字幕');
    const TOP = P.at('#507@一半');                     // 講到結論的時刻  // @if topAt
    P.sfx('impact', '#507@一半');                      // 結論一顆音效（句號和 TOP 一樣）  // @if topAt
    const ENTER = P.prev() === 'fullscreen' ? 'swap' : 'grow';   // 預設看前一段（build 給）：也是全畫面＝'swap' 換卡不換景，其他＝'grow' 從子母畫面長出

    // 照數字排名（載入時算一次，不用改）：數字最大的那一列放到第 1 名的位置、長條換主色；長條長度＝數字 ÷ 最大值
    const ROWS = $q('.xrk-row'), TEXT = ROWS.map(function (r) { return r.querySelector('.xrk-val').textContent.trim(); });
    const VALS = TEXT.map(function (t) { return parseFloat(t) || 0; }), DEC = TEXT.map(function (t) { return (t.split('.')[1] || '').length; });
    const PEAK = Math.max.apply(null, VALS) || 1, RATIO = VALS.map(function (v) { return Math.max(0.04, v / PEAK); });
    const ORDER = VALS.map(function (v, i) { return i; }).sort(function (a, b) { return VALS[b] - VALS[a] || a - b; });   // 第 k 名是第幾列
    ORDER.forEach(function (i, k) { ROWS[i].style.top = (144 + k * 96) + 'px'; });
    ROWS[ORDER[0]].setAttribute('data-top', '');
    const BEST = '#' + ROWS[ORDER[0]].id;              // 第一名那一列
    const REST = ORDER.slice(1).map(function (i) { return '#' + ROWS[i].id; }).join(', ');   // 其他列

    // 拍 0 開場：主卡進場（看 ENTER；名次徽章和空軌道跟著主卡一起出現）→ 圖示描線、標題逐字
    if (ENTER === 'grow') P.grow('#xrk-card', 0.3);
    else { P.wipe('#xrk-card', 0, { dir: 'up', dur: 0.8 }); P.pop('#xrk-card', 0, { from: 0.96, dy: 60, dur: 0.8, ease: P.V2.EASE.in }); }
    P.icon('#xrk-ico', 0.5);
    P.chars('#xrk-title .sc-opt', 0.62, { stagger: 0.03 });

    // 拍 1–5 講到哪一項：那一列由左擦開 → ＋0.1 長條長到比例、數字數上去（0.6 秒）
    P.wipe('#xrk-r1', T1, { dir: 'left', dur: 0.4 });  P.bar('#xrk-b1', T1 + 0.1, { to: RATIO[0], dur: 0.6 });  P.count('#xrk-v1', T1 + 0.1, { from: 0, to: VALS[0], dur: 0.6, decimals: DEC[0] });
    P.wipe('#xrk-r2', T2, { dir: 'left', dur: 0.4 });  P.bar('#xrk-b2', T2 + 0.1, { to: RATIO[1], dur: 0.6 });  P.count('#xrk-v2', T2 + 0.1, { from: 0, to: VALS[1], dur: 0.6, decimals: DEC[1] });
    P.wipe('#xrk-r3', T3, { dir: 'left', dur: 0.4 });  P.bar('#xrk-b3', T3 + 0.1, { to: RATIO[2], dur: 0.6 });  P.count('#xrk-v3', T3 + 0.1, { from: 0, to: VALS[2], dur: 0.6, decimals: DEC[2] });
    P.wipe('#xrk-r4', T4, { dir: 'left', dur: 0.4 });  P.bar('#xrk-b4', T4 + 0.1, { to: RATIO[3], dur: 0.6 });  P.count('#xrk-v4', T4 + 0.1, { from: 0, to: VALS[3], dur: 0.6, decimals: DEC[3] });   // @if n>=4
    P.wipe('#xrk-r5', T5, { dir: 'left', dur: 0.4 });  P.bar('#xrk-b5', T5 + 0.1, { to: RATIO[4], dur: 0.6 });  P.count('#xrk-v5', T5 + 0.1, { from: 0, to: VALS[4], dur: 0.6, decimals: DEC[4] });   // @if n>=5

    // @if topAt {
    // 拍 結論：第一名亮著、其他列退焦 → 第一名的數字重拍、名稱畫螢光筆；完成態停到段尾
    P.dim(REST, TOP, { to: 0.5 });
    P.punch(BEST + ' .xrk-val', TOP + 0.1, { scale: 1.12 });
    P.marker(BEST + ' .xrk-name', TOP + 0.1);
    // @}

    P.end();                                           // 長度＝plan.json 這段的長度
    window.__timelines['x-rank'] = tl;
  })();
  </script>
</template>
</body>
</html>
