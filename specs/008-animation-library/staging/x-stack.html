<!doctype html>
<!--
  x-stack：架構一層一層疊上去（第二層 custom，layout: "fullscreen"）

  【適用的口播】
  在講「由下往上的組成」：3–4 層、從底層講起，每層一個名稱＋一句說明，例如「最底層是手機上的錄影 App，中間靠區網連線，最上層是電腦端的控制台」。
  畫面先畫出地基線；講到哪一層，那一層從上方落下就位（小幅、不彈），層內左邊圖示＋名稱、右邊說明；目前這一層有主色框。
  講到「這幾層合起來…」時框全部拿掉（選用）。

  【不要用在哪裡】
  - 口播從最上層往下講：用 13 標題條列或 04a（這支第 1 個講到的永遠放最底層）。
  - 各項之間沒有上下依賴、只是並列：用 13、x-callout 或 04a。
  - 有先後順序的步驟：用 x-process。
  - 超過 4 層：拆兩段。

  【要改的地方】
  1. 文字：標題列（≤ 10 字）；每層 .xstk-name 名稱（≤ 6 字）、.xstk-desc 說明（≤ 12 字，選填：不寫就刪掉那個 span，
     並在那一層的 .xstk-layer 加 data-layout-allow-slack（層要等寬，右邊是刻意留白；不加 audit 會報右側空白過多）。放不下就縮文案，不縮字。
  2. 圖示：每層的 .sc-icon（#xstk-ico1–4）。到 kit/icons.json 找名稱，把 svg 原文整段貼上。
     一個字都不改：svg 裡面 <rect>、<line>、<circle> 的 width、height、x、y、r 是形狀本身的尺寸，拿掉就畫不出來；
     圖示大小由 .sc-icon--72 決定，<svg> 本身不用寫 width、height。
  3. 綁句：<script> 開頭 T1–T4、ALL 的句號與詞（見【綁句欄位】）。
  層數是 3：刪掉 #xstk-l4（整個 div）、T4（宣告那一行的「, T4 = P.at(…)」）和第 4 層那一行（P.rise／P.icon／P.focus 寫在同一行）；
  照最後一節版面的「3 層」那一列改三層的 top 和地基線的 y1、y2。

  【綁句欄位】
  T1 = P.at('#111@手機')、T2 = P.at('#112@區網')、T3 = P.at('#113@控制台')、T4 = P.at('#114@剪輯')：講到那一層名稱的時刻，那一層落下，主色框移到這一層。
  ALL = P.at('#115')：講到「合起來就是…」那一句，框全部拿掉。沒有這句就刪掉 ALL 那兩行（const ALL 與 P.focus('.xstk-layer', null, ALL, …)）。
  名稱在句中間或句尾時一定用 @詞，不要綁句首；剛好是那句的第一個詞才寫 P.at('#112')。
  「@詞」要寫成字串字面值（P.at('#112@區網')，不要用變數組字串），build 才算得到；要再晚一點加第二個參數：P.at('#112@區網', 0.3)。
  相鄰兩層至少差 2.1 秒（落下 0.5 秒、圖示 0.15 秒起描 0.7 秒＝忙到 0.85 秒，再停 1.2 秒）；太近就綁後面一句，或把兩層合併成一層。
  audit 會比對：這一拍出現的字（層名、說明）在別句才講到時，印 ⚠ 綁句對不上，照它給的 P.at 改。

  【D 下限】
  T1 ≥ 1.7（卡片 0.5 秒、地基線 1.0 秒起描 0.7 秒）
  T2 ≥ T1 + 2.1；T3 ≥ T2 + 2.1；T4 ≥ T3 + 2.1；ALL ≥ T4 + 2.1
  D ≥ ALL + 2.4（框淡出 0.4 秒＋最後一幕停 1.5 秒＋build 加的淡出 0.5 秒；沒有 ALL 時 D ≥ T4 + 2.9；D＝plan.json 這段的長度）
  結尾寫 P.end()（不帶參數），長度自動等於 plan.json 這段的長度；root 的 data-duration 只給單獨開檔時用。

  【版面】
  fullscreen：整段淡入淡出 0.5 秒由 build 處理；0.5 秒前不動。主卡 left 120、top 150、寬 1180（右緣 1300），標題列 128、內容區 1176×580。
  每層 x 56、寬 1064、高 112，左邊圖示 72＋名稱（52 字），右邊說明（40 字、靠右）；左右內距 32。
    4 層：top 由下往上 438／302／166／30（間距 24）；3 層：top 400／248／96（間距 40）。地基線 y 566（4 層）／528（3 層），x 40–1136。
  主色框（.xstk-on）疊在層的外框上，不算新元素；層落下 12 px、不過衝。
  靈感（只借技法）：techhalla-498547／techhalla／https://x.com/techhalla/status/2103411244468498547；gdgtify-130294／Gdgtify／https://x.com/Gdgtify/status/2105570411870130294；0xlangeai-597929／0xlangeai／https://x.com/0xlangeai/status/2106391068367597929
-->
<html lang="zh-Hant">
<head><meta charset="UTF-8"><title>x-stack 架構堆疊</title></head>
<body>
<template id="x-stack-template">
  <style>
    #x-stack { position: absolute; inset: 0; }
    #x-stack .fill { position: absolute; inset: 0; }
    /* 主卡：左 120、頂 150、寬 1180（右緣 1300，避開右下子母畫面）；標題列 128、內容區 1176×580（卡底 862） */
    #x-stack #xstk-card { position: absolute; left: 120px; top: 150px; width: 1180px; }
    #x-stack #xstk-card .sc-wcard__bar { height: 128px; padding: 20px 56px; }
    #x-stack #xstk-body { position: relative; width: 1176px; height: 580px; }
    /* 地基線：內容區大小的 svg，最底層下面 16 px，左右各比層寬 16 px */
    #x-stack #xstk-base { position: absolute; left: 0; top: 0; width: 1176px; height: 580px; }
    #x-stack #xstk-ground { fill: none; stroke: var(--sc-fs-line); stroke-width: 4px; stroke-linecap: round; }
    /* 層：同寬 1064×112，左邊圖示＋名稱、右邊說明（靠右）；左右內距 32 */
    #x-stack .xstk-layer { position: absolute; left: 56px; width: 1064px; height: 112px; box-sizing: border-box; border: 4px solid var(--sc-fs-node-line);
                           border-radius: 16px; background: var(--sc-fs-node); color: var(--sc-fs-ink);
                           display: flex; align-items: center; justify-content: space-between; padding: 0 32px; white-space: nowrap; }
    #x-stack #xstk-l1 { top: 438px; }
    #x-stack #xstk-l2 { top: 302px; }
    #x-stack #xstk-l3 { top: 166px; }
    #x-stack #xstk-l4 { top: 30px; }
    #x-stack .xstk-left { display: flex; align-items: center; gap: 24px; }
    /* 主色框：疊在層的外框上（P.focus 的 ring） */
    #x-stack .xstk-on { position: absolute; inset: -4px; border: 4px solid var(--brand); border-radius: 16px; }
  </style>
  <div id="x-stack" data-composition-id="x-stack" data-width="1920" data-height="1080" data-duration="13"
       data-cues-sample='{"start":0,"D":13,"cues":{"111":[1.6,3.6],"112":[3.7,5.8],"113":[5.9,8],"114":[8.1,10.4],"115":[10.6,12.5]},"refs":{"#111@手機":1.8,"#112@區網":4.0,"#113@控制台":6.2,"#114@剪輯":8.4}}'>
    <div class="sc-surface-fs fill"></div>
    <div id="xstk-card" class="sc-wcard">
      <div class="sc-wcard__bar"><span class="sc-opt">多機錄影工具的架構</span></div>
      <div id="xstk-body">
        <svg id="xstk-base" viewBox="0 0 1176 580" xmlns="http://www.w3.org/2000/svg"><line id="xstk-ground" x1="40" y1="566" x2="1136" y2="566" /></svg>
        <!-- 由下往上：l1 最底層（第 1 個講到），l4 最上層 -->
        <div id="xstk-l1" class="xstk-layer"><i class="xstk-on"></i>
          <span class="xstk-left"><span id="xstk-ico1" class="sc-icon sc-icon--72"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <rect width="14" height="20" x="5" y="2" rx="2" ry="2" /> <path d="M12 18h.01" /> </svg></span><span class="xstk-name sc-t52 sc-w900 sc-opt">手機 App</span></span><span class="xstk-desc sc-t40 sc-w500 sc-gray sc-opt">負責錄影與回傳</span></div>
        <div id="xstk-l2" class="xstk-layer"><i class="xstk-on"></i>
          <span class="xstk-left"><span id="xstk-ico2" class="sc-icon sc-icon--72"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M12 20h.01" /> <path d="M2 8.82a15 15 0 0 1 20 0" /> <path d="M5 12.859a10 10 0 0 1 14 0" /> <path d="M8.5 16.429a5 5 0 0 1 7 0" /> </svg></span><span class="xstk-name sc-t52 sc-w900 sc-opt">區網連線</span></span><span class="xstk-desc sc-t40 sc-w500 sc-gray sc-opt">同一個 Wi-Fi 傳檔</span></div>
        <div id="xstk-l3" class="xstk-layer"><i class="xstk-on"></i>
          <span class="xstk-left"><span id="xstk-ico3" class="sc-icon sc-icon--72"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <rect width="20" height="14" x="2" y="3" rx="2" /> <line x1="8" x2="16" y1="21" y2="21" /> <line x1="12" x2="12" y1="17" y2="21" /> </svg></span><span class="xstk-name sc-t52 sc-w900 sc-opt">控制台</span></span><span class="xstk-desc sc-t40 sc-w500 sc-gray sc-opt">電腦上按開始結束</span></div>
        <div id="xstk-l4" class="xstk-layer"><i class="xstk-on"></i>
          <span class="xstk-left"><span id="xstk-ico4" class="sc-icon sc-icon--72"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <circle cx="6" cy="6" r="3" /> <path d="M8.12 8.12 12 12" /> <path d="M20 4 8.12 15.88" /> <circle cx="6" cy="18" r="3" /> <path d="M14.8 14.8 20 20" /> </svg></span><span class="xstk-name sc-t52 sc-w900 sc-opt">剪輯流程</span></span><span class="xstk-desc sc-t40 sc-w500 sc-gray sc-opt">直接接剪輯軟體</span></div>
      </div>
    </div>
  </div>
  <script>
  (function () {
    var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
    const tl = gsap.timeline({ paused: true });
    const P = SceneMotion(tl, document.getElementById('x-stack'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut', 'morph', 'push', 'count', 'bar', 'stroke', 'icon', 'check', 'type' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis', 'focus' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const T1 = P.at('#111@手機'), T2 = P.at('#112@區網'), T3 = P.at('#113@控制台'), T4 = P.at('#114@剪輯');   // 由下往上講到每一層名稱的時刻
    const ALL = P.at('#115');                          // 講到「合起來就是…」那一句

    // 1. 卡片先進場，地基線從 1.0 秒起描出；0.5 秒前不動
    P.reveal('#xstk-card', 0.5);
    P.stroke('#xstk-ground', 1.0);

    // 2. 講到哪一層：那一層從上方 12 px 落下就位、0.15 秒後圖示描線、0.3 秒後主色框移到這一層
    //    （dim: 1＝其他層亮度不變；P.focus 的第一個參數只寫已經落下的層，要照時間先後寫）
    P.rise('#xstk-l1', T1, { dy: -12 });  P.icon('#xstk-ico1', T1 + P.BEAT);  P.focus('#xstk-l1', '#xstk-l1', T1 + 0.3, { dim: 1, ring: '.xstk-on' });
    P.rise('#xstk-l2', T2, { dy: -12 });  P.icon('#xstk-ico2', T2 + P.BEAT);  P.focus('#xstk-l1, #xstk-l2', '#xstk-l2', T2 + 0.3, { dim: 1, ring: '.xstk-on' });
    P.rise('#xstk-l3', T3, { dy: -12 });  P.icon('#xstk-ico3', T3 + P.BEAT);  P.focus('#xstk-l1, #xstk-l2, #xstk-l3', '#xstk-l3', T3 + 0.3, { dim: 1, ring: '.xstk-on' });
    P.rise('#xstk-l4', T4, { dy: -12 });  P.icon('#xstk-ico4', T4 + P.BEAT);  P.focus('#xstk-l1, #xstk-l2, #xstk-l3, #xstk-l4', '#xstk-l4', T4 + 0.3, { dim: 1, ring: '.xstk-on' });

    // 3. 講到「合起來」：框全部拿掉（最後一幕）
    P.focus('.xstk-layer', null, ALL, { dim: 1, ring: '.xstk-on' });

    P.end();                                           // 長度＝plan.json 這段的長度
    window.__timelines['x-stack'] = tl;
  })();
  </script>
</template>
</body>
</html>
