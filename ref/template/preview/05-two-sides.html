<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>05 兩側｜預覽</title>
<!-- build.mjs --gallery 產生：用 scene.json 的 sample 填模板，講者是 speaker.jpg；換主色或放 ../bg.jpg 後重新整理就會更新 -->
<link rel="stylesheet" href="../kit/fonts.css">
<link rel="stylesheet" href="../kit/brand.css">
<link rel="stylesheet" href="../kit/scene.css">
<link rel="stylesheet" href="../kit/theme.css">
<link rel="stylesheet" href="../kit/captions.css">
<script src="../kit/gsap.min.js"></script>
<script src="../kit/scene-motion.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; transform-origin: 0 0; }
  #footage { position: absolute; inset: 0; }
  #footage img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
  .fill { position: absolute; inset: 0; }
  #scene { position: absolute; inset: 0; z-index: 20; }
  #pip { position: absolute; left: 1344px; top: 630px; width: 512px; height: 288px; overflow: hidden; border-radius: 6px; z-index: 40; }
  #pip img { position: absolute; left: -124px; top: -9px; width: 776px; height: 436px; }
  #pipf { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 41; }
  #cap { z-index: 60; }
  /* 背景圖：有 ../bg.jpg 就蓋在底紋上，沒有就只顯示底紋（不必重新產生預覽頁） */
  .sc-surface-fs { background-image: url("../bg.jpg"), var(--sc-fs-pattern); background-size: cover, 1920px 1080px; background-position: center, 0 0; background-repeat: no-repeat; }
  .sc-surface-ch { background-image: url("../bg.jpg"), var(--sc-ch-pattern); background-size: cover, 1920px 1080px; background-position: center, 0 0; background-repeat: no-repeat; }
  .sc-surface-side { background-image: url("../bg.jpg"), var(--sc-side-pattern); background-size: 1920px auto, 960px 1080px; background-position: 0 50%, 0 0; background-repeat: no-repeat; }
  #pv-two-sides .sCard { position: absolute; width: 504px; height: 280px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 24px; background: var(--sc-card-solid); }
  #pv-two-sides .sCard .sc-t60 { line-height: 64px; }
  #pv-two-sides .sCard.sc-card--topline::before { left: 16px; right: 16px; top: 16px; height: 4px; border-radius: 2px; }
  #pv-two-sides .sc-icon--96 { --d: 96px; --i: 56px; }
  #pv-two-sides #pv-sCard1 { left: 96px;   top: 211px; }
  #pv-two-sides #pv-sCard2 { left: 96px;   top: 539px; }
  #pv-two-sides #pv-sCard3 { left: 1320px; top: 211px; }
  #pv-two-sides #pv-sCard4 { left: 1320px; top: 539px; }
</style>
</head>
<body>
<div id="stage">
  <div id="footage"><img src="speaker.jpg" alt=""></div>
  <div id="scene">
    <div id="pv-two-sides" class="fill">
      <div id="pv-aWrap" class="fill">
        <div id="pv-sCard1" class="sc-card sc-card--topline sCard">
          <span class="sc-icon sc-icon--96"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5" /> <rect x="2" y="6" width="14" height="12" rx="2" /> </svg></span>
          <span class="sc-t60 sc-w700 sc-opt">原始口播</span>
        </div>
        <div id="pv-sCard2" class="sc-card sc-card--topline sCard">
          <span class="sc-icon sc-icon--96"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /> <path d="M14 2v4a2 2 0 0 0 2 2h4" /> <path d="M10 9H8" /> <path d="M16 13H8" /> <path d="M16 17H8" /> </svg></span>
          <span class="sc-t60 sc-w700 sc-opt">講稿</span>
        </div>
        <div id="pv-sCard3" class="sc-card sc-card--topline sCard">
          <span class="sc-icon sc-icon--96"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" /> <circle cx="12" cy="13" r="3" /> </svg></span>
          <span class="sc-t60 sc-w700 sc-opt">場地照</span>
        </div>
        <div id="pv-sCard4" class="sc-card sc-card--topline sCard">
          <span class="sc-icon sc-icon--96"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" /> <path d="M16 9a5 5 0 0 1 0 6" /> <path d="M19.364 18.364a9 9 0 0 0 0-12.728" /> </svg></span>
          <span class="sc-t60 sc-w700 sc-opt">音效</span>
        </div>
      </div>
    </div>
  </div>
  <div class="cg" id="cap"><span>剪輯要用到的檔案，我做成了範本</span></div>
</div>
<script>
window.__PREVIEW = {"key":"two-sides","duration":8,"cues":[{"sound":"pop","at":0.2},{"sound":"tick","at":0.55,"volume":1},{"sound":"tick","at":0.9,"volume":1},{"sound":"tick","at":1.25,"volume":1}]};
</script>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); stage.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();
  var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
  var start = function () {
    const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.2 });
    var pv = window.__PREVIEW;
    const P = SceneMotion(tl, document.getElementById('pv-two-sides'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const D = 8;
    /* 左上 → 左下 → 右上 → 右下依序 drift（左欄 dx −16、右欄 +16）→ 停 → 段尾一起淡出 */
    P.drift('#pv-sCard1', 0.2, { dx: 1 <= 2 ? -P.DRIFT : P.DRIFT });
    P.drift('#pv-sCard2', 0.55, { dx: 2 <= 2 ? -P.DRIFT : P.DRIFT });
    P.drift('#pv-sCard3', 0.9, { dx: 3 <= 2 ? -P.DRIFT : P.DRIFT });
    P.drift('#pv-sCard4', 1.25, { dx: 4 <= 2 ? -P.DRIFT : P.DRIFT });
    P.out('#pv-sCard1, #pv-sCard2, #pv-sCard3, #pv-sCard4', D - P.OUT);

    P.end(D);
    // 截圖用：網址加 ?t=秒數 就停在那一刻（例：03-side-panel.html?t=3）
    var t = Number(new URLSearchParams(location.search).get('t'));
    if (t > 0) tl.pause(t);
    // 重播協定：父頁（音效預覽）送 hf-preview-replay → 從頭播，並回 hf-preview-started
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'hf-preview-replay') return;
      tl.restart();
      (e.source || parent).postMessage({ type: 'hf-preview-started', key: pv.key }, '*');
    });
    parent.postMessage({ type: 'hf-preview-ready', key: pv.key, duration: pv.duration, cues: pv.cues }, '*');
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
</body>
</html>
