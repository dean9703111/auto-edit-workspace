<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>04c 全畫面流程｜預覽</title>
<!-- build.mjs --gallery 產生：用 scene.json 的 sample 填模板，講者是 speaker.jpg；換主色或放 ../bg.jpg 後重新整理就會更新 -->
<link rel="stylesheet" href="../kit/fonts.css">
<link rel="stylesheet" href="../kit/brand.css">
<link rel="stylesheet" href="../kit/scene.css">
<link rel="stylesheet" href="../kit/theme.css">
<link rel="stylesheet" href="../kit/captions.css">
<script src="../kit/gsap.min.js"></script>
<script src="../kit/scene-motion.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: #000; transform-origin: 0 0; }
  #footage { position: absolute; inset: 0; }
  #footage img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: cover; }
  .fill { position: absolute; inset: 0; }
  #scene { position: absolute; inset: 0; z-index: 30; }
  #pip { position: absolute; left: 1344px; top: 630px; width: 512px; height: 288px; overflow: hidden; border-radius: 6px; z-index: 40; }
  #pip img { position: absolute; left: -124px; top: -9px; width: 776px; height: 436px; }
  #pipf { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 41; }
  #cap { z-index: 60; }
  /* 背景圖：有 ../bg.jpg 就蓋在底紋上，沒有就只顯示底紋（不必重新產生預覽頁） */
  .sc-surface-fs { background-image: url("../bg.jpg"), var(--sc-fs-pattern); background-size: cover, 1920px 1080px; background-position: center, 0 0; background-repeat: no-repeat; }
  .sc-surface-ch { background-image: url("../bg.jpg"), var(--sc-ch-pattern); background-size: cover, 1920px 1080px; background-position: center, 0 0; background-repeat: no-repeat; }
  .sc-surface-side { background-image: url("../bg.jpg"), var(--sc-side-pattern); background-size: 1920px auto, 960px 1080px; background-position: 0 50%, 0 0; background-repeat: no-repeat; }
  #pv-fs-flow #pv-wCard { position: absolute; left: 120px; top: 150px; width: 1180px; }
  #pv-fs-flow #pv-wCard .sc-wcard__bar { height: 128px; padding: 20px 56px; }
  #pv-fs-flow #pv-wBody { width: 1176px; height: 580px; display: flex; align-items: center; justify-content: center; }
  #pv-fs-flow #pv-fFlow { display: flex; align-items: flex-start; width: 1128px; }
  #pv-fs-flow .fNode { flex: none; display: flex; flex-direction: column; align-items: center; gap: 24px; width: 240px; padding: 24px 0; border-radius: 20px; white-space: nowrap; }
  #pv-fs-flow .fNode .sc-icon { --d: 192px; --i: 104px; }
  #pv-fs-flow .fNode .sc-t44 { line-height: 60px; }
  #pv-fs-flow .fArrow { position: relative; flex: 1 1 0; min-width: 56px; height: 14px; margin-top: 113px; }
  #pv-fs-flow .fArrow::before { content: ""; position: absolute; left: 0; right: 12px; top: 5px; height: 4px; background: var(--sc-fs-line); }
  #pv-fs-flow .fArrow::after { content: ""; position: absolute; right: 0; top: 0; width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 14px solid var(--sc-fs-line); }
  #pv-fs-flow #pv-fFlow[data-current="1"] > :nth-child(1), #pv-fs-flow #pv-fFlow[data-current="2"] > :nth-child(3), #pv-fs-flow #pv-fFlow[data-current="3"] > :nth-child(5), #pv-fs-flow #pv-fFlow[data-current="4"] > :nth-child(7) { background: var(--sc-fs-tint); box-shadow: inset 0 0 0 4px var(--sc-accent); }
</style>
</head>
<body>
<div id="stage">
  <div id="footage"><img src="speaker.jpg" alt=""></div>
  <div id="scene">
    <div id="pv-fs-flow" class="fill">
      <div class="sc-surface-fs fill"></div>
      <div id="pv-aWrap" class="fill">
        <div id="pv-wCard" class="sc-wcard">
          <div class="sc-wcard__bar"><span class="sc-opt">從原始口播到成片</span></div>
          <div id="pv-wBody">
            <div id="pv-fFlow" data-current="2">
              
              <div id="pv-fNode1" class="fNode"><span class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" /> <path d="M14 2v4a2 2 0 0 0 2 2h4" /> <path d="M10 9H8" /> <path d="M16 13H8" /> <path d="M16 17H8" /> </svg></span><span class="sc-t44 sc-w700 sc-opt">轉逐字稿</span></div>
              <div id="pv-fArr2" class="fArrow"></div>
              <div id="pv-fNode2" class="fNode"><span class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="m3 17 2 2 4-4" /> <path d="m3 7 2 2 4-4" /> <path d="M13 6h8" /> <path d="M13 12h8" /> <path d="M13 18h8" /> </svg></span><span class="sc-t44 sc-w700 sc-opt">列剪輯清單</span></div>
              <div id="pv-fArr3" class="fArrow"></div>
              <div id="pv-fNode3" class="fNode"><span class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <circle cx="6" cy="6" r="3" /> <path d="M8.12 8.12 12 12" /> <path d="M20 4 8.12 15.88" /> <circle cx="6" cy="18" r="3" /> <path d="M14.8 14.8 20 20" /> </svg></span><span class="sc-t44 sc-w700 sc-opt">初剪</span></div>
              <div id="pv-fArr4" class="fArrow"></div>
              <div id="pv-fNode4" class="fNode"><span class="sc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"> <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z" /> <path d="m6.2 5.3 3.1 3.9" /> <path d="m12.4 3.4 3.1 4" /> <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z" /> </svg></span><span class="sc-t44 sc-w700 sc-opt">包裝成片</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="pip"><img src="speaker.jpg" alt=""></div>
  <img id="pipf" src="../kit/pip-frame.png" alt="">
  <div class="cg" id="cap"><span>先轉逐字稿，AI 再找出 NG</span></div>
</div>
<script>
window.__PREVIEW = {"key":"fs-flow","duration":6,"cues":[{"sound":"whoosh","at":-0.15},{"sound":"tick","at":0.5,"volume":1},{"sound":"tick","at":0.85,"volume":1},{"sound":"tick","at":1.2,"volume":1},{"sound":"tick","at":1.55,"volume":1}]};
</script>
<script>
(function () {
  var stage = document.getElementById('stage');
  function fit() { var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080); stage.style.transform = 'scale(' + s + ')'; }
  window.addEventListener('resize', fit); fit();
  var $q = function (s) { return typeof s === 'string' ? Array.prototype.slice.call(document.querySelectorAll(s)) : s; };
  var start = function () {
    const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.2 });
    var pv = window.__PREVIEW;
    const P = SceneMotion(tl, document.getElementById('pv-fs-flow'));
    [ 'in', 'out', 'drift', 'reveal', 'rise', 'maskUp', 'sideIn', 'sideOut' ].forEach(function (k) { var f = P[k]; P[k] = function (s) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s); return f.apply(P, a); }; });
    [ 'swap', 'axis' ].forEach(function (k) { var f = P[k]; P[k] = function (s1, s2) { var a = Array.prototype.slice.call(arguments); a[0] = $q(s1); a[1] = $q(s2); return f.apply(P, a); }; });
    const D = 6;
    /* 節點逐個 P.rise（箭頭跟著它所指向的節點一起出現；綁句號，預設 0.5 起每 0.35s）→ 全部到位後停住。
       全畫面幕不在 HF 內淡出（離場由剪映端整段渐隐） */
    P.rise('#pv-fNode1', 0.5);
    P.rise('#pv-fNode2, #pv-fArr2', 0.85);
    P.rise('#pv-fNode3, #pv-fArr3', 1.2);
    P.rise('#pv-fNode4, #pv-fArr4', 1.55);
    tl.fromTo('#scene, #pip, #pipf', { opacity: 0 }, { opacity: 1, duration: 0.5, ease: 'sine.out' }, 0);
    tl.to('#scene, #pip, #pipf', { opacity: 0, duration: 0.5, ease: 'sine.in' }, 5.5);
    P.end(D);
    // 截圖用：網址加 ?t=秒數 就停在那一刻（例：03-side-panel.html?t=3）
    var t = Number(new URLSearchParams(location.search).get('t'));
    if (t > 0) tl.pause(t);
    // 重播協定：父頁（音效預覽）送 hf-preview-replay → 從頭播，並回 hf-preview-started
    window.addEventListener('message', function (e) {
      if (!e.data || e.data.type !== 'hf-preview-replay') return;
      tl.restart();
      (e.source || parent).postMessage({ type: 'hf-preview-started', key: pv.key }, '*');
    });
    parent.postMessage({ type: 'hf-preview-ready', key: pv.key, duration: pv.duration, cues: pv.cues }, '*');
  };
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(start); else start();
})();
</script>
</body>
</html>
