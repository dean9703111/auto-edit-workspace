<!doctype html>
<html lang="zh-Hant" data-composition-variables='[
  {"id":"text","type":"string","label":"動畫文字","default":"圖紋遮罩"},
  {"id":"accent","type":"color","label":"主色","default":"#f78c3c"},
  {"id":"bg","type":"enum","label":"底色","default":"light","options":[{"value":"dark","label":"深色"},{"value":"light","label":"淺色"},{"value":"accent","label":"主色"},{"value":"none","label":"透明"}]}
]'>
<head><meta charset="UTF-8"><title>35 Text Mask Pattern 圖紋遮罩</title></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; }
    /* 35 Text Mask Pattern：160px 方塊內 45° 斜紋，水平週期剛好 160px，位移 160px 的整數倍即無縫 */
    .fx-35-word { display: inline-block; white-space: nowrap; color: transparent;
      -webkit-background-clip: text; background-clip: text;
      background-size: 160px 160px;
      background-image: repeating-linear-gradient(45deg,
        var(--fx-hi) 0px, var(--fx-hi) 56.5685px, var(--fx-panel) 56.5685px, var(--fx-panel) 113.137px); }
    .fx-stage[data-bg="none"] .fx-35-word { filter: drop-shadow(0 2px 4px rgba(0,0,0,.85)); }
  </style>
  <div id="root" data-composition-id="fx-35-text-mask-pattern" data-width="1920" data-height="1080" data-duration="3">
    <div class="fx-stage">
      <div class="fx-safe"><div class="fx-35-word"></div></div>
    </div>
  </div>
  <script src="fx-kit.js"></script>
  <script>
    /* 35 Text Mask Pattern：文字當窗口（background-clip: text），主色／深色斜紋沿 x 流動整數個 160px 週期 */
    const v = window.__hyperframes.getVariables();
    const stage = document.querySelector('.fx-stage');
    const word = document.querySelector('.fx-35-word');
    const { D } = FXKit.setup(stage, v, 3);

    word.textContent = v.text;
    word.style.fontSize = FXKit.fitSize(v.text, 300, FXKit.SAFE.w) + 'px';

    // 基準週期約 1 秒流過一格；D 內整數格
    const loops = Math.max(1, Math.round(D / 1));
    const tl = gsap.timeline({ paused: true });
    tl.fromTo(word, { backgroundPosition: '0px 0px' },
      { backgroundPosition: (160 * loops) + 'px 0px', duration: D, ease: 'none' }, 0);
    window.__timelines['fx-35-text-mask-pattern'] = tl;
  </script>
</template>
</body>
</html>
