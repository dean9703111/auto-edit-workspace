<!doctype html>
<html lang="zh-Hant" data-composition-variables='[
  {"id":"text","type":"string","label":"動畫文字","default":"拉霸滾輪"},
  {"id":"accent","type":"color","label":"主色","default":"#a78bfa"},
  {"id":"bg","type":"enum","label":"底色","default":"dark","options":[{"value":"dark","label":"深色"},{"value":"light","label":"淺色"},{"value":"accent","label":"主色"},{"value":"none","label":"透明"}]}
]'>
<head><meta charset="UTF-8"><title>28 Slot Text 拉霸滾輪</title></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; }
    /* 28 Slot Text */
    .fx-28-row { display: flex; align-items: center; justify-content: center; }
    .fx-28-win { position: relative; flex: none; overflow: hidden; background: var(--fx-panel); border-radius: 14px;
      box-shadow: inset 0 0 0 2px var(--fx-hi); }
    .fx-28-strip { position: absolute; left: 0; top: 0; width: 100%; }
    .fx-28-it { display: flex; align-items: center; justify-content: center; width: 100%; color: #fff; white-space: pre; }
    .fx-28-shade { position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(rgba(0,0,0,.6), rgba(0,0,0,0) 28%, rgba(0,0,0,0) 72%, rgba(0,0,0,.6)); }
  </style>
  <div id="root" data-composition-id="fx-28-slot-text" data-width="1920" data-height="1080" data-duration="4">
    <div class="fx-stage">
      <div class="fx-safe"><div class="fx-28-row"></div></div>
    </div>
  </div>
  <script src="fx-kit.js"></script>
  <script>
    /* 28 Slot Text：每字一個直向滾輪，高速轉動後由左至右依序減速、back.out 彈性停在正確字；停留後整排向上捲走成空白 */
    const v = window.__hyperframes.getVariables();
    const stage = document.querySelector('.fx-stage');
    const row = document.querySelector('.fx-28-row');
    const { D } = FXKit.setup(stage, v, 4);

    const T = [...String(v.text ?? '')];
    const N = Math.max(T.length, 1);
    const f = Math.min(240, Math.floor(FXKit.SAFE.w / (1.06 * N)));
    const cw = Math.round(f * 0.96), H = Math.round(f * 1.3), gap = Math.round(f * 0.08);
    const LATIN = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const CJK = '字卡滾輪拉霸結果揭曉抽獎中大吉運氣好數開獎得主名單恭喜';
    const isCJK = (c) => c.codePointAt(0) >= 0x2e80;

    const reels = T.map((target, i) => {
      const win = document.createElement('div');
      win.className = 'fx-28-win';
      win.style.cssText = `width:${cw}px;height:${H}px;margin:0 ${gap / 2}px;font-size:${Math.round(f * 0.88)}px;`;
      const strip = document.createElement('div');
      strip.className = 'fx-28-strip';
      // 0 空白 → 亂數字 → 目標字 → 空白（退場用）
      const K = Math.min(8 + 2 * i, 18);
      const pool = isCJK(target) ? CJK : LATIN;
      const r = FXKit.rng('28-' + i + '-' + target);
      const items = [' '];
      for (let k = 1; k < K; k++) items.push(pool[Math.floor(r() * pool.length)]);
      items.push(target, ' ');
      items.forEach((c) => {
        const it = document.createElement('div');
        it.className = 'fx-28-it';
        it.style.height = H + 'px';
        it.textContent = c;
        strip.appendChild(it);
      });
      const shade = document.createElement('div');
      shade.className = 'fx-28-shade';
      win.appendChild(strip); win.appendChild(shade);
      row.appendChild(win);
      return { strip, K };
    });

    const spin0 = 0.9, st = 0.2, exitDur = 0.35, exitSt = 0.05;
    const core = spin0 + st * (N - 1) + exitDur + exitSt * (N - 1);
    const s = Math.max(0.3, Math.min(1, (D - 0.8) / core));
    const hold = D - 0.4 - core * s;           // 頭 0.2、尾 0.2 靜止空白
    const tExit = 0.2 + (spin0 + st * (N - 1)) * s + hold;

    const tl = gsap.timeline({ paused: true });
    reels.forEach(({ strip, K }, i) => {
      tl.fromTo(strip, { y: 0 }, { y: -K * H, duration: (spin0 + st * i) * s, ease: 'back.out(1.5)' }, 0.2)
        .fromTo(strip, { y: -K * H }, { y: -(K + 1) * H, duration: exitDur * s, ease: 'power2.in', immediateRender: false },
          tExit + exitSt * s * i);
    });
    window.__timelines['fx-28-slot-text'] = tl;
  </script>
</template>
</body>
</html>
