<!doctype html>
<html lang="zh-Hant" data-composition-variables='[
  {"id":"text","type":"string","label":"動畫文字","default":"直書逆流"},
  {"id":"accent","type":"color","label":"主色","default":"#f5c518"},
  {"id":"bg","type":"enum","label":"底色","default":"accent","options":[{"value":"dark","label":"深色"},{"value":"light","label":"淺色"},{"value":"accent","label":"主色"},{"value":"none","label":"透明"}]}
]'>
<head><meta charset="UTF-8"><title>10 Vertical Typography 直書逆流</title></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; }
    /* 10 Vertical Typography */
    .fx-10-col { position: absolute; top: 0; height: 1080px; will-change: transform; }
    .fx-10-u { display: block; writing-mode: vertical-rl; text-orientation: mixed; white-space: nowrap; color: var(--fx-ink); text-shadow: var(--fx-scrim); }
    .fx-10-col.fx-10-hi .fx-10-u { color: var(--fx-hi); }
  </style>
  <div id="root" data-composition-id="fx-10-vertical-typography" data-width="1920" data-height="1080" data-duration="6">
    <div class="fx-stage"></div>
  </div>
  <script src="fx-kit.js"></script>
  <script>
    /* 10 Vertical Typography：8 欄直書、字級大小不一，相鄰欄一上一下反向流動，各欄速度不同、位移＝整數個重複單元 */
    const v = window.__hyperframes.getVariables();
    const stage = document.querySelector('.fx-stage');
    const { D } = FXKit.setup(stage, v, 6);
    const H = 1080, P = 6;
    const cycles = Math.max(1, Math.round(D / P));
    const Pp = D / cycles;

    const emW = FXKit.emWidth(v.text + '・');
    // 每欄：字級、速度（px/s）、是否用強調色
    const COLS = [
      { fs: 150, speed: 300, hi: false }, { fs: 110, speed: 420, hi: true },
      { fs: 190, speed: 250, hi: false }, { fs: 130, speed: 360, hi: false },
      { fs: 170, speed: 280, hi: true },  { fs: 100, speed: 460, hi: false },
      { fs: 160, speed: 330, hi: false }, { fs: 120, speed: 390, hi: true },
    ];
    // 長文字時整體縮小，讓一個單元不超過 ~1.6 個畫面高
    const k = Math.min(1, 1700 / (190 * emW));
    const tl = gsap.timeline({ paused: true });
    COLS.forEach((c, i) => {
      const fs = Math.max(24, Math.round(c.fs * k));
      const U = Math.round(fs * emW);
      const m = Math.max(1, Math.round(c.speed * Pp / U));
      const per = m * U, S = cycles * per;
      const col = document.createElement('div');
      col.className = 'fx-10-col' + (c.hi ? ' fx-10-hi' : '');
      col.style.width = fs + 'px';
      col.style.left = Math.round((i + 0.5) * 1920 / COLS.length - fs / 2) + 'px';
      col.style.fontSize = fs + 'px';
      col.style.lineHeight = '1';
      const n = Math.ceil((H + S) / U) + 2;
      for (let j = 0; j < n; j++) {
        const u = document.createElement('span');
        u.className = 'fx-10-u';
        u.style.height = U + 'px';
        u.style.width = fs + 'px';
        u.textContent = v.text + '・';
        col.appendChild(u);
      }
      stage.appendChild(col);
      const phase = -((i * 0.37) % 1) * U;                // 各欄起始相位錯開
      const up = i % 2 === 0;                              // 偶數欄向上、奇數欄向下
      const from = up ? phase : phase - S, to = up ? phase - S : phase;
      tl.fromTo(col, { y: from }, { y: to, duration: D, ease: 'none' }, 0);
    });
    window.__timelines['fx-10-vertical-typography'] = tl;
  </script>
</template>
</body>
</html>
