<!doctype html>
<html lang="zh-Hant" data-composition-variables='[
  {"id":"text","type":"string","label":"動畫文字","default":"斜向帶狀"},
  {"id":"accent","type":"color","label":"主色","default":"#f5c518"},
  {"id":"bg","type":"enum","label":"底色","default":"accent","options":[{"value":"dark","label":"深色"},{"value":"light","label":"淺色"},{"value":"accent","label":"主色"},{"value":"none","label":"透明"}]}
]'>
<head><meta charset="UTF-8"><title>12 Diagonal Text Bands 斜向帶狀</title></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; }
    /* 12 Diagonal Text Bands */
    .fx-12-rig { position: absolute; left: -340px; top: 0; width: 2600px; height: 1080px; transform: rotate(-12deg); transform-origin: 50% 50%; }
    .fx-12-band { position: absolute; left: 0; width: 2600px; height: 230px; overflow: hidden; }
    .fx-12-dark { background: var(--fx-panel); color: var(--fx-hi); }
    .fx-12-light { background: #ffffff; color: #14161c; }
    .fx-stage[data-bg="none"] .fx-12-light { background: var(--fx-panel); color: var(--fx-hi); }
    .fx-12-row { position: absolute; left: 0; top: 0; height: 230px; display: flex; align-items: center; white-space: nowrap; will-change: transform; }
    .fx-12-u { flex: 0 0 auto; display: block; white-space: nowrap; line-height: 1; }
  </style>
  <div id="root" data-composition-id="fx-12-diagonal-text-bands" data-width="1920" data-height="1080" data-duration="6">
    <div class="fx-stage"><div class="fx-12-rig"></div></div>
  </div>
  <script src="fx-kit.js"></script>
  <script>
    /* 12 Diagonal Text Bands：3 條 -12° 帶（深／淺／深），黑白交錯，相鄰帶反向捲動；位移＝整數個重複單元 */
    const v = window.__hyperframes.getVariables();
    const stage = document.querySelector('.fx-stage');
    const rig = document.querySelector('.fx-12-rig');
    const { D } = FXKit.setup(stage, v, 6);
    const W = 2600, P = 6;
    const cycles = Math.max(1, Math.round(D / P));
    const Pp = D / cycles;

    const emW = FXKit.emWidth(v.text + '・');
    const fs = Math.min(150, Math.floor(2600 / emW));
    const U = Math.round(fs * emW);
    // 三條帶：垂直位置、深淺、速度（px/s）、方向（-1 向左、1 向右）
    const BANDS = [
      { y: 190, cls: 'fx-12-dark',  speed: 420, dir: -1 },
      { y: 425, cls: 'fx-12-light', speed: 560, dir: 1 },
      { y: 660, cls: 'fx-12-dark',  speed: 340, dir: -1 },
    ];
    const tl = gsap.timeline({ paused: true });
    BANDS.forEach((b, i) => {
      const band = document.createElement('div');
      band.className = 'fx-12-band ' + b.cls;
      band.style.top = b.y + 'px';
      const row = document.createElement('div');
      row.className = 'fx-12-row';
      row.style.fontSize = fs + 'px';
      const m = Math.max(1, Math.round(b.speed * Pp / U));
      const S = cycles * m * U;
      const n = Math.ceil((W + S) / U) + 1;
      for (let j = 0; j < n; j++) {
        const u = document.createElement('span');
        u.className = 'fx-12-u';
        u.style.width = U + 'px';
        u.textContent = v.text + '・';
        row.appendChild(u);
      }
      band.appendChild(row);
      rig.appendChild(band);
      const phase = -((i * 0.41) % 1) * U;
      const from = b.dir < 0 ? phase : phase - S, to = b.dir < 0 ? phase - S : phase;
      tl.fromTo(row, { x: from }, { x: to, duration: D, ease: 'none' }, 0);
    });
    window.__timelines['fx-12-diagonal-text-bands'] = tl;
  </script>
</template>
</body>
</html>
