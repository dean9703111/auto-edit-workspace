<!doctype html>
<html lang="zh-Hant" data-composition-variables='[
  {"id":"text","type":"string","label":"動畫文字","default":"緞帶文字"},
  {"id":"accent","type":"color","label":"主色","default":"#f5c518"},
  {"id":"bg","type":"enum","label":"底色","default":"dark","options":[{"value":"dark","label":"深色"},{"value":"light","label":"淺色"},{"value":"accent","label":"主色"},{"value":"none","label":"透明"}]}
]'>
<head><meta charset="UTF-8"><title>13 Text Ribbon 緞帶文字</title></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; }
    /* 13 Text Ribbon */
    .fx-13-svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    .fx-13-svg text { fill: var(--fx-ink); font-family: "Noto Sans TC", sans-serif; font-weight: 900; }
    .fx-13-path { fill: none; stroke: var(--fx-hi); stroke-width: 3; opacity: 0.55; }
    .fx-stage[data-bg="none"] .fx-13-svg { filter: drop-shadow(0 2px 4px rgba(0,0,0,0.85)); }
  </style>
  <div id="root" data-composition-id="fx-13-text-ribbon" data-width="1920" data-height="1080" data-duration="6">
    <div class="fx-stage">
      <svg class="fx-13-svg" viewBox="0 0 1920 1080">
        <path class="fx-13-path" id="fx-13-wave" d="M0 495"></path>
        <text class="fx-13-text"><textPath id="fx-13-tp" href="#fx-13-wave" startOffset="0"></textPath></text>
      </svg>
    </div>
  </div>
  <script src="fx-kit.js"></script>
  <script>
    /* 13 Text Ribbon：文字沿正弦波路徑流動（startOffset 整數週期），波的相位與振幅是時間的純函數，每幀重算 path 的 d */
    const v = window.__hyperframes.getVariables();
    const stage = document.querySelector('.fx-stage');
    const path = document.querySelector('.fx-13-path');
    const tp = document.querySelector('#fx-13-tp');
    const { D } = FXKit.setup(stage, v, 6);
    const P = 6;
    const cycles = Math.max(1, Math.round(D / P));
    const Pp = D / cycles;

    const fs = 112, LAM = 900, X0 = -300, X1 = 2220, N = 120;
    const LS = 0.18;   // 字距（em），拉開波谷內側擠在一起的字
    const emW = FXKit.emWidth(v.text + "・") + LS * [...(v.text + "・")].length;
    // 文字每個單元固定寬；長文字時縮字級以免單元過長
    const fsz = Math.min(fs, Math.floor(1600 / emW));
    const U = fsz * emW;
    const m = Math.max(1, Math.round(380 * Pp / U));
    const S = cycles * m * U;
    const PATH_MAX = 3600;                       // 路徑長度上限（振幅最大時仍小於此）
    const reps = Math.ceil((PATH_MAX + S) / U) + 1;
    document.querySelector('.fx-13-text').setAttribute('font-size', fsz);
    document.querySelector(".fx-13-text").setAttribute("letter-spacing", (LS * fsz).toFixed(1));
    tp.textContent = (v.text + '・').repeat(reps);

    // 整個狀態只由 t 決定（倒帶 seek 也正確）
    function render(t) {
      const ph = t / Pp;                                          // 週期進度（可超過 1）
      const amp = 155 + 15 * Math.sin(2 * Math.PI * ph);          // 振幅緩慢起伏
      const phase = -2 * Math.PI * ph;                            // 相位整數圈
      let d = '';
      for (let i = 0; i <= N; i++) {
        const x = X0 + (X1 - X0) * i / N;
        const y = 495 + amp * Math.sin(2 * Math.PI * x / LAM + phase);
        d += (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1);
      }
      path.setAttribute('d', d);
      tp.setAttribute('startOffset', (-(t / D) * S).toFixed(2));   // startOffset 由 0 走到 -S，文字向左流
    }
    render(0);

    const tl = gsap.timeline({ paused: true });
    const proxy = { t: 0 };
    tl.fromTo(proxy, { t: 0 }, { t: D, duration: D, ease: 'none', onUpdate: () => render(proxy.t) }, 0);
    window.__timelines['fx-13-text-ribbon'] = tl;
  </script>
</template>
</body>
</html>
