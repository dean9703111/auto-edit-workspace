<!doctype html>
<html lang="zh-Hant" data-composition-variables='[
  {"id":"text","type":"string","label":"動畫文字（B）","default":"翻牌看板"},
  {"id":"alt","type":"string","label":"切換文字（A）","default":"Split"},
  {"id":"accent","type":"color","label":"主色","default":"#a78bfa"},
  {"id":"bg","type":"enum","label":"底色","default":"dark","options":[{"value":"dark","label":"深色"},{"value":"light","label":"淺色"},{"value":"accent","label":"主色"},{"value":"none","label":"透明"}]}
]'>
<head><meta charset="UTF-8"><title>25 Split Flap 翻牌看板</title></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; }
    /* 25 Split Flap */
    .fx-25-row { display: flex; gap: 0; align-items: center; justify-content: center; }
    .fx-25-cell { position: relative; flex: none; perspective: 700px; }
    .fx-25-half { position: absolute; left: 0; width: 100%; overflow: hidden; background: var(--fx-panel); box-shadow: inset 0 0 0 2px rgba(255,255,255,.1); }
    .fx-25-top { top: 0; border-radius: 10px 10px 0 0; }
    .fx-25-bot { bottom: 0; border-radius: 0 0 10px 10px; }
    .fx-25-flapT { transform-origin: 50% 100%; }
    .fx-25-flapB { transform-origin: 50% 0%; }
    .fx-25-g { position: absolute; left: 0; width: 100%; text-align: center; color: #fff; white-space: pre; }
    .fx-25-top .fx-25-g { top: 0; }
    .fx-25-bot .fx-25-g { bottom: 0; }
    .fx-25-line { position: absolute; left: 0; width: 100%; background: #000; opacity: 1; z-index: 5; }
  </style>
  <div id="root" data-composition-id="fx-25-split-flap" data-width="1920" data-height="1080" data-duration="4">
    <div class="fx-stage">
      <div class="fx-safe"><div class="fx-25-row"></div></div>
    </div>
  </div>
  <script src="fx-kit.js"></script>
  <script>
    /* 25 Split Flap：每字一格翻牌，A 靜止 → 亂碼翻動依序停在 B → 停留 → 亂碼翻回 A */
    const v = window.__hyperframes.getVariables();
    const stage = document.querySelector('.fx-stage');
    const row = document.querySelector('.fx-25-row');
    const { D } = FXKit.setup(stage, v, 4);

    const A = [...String(v.alt ?? '')], B = [...String(v.text ?? '')];
    const N = Math.max(A.length, B.length, 1);
    while (A.length < N) A.push(' ');
    while (B.length < N) B.push(' ');
    const f = Math.min(240, Math.floor(FXKit.SAFE.w / (1.04 * N)));
    const cw = Math.round(f * 0.96), ch = Math.round(f * 1.3), gap = Math.round(f * 0.08);
    const LATIN = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const CJK = '字卡板翻看動亂碼車站時刻表班次準點延誤取消到達出發月日數';
    const isCJK = (c) => c.codePointAt(0) >= 0x2e80;

    const cells = A.map((_, i) => {
      const el = document.createElement('div');
      el.className = 'fx-25-cell';
      el.style.cssText = `width:${cw}px;height:${ch}px;margin:0 ${gap / 2}px;font-size:${Math.round(f * 0.88)}px;`;
      const mk = (cls) => {
        const h = document.createElement('div');
        h.className = 'fx-25-half ' + cls;
        h.style.height = ch / 2 + 'px';
        const g = document.createElement('div');
        g.className = 'fx-25-g';
        g.style.cssText = `height:${ch}px;line-height:${ch}px;`;
        h.appendChild(g);
        el.appendChild(h);
        return g;
      };
      const sT = mk('fx-25-top'), sB = mk('fx-25-bot');
      const fT = mk('fx-25-top fx-25-flapT'), fB = mk('fx-25-bot fx-25-flapB');
      const line = document.createElement('div');
      line.className = 'fx-25-line';
      line.style.cssText = `top:${ch / 2 - 3}px;height:6px;`;
      el.appendChild(line);
      row.appendChild(el);
      return { el, sT, sB, fT, fB, fTh: fT.parentNode, fBh: fB.parentNode };
    });

    // 時間配置：頭尾各留 0.3s 靜止，兩段翻牌各佔 Smax，中間停留在 B
    const M = 0.3;
    const Smax = Math.min(0.45 + 0.1 * (N - 1), Math.max(0.3, (D - 2 * M) * 0.36));
    const segStart = [M, D - M - Smax];
    const segFrom = [A, B], segTo = [B, A];
    // 每格每段的字序列：from → 亂碼… → to（亂碼用 格子編號＋段＋步數 當 seed）
    const plan = cells.map((_, i) => segStart.map((s0, sg) => {
      const settle = Smax * (0.5 + 0.5 * (i / Math.max(1, N - 1)));
      const K = Math.max(2, Math.round(settle / 0.09));
      const seq = [segFrom[sg][i]];
      for (let k = 1; k < K; k++) {
        const pool = isCJK(segTo[sg][i]) ? CJK : LATIN;
        const r = FXKit.rng('25-' + i + '-' + sg + '-' + k)();
        seq.push(pool[Math.floor(r * pool.length)]);
      }
      seq.push(segTo[sg][i]);
      return { s0, per: settle / K, K, seq };
    }));

    function render(t) {
      cells.forEach((c, i) => {
        let cur = t < segStart[1] ? A[i] : null, old = null, nxt = null, fr = 0, flipping = false;
        // 找目前所在的段
        let seg = t >= segStart[1] ? 1 : 0;
        const P = plan[i][seg];
        const u = t - P.s0;
        if (u < 0) cur = seg === 0 ? A[i] : B[i];
        else if (u >= P.K * P.per) cur = segTo[seg][i];
        else {
          const k = Math.min(P.K - 1, Math.floor(u / P.per));
          old = P.seq[k]; nxt = P.seq[k + 1];
          fr = (u - k * P.per) / P.per;
          flipping = true;
        }
        if (!flipping) {
          c.sT.textContent = c.sB.textContent = cur;
          c.fTh.style.visibility = c.fBh.style.visibility = 'hidden';
          return;
        }
        c.sT.textContent = nxt; c.sB.textContent = old;
        c.fT.textContent = old; c.fB.textContent = nxt;
        if (fr < 0.5) {
          c.fTh.style.visibility = 'visible'; c.fBh.style.visibility = 'hidden';
          c.fTh.style.transform = `rotateX(${-fr * 180}deg)`;
        } else {
          c.fTh.style.visibility = 'hidden'; c.fBh.style.visibility = 'visible';
          c.fBh.style.transform = `rotateX(${90 - (fr - 0.5) * 180}deg)`;
        }
      });
    }

    const tl = gsap.timeline({ paused: true });
    const p = { t: 0 };
    render(0);
    tl.fromTo(p, { t: 0 }, { t: D, duration: D, ease: 'none', onUpdate: () => render(p.t) }, 0);
    window.__timelines['fx-25-split-flap'] = tl;
  </script>
</template>
</body>
</html>
