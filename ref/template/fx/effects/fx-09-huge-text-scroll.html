<!doctype html>
<html lang="zh-Hant" data-composition-variables='[
  {"id":"text","type":"string","label":"動畫文字","default":"巨字捲動"},
  {"id":"accent","type":"color","label":"主色","default":"#f5c518"},
  {"id":"bg","type":"enum","label":"底色","default":"light","options":[{"value":"dark","label":"深色"},{"value":"light","label":"淺色"},{"value":"accent","label":"主色"},{"value":"none","label":"透明"}]}
]'>
<head><meta charset="UTF-8"><title>09 Huge Text Scroll 巨字捲動</title></head>
<body>
<template>
  <style>
    #root { position: absolute; inset: 0; }
    /* 09 Huge Text Scroll */
    .fx-09-row { position: absolute; left: 0; display: flex; white-space: nowrap; will-change: transform; }
    .fx-09-u { flex: 0 0 auto; display: block; white-space: nowrap; }
    .fx-09-big { color: var(--fx-ink); text-shadow: var(--fx-scrim); }
    .fx-09-big .fx-09-u i { font-style: normal; color: var(--fx-hi); }
    .fx-09-small { color: var(--fx-hi); text-shadow: var(--fx-scrim); }
    .fx-09-small .fx-09-u i { font-style: normal; color: var(--fx-ink); }
  </style>
  <div id="root" data-composition-id="fx-09-huge-text-scroll" data-width="1920" data-height="1080" data-duration="6">
    <div class="fx-stage">
      <div class="fx-09-row fx-09-big"></div>
      <div class="fx-09-row fx-09-small"></div>
    </div>
  </div>
  <script src="fx-kit.js"></script>
  <script>
    /* 09 Huge Text Scroll：巨字向左捲、快—慢—快（餘弦速度曲線，接縫處速度連續）；小字向右反向等速。位移＝整數個重複單元 */
    const v = window.__hyperframes.getVariables();
    const stage = document.querySelector('.fx-stage');
    const { D } = FXKit.setup(stage, v, 6);
    const W = 1920, P = 6;
    const cycles = Math.max(1, Math.round(D / P));
    const Pp = D / cycles;

    // 一個單元＝固定寬度的 text＋「・」（寬度由 em 估算決定，接縫不靠量測字型）
    function build(row, fs, speed) {
      const em = FXKit.emWidth(v.text + '・');
      const U = Math.round(fs * em);
      const m = Math.max(1, Math.round(speed * Pp / U));
      const S = cycles * m * U;
      const n = Math.ceil((W + S) / U) + 1;
      row.style.fontSize = fs + 'px';
      row.style.lineHeight = '1';
      row.textContent = '';
      for (let i = 0; i < n; i++) {
        const u = document.createElement('span');
        u.className = 'fx-09-u';
        u.style.width = U + 'px';
        u.appendChild(document.createTextNode(v.text));
        const dot = document.createElement('i'); dot.textContent = '・'; u.appendChild(dot);
        row.appendChild(u);
      }
      return { U, S, per: m * U };
    }

    const big = document.querySelector('.fx-09-big');
    const small = document.querySelector('.fx-09-small');
    const bigFs = Math.min(480, Math.floor(3840 / FXKit.emWidth(v.text + '・')));
    const smallFs = 64;
    big.style.top = Math.round(420 - bigFs / 2) + 'px';
    small.style.top = Math.round(780 - smallFs / 2) + 'px';
    const b = build(big, bigFs, 520);
    const s = build(small, smallFs, 300);

    const tl = gsap.timeline({ paused: true });
    // 巨字：每個週期一段 fast-slow-fast；ease 的導數 1+0.8cos(2πp)，頭尾同速
    const A = 0.8;
    const fss = (p) => p + A / (2 * Math.PI) * Math.sin(2 * Math.PI * p);
    for (let i = 0; i < cycles; i++) {
      tl.fromTo(big, { x: -i * b.per }, { x: -(i + 1) * b.per, duration: Pp, ease: fss }, i * Pp);
    }
    // 小字：反向、等速
    tl.fromTo(small, { x: -s.S }, { x: 0, duration: D, ease: 'none' }, 0);
    window.__timelines['fx-09-huge-text-scroll'] = tl;
  </script>
</template>
</body>
</html>
